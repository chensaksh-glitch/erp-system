<body>
<div id="root"></div>
<script type="text/babel">

const SUPABASE_URL = "https://bwxkeuizvhyggdkngraj.supabase.co";
const SUPABASE_KEY = "sb_publishable_zBiSYJfZgt6Yrlafe1-YjA_Yt_Nv0P9";
const TOTAL_DB_MB = 500;
const EMPTY_MAT = {material_code:"",material_name:"",qty:"",unit:"",note:""};

const dlCSV = (name, headers, rows) => {
  const csv = "\uFEFF" + [headers.join(","), ...rows.map(r=>r.map(c=>`"${String(c??"-").replace(/"/g,'""')}"`).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
  a.download = name+"_"+new Date().toISOString().slice(0,10)+".csv";
  a.click();
};

const api = async (table, method="GET", body=null, query="") => {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`, {
    method,
    headers:{"apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/json","Prefer":"return=representation"},
    body: body ? JSON.stringify(body) : null
  });
  if(method==="DELETE"||res.status===204) return null;
  const d = await res.json();
  if(!res.ok) throw new Error(JSON.stringify(d));
  return d;
};

const fmt = n => Math.round(n||0).toLocaleString();
const SC = {"대기":{bg:"#e6f1fb",c:"#185fa5"},"진행중":{bg:"#faeeda",c:"#854f0b"},"완료":{bg:"#eaf3de",c:"#3b6d11"},"예정":{bg:"#e6f1fb",c:"#185fa5"},"입고완료":{bg:"#eaf3de",c:"#3b6d11"}};
const CAT = {"완제품":{bg:"#e6f1fb",c:"#185fa5"},"원자재":{bg:"#eaf3de",c:"#3b6d11"},"부자재":{bg:"#faeeda",c:"#854f0b"},"반제품":{bg:"#f3e8fb",c:"#6b2fa0"},"원료":{bg:"#fce8e8",c:"#a32d2d"},"포장자재":{bg:"#e8f8e8",c:"#2d6b2d"}};
const Badge = ({s}) => <span className="badge" style={{background:SC[s]?.bg||"#f0f0f0",color:SC[s]?.c||"#666"}}>{s}</span>;
const CatBadge = ({c}) => <span className="cat-badge" style={{background:CAT[c]?.bg||"#f0f0f0",color:CAT[c]?.c||"#666"}}>{c||"-"}</span>;
const calcMin = (s,e) => { if(!s||!e) return null; const [sh,sm]=s.split(":").map(Number),[eh,em]=e.split(":").map(Number),d=(eh*60+em)-(sh*60+sm); return d>0?d:null; };

const useSel = () => {
  const [sel,setSel] = React.useState([]);
  return {
    sel, clear:()=>setSel([]),
    toggle:id=>setSel(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]),
    toggleAll:list=>setSel(sel.length===list.length?[]:list.map(x=>x.id)),
    has:id=>sel.includes(id),
    allOf:list=>list.length>0&&sel.length===list.length
  };
};

const Toolbar = ({s,onDel,children}) => (
  <div className="toolbar">{children}{s&&s.sel.length>0&&<button className="btn-danger" onClick={onDel}>🗑 선택 삭제 ({s.sel.length})</button>}</div>
);

function App() {
  const [menu,setMenu] = React.useState("dashboard");
  const [items,setItems] = React.useState([]);
  const [workOrders,setWorkOrders] = React.useState([]);
  const [wop,setWop] = React.useState([]);
  const [hist,setHist] = React.useState([]);
  const [whs,setWhs] = React.useState([]);
  const [procs,setProcs] = React.useState([]);
  const [lots,setLots] = React.useState([]);
  const [inPlan,setInPlan] = React.useState([]);
  const [boms,setBoms] = React.useState([]);
  const [costMaster,setCostMaster] = React.useState([]);
  const [costResults,setCostResults] = React.useState([]);
  const [loading,setLoading] = React.useState(true);
  const [toast,setToast] = React.useState("");
  const [dbMB,setDbMB] = React.useState(0);
  const [expWO,setExpWO] = React.useState(null);
  const [expBom,setExpBom] = React.useState(null);
  const [selFactory,setSelFactory] = React.useState("광주공장");
  const [selWOCost,setSelWOCost] = React.useState(null);

  const iSel=useSel(),woSel=useSel(),whSel=useSel(),prSel=useSel(),lotSel=useSel(),inSel=useSel(),bomSel=useSel();

  const [mIO,setMIO]=React.useState(false);
  const [mWO,setMWO]=React.useState(false);
  const [mWH,setMWH]=React.useState(false);
  const [mPR,setMPR]=React.useState(false);
  const [mLot,setMLot]=React.useState(false);
  const [mIn,setMIn]=React.useState(false);
  const [mItem,setMItem]=React.useState(false);
  const [mBom,setMBom]=React.useState(false);
  const [mBomExp,setMBomExp]=React.useState(false);
  const [mWhStock,setMWhStock]=React.useState(false);
  const [mProcRes,setMProcRes]=React.useState(false);

  const [eItem,setEItem]=React.useState(null);
  const [eWO,setEWO]=React.useState(null);
  const [eWH,setEWH]=React.useState(null);
  const [ePR,setEPR]=React.useState(null);
  const [eLot,setELot]=React.useState(null);
  const [eIn,setEIn]=React.useState(null);
  const [eBom,setEBom]=React.useState(null);
  const [selWH,setSelWH]=React.useState(null);
  const [selProc,setSelProc]=React.useState(null);

  const [whSrch,setWhSrch]=React.useState("");
  const [invTab,setInvTab]=React.useState("품목현황");
  const [itemTab,setItemTab]=React.useState("전체");
  const [itemSrch,setItemSrch]=React.useState("");
  const [bomTab,setBomTab]=React.useState("전체");
  const [bomSrch,setBomSrch]=React.useState("");
  const [hFilter,setHFilter]=React.useState({cat:"전체",type:"전체",kw:""});
  const [beProd,setBeProd]=React.useState("");
  const [beQty,setBeQty]=React.useState("");
  const [beResult,setBeResult]=React.useState([]);

  const [fIO,setFIO]=React.useState({type:"입고",code:"",qty:"",lot_no:"",wh_id:"",note:""});
  const [fWO,setFWO]=React.useState({product:"",qty:"",planned:"",due:"",wh_id:"",procs:[]});
  const [fWH,setFWH]=React.useState({code:"",name:"",location:"",manager:"",note:""});
  const [fPR,setFPR]=React.useState({code:"",name:"",order_no:"",machine:"",manager:"",note:"",proc_type:"생산"});
  const [fLot,setFLot]=React.useState({lot_no:"",item_code:"",item_name:"",wh_id:"",qty:"",recv:"",exp:"",supplier:"",note:""});
  const [fIn,setFIn]=React.useState({item_code:"",item_name:"",qty:"",planned_date:"",supplier:"",wh_id:"",lot_no:"",note:""});
  const [fItem,setFItem]=React.useState({code:"",name:"",category:"원자재",unit:"",stock:0,min_stock:0,location:"",spec:"",maker:"",price:0,lead_time:0,note:""});
  const [fBomProd,setFBomProd]=React.useState({product_code:"",product_name:""});
  const [fBomMats,setFBomMats]=React.useState([{...EMPTY_MAT}]);
  const [fProcRes,setFProcRes]=React.useState({work_date:"",start_time:"",end_time:"",work_qty:"",defect_qty:"0",assignee:"",note:""});

  const showToast = m => { setToast(m); setTimeout(()=>setToast(""),2500); };
  const whName = id => whs.find(w=>w.id===id)?.name||"-";
  const prName = id => procs.find(p=>p.id===id)?.name||"-";
  const getWOP = woId => wop.filter(p=>p.wo_id===woId).sort((a,b)=>a.step_no-b.step_no);
  const getCurStep = woId => { const s=getWOP(woId); return s.find(x=>x.status==="진행중")||s.find(x=>x.status==="대기"); };
  const filtItems = items.filter(i=>(itemTab==="전체"||i.category===itemTab)&&(!itemSrch||i.code.includes(itemSrch)||i.name.includes(itemSrch)));
  const lowStock = items.filter(i=>i.stock<i.min_stock);
  const usePct = Math.min(100,(dbMB/TOTAL_DB_MB*100)).toFixed(2);
  const useColor = usePct>80?"#e24b4a":usePct>50?"#f0a500":"#3b9e3b";

  const loadAll = async () => {
    try {
      const [i,w,wp,h,wh,pr,lt,ip,bm,cm,cr] = await Promise.all([
        api("items","GET",null,"?order=code"),
        api("work_orders","GET",null,"?order=created_at.desc"),
        api("work_order_processes","GET",null,"?order=wo_id,step_no"),
        api("stock_history","GET",null,"?order=id.desc&limit=200"),
        api("warehouses","GET",null,"?order=id"),
        api("processes","GET",null,"?order=order_no"),
        api("lots","GET",null,"?order=id.desc"),
        api("incoming_plan","GET",null,"?order=planned_date"),
        api("bom","GET",null,"?order=product_code"),
        api("cost_master","GET",null,"?order=id"),
        api("cost_result","GET",null,"?order=created_at.desc"),
      ]);
      setItems(i||[]); setWorkOrders(w||[]); setWop(wp||[]); setHist(h||[]);
      setWhs(wh||[]); setProcs(pr||[]); setLots(lt||[]); setInPlan(ip||[]); setBoms(bm||[]);
      setCostMaster(cm||[]); setCostResults(cr||[]);
      const t=(i||[]).length*0.5+(w||[]).length*0.5+(h||[]).length*0.3+(lt||[]).length*0.4+(ip||[]).length*0.3+(wh||[]).length*0.2+(pr||[]).length*0.2+(wp||[]).length*0.3+(bm||[]).length*0.3+(cr||[]).length*0.5;
      setDbMB(Math.max(0.01,t/1024).toFixed(3));
    } catch(e){ alert("DB 연결 오류: "+e.message); }
    setLoading(false);
  };

  React.useEffect(()=>{ loadAll(); },[]);

  const bomFiltered = boms.filter(b=>{
    const it=items.find(i=>i.code===b.product_code);
    return (bomTab==="전체"||(it?.category===bomTab))&&(!bomSrch||(b.product_code||"").includes(bomSrch)||(b.product_name||"").includes(bomSrch));
  });
  const bomGroups = Object.values(bomFiltered.reduce((acc,b)=>{
    if(!acc[b.product_code]) acc[b.product_code]={code:b.product_code,name:b.product_name,rows:[]};
    acc[b.product_code].rows.push(b); return acc;
  },{}));

  const doBomExpand = (prod,qty) => {
    if(!prod) return;
    const pb=boms.filter(b=>b.product_code===prod);
    if(pb.length===0){setBeResult([]);return;}
    const q=parseFloat(qty)||1;
    setBeResult(pb.map(b=>{
      const it=items.find(i=>i.code===b.material_code);
      const stock=it?.stock||0;
      const needed=b.qty*q;
      const short=Math.max(0,needed-stock);
      return {code:b.material_code,name:b.material_name,unit:b.unit||it?.unit||"-",qty_per:b.qty,needed,stock,short,ok:short===0,cat:it?.category||"-"};
    }));
  };

  const openBomExp = (prodCode) => {
    setBeProd(prodCode); setBeQty(""); doBomExpand(prodCode,""); setMBomExp(true);
  };

  // 원가계산
  const calcCost = async (wo, factory) => {
    const steps = getWOP(wo.id);
    const batchSize = wo.qty;
    const factoryMaster = costMaster.filter(c=>c.factory===factory);
    const getMV = name => parseFloat(factoryMaster.find(c=>c.name===name)?.value||0);

    const prodMin = steps.filter(s=>procs.find(p=>p.id===s.process_id)?.proc_type!=="포장").reduce((a,s)=>a+(s.work_minutes||0),0);
    const packMin = steps.filter(s=>procs.find(p=>p.id===s.process_id)?.proc_type==="포장").reduce((a,s)=>a+(s.work_minutes||0),0);
    const prodH = prodMin/60;
    const packH = packMin/60;
    const totalH = prodH+packH;

    const rentRate=getMV("임차료"), cleanRate=getMV("청정실 운영비");
    const prodRate=getMV("생산 시급"), packRate=getMV("포장 시급");
    const depreciation=getMV("감가상각비"), inspection=getMV("시험검사비");

    const rentCost=Math.round(totalH*rentRate);
    const cleanCost=Math.round(totalH*cleanRate);
    const prodLabor=Math.round(prodH*prodRate);
    const packLabor=Math.round(packH*packRate);
    const mfgCost=rentCost+cleanCost+prodLabor+packLabor+depreciation+inspection;

    const bomList=boms.filter(b=>b.product_code===wo.product||b.product_name===wo.product);
    const matDetail=[];
    let matCost=0;
    bomList.forEach(b=>{
      const it=items.find(i=>i.code===b.material_code);
      const unitPrice=parseFloat(it?.price||0);
      const qty=parseFloat(b.qty||0);
      const cost=Math.round(unitPrice*qty);
      matCost+=cost;
      matDetail.push({category:it?.category||"-",code:b.material_code,name:b.material_name,spec:it?.spec||"-",unit_price:unitPrice,qty_per:qty,unit:b.unit||it?.unit||"-",cost_per:cost,total_cost:Math.round(unitPrice*qty*batchSize)});
    });

    const totalCost=matCost+mfgCost;
    const unitCost=batchSize>0?Math.round(totalCost/batchSize):0;
    const detail={matDetail,prodMin,packMin,totalH:Math.round(totalH*100)/100,prodH:Math.round(prodH*100)/100,packH:Math.round(packH*100)/100,rentCost,cleanCost,prodLabor,packLabor,depreciation,inspection,mfgCost,totalMatCost:matCost,totalCost,unitCost,batchSize,rentRate,cleanRate,prodRate,packRate,factory};

    try {
      await api("cost_result","POST",{wo_id:wo.id,batch_size:batchSize,material_cost:matCost,production_minutes:prodMin,packing_minutes:packMin,rent_cost:rentCost,cleanroom_cost:cleanCost,production_labor:prodLabor,packing_labor:packLabor,depreciation,inspection,total_cost:totalCost,unit_cost:unitCost,detail,factory});
      await loadAll();
      setCostDetail(detail); setSelWOCost(wo); setMenu("cost_calc");
      showToast("✓ 원가계산 완료");
    } catch(e){ alert("오류: "+e.message); }
  };

  // 연계 체크
  const checkAndDelete = async (table,id,label,checks) => {
    for(const chk of checks){
      if(chk.count>0){ alert(`❌ 삭제 불가!\n\n[${label}]은(는) [${chk.label}]에서 ${chk.count}건 사용중입니다.\n먼저 연결된 데이터를 삭제해주세요.`); return; }
    }
    if(!window.confirm(`[${label}]을(를) 삭제하시겠습니까?`)) return;

          <div className="grid4">{[{l:"총 작업지시",v:workOrders.length+" 건"},{l:"대기",v:workOrders.filter(w=>w.status==="대기").length+" 건"},{l:"진행중",v:workOrders.filter(w=>w.status==="진행중").length+" 건"},{l:"완료",v:workOrders.filter(w=>w.status==="완료").length+" 건"}].map((m,i)=><div key={i} className="card"><div className="card-label">{m.l}</div><div className="card-val">{m.v}</div></div>)}</div>
          <div className="section"><table><thead><tr><th>지시번호</th><th>제품명</th><th>지시수량</th><th>총 작업시간</th><th>총 불량</th><th>불량률</th><th>계획일</th><th>완료기한</th><th>원가</th></tr></thead>
            <tbody>{workOrders.filter(w=>w.status==="완료").map(w=>{
              const steps=getWOP(w.id);
              const tm=steps.reduce((s,p)=>s+(p.work_minutes||0),0);
              const td=steps.reduce((s,p)=>s+(p.defect_qty||0),0);
              const tw=steps.reduce((s,p)=>s+(p.work_qty||0),0);
              const cr=costResults.find(c=>c.wo_id===w.id);
              return<tr key={w.id}>
                <td className="mono">{w.id}</td><td>{w.product}</td><td>{w.qty?.toLocaleString()}</td>
                <td>{tm?tm+"분":"-"}</td><td style={{color:"#a32d2d"}}>{td||"-"}</td>
                <td>{tw>0?(td/tw*100).toFixed(1)+"%":"-"}</td><td>{w.planned}</td><td>{w.due}</td>
                <td>{cr
                  ?<button className="btn-sm" onClick={()=>{setCostDetail(cr.detail);setSelWOCost(w);setMenu("cost_calc");}}>원가보기 ({fmt(cr.unit_cost)}원)</button>

                </td>
              </tr>;
            })}</tbody>
          </table></div>
        </>}

        {/* 원가 마스터 */}
        {menu==="cost_master"&&<>
          <div className="page-title">💰 원가 마스터 설정</div>
          {["광주공장","동탄공장"].map(factory=>(

              <div className="section-head">
                <span className="section-title">🏭 {factory}</span>

              <table><thead><tr><th>항목</th><th>단가</th><th>단위</th><th>저장</th></tr></thead>
              <tbody>{costMaster.filter(c=>c.factory===factory).map(c=><tr key={c.id}>
                <td style={{fontWeight:600}}>{c.name}</td>
                <td><input type="number" style={{width:"160px",padding:"5px 8px"}} value={c.value} onChange={e=>setCostMaster(costMaster.map(x=>x.id===c.id?{...x,value:e.target.value}:x))}/></td>
                <td style={{color:"#888"}}>{c.unit}</td>
                <td><button className="btn-sm" onClick={async()=>{try{await api("cost_master","PATCH",{value:parseFloat(c.value)},`?id=eq.${c.id}`);await loadAll();showToast("✓ 저장됨");}catch(e){alert("오류: "+e.message);}}}>저장</button></td>
              </tr>)}</tbody></table>
            </div>
          ))}
          <div className="section">
            <div className="section-head"><span className="section-title">공정 유형 설정</span><span style={{fontSize:"12px",color:"#888"}}>생산/포장 구분</span></div>
            <table><thead><tr><th>순서</th><th>공정코드</th><th>공정명</th><th>유형</th><th>저장</th></tr></thead>
            <tbody>{procs.map(p=><tr key={p.id}>
              <td style={{fontWeight:700,color:"#185fa5"}}>{p.order_no}</td>
              <td className="mono">{p.code}</td>
              <td style={{fontWeight:600}}>{p.name}</td>
              <td><select style={{width:"100px",padding:"5px 8px"}} value={p.proc_type||"생산"} onChange={e=>setProcs(procs.map(x=>x.id===p.id?{...x,proc_type:e.target.value}:x))}>
                <option value="생산">생산</option>
                <option value="포장">포장</option>
              </select></td>
              <td><button className="btn-sm" onClick={async()=>{try{await api("processes","PATCH",{proc_type:p.proc_type||"생산"},`?id=eq.${p.id}`);await loadAll();showToast("✓ 저장됨");}catch(e){alert("오류: "+e.message);}}}>저장</button></td>
            </tr>)}</tbody></table>
          </div>
        </>}

        {/* 원가 계산 */}
        {menu==="cost_calc"&&<>
          <div className="page-title">📊 원가 계산</div>
          {!costDetail&&<div className="section">
            <div className="section-head"><span className="section-title">완료된 작업지시 선택</span>
              <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                <span style={{fontSize:"13px",color:"#555"}}>공장 선택:</span>
                {["광주공장","동탄공장"].map(f=><button key={f} className={selFactory===f?"btn-primary":"btn"} style={{fontSize:"12px",padding:"5px 12px"}} onClick={()=>setSelFactory(f)}>{f}</button>)}
              </div>
            </div>
            <table><thead><tr><th>지시번호</th><th>제품명</th><th>수량(Batch)</th><th>완료기한</th><th>원가계산</th></tr></thead>
            <tbody>{workOrders.filter(w=>w.status==="완료").length===0?<tr><td colSpan="5" className="empty">완료된 작업지시가 없습니다</td></tr>:workOrders.filter(w=>w.status==="완료").map(w=><tr key={w.id}>
              <td className="mono">{w.id}</td><td style={{fontWeight:600}}>{w.product}</td>
              <td>{w.qty?.toLocaleString()} ea</td><td>{w.due}</td>
              <td><button className="btn-primary" style={{fontSize:"12px",padding:"5px 12px"}} onClick={()=>calcCost(w,selFactory)}>🏭 {selFactory} 원가계산</button></td>
            </tr>)}</tbody></table>
          </div>}

          {costDetail&&selWOCost&&<>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}}>
              <div style={{fontSize:"13px",color:"#888"}}>작업지시: <b>{selWOCost.id}</b> · 제품: <b>{selWOCost.product}</b> · Batch: <b>{selWOCost.qty?.toLocaleString()} ea</b></div>
              <div style={{display:"flex",gap:"8px"}}>
                <button className="btn" onClick={()=>{setCostDetail(null);setSelWOCost(null);}}>← 목록으로</button>
                <button className="btn" onClick={()=>dlCSV(`원가계산_${selWOCost.id}`,
                  ["구분","항목","코드","규격","단가","투입량","단위","비용(1Batch)"],
                  [...costDetail.matDetail.map(m=>[m.category,m.name,m.code,m.spec,fmt(m.unit_price),m.qty_per,m.unit,fmt(m.cost_per)]),
                   ["제조비","임차료","","",fmt(costDetail.rentRate)+"원/h",costDetail.totalH+"h","h",fmt(costDetail.rentCost)],
                   ["제조비","청정실 운영비","","",fmt(costDetail.cleanRate)+"원/h",costDetail.totalH+"h","h",fmt(costDetail.cleanCost)],
                   ["제조비","생산 인건비","","",fmt(costDetail.prodRate)+"원/h",costDetail.prodH+"h","h",fmt(costDetail.prodLabor)],
                   ["제조비","포장 인건비","","",fmt(costDetail.packRate)+"원/h",costDetail.packH+"h","h",fmt(costDetail.packLabor)],
                   ["제조비","감가상각비","","","","","",fmt(costDetail.depreciation)],
                   ["제조비","시험검사비","","","","","",fmt(costDetail.inspection)],
                   ["합계","총 원가","","","","","",fmt(costDetail.totalCost)],
                   ["합계","1개당 원가","","","","","",fmt(costDetail.unitCost)]])}>📥 엑셀</button>
              </div>
            </div>
            <div className="grid4" style={{marginBottom:"16px"}}>
              {[{l:"자재비 합계",v:fmt(costDetail.totalMatCost)+"원",c:"#185fa5"},{l:"제조비 합계",v:fmt(costDetail.mfgCost)+"원",c:"#854f0b"},{l:"총 원가",v:fmt(costDetail.totalCost)+"원",c:"#222"},{l:"1개당 원가",v:fmt(costDetail.unitCost)+"원",c:"#a32d2d"}].map((m,i)=><div key={i} className="card" style={{borderLeft:`3px solid ${m.c}`}}><div className="card-label">{m.l}</div><div className="card-val" style={{fontSize:"18px",color:m.c}}>{m.v}</div></div>)}
            </div>
            <div className="section" style={{marginBottom:"16px"}}>
              <div className="section-head"><span className="section-title">📦 자재비 상세</span><span style={{fontSize:"13px",fontWeight:700,color:"#185fa5"}}>{fmt(costDetail.totalMatCost)}원</span></div>
              <table><thead><tr><th>구분</th><th>항목</th><th>코드</th><th>규격</th><th style={{textAlign:"right"}}>단가(원)</th><th style={{textAlign:"right"}}>투입량</th><th>단위</th><th style={{textAlign:"right"}}>비용/Batch(원)</th></tr></thead>
              <tbody>
                {costDetail.matDetail.length===0?<tr><td colSpan="8" className="empty">BOM 자재 없음 - BOM을 먼저 등록하세요</td></tr>
                :costDetail.matDetail.map((m,i)=><tr key={i} style={{background:i%2===0?"#fafafa":"#fff"}}>
                  <td><CatBadge c={m.category}/></td><td style={{fontWeight:500}}>{m.name}</td><td className="mono">{m.code}</td>
                  <td style={{color:"#888",fontSize:"12px"}}>{m.spec}</td>
                  <td style={{textAlign:"right"}}>{fmt(m.unit_price)}</td>
                  <td style={{textAlign:"right",fontWeight:600}}>{m.qty_per}</td><td>{m.unit}</td>
                  <td style={{textAlign:"right",fontWeight:600,color:"#185fa5"}}>{fmt(m.cost_per)}</td>
                </tr>)}
                <tr style={{background:"#eef3fb",fontWeight:700}}><td colSpan="7">BOM 자재비 합계</td><td style={{textAlign:"right",color:"#185fa5"}}>{fmt(costDetail.totalMatCost)}</td></tr>
              </tbody></table>
            </div>
            <div className="section" style={{marginBottom:"16px"}}>
              <div className="section-head"><span className="section-title">⚙️ 제조비 상세</span><span style={{fontSize:"13px",fontWeight:700,color:"#854f0b"}}>{fmt(costDetail.mfgCost)}원</span></div>
              <table><thead><tr><th>항목</th><th style={{textAlign:"right"}}>시간(h)</th><th style={{textAlign:"right"}}>시간당 단가(원)</th><th style={{textAlign:"right"}}>비용(원)</th><th>비고</th></tr></thead>
              <tbody>
                {[{name:"임차료",h:costDetail.totalH,rate:costDetail.rentRate,cost:costDetail.rentCost,note:`총 작업시간 ${costDetail.totalH}h`},
                  {name:"청정실 운영비",h:costDetail.totalH,rate:costDetail.cleanRate,cost:costDetail.cleanCost,note:`총 작업시간 ${costDetail.totalH}h`},
                  {name:"생산 인건비",h:costDetail.prodH,rate:costDetail.prodRate,cost:costDetail.prodLabor,note:`생산공정 ${Math.round(costDetail.prodMin)}분`},
                  {name:"포장 인건비",h:costDetail.packH,rate:costDetail.packRate,cost:costDetail.packLabor,note:`포장공정 ${Math.round(costDetail.packMin)}분`},
                  {name:"감가상각비",h:null,rate:null,cost:costDetail.depreciation,note:"월 고정"},
                  {name:"시험검사비",h:null,rate:null,cost:costDetail.inspection,note:"건당"},
                ].map((r,i)=><tr key={i}>
                  <td style={{fontWeight:600}}>{r.name}</td>
                  <td style={{textAlign:"right"}}>{r.h!=null?r.h:"-"}</td>
                  <td style={{textAlign:"right"}}>{r.rate!=null?fmt(r.rate):"-"}</td>
                  <td style={{textAlign:"right",fontWeight:600,color:"#854f0b"}}>{fmt(r.cost)}</td>
                  <td style={{color:"#888",fontSize:"12px"}}>{r.note}</td>
                </tr>)}
                <tr style={{background:"#faeeda",fontWeight:700}}><td colSpan="3">제조비 합계</td><td style={{textAlign:"right",color:"#854f0b"}}>{fmt(costDetail.mfgCost)}</td><td></td></tr>
              </tbody></table>
            </div>
            <div className="section">
              <div className="section-head"><span className="section-title">💰 최종 원가</span></div>
              <table><thead><tr><th>항목</th><th style={{textAlign:"right"}}>금액(원)</th><th>비고</th></tr></thead>
              <tbody>
                <tr><td>자재비 합계</td><td style={{textAlign:"right",fontWeight:600}}>{fmt(costDetail.totalMatCost)}</td><td style={{color:"#888"}}>BOM 기준</td></tr>
                <tr><td>제조비 합계</td><td style={{textAlign:"right",fontWeight:600}}>{fmt(costDetail.mfgCost)}</td><td style={{color:"#888"}}>임차료+청정실+인건비+기타</td></tr>
                <tr style={{background:"#eef3fb",fontWeight:700,fontSize:"14px"}}><td>총 원가 (1 Batch)</td><td style={{textAlign:"right",color:"#185fa5"}}>{fmt(costDetail.totalCost)}</td><td style={{color:"#888"}}>Batch: {costDetail.batchSize?.toLocaleString()} ea</td></tr>
                <tr style={{background:"#fcebeb",fontWeight:700,fontSize:"15px"}}><td>제품 1개당 원가</td><td style={{textAlign:"right",color:"#a32d2d"}}>{fmt(costDetail.unitCost)}</td><td style={{color:"#888"}}>= 총원가 ÷ {costDetail.batchSize?.toLocaleString()}</td></tr>
              </tbody></table>
            </div>
          </>}
        </>}

        {/* 원가 대장 */}
        {menu==="cost_list"&&<>
          <div className="row-between">
            <div className="page-title">📋 원가 대장</div>
            <button className="btn" onClick={()=>dlCSV("원가대장",["작업지시","제품명","Batch수량","자재비","제조비","총원가","1개당원가","계산일"],
              costResults.map(c=>[c.wo_id,workOrders.find(w=>w.id===c.wo_id)?.product||"-",c.batch_size,c.material_cost,(c.rent_cost||0)+(c.cleanroom_cost||0)+(c.production_labor||0)+(c.packing_labor||0)+(c.depreciation||0)+(c.inspection||0),c.total_cost,c.unit_cost,c.created_at?.slice(0,10)]))}>📥 엑셀</button>
          </div>
          <div className="section"><table><thead><tr>
            <th>작업지시</th><th>제품명</th><th style={{textAlign:"right"}}>Batch</th>
            <th style={{textAlign:"right"}}>자재비</th><th style={{textAlign:"right"}}>제조비</th>
            <th style={{textAlign:"right"}}>총 원가</th><th style={{textAlign:"right"}}>1개당 원가</th>
            <th>계산일</th><th>상세</th>
          </tr></thead>
          <tbody>{costResults.length===0?<tr><td colSpan="9" className="empty">원가계산 결과가 없습니다</td></tr>:costResults.map(c=>{
            const wo=workOrders.find(w=>w.id===c.wo_id);
            const mfg=(c.rent_cost||0)+(c.cleanroom_cost||0)+(c.production_labor||0)+(c.packing_labor||0)+(c.depreciation||0)+(c.inspection||0);
            return<tr key={c.id}>
              <td className="mono">{c.wo_id}</td><td style={{fontWeight:600}}>{wo?.product||"-"}</td>
              <td style={{textAlign:"right"}}>{c.batch_size?.toLocaleString()} ea</td>
              <td style={{textAlign:"right",color:"#185fa5"}}>{fmt(c.material_cost)}</td>
              <td style={{textAlign:"right",color:"#854f0b"}}>{fmt(mfg)}</td>
              <td style={{textAlign:"right",fontWeight:700}}>{fmt(c.total_cost)}</td>
              <td style={{textAlign:"right",fontWeight:700,color:"#a32d2d"}}>{fmt(c.unit_cost)}</td>
              <td>{c.created_at?.slice(0,10)}</td>
              <td><button className="btn-sm" onClick={()=>{setCostDetail(c.detail);setSelWOCost(wo);setMenu("cost_calc");}}>상세보기</button></td>
            </tr>;
          })}</tbody></table></div>
        </>}

        {/* 창고 관리 */}
        {menu==="warehouse"&&<>
          <div className="row-between"><div className="page-title">창고 관리</div><button className="btn-primary" onClick={()=>{setEWH(null);setFWH({code:"",name:"",location:"",manager:"",note:""});setMWH(true);}}>+ 창고 등록</button></div>
          <Toolbar s={whSel} onDel={()=>checkAndBulkDelete("warehouses",whSel.sel,id=>whs.find(w=>w.id===id)?.name||id,id=>whChecks(id),whSel.clear)}>
            <input style={{width:"240px",padding:"7px 12px"}} placeholder="🔍 창고명 검색" value={whSrch} onChange={e=>setWhSrch(e.target.value)}/>
          </Toolbar>
          {(()=>{const fil=whs.filter(w=>!whSrch||w.name.includes(whSrch)||w.code.includes(whSrch));
          return<div className="section"><table><thead><tr>
            <th style={{width:"40px"}}><input type="checkbox" checked={whSel.allOf(fil)} onChange={()=>whSel.toggleAll(fil)}/></th>
            <th>창고코드</th><th>창고명</th><th>위치</th><th>담당자</th><th>비고</th><th>재고</th>
          </tr></thead>
          <tbody>{fil.length===0?<tr><td colSpan="7" className="empty">검색 결과 없음</td></tr>:fil.map(w=><tr key={w.id} className={whSel.has(w.id)?"sel-row":""}>
            <td><input type="checkbox" checked={whSel.has(w.id)} onChange={()=>whSel.toggle(w.id)}/></td>
            <td className="mono">{w.code}</td>
            <td><div style={{display:"flex",alignItems:"center",gap:"6px"}}><span style={{fontWeight:600}}>{w.name}</span>
              <button className="btn-sm" onClick={()=>{setEWH(w);setFWH({code:w.code,name:w.name,location:w.location||"",manager:w.manager||"",note:w.note||""});setMWH(true);}}>수정</button>
              <button className="btn-danger-sm" onClick={()=>checkAndDelete("warehouses",w.id,w.name,whChecks(w.id))}>삭제</button>
            </div></td>
            <td>{w.location}</td><td>{w.manager}</td><td style={{color:"#888"}}>{w.note}</td>
            <td><button className="btn-sm" onClick={()=>{setSelWH(w);setMWhStock(true);}}>재고확인</button></td>
          </tr>)}</tbody></table></div>;})()}
          {mWhStock&&selWH&&<div className="modal-bg"><div className="modal modal-lg">
            <div className="modal-title">🏭 {selWH.name} 재고 현황</div>
            {(()=>{const wh=hist.filter(h=>h.warehouse_id===selWH.id);const sm={};wh.forEach(h=>{if(!sm[h.code])sm[h.code]={code:h.code,name:h.name,qty:0};sm[h.code].qty+=h.type==="입고"?h.qty:-h.qty;});const sl=Object.values(sm).filter(s=>s.qty>0);
            return<><div style={{fontWeight:600,fontSize:"13px",marginBottom:"8px"}}>📦 현재 재고</div>
            <table style={{marginBottom:"16px"}}><thead><tr><th>코드</th><th>품목명</th><th>분류</th><th>단위</th><th>현재고</th></tr></thead>
            <tbody>{sl.length===0?<tr><td colSpan="5" className="empty">재고 없음</td></tr>:sl.map(s=>{const it=items.find(i=>i.code===s.code);return<tr key={s.code}><td className="mono">{s.code}</td><td>{s.name}</td><td><CatBadge c={it?.category}/></td><td>{it?.unit||"-"}</td><td style={{fontWeight:700,color:"#185fa5"}}>{s.qty?.toLocaleString()}</td></tr>;})}</tbody></table>
            <div style={{fontWeight:600,fontSize:"13px",marginBottom:"8px"}}>📋 입출고 이력</div>
            <table><thead><tr><th>날짜</th><th>구분</th><th>코드</th><th>품목명</th><th>수량</th><th>LOT</th></tr></thead>
            <tbody>{wh.length===0?<tr><td colSpan="6" className="empty">이력 없음</td></tr>:wh.map(h=><tr key={h.id}><td>{h.date}</td><td><span className="badge" style={{background:h.type==="입고"?"#e6f1fb":"#faeeda",color:h.type==="입고"?"#185fa5":"#854f0b"}}>{h.type}</span></td><td className="mono">{h.code}</td><td>{h.name}</td><td style={{fontWeight:600}}>{h.qty?.toLocaleString()}</td><td className="mono">{h.lot_no||"-"}</td></tr>)}</tbody></table></>;})()}
            <div style={{display:"flex",justifyContent:"flex-end",marginTop:"16px"}}><button className="btn" onClick={()=>setMWhStock(false)}>닫기</button></div>

        <div className="form-grid3">
          <div className="form-row"><label className="form-label">순서</label><input type="number" placeholder="순서번호" value={fPR.order_no} onChange={e=>setFPR({...fPR,order_no:e.target.value})}/></div>
          <div className="form-row"><label className="form-label">유형 *</label><select value={fPR.proc_type||"생산"} onChange={e=>setFPR({...fPR,proc_type:e.target.value})}><option value="생산">생산</option><option value="포장">포장</option></select></div>
          <div className="form-row"><label className="form-label">설비</label><input placeholder="설비명" value={fPR.machine} onChange={e=>setFPR({...fPR,machine:e.target.value})}/></div>
        </div>
        <div className="form-grid2">
          <div className="form-row"><label className="form-label">담당자</label><input placeholder="담당자" value={fPR.manager} onChange={e=>setFPR({...fPR,manager:e.target.value})}/></div>
          <div className="form-row"><label className="form-label">비고</label><input placeholder="비고" value={fPR.note} onChange={e=>setFPR({...fPR,note:e.target.value})}/></div>
        </div>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}><button className="btn" onClick={()=>{setMPR(false);setEPR(null);}}>취소</button><button className="btn-primary" onClick={handlePR}>{ePR?"수정":"등록"}</button></div>
      </div></div>}

      {/* LOT 모달 */}
      {mLot&&<div className="modal-bg"><div className="modal">
        <div className="modal-title">{eLot?"LOT 수정":"LOT 등록"}</div>
        <div className="form-grid2">
          <div className="form-row"><label className="form-label">LOT 번호</label><input placeholder="예: LOT-20250101-001" value={fLot.lot_no} onChange={e=>setFLot({...fLot,lot_no:e.target.value})}/></div>
          <div className="form-row"><label className="form-label">품목코드</label>
            <input placeholder="코드 입력" value={fLot.item_code} list="lot-list" onChange={e=>{const it=items.find(i=>i.code===e.target.value);setFLot({...fLot,item_code:e.target.value,item_name:it?.name||""});}}/>
            <datalist id="lot-list">{items.map(i=><option key={i.id} value={i.code}>{i.name}</option>)}</datalist>
            {fLot.item_code&&items.find(i=>i.code===fLot.item_code)&&<div style={{marginTop:"4px",fontSize:"12px",color:"#185fa5",fontWeight:600}}>✓ {items.find(i=>i.code===fLot.item_code).name}</div>}
          </div>
        </div>
        <div className="form-grid2">
          <div className="form-row"><label className="form-label">수량</label><input type="number" value={fLot.qty} onChange={e=>setFLot({...fLot,qty:e.target.value})}/></div>
          <div className="form-row"><label className="form-label">창고</label><select value={fLot.wh_id} onChange={e=>setFLot({...fLot,wh_id:e.target.value})}><option value="">창고 선택</option>{whs.map(w=><option key={w.id} value={w.id}>{w.name}</option>)}</select></div>
        </div>
        <div className="form-grid2">
          <div className="form-row"><label className="form-label">입고일</label><input type="date" value={fLot.recv} onChange={e=>setFLot({...fLot,recv:e.target.value})}/></div>
          <div className="form-row"><label className="form-label">유효기한</label><input type="date" value={fLot.exp} onChange={e=>setFLot({...fLot,exp:e.target.value})}/></div>
        </div>
        <div className="form-row"><label className="form-label">공급업체</label><input placeholder="공급업체" value={fLot.supplier} onChange={e=>setFLot({...fLot,supplier:e.target.value})}/></div>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}><button className="btn" onClick={()=>{setMLot(false);setELot(null);}}>취소</button><button className="btn-primary" onClick={handleLot}>{eLot?"수정":"등록"}</button></div>
      </div></div>}

      {/* 입고 예정 모달 */}
      {mIn&&<div className="modal-bg"><div className="modal">
        <div className="modal-title">{eIn?"입고 예정 수정":"입고 예정 등록"}</div>
        <div className="form-grid2">
          <div className="form-row"><label className="form-label">품목코드</label>
            <input placeholder="코드 입력" value={fIn.item_code} list="in-list" onChange={e=>{const it=items.find(i=>i.code===e.target.value);setFIn({...fIn,item_code:e.target.value,item_name:it?.name||""});}}/>
            <datalist id="in-list">{items.map(i=><option key={i.id} value={i.code}>{i.name}</option>)}</datalist>
            {fIn.item_code&&items.find(i=>i.code===fIn.item_code)&&<div style={{marginTop:"4px",fontSize:"12px",color:"#185fa5",fontWeight:600}}>✓ {items.find(i=>i.code===fIn.item_code).name}</div>}
          </div>
          <div className="form-row"><label className="form-label">수량</label><input type="number" value={fIn.qty} onChange={e=>setFIn({...fIn,qty:e.target.value})}/></div>
        </div>
        <div className="form-grid2">
          <div className="form-row"><label className="form-label">예정일</label><input type="date" value={fIn.planned_date} onChange={e=>setFIn({...fIn,planned_date:e.target.value})}/></div>
          <div className="form-row"><label className="form-label">공급업체</label><input placeholder="공급업체" value={fIn.supplier} onChange={e=>setFIn({...fIn,supplier:e.target.value})}/></div>
        </div>
        <div className="form-grid2">
          <div className="form-row"><label className="form-label">창고</label><select value={fIn.wh_id} onChange={e=>setFIn({...fIn,wh_id:e.target.value})}><option value="">창고 선택</option>{whs.map(w=><option key={w.id} value={w.id}>{w.name}</option>)}</select></div>
          <div className="form-row"><label className="form-label">LOT 번호</label><input placeholder="LOT (선택)" value={fIn.lot_no} onChange={e=>setFIn({...fIn,lot_no:e.target.value})}/></div>
        </div>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}><button className="btn" onClick={()=>{setMIn(false);setEIn(null);}}>취소</button><button className="btn-primary" onClick={handleIn}>{eIn?"수정":"등록"}</button></div>
      </div></div>}

      {/* 품목 모달 */}
      {mItem&&<div className="modal-bg"><div className="modal">
        <div className="modal-title">{eItem?"품목 수정":"기초품목 등록"}</div>
        <div className="form-grid2">
          <div className="form-row"><label className="form-label">품목코드 *</label><input placeholder="예: RM-001" value={fItem.code} onChange={e=>setFItem({...fItem,code:e.target.value})} disabled={!!eItem}/></div>
          <div className="form-row"><label className="form-label">품목명 *</label><input placeholder="품목명" value={fItem.name} onChange={e=>setFItem({...fItem,name:e.target.value})}/></div>
        </div>
        <div className="form-grid3">
          <div className="form-row"><label className="form-label">분류 *</label><select value={fItem.category} onChange={e=>setFItem({...fItem,category:e.target.value})}><option>원료</option><option>원자재</option><option>부자재</option><option>완제품</option><option>반제품</option><option>포장자재</option></select></div>
          <div className="form-row"><label className="form-label">단위 *</label><input placeholder="kg, 개, L" value={fItem.unit} onChange={e=>setFItem({...fItem,unit:e.target.value})}/></div>
          <div className="form-row"><label className="form-label">보관위치</label><input placeholder="예: A-1" value={fItem.location} onChange={e=>setFItem({...fItem,location:e.target.value})}/></div>
        </div>
        <div className="form-grid2">
          <div className="form-row"><label className="form-label">규격</label><input placeholder="규격/사양" value={fItem.spec} onChange={e=>setFItem({...fItem,spec:e.target.value})}/></div>
          <div className="form-row"><label className="form-label">제조사</label><input placeholder="제조사" value={fItem.maker} onChange={e=>setFItem({...fItem,maker:e.target.value})}/></div>
        </div>
        <div className="form-grid2">
          <div className="form-row"><label className="form-label">단가 (원) *</label><input type="number" value={fItem.price} onChange={e=>setFItem({...fItem,price:e.target.value})}/></div>
          <div className="form-row"><label className="form-label">리드타임 (일)</label><input type="number" value={fItem.lead_time} onChange={e=>setFItem({...fItem,lead_time:e.target.value})}/></div>
        </div>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}><button className="btn" onClick={()=>{setMItem(false);setEItem(null);}}>취소</button><button className="btn-primary" onClick={handleItem}>{eItem?"수정":"등록"}</button></div>
      </div></div>}

      {toast&&<div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
