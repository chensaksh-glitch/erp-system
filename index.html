  .btn-danger { padding: 7px 14px; border-radius: 7px; border: 1px solid #e24b4a; background: #fff; cursor: pointer; font-size: 13px; color: #a32d2d; }
  .btn-green { padding: 4px 10px; border-radius: 6px; border: none; background: #3b9e3b; color: #fff; cursor: pointer; font-size: 12px; margin-right: 4px; }

  .modal-bg { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .modal { background: #fff; border-radius: 12px; padding: 24px; width: 560px; max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
  .modal-lg { width: 720px; }

  .form-row { margin-bottom: 14px; }
  .form-label { font-size: 12px; color: #666; margin-bottom: 5px; display: block; font-weight: 500; }
  .form-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  input, select, textarea { width: 100%; padding: 8px 10px; border-radius: 7px; border: 1px solid #ddd; font-size: 13px; outline: none; font-family: inherit; }
  input:focus, select:focus { border-color: #185fa5; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #185fa5; color: #fff; padding: 10px 22px; border-radius: 20px; font-size: 13px; z-index: 9999; }
  .save-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #3b6d11; background: #eaf3de; padding: 3px 8px; border-radius: 12px; }

  .loading { display: flex; align-items: center; justify-content: center; height: 100vh; font-size: 15px; color: #888; }
  .empty { padding: 32px; text-align: center; color: #aaa; font-size: 13px; }
  .mono { font-family: monospace; font-size: 12px; }
  .tab-bar { display: flex; gap: 4px; margin-bottom: 16px; background: #f0f0f0; padding: 4px; border-radius: 8px; width: fit-content; }
  .tab { padding: 6px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; color: #666; }
  .tab.active { background: #fff; color: #185fa5; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .progress-bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .progress-fill { height: 100%; border-radius: 4px; }
  .cat-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .process-step { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .process-chip { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
  .wo-detail-row { background: #f9fbff; }
  .wo-pt { width: 100%; border-collapse: collapse; font-size: 12px; }
  .wo-pt th { background: #f0f5ff; padding: 7px 10px; color: #555; font-weight: 600; border-bottom: 1px solid #e0e8ff; text-align: left; }

  .bmt td { padding: 4px; border-bottom: 1px solid #f0f0f0; }
  .bmt input { padding: 5px 8px; font-size: 12px; }
</style>

<body>
<div id="root"></div>
<script type="text/babel">

const SUPABASE_URL = "https://bwxkeuizvhyggdkngraj.supabase.co";
const SUPABASE_KEY = "sb_publishable_zBiSYJfZgt6Yrlafe1-YjA_Yt_Nv0P9";
const TOTAL_DB_MB = 500;
const EMPTY_MAT = {material_code:"",material_name:"",qty:"",unit:"",note:""};

const dlCSV = (name, headers, rows) => {
  const csv = "\uFEFF" + [headers.join(","), ...rows.map(r=>r.map(c=>`"${String(c??"-").replace(/"/g,'""')}"`).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
  a.download = name+"_"+new Date().toISOString().slice(0,10)+".csv";
  a.click();
};

const api = async (table, method="GET", body=null, query="") => {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`, {
    method, headers:{"apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/json","Prefer":"return=representation"},
    body: body?JSON.stringify(body):null
  });
  if(method==="DELETE"||res.status===204) return null;
  const d = await res.json();
  if(!res.ok) throw new Error(JSON.stringify(d));
  return d;
};

const SC = {"대기":{bg:"#e6f1fb",c:"#185fa5"},"진행중":{bg:"#faeeda",c:"#854f0b"},"완료":{bg:"#eaf3de",c:"#3b6d11"},"예정":{bg:"#e6f1fb",c:"#185fa5"},"입고완료":{bg:"#eaf3de",c:"#3b6d11"}};
const CAT = {"완제품":{bg:"#e6f1fb",c:"#185fa5"},"원자재":{bg:"#eaf3de",c:"#3b6d11"},"부자재":{bg:"#faeeda",c:"#854f0b"},"반제품":{bg:"#f3e8fb",c:"#6b2fa0"}};
const Badge = ({s}) => <span className="badge" style={{background:SC[s]?.bg||"#f0f0f0",color:SC[s]?.c||"#666"}}>{s}</span>;
const CatBadge = ({c}) => <span className="cat-badge" style={{background:CAT[c]?.bg||"#f0f0f0",color:CAT[c]?.c||"#666"}}>{c||"-"}</span>;
const calcMin = (s,e) => { if(!s||!e) return null; const [sh,sm]=s.split(":").map(Number),[eh,em]=e.split(":").map(Number),d=(eh*60+em)-(sh*60+sm); return d>0?d:null; };

const useSel = () => {
  const [sel, setSel] = React.useState([]);
  return {
    sel, clear:()=>setSel([]),
    toggle:id=>setSel(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]),
    toggleAll:list=>setSel(sel.length===list.length?[]:list.map(x=>x.id)),
    has:id=>sel.includes(id),
    allOf:list=>list.length>0&&sel.length===list.length
  };
};

const Toolbar = ({s, onDel, children}) => (
  <div className="toolbar">{children}{s&&s.sel.length>0&&<button className="btn-danger" onClick={onDel}>🗑 선택 삭제 ({s.sel.length})</button>}</div>
);

function App() {
  // 데이터
  const [items,setItems] = React.useState([]);
  const [workOrders,setWorkOrders] = React.useState([]);
  const [wop,setWop] = React.useState([]);
  const [hist,setHist] = React.useState([]);
  const [whs,setWhs] = React.useState([]);
  const [procs,setProcs] = React.useState([]);
  const [lots,setLots] = React.useState([]);
  const [inPlan,setInPlan] = React.useState([]);
  const [boms,setBoms] = React.useState([]);
  const [loading,setLoading] = React.useState(true);
  const [toast,setToast] = React.useState("");
  const [dbMB,setDbMB] = React.useState(0);
  const [expWO,setExpWO] = React.useState(null);
  const [menu,setMenu] = React.useState("dashboard");

  // 선택
  const iSel=useSel(),woSel=useSel(),whSel=useSel(),prSel=useSel(),lotSel=useSel(),inSel=useSel(),bomSel=useSel();

  // 모달
  const [mIO,setMIO]=React.useState(false);
  const [mWO,setMWO]=React.useState(false);
  const [mWH,setMWH]=React.useState(false);
  const [mPR,setMPR]=React.useState(false);
  const [mLot,setMLot]=React.useState(false);
  const [mIn,setMIn]=React.useState(false);
  const [mItem,setMItem]=React.useState(false);
  const [mBom,setMBom]=React.useState(false);
  const [mBomExp,setMBomExp]=React.useState(false);
  const [mWhStock,setMWhStock]=React.useState(false);
  const [mProcRes,setMProcRes]=React.useState(false);

  // 편집
  const [eItem,setEItem]=React.useState(null);
  const [eWO,setEWO]=React.useState(null);
  const [eWH,setEWH]=React.useState(null);
  const [ePR,setEPR]=React.useState(null);
  const [eLot,setELot]=React.useState(null);
  const [eIn,setEIn]=React.useState(null);
  const [eBom,setEBom]=React.useState(null);
  const [selWH,setSelWH]=React.useState(null);
  const [selProc,setSelProc]=React.useState(null);

  // 필터
  const [whSrch,setWhSrch]=React.useState("");
  const [invTab,setInvTab]=React.useState("품목현황");
  const [itemTab,setItemTab]=React.useState("전체");
  const [itemSrch,setItemSrch]=React.useState("");
  const [bomTab,setBomTab]=React.useState("전체");
  const [bomSrch,setBomSrch]=React.useState("");
  const [hFilter,setHFilter]=React.useState({cat:"전체",type:"전체",kw:""});

  // BOM 전개
  const [beProd,setBeProd]=React.useState("");
  const [beQty,setBeQty]=React.useState("");
  const [beResult,setBeResult]=React.useState([]);

  // 폼
  const [fIO,setFIO]=React.useState({type:"입고",code:"",qty:"",lot_no:"",wh_id:"",note:""});
  const [fWO,setFWO]=React.useState({product:"",qty:"",planned:"",due:"",wh_id:"",procs:[]});
  const [fWH,setFWH]=React.useState({code:"",name:"",location:"",manager:"",note:""});
  const [fPR,setFPR]=React.useState({code:"",name:"",order_no:"",machine:"",manager:"",note:""});
  const [fLot,setFLot]=React.useState({lot_no:"",item_code:"",item_name:"",wh_id:"",qty:"",recv:"",exp:"",supplier:"",note:""});
  const [fIn,setFIn]=React.useState({item_code:"",item_name:"",qty:"",planned_date:"",supplier:"",wh_id:"",lot_no:"",note:""});
  const [fItem,setFItem]=React.useState({code:"",name:"",category:"원자재",unit:"",stock:0,min_stock:0,location:"",spec:"",maker:"",price:0,lead_time:0,note:""});
  const [fBomProd,setFBomProd]=React.useState({product_code:"",product_name:""});
  const [fBomMats,setFBomMats]=React.useState([{...EMPTY_MAT}]);
  const [fProcRes,setFProcRes]=React.useState({work_date:"",start_time:"",end_time:"",work_qty:"",defect_qty:"0",assignee:"",note:""});

  const showToast = m => { setToast(m); setTimeout(()=>setToast(""),2500); };
  const whName = id => whs.find(w=>w.id===id)?.name||"-";
  const prName = id => procs.find(p=>p.id===id)?.name||"-";
  const getWOP = woId => wop.filter(p=>p.wo_id===woId).sort((a,b)=>a.step_no-b.step_no);
  const getCurStep = woId => { const s=getWOP(woId); return s.find(x=>x.status==="진행중")||s.find(x=>x.status==="대기"); };

  const loadAll = async () => {
    try {
      const [i,w,wp,h,wh,pr,lt,ip,bm] = await Promise.all([
        api("items","GET",null,"?order=code"),
        api("work_orders","GET",null,"?order=created_at.desc"),
        api("work_order_processes","GET",null,"?order=wo_id,step_no"),
        api("stock_history","GET",null,"?order=id.desc&limit=200"),
        api("warehouses","GET",null,"?order=id"),
        api("processes","GET",null,"?order=order_no"),
        api("lots","GET",null,"?order=id.desc"),
        api("incoming_plan","GET",null,"?order=planned_date"),
        api("bom","GET",null,"?order=product_code"),
      ]);
      setItems(i||[]); setWorkOrders(w||[]); setWop(wp||[]); setHist(h||[]);
      setWhs(wh||[]); setProcs(pr||[]); setLots(lt||[]); setInPlan(ip||[]); setBoms(bm||[]);
      const t=(i||[]).length*0.5+(w||[]).length*0.5+(h||[]).length*0.3+(lt||[]).length*0.4+(ip||[]).length*0.3+(wh||[]).length*0.2+(pr||[]).length*0.2+(wp||[]).length*0.3+(bm||[]).length*0.3;
      setDbMB(Math.max(0.01,t/1024).toFixed(3));
    } catch(e){ alert("DB 연결 오류: "+e.message); }
    setLoading(false);
  };
  React.useEffect(()=>{ loadAll(); },[]);

  const lowStock = items.filter(i=>i.stock<i.min_stock);
  const usePct = Math.min(100,(dbMB/TOTAL_DB_MB*100)).toFixed(2);
  const useColor = usePct>80?"#e24b4a":usePct>50?"#f0a500":"#3b9e3b";
  const filtItems = items.filter(i=>(itemTab==="전체"||i.category===itemTab)&&(!itemSrch||i.code.includes(itemSrch)||i.name.includes(itemSrch)));

  const bulkDel = async (table, ids, clear, isWO=false) => {
    if(!ids||ids.length===0) return alert("삭제할 항목을 선택해주세요.");
    if(!window.confirm(`${ids.length}개 삭제하시겠습니까?`)) return;
    try {
      for(const id of ids){ if(isWO) await api("work_order_processes","DELETE",null,`?wo_id=eq.${id}`); await api(table,"DELETE",null,`?id=eq.${id}`); }
      clear(); await loadAll(); showToast(`✓ ${ids.length}개 삭제 완료`);
    } catch(e){ alert("오류: "+e.message); }
  };

  const handleIO = async () => {
    const item=items.find(i=>i.code===fIO.code);
    if(!item) return alert("품목 코드 확인");
    const qty=parseInt(fIO.qty);
    try {
      await api("items","PATCH",{stock:fIO.type==="입고"?item.stock+qty:item.stock-qty},`?code=eq.${fIO.code}`);
      await api("stock_history","POST",{date:new Date().toISOString().slice(0,10),type:fIO.type,code:fIO.code,name:item.name,qty,lot_no:fIO.lot_no,warehouse_id:fIO.wh_id||null,note:fIO.note});
      if(fIO.lot_no){const l=lots.find(x=>x.lot_no===fIO.lot_no);if(l){const nr=fIO.type==="입고"?l.remaining_qty+qty:l.remaining_qty-qty;await api("lots","PATCH",{remaining_qty:nr},`?lot_no=eq.${fIO.lot_no}`);}}
      await loadAll(); setMIO(false); setFIO({type:"입고",code:"",qty:"",lot_no:"",wh_id:"",note:""}); showToast("✓ 입출고 처리 완료");
    } catch(e){ alert("오류: "+e.message); }
  };

  const handleItem = async () => {
    try {
      const d={...fItem,stock:parseInt(fItem.stock),min_stock:parseInt(fItem.min_stock),price:parseInt(fItem.price),lead_time:parseInt(fItem.lead_time)};
      if(eItem){ await api("items","PATCH",d,`?id=eq.${eItem.id}`); showToast("✓ 품목 수정"); }
      else { await api("items","POST",d); showToast("✓ 품목 등록"); }
      await loadAll(); setMItem(false); setEItem(null); setFItem({code:"",name:"",category:"원자재",unit:"",stock:0,min_stock:0,location:"",spec:"",maker:"",price:0,lead_time:0,note:""});
    } catch(e){ alert("오류: "+e.message); }
  };

  const handleBom = async () => {
    if(!fBomProd.product_code||!fBomProd.product_name) return alert("제품코드와 제품명을 입력하세요.");
    const valid=fBomMats.filter(m=>m.material_code&&m.qty);
    if(valid.length===0) return alert("자재를 1개 이상 입력하세요.");
    try {
      if(eBom){
        await api("bom","PATCH",{product_code:fBomProd.product_code,product_name:fBomProd.product_name,material_code:valid[0].material_code,material_name:valid[0].material_name,qty:parseFloat(valid[0].qty),unit:valid[0].unit||"",note:valid[0].note||""},`?id=eq.${eBom.id}`);
        showToast("✓ BOM 수정");
      } else {
        for(const m of valid){
          const it=items.find(i=>i.code===m.material_code);
          await api("bom","POST",{product_code:fBomProd.product_code,product_name:fBomProd.product_name,material_code:m.material_code,material_name:m.material_name||it?.name||"",qty:parseFloat(m.qty),unit:m.unit||it?.unit||"",note:m.note||""});
        }
        showToast(`✓ BOM ${valid.length}개 자재 등록`);
      }
      await loadAll(); setMBom(false); setEBom(null); setFBomProd({product_code:"",product_name:""}); setFBomMats([{...EMPTY_MAT}]);
    } catch(e){ alert("오류: "+e.message); }
  };

  const handleBomExpand = () => {
    if(!beProd||!beQty) return alert("제품과 수량을 입력하세요.");
    const qty=parseFloat(beQty);
    const pb=boms.filter(b=>b.product_code===beProd);
    if(pb.length===0) return alert("해당 제품의 BOM이 없습니다.");
    setBeResult(pb.map(b=>{
      const needed=b.qty*qty;
      const it=items.find(i=>i.code===b.material_code);
      const stock=it?.stock||0;
      const short=Math.max(0,needed-stock);
      return {code:b.material_code,name:b.material_name,unit:b.unit||it?.unit||"-",qty_per:b.qty,needed,stock,short,ok:short===0,cat:it?.category||"-"};
    }));
  };

  const handleWO = async () => {
    if(!fWO.product||!fWO.qty) return alert("제품명, 수량 입력");
    try {
      if(eWO){
        await api("work_orders","PATCH",{product:fWO.product,qty:parseInt(fWO.qty),planned:fWO.planned,due:fWO.due,warehouse_id:fWO.wh_id||null},`?id=eq.${eWO.id}`);
        showToast("✓ 작업지시 수정");
      } else {
        if(fWO.procs.length===0) return alert("공정을 선택하세요.");
        const nid=`WO-${new Date().getFullYear()}-${String(workOrders.length+1).padStart(3,"0")}`;

        showToast("✓ 작업지시 생성");
      }
