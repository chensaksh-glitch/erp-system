<script type="text/babel">

const SUPABASE_URL = "https://bwxkeuizvhyggdkngraj.supabase.co";
const SUPABASE_KEY = "sb_publishable_zBiSYJfZgt6Yrlafe1-YjA_Yt_Nv0P9";
const TOTAL_DB_MB = 500;
const EMPTY_MAT = {material_code:"",material_name:"",qty:"",unit:"",note:""};

const downloadCSV = (filename, headers, rows) => {
  const BOM_MARK = "\uFEFF";
  const csv = BOM_MARK + [headers.join(","), ...rows.map(r => r.map(c => `"${String(c??"-").replace(/"/g,'""')}"`).join(","))].join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename + "_" + new Date().toISOString().slice(0,10) + ".csv";
  a.click(); URL.revokeObjectURL(url);
};

const api = async (table, method="GET", body=null, query="") => {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`, {
    method,
    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": "return=representation" },
    body: body ? JSON.stringify(body) : null
  });
  if (method==="DELETE" || res.status===204) return null;
  const data = await res.json();
  if (!res.ok) throw new Error(JSON.stringify(data));
  return data;
};

const SC = { "대기":{bg:"#e6f1fb",color:"#185fa5"}, "진행중":{bg:"#faeeda",color:"#854f0b"}, "완료":{bg:"#eaf3de",color:"#3b6d11"}, "예정":{bg:"#e6f1fb",color:"#185fa5"}, "입고완료":{bg:"#eaf3de",color:"#3b6d11"} };
const CAT = { "완제품":{bg:"#e6f1fb",color:"#185fa5"}, "원자재":{bg:"#eaf3de",color:"#3b6d11"}, "부자재":{bg:"#faeeda",color:"#854f0b"}, "반제품":{bg:"#f3e8fb",color:"#6b2fa0"} };
const Badge = ({s}) => <span className="badge" style={{background:SC[s]?.bg||"#f0f0f0",color:SC[s]?.color||"#666"}}>{s}</span>;
const CatBadge = ({c}) => <span className="cat-badge" style={{background:CAT[c]?.bg||"#f0f0f0",color:CAT[c]?.color||"#666"}}>{c||"-"}</span>;
const calcMinutes = (s,e) => { if(!s||!e) return null; const [sh,sm]=s.split(":").map(Number),[eh,em]=e.split(":").map(Number),d=(eh*60+em)-(sh*60+sm); return d>0?d:null; };

const useSelection = () => {
  const [selected, setSelected] = React.useState([]);
  const toggle = id => setSelected(p => p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const toggleAll = list => setSelected(selected.length===list.length?[]:list.map(x=>x.id));
  const clear = () => setSelected([]);
  const isSelected = id => selected.includes(id);
  const isAllSelected = list => list.length>0 && selected.length===list.length;
  return {selected, toggle, toggleAll, clear, isSelected, isAllSelected};
};

const Toolbar = ({sel, onDelete, children}) => (
  <div className="toolbar">
    {children}
    {sel && sel.selected.length>0 && <button className="btn-danger" onClick={onDelete}>🗑 선택 삭제 ({sel.selected.length})</button>}

);

function App() {

  const [expandedWO, setExpandedWO] = React.useState(null);

  const woSel = useSelection();

  const [showIO, setShowIO] = React.useState(false);

  const [showWH, setShowWH] = React.useState(false);
  const [showPR, setShowPR] = React.useState(false);

  const [editItem, setEditItem] = React.useState(null);

  const [editPR, setEditPR] = React.useState(null);
  const [editLot, setEditLot] = React.useState(null);

  const [whSearch, setWhSearch] = React.useState("");

  const [whForm, setWHForm] = React.useState({code:"",name:"",location:"",manager:"",note:""});
  const [prForm, setPRForm] = React.useState({code:"",name:"",order_no:"",machine:"",manager:"",note:""});
  const [lotForm, setLotForm] = React.useState({lot_no:"",item_code:"",item_name:"",warehouse_id:"",qty:"",received_date:"",expiry_date:"",supplier:"",note:""});
  const [incomingForm, setIncomingForm] = React.useState({item_code:"",item_name:"",qty:"",planned_date:"",supplier:"",warehouse_id:"",lot_no:"",note:""});

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(""),2500); };

  const loadAll = async () => {

  const bulkDelete = async (table, ids, afterClear, woIds=false) => {

        showToast("✓ 작업지시 생성 완료");
      }
      await loadAll(); setShowWO(false); setEditWO(null); setWOForm({product:"",qty:"",planned:"",due:"",warehouse_id:"",selectedProcesses:[]});

      if(steps.length>0) await api("work_order_processes","PATCH",{status:"진행중"},`?id=eq.${steps[0].id}`);

  };

      await api("work_order_processes","PATCH",{status:"완료",work_date:procResultForm.work_date,start_time:procResultForm.start_time,end_time:procResultForm.end_time,work_minutes:minutes,work_qty:wq,defect_qty:dq,good_qty:wq-dq,assignee:procResultForm.assignee,note:procResultForm.note},`?id=eq.${selectedProc.id}`);

            <tbody>{lowStock.map(i=><tr key={i.id}><td className="mono">{i.code}</td><td>{i.name}</td><td><CatBadge c={i.category}/></td><td style={{color:"#a32d2d",fontWeight:700}}>{i.stock}</td><td>{i.min_stock}</td><td>{i.unit}</td></tr>)}</tbody>

        <div className="form-grid2">
          <div className="form-row"><label className="form-label">입고일</label><input type="date" value={lotForm.received_date} onChange={e=>setLotForm({...lotForm,received_date:e.target.value})}/></div>
          <div className="form-row"><label className="form-label">유효기한</label><input type="date" value={lotForm.expiry_date} onChange={e=>setLotForm({...lotForm,expiry_date:e.target.value})}/></div>
        </div>
        <div className="form-row"><label className="form-label">공급업체</label><input placeholder="공급업체" value={lotForm.supplier} onChange={e=>setLotForm({...lotForm,supplier:e.target.value})}/></div>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}><button className="btn" onClick={()=>{setShowLot(false);setEditLot(null);}}>취소</button><button className="btn-primary" onClick={handleLot}>{editLot?"수정":"등록"}</button></div>
      </div></div>}

      {/* 입고 예정 등록/수정 모달 */}
      {showIncoming&&<div className="modal-bg"><div className="modal">
        <div className="modal-title">{editIncoming?"입고 예정 수정":"입고 예정 등록"}</div>
        <div className="form-grid2">
          <div className="form-row"><label className="form-label">품목코드</label>
            <input placeholder="코드 입력" value={incomingForm.item_code} list="in-item-list" onChange={e=>{const it=items.find(i=>i.code===e.target.value);setIncomingForm({...incomingForm,item_code:e.target.value,item_name:it?.name||""}); }}/>
            <datalist id="in-item-list">{items.map(i=><option key={i.id} value={i.code}>{i.name}</option>)}</datalist>
            {incomingForm.item_code&&items.find(i=>i.code===incomingForm.item_code)&&<div style={{marginTop:"4px",fontSize:"12px",color:"#185fa5",fontWeight:600}}>✓ {items.find(i=>i.code===incomingForm.item_code).name}</div>}
          </div>
          <div className="form-row"><label className="form-label">수량</label><input type="number" value={incomingForm.qty} onChange={e=>setIncomingForm({...incomingForm,qty:e.target.value})}/></div>
        </div>
        <div className="form-grid2">
          <div className="form-row"><label className="form-label">예정일</label><input type="date" value={incomingForm.planned_date} onChange={e=>setIncomingForm({...incomingForm,planned_date:e.target.value})}/></div>
          <div className="form-row"><label className="form-label">공급업체</label><input placeholder="공급업체" value={incomingForm.supplier} onChange={e=>setIncomingForm({...incomingForm,supplier:e.target.value})}/></div>
        </div>
        <div className="form-grid2">
          <div className="form-row"><label className="form-label">창고</label><select value={incomingForm.warehouse_id} onChange={e=>setIncomingForm({...incomingForm,warehouse_id:e.target.value})}><option value="">창고 선택</option>{warehouses.map(w=><option key={w.id} value={w.id}>{w.name}</option>)}</select></div>
          <div className="form-row"><label className="form-label">LOT 번호</label><input placeholder="LOT (선택)" value={incomingForm.lot_no} onChange={e=>setIncomingForm({...incomingForm,lot_no:e.target.value})}/></div>
        </div>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}><button className="btn" onClick={()=>{setShowIncoming(false);setEditIncoming(null);}}>취소</button><button className="btn-primary" onClick={handleIncoming}>{editIncoming?"수정":"등록"}</button></div>
      </div></div>}

      {/* 품목 등록/수정 모달 */}
      {showItem&&<div className="modal-bg"><div className="modal">
        <div className="modal-title">{editItem?"품목 수정":"기초품목 등록"}</div>
        <div className="form-grid2">
          <div className="form-row"><label className="form-label">품목코드 *</label><input placeholder="예: RM-001" value={itemForm.code} onChange={e=>setItemForm({...itemForm,code:e.target.value})} disabled={!!editItem}/></div>
          <div className="form-row"><label className="form-label">품목명 *</label><input placeholder="품목명" value={itemForm.name} onChange={e=>setItemForm({...itemForm,name:e.target.value})}/></div>
        </div>
        <div className="form-grid3">
          <div className="form-row"><label className="form-label">분류 *</label><select value={itemForm.category} onChange={e=>setItemForm({...itemForm,category:e.target.value})}><option>원자재</option><option>부자재</option><option>완제품</option><option>반제품</option></select></div>
          <div className="form-row"><label className="form-label">단위 *</label><input placeholder="예: kg, 개, L" value={itemForm.unit} onChange={e=>setItemForm({...itemForm,unit:e.target.value})}/></div>
          <div className="form-row"><label className="form-label">보관위치</label><input placeholder="예: A-1" value={itemForm.location} onChange={e=>setItemForm({...itemForm,location:e.target.value})}/></div>
        </div>
        <div className="form-grid2">
          <div className="form-row"><label className="form-label">규격</label><input placeholder="규격/사양" value={itemForm.spec} onChange={e=>setItemForm({...itemForm,spec:e.target.value})}/></div>
          <div className="form-row"><label className="form-label">제조사</label><input placeholder="제조사" value={itemForm.maker} onChange={e=>setItemForm({...itemForm,maker:e.target.value})}/></div>
        </div>
        <div className="form-grid2">
          <div className="form-row"><label className="form-label">단가 (원)</label><input type="number" value={itemForm.price} onChange={e=>setItemForm({...itemForm,price:e.target.value})}/></div>
          <div className="form-row"><label className="form-label">리드타임 (일)</label><input type="number" value={itemForm.lead_time} onChange={e=>setItemForm({...itemForm,lead_time:e.target.value})}/></div>
        </div>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}><button className="btn" onClick={()=>{setShowItem(false);setEditItem(null);}}>취소</button><button className="btn-primary" onClick={handleItem}>{editItem?"수정":"등록"}</button></div>
      </div></div>}

      {toast&&<div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
