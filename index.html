    const hdrFont={name:"나눔고딕",bold:true,size:7};
    const bodyFont={name:"나눔고딕",size:7};
    const cM={horizontal:"center",vertical:"middle",wrapText:true};
    const lM={horizontal:"left",vertical:"middle",wrapText:true};
    const rM={horizontal:"right",vertical:"middle",wrapText:true};

    const applyBdr=(cell)=>{cell.border=bdr;return cell;};
    const hdrCell=(r,c,v,fill)=>{const cell=ws.getCell(r,c);cell.value=v;cell.font=hdrFont;cell.alignment=cM;cell.border=bdr;if(fill)cell.fill=gFill;return cell;};

    // ── Row 1: 여백 ──
    ws.getRow(1).height=2;

    // ── Row 2~5: 제목 A2:AE5 병합 ──
    ws.mergeCells("A2:AE5");
    ws.getRow(2).height=19.35; ws.getRow(3).height=16.35; ws.getRow(4).height=37.25; ws.getRow(5).height=19.35;
    const tc=ws.getCell("A2");
    tc.value=`(  ${year}  ) 년도  ( ${month} ) 월   (  ${typeLabel}  ) 입·출고 관리대장`;
    tc.font=titleFont; tc.alignment={horizontal:"center",vertical:"middle"}; tc.border=bdr;

    // ── 서명란 AF2:AM5 ──
    const sigLabels=[["AF2:AG2","작  성"],["AH2:AI2","검  토"],["AJ2:AK2","검  토"],["AL2:AM2","승  인"]];
    sigLabels.forEach(([rng,label])=>{ws.mergeCells(rng);const c=ws.getCell(rng.split(":")[0]);c.value=label;c.font=hdrFont;c.alignment=cM;c.border=bdr;});
    [["AF3:AG5"],["AH3:AI5"],["AJ3:AK5"],["AL3:AM5"]].forEach(([rng])=>{ws.mergeCells(rng);applyBdr(ws.getCell(rng.split(":")[0]));});

    // ── Row 6: 구분선 ──
    ws.getRow(6).height=5.85;

    // ── Row 7: 범례 ──
    ws.getRow(7).height=20;
    const lgc=ws.getCell("AM7");
    lgc.value="출고처 범례: P = 생산, Q = 품질, R = 연구, E = 기타(생산·품질·연구 외 출고 시, 출고처 상세 내용은 SOP-706-F07. 제조지시 및 기록서 참고)";
    lgc.font={name:"나눔고딕",size:8}; lgc.alignment=rM;

    // ── Row 8: 헤더 ──
    ws.getRow(8).height=23.85;
    ["보관위치","원료명","Lot No.","이월재고","단위","구분"].forEach((h,i)=>hdrCell(8,i+1,h,true));
    for(let d=1;d<=31;d++) hdrCell(8,6+d,d,true);
    hdrCell(8,38,"합계",true); hdrCell(8,39,"현재고",true);

    // ── 데이터: LOT 단위 그룹화 ──
    const tabIts=items.filter(i=>i.type===typeLabel);
    const tabItemCodes=new Set(tabIts.map(i=>i.code));
    const grpMap={};

    // 1) lots 배열에서 LOT별 그룹 생성
    lots.filter(l=>tabItemCodes.has(l.item)).sort((a,b)=>(a.mfg||"").localeCompare(b.mfg||"")).forEach(l=>{
      const key=l.item+"__"+l.code;
      const it=items.find(i=>i.code===l.item);
      if(!grpMap[key]) grpMap[key]={item:l.item,itemName:l.itemName||(it?it.name:""),lot:l.code};
    });
    // 2) IO 기록에만 있는 품목+LOT 조합 추가
    io.filter(r=>r.date&&r.date>=monthStartStr&&r.date<=monthEndStr&&tabItemCodes.has(r.item)).forEach(r=>{
      const key=r.item+"__"+(r.lot||"");
      if(!grpMap[key]){
        const it=items.find(i=>i.code===r.item);
        grpMap[key]={item:r.item,itemName:r.itemName||(it?it.name:""),lot:r.lot||""};
      }
    });
    // 3) LOT가 전혀 없는 품목은 빈 LOT로 추가
    tabIts.forEach(it=>{
      const hasAny=Object.values(grpMap).some(g=>g.item===it.code);
      if(!hasAny) grpMap[it.code+"__"]={item:it.code,itemName:it.name,lot:""};
    });

    // ── 이월재고 계산: LOT별 (현재 LOT 잔량에서 이번달 이후 변동분 역산) ──
    const calcPrevStock=(itemCode,lotCode)=>{
      if(lotCode){
        const lotObj=lots.find(l=>l.code===lotCode&&l.item===itemCode);
        const curQty=lotObj?lotObj.qty||0:0;
        const inFrom=io.filter(r=>r.item===itemCode&&r.lot===lotCode&&r.date&&r.date>=monthStartStr&&r.type==="입고").reduce((s,r)=>s+(r.qty||0),0);
        const outFrom=io.filter(r=>r.item===itemCode&&r.lot===lotCode&&r.date&&r.date>=monthStartStr&&r.type==="출고").reduce((s,r)=>s+(r.qty||0),0);
        return curQty-inFrom+outFrom;
      } else {
        // LOT 미지정: 품목 전체 현재고 - 모든 LOT 잔량 (LOT 미추적 재고)
        const itemStock=(items.find(i=>i.code===itemCode)||{}).stock||0;
        const lotTotal=lots.filter(l=>l.item===itemCode).reduce((s,l)=>s+(l.qty||0),0);
        const noLotCur=Math.max(0,itemStock-lotTotal);
        const inFrom=io.filter(r=>r.item===itemCode&&!r.lot&&r.date&&r.date>=monthStartStr&&r.type==="입고").reduce((s,r)=>s+(r.qty||0),0);
        const outFrom=io.filter(r=>r.item===itemCode&&!r.lot&&r.date&&r.date>=monthStartStr&&r.type==="출고").reduce((s,r)=>s+(r.qty||0),0);
        return noLotCur-inFrom+outFrom;
      }
    };

    let dr=9;

    Object.values(grpMap).forEach(grp=>{
      const it=items.find(i=>i.code===grp.item);
      const lotObj=lots.find(l=>l.code===grp.lot);
      const warehouse=lotObj?lotObj.warehouse:(it&&it.warehouse?it.warehouse:"");
      const unit=it?it.unit||"":"";
      const prevStock=calcPrevStock(grp.item,grp.lot);

      // 일별 입고/출고/출고처 (해당 월, 해당 LOT만)
      const inD={},outD={},destD={};
      io.filter(r=>r.item===grp.item&&(r.lot||"")===(grp.lot||"")&&r.date&&r.date>=monthStartStr&&r.date<=monthEndStr).forEach(r=>{
        const d=new Date(r.date).getDate();
        if(r.type==="입고"){inD[d]=(inD[d]||0)+r.qty;}
        else{outD[d]=(outD[d]||0)+r.qty; if(r.destination) destD[d]=r.destination;}
      });
      const totalIn=Object.values(inD).reduce((a,b)=>a+b,0);
      const totalOut=Object.values(outD).reduce((a,b)=>a+b,0);
      const curStock=prevStock+totalIn-totalOut;

      // 이월재고 0 + 이번달 입출고 없으면 행 생략
      if(prevStock<=0&&totalIn===0&&totalOut===0) return;

      // ── 3행 공통 셀 (A,B,C,D,E 병합) ──
      [[1,warehouse,cM],[2,grp.itemName,lM],[3,grp.lot,cM],[4,prevStock,cM],[5,unit,cM]].forEach(([ci,val,align])=>{
        ws.mergeCells(dr,ci,dr+2,ci);
        const c=ws.getCell(dr,ci); c.value=val; c.font=bodyFont; c.alignment=align; c.border=bdr;
        [dr+1,dr+2].forEach(ri=>{const cc=ws.getCell(ri,ci);cc.border=bdr;});
      });

      // ── 입고 행 (dr) ──
      ws.getRow(dr).height=23.85;
      hdrCell(dr,6,"입고",true);
      for(let d=1;d<=31;d++){const c=ws.getCell(dr,6+d);c.value=inD[d]||"";c.font=bodyFont;c.alignment=cM;c.border=bdr;}
      const sumInC=ws.getCell(dr,38); sumInC.value=totalIn||""; sumInC.font=hdrFont; sumInC.alignment=cM; sumInC.border=bdr; sumInC.fill=gFill;
      const curC=ws.getCell(dr,39); curC.value=curStock; curC.font={name:"나눔고딕",bold:true,size:9}; curC.alignment=cM; curC.border=bdr; curC.fill=gFill;

      // ── 출고 행 (dr+1) ──
      ws.getRow(dr+1).height=23.85;
      hdrCell(dr+1,6,"출고",true);
      for(let d=1;d<=31;d++){const c=ws.getCell(dr+1,6+d);c.value=outD[d]||"";c.font=bodyFont;c.alignment=cM;c.border=bdr;}
      const sumOutC=ws.getCell(dr+1,38); sumOutC.value=totalOut||""; sumOutC.font=hdrFont; sumOutC.alignment=cM; sumOutC.border=bdr; sumOutC.fill=gFill;
      applyBdr(ws.getCell(dr+1,39)).fill=gFill;

      // ── 출고처 행 (dr+2) ──
      ws.getRow(dr+2).height=23.85;
      hdrCell(dr+2,6,"출고처",true);
      for(let d=1;d<=31;d++){const c=ws.getCell(dr+2,6+d);c.value=destD[d]||"";c.font=bodyFont;c.alignment=cM;c.border=bdr;}
      applyBdr(ws.getCell(dr+2,38)).fill=gFill;
      applyBdr(ws.getCell(dr+2,39)).fill=gFill;

      dr+=3;
    });

    ws.views=[{state:"frozen",ySplit:8,activeCell:"G9"}];

    const fname=`원부자재입출고관리대장_${year}년${String(month).padStart(2,"0")}월_${typeLabel}.xlsx`;
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=fname; a.click();
    URL.revokeObjectURL(url);
    showToast("엑셀 다운로드 완료");
  };

  // ── 인쇄 (원부자재 월간 그리드) ──
  const printIO=()=>{
    const isMatTab=(ioTab==="원자재"||ioTab==="부자재");
    const year=isMatTab?ioYear:(startDate?new Date(startDate).getFullYear():new Date().getFullYear());
    const month=isMatTab?ioMonth:(startDate?new Date(startDate).getMonth()+1:new Date().getMonth()+1);
    const daysInMonth=new Date(year,month,0).getDate();
    const typeLabel=ioTab==="원자재"?"원자재":ioTab==="부자재"?"부자재":ioTab==="완제품"?"완제품":"전체";
    const monthStartStr=String(year)+"-"+String(month).padStart(2,"0")+"-01";
    const monthEndStr=String(year)+"-"+String(month).padStart(2,"0")+"-"+String(daysInMonth).padStart(2,"0");

    // 이월재고 계산 함수 (LOT별 현재고 역산)
    const calcPrevStock=(itemCode,lotCode)=>{
      if(lotCode){
        const lotObj=lots.find(l=>l.code===lotCode&&l.item===itemCode);
        const curQty=lotObj?lotObj.qty||0:0;
        const inFrom=io.filter(r=>r.item===itemCode&&r.lot===lotCode&&r.date&&r.date>=monthStartStr&&r.type==="입고").reduce((s,r)=>s+(r.qty||0),0);
        const outFrom=io.filter(r=>r.item===itemCode&&r.lot===lotCode&&r.date&&r.date>=monthStartStr&&r.type==="출고").reduce((s,r)=>s+(r.qty||0),0);
        return curQty-inFrom+outFrom;
      } else {
        const itemStock=(items.find(i=>i.code===itemCode)||{}).stock||0;
        const lotTotal=lots.filter(l=>l.item===itemCode).reduce((s,l)=>s+(l.qty||0),0);
        const noLotCur=Math.max(0,itemStock-lotTotal);
        const inFrom=io.filter(r=>r.item===itemCode&&!r.lot&&r.date&&r.date>=monthStartStr&&r.type==="입고").reduce((s,r)=>s+(r.qty||0),0);
        const outFrom=io.filter(r=>r.item===itemCode&&!r.lot&&r.date&&r.date>=monthStartStr&&r.type==="출고").reduce((s,r)=>s+(r.qty||0),0);
        return noLotCur-inFrom+outFrom;
      }
    };

    // 그룹화 — 원자재/부자재는 LOT 단위, 완제품/전체는 품목 단위
    const grpMap={};
    if(isMatTab){
      const tabItemCodes=new Set(items.filter(i=>i.type===typeLabel).map(i=>i.code));
      // lots 배열에서 LOT별 그룹
      lots.filter(l=>tabItemCodes.has(l.item)).sort((a,b)=>(a.mfg||"").localeCompare(b.mfg||"")).forEach(l=>{
        const key=l.item+"__"+l.code;
        const it=items.find(i=>i.code===l.item);
        if(!grpMap[key]) grpMap[key]={item:l.item,itemName:l.itemName||(it?it.name:""),lot:l.code};
      });
      // IO에만 있는 품목+LOT 조합
      io.filter(r=>r.date&&r.date>=monthStartStr&&r.date<=monthEndStr&&tabItemCodes.has(r.item)).forEach(r=>{
        const key=r.item+"__"+(r.lot||"");
        if(!grpMap[key]){const it=items.find(i=>i.code===r.item);grpMap[key]={item:r.item,itemName:r.itemName||(it?it.name:""),lot:r.lot||""};}
      });
      // LOT 없는 품목
      items.filter(i=>i.type===typeLabel).forEach(it=>{
        if(!Object.values(grpMap).some(g=>g.item===it.code)) grpMap[it.code+"__"]={item:it.code,itemName:it.name,lot:""};
      });
    } else {
      filteredIo.forEach(r=>{
        if(!grpMap[r.item]){
          const lot=lots.filter(l=>l.item===r.item).sort((a,b)=>(b.mfg||"").localeCompare(a.mfg||""))[0];
          grpMap[r.item]={item:r.item,itemName:r.itemName,lot:lot?lot.code:""};
        }
      });
    }

    const dayNums=Array.from({length:daysInMonth},(_,i)=>i+1);

    const rows=Object.values(grpMap).map(grp=>{
      const it=items.find(i=>i.code===grp.item);
      const lotObj=lots.find(l=>l.code===grp.lot);
      const inD={},outD={},destD={};
      if(isMatTab){
        // LOT별 IO 필터
        io.filter(r=>r.item===grp.item&&(r.lot||"")===(grp.lot||"")&&r.date&&r.date>=monthStartStr&&r.date<=monthEndStr).forEach(r=>{
          const d=new Date(r.date).getDate();
          if(r.type==="입고"){inD[d]=(inD[d]||0)+r.qty;}
          else{outD[d]=(outD[d]||0)+r.qty;if(r.destination)destD[d]=r.destination;}
        });
      } else {
        (filteredIo.filter(r=>r.item===grp.item)).forEach(r=>{
          if(!r.date) return;
          const rd=new Date(r.date);
          if(rd.getFullYear()!==year||rd.getMonth()+1!==month) return;
          const d=rd.getDate();
          if(r.type==="입고"){inD[d]=(inD[d]||0)+r.qty;}
          else{outD[d]=(outD[d]||0)+r.qty;if(r.destination)destD[d]=r.destination;}
        });
      }
      const prevStock=isMatTab?calcPrevStock(grp.item,grp.lot):(it?it.stock||0:0);
      const totalIn=Object.values(inD).reduce((a,b)=>a+b,0);
      const totalOut=Object.values(outD).reduce((a,b)=>a+b,0);
      const wh=lotObj?lotObj.warehouse:(it&&it.warehouse?it.warehouse:"");
      if(prevStock<=0&&totalIn===0&&totalOut===0) return null;
      return {warehouse:wh,itemName:grp.itemName,lot:grp.lot,prevStock,unit:it?it.unit||"":"",inD,outD,destD,totalIn,totalOut,curStock:prevStock+totalIn-totalOut};
    }).filter(Boolean);

    const dayCols=dayNums.map(d=>`<th>${d}</th>`).join("");
    const dataRows=rows.map(r=>`
      <tr>
        <td rowspan="3" style="font-size:9px">${r.warehouse}</td>
        <td rowspan="3" style="font-size:9px;text-align:left">${r.itemName}</td>
        <td rowspan="3" style="font-size:9px">${r.lot}</td>
        <td rowspan="3" style="font-size:9px">${r.prevStock}</td>
        <td rowspan="3" style="font-size:9px">${r.unit}</td>
        <td class="gry">입고</td>
        ${dayNums.map(d=>`<td>${r.inD[d]||""}</td>`).join("")}
        <td class="gry">${r.totalIn||""}</td>
        <td class="gry" rowspan="3" style="font-weight:bold">${r.curStock}</td>
      </tr>
      <tr>
        <td class="gry">출고</td>
        ${dayNums.map(d=>`<td>${r.outD[d]||""}</td>`).join("")}
        <td class="gry">${r.totalOut||""}</td>
      </tr>
      <tr>
        <td class="gry">출고처</td>
        ${dayNums.map(d=>`<td style="font-size:8px">${r.destD[d]||""}</td>`).join("")}
        <td class="gry"></td>
      </tr>`).join("");

    const html=`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>${year}년 ${month}월 ${typeLabel} 입·출고 관리대장</title>
    <style>
      @page{size:A4 landscape;margin:10mm 8mm;}
      body{font-family:'나눔고딕',sans-serif;font-size:9px;margin:0;}
      .title-area{display:flex;margin-bottom:4px;}
      .title{flex:1;text-align:center;font-size:14px;font-weight:bold;border:1px solid #000;padding:8px;}
      .sig-area{display:flex;min-width:200px;}
      .sig-box{border:1px solid #000;text-align:center;flex:1;padding:2px 4px;font-size:9px;min-height:50px;}
      .legend{text-align:right;font-size:8px;color:#555;margin-bottom:2px;}
      table{width:100%;border-collapse:collapse;font-size:8px;}
      th,td{border:1px solid #000;padding:1px 2px;text-align:center;white-space:nowrap;}
      th{background:#d9d9d9;font-weight:bold;}
      .gry{background:#d9d9d9;font-weight:bold;}
      .footer{text-align:center;font-size:8px;margin-top:4px;color:#555;}
    </style></head><body>
    <div class="title-area">
      <div class="title">(  ${year}  ) 년도  ( ${month} ) 월  (  ${typeLabel}  ) 입·출고 관리대장</div>
      <div class="sig-area">
        <div class="sig-box">작&nbsp;&nbsp;성</div>
        <div class="sig-box">검&nbsp;&nbsp;토</div>
        <div class="sig-box">검&nbsp;&nbsp;토</div>
        <div class="sig-box">승&nbsp;&nbsp;인</div>
      </div>
    </div>
    <div class="legend">출고처 범례: P = 생산, Q = 품질, R = 연구, E = 기타</div>
    <table>
      <thead><tr>
        <th>보관위치</th><th>원료명</th><th>Lot No.</th><th>이월재고</th><th>단위</th><th>구분</th>
        ${dayCols}<th>합계</th><th>현재고</th>
      </tr></thead>
      <tbody>${dataRows||"<tr><td colspan='39'>데이터 없음</td></tr>"}</tbody>
    </table>
    <div class="footer">SOP-705-F01 &nbsp;&nbsp; Ver2.0(2025.09.09) &nbsp;&nbsp; (주)아이메디텍</div>
    </body></html>`;

    const blob=new Blob([html],{type:"text/html;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const win=window.open(url,"_blank","width=1200,height=800");
    win.onload=()=>{ win.focus(); win.print(); URL.revokeObjectURL(url); };
  };

  return (
    <div>
      <div className="page-header">
        <div><div className="page-title">입출고관리</div><div className="page-sub">( 모델명 ) 입·출고 관리대장 — SOP-705-F08 — LOT별 재고 추적</div></div>
        <div style={{display:"flex",gap:8}}>
          {perm.canDelete&&sel.size>0&&<button className="btn btn-danger" onClick={bulkDel}>🗑 선택 삭제 ({sel.size})</button>}
          <button className="btn btn-outline" onClick={printIO}>🖨️ 인쇄</button>
          <button className="btn btn-outline" onClick={(ioTab==="원자재"||ioTab==="부자재")?downloadExcelMaterial:downloadExcel}>📥 엑셀 다운로드</button>
          {perm.canCreate&&<button className="btn btn-primary" onClick={()=>{setForm({...emptyForm,date:today,manager:currentUser?.name||""});setCodeInput("");setModal(true);}}>+ 입출고 등록</button>}
        </div>
      </div>

      {/* 탭: 전체 / 완제품(반제품포함) / 원자재 / 부자재 */}
      <div className="tabs">
        {[["전체","📋 전체"],["완제품","📦 완제품·반제품"],["원자재","🧪 원자재"],["부자재","🔩 부자재"]].map(([k,label])=>(
          <div key={k} className={`tab${ioTab===k?" active":""}`} onClick={()=>setIoTab(k)}>{label}</div>
        ))}
      </div>

      <div className="panel" style={{overflowX:"auto"}}>
        <div className="panel-top">
          {(ioTab==="원자재"||ioTab==="부자재")?(
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:12,color:"#666",fontWeight:600}}>📅 기준 월</span>
              <select value={ioYear} onChange={e=>setIoYear(+e.target.value)} style={dateStyle}>
                {Array.from({length:7},(_,i)=>_now.getFullYear()-3+i).map(y=><option key={y} value={y}>{y}년</option>)}
              </select>
              <select value={ioMonth} onChange={e=>setIoMonth(+e.target.value)} style={dateStyle}>

                  <td style={{textAlign:"center",color:r.type==="입고"?"#2563eb":"#ccc",fontWeight:r.type==="입고"?600:400}}>{r.type==="입고"?fmt3(r.qty):"-"}</td>

                  <td style={{textAlign:"center",fontWeight:600,color:(r.runStock??0)<0?"#e74c3c":"#27ae60"}}>{fmt3(r.runStock??0)}</td>
                  <td>{(()=>{const d=r.destination;if(!d)return<span style={{color:"#ccc"}}>-</span>;const lbl={P:"P 생산",Q:"Q 품질",R:"R 연구",E:"E 기타",BUY:"구매입고",RTN:"반품",TRF:"이월",ETC:"기타"};const cls={P:"badge-blue",Q:"badge-orange",R:"badge-green",E:"badge-gray",BUY:"badge-blue",RTN:"badge-orange",TRF:"badge-green",ETC:"badge-gray"};return<span className={`badge ${cls[d]||"badge-gray"}`}>{lbl[d]||d}</span>;})()}</td>
                  <td style={{fontSize:12,color:"#555"}}>{r.manager||"-"}</td>
                  <td style={{fontSize:12,color:"#555"}}>{r.approver||"-"}</td>
                  <td style={{fontSize:12,color:"#aaa",maxWidth:100,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.note||"-"}</td>
                  <td>{perm.canEdit&&<button className="btn btn-outline btn-sm" onClick={()=>openEdit(r,r._idx)}>수정</button>}</td>
                </tr>
              );
            })}
            {!displayRows.length&&<tr><td colSpan={14} className="empty">{io.length?"해당 이력 없음":"이력 없음"}</td></tr>}
          </tbody>
        </table>
      </div>

      {/* 등록/수정 모달 */}
      {modal&&(<div className="overlay"><div className="modal" style={{width:620}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <span className="modal-title">{editIdx!==null?"입출고 수정":"입출고 등록"}</span>
          <button className="modal-close" onClick={()=>{setModal(false);setEditIdx(null);}}>✕</button>
        </div>
        <div className="modal-body">

            <div className="field"><label>일자</label><input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></div>
            <div className="field"><label>구분</label><select value={form.type} onChange={e=>setForm({...form,type:e.target.value,lot:"",destination:""})}><option>입고</option><option>출고</option></select></div>
          </div>
          <div className="field" style={{position:"relative"}}>
            <label>품목코드 *</label>
            <input value={codeInput}
              onChange={e=>{
                const v=e.target.value; setCodeInput(v);
                const exact=items.find(i=>i.code===v);
                if(exact){setForm(f=>({...f,item:exact.code,itemName:exact.name,unit:exact.unit||"EA",unitPrice:exact.price||0,lot:""}));}
                else{setForm(f=>({...f,item:"",itemName:""}));}
              }}
              placeholder="품목코드 또는 품목명 검색"
              autoComplete="off"/>
            {codeInput&&!form.item&&(()=>{
              const tabItems=items.filter(i=>{
                if(ioTab==="완제품") return i.type==="완제품"||i.type==="반제품";
                if(ioTab==="원자재") return i.type==="원자재";
                if(ioTab==="부자재") return i.type==="부자재";
                return true;
              });
              const _q=codeInput.toLowerCase();
              const hits=tabItems.filter(i=>i.code.toLowerCase().includes(_q)||i.name.toLowerCase().includes(_q));
              return hits.length>0?(
                <div style={{position:"absolute",top:"100%",left:0,right:0,background:"#fff",border:"1px solid #2563eb",borderRadius:6,boxShadow:"0 4px 12px rgba(0,0,0,0.12)",zIndex:300,maxHeight:180,overflowY:"auto"}}>
                  {hits.map(i=>(
                    <div key={i.code}
                      onClick={()=>{setForm(f=>({...f,item:i.code,itemName:i.name,unit:i.unit||"EA",unitPrice:i.price||0,lot:""}));setCodeInput(i.code);}}
                      style={{padding:"8px 12px",cursor:"pointer",borderBottom:"1px solid #f0f0f0",fontSize:13}}

                      <span style={{fontFamily:"monospace",color:"#2563eb",fontWeight:600}}>{i.code}</span>

                      <span className="badge badge-gray" style={{marginLeft:6,fontSize:10}}>{i.type}</span>
                    </div>
                  ))}

              ):null;
            })()}
            {form.item&&<div style={{fontSize:12,color:"#16a34a",fontWeight:600,marginTop:5}}>✅ {form.itemName} ({form.unit})</div>}
          </div>
          <div className="field-row">
            <div className="field"><label>수량</label><input type="number" value={form.qty} onChange={e=>setForm({...form,qty:+e.target.value})}/></div>
            <div className="field"><label>단위</label><select value={form.unit||"EA"} onChange={e=>setForm({...form,unit:e.target.value})}>{UNITS.map(u=><option key={u} value={u}>{u}</option>)}</select></div>
            {form.type==="입고"&&<div className="field"><label>단가 (원)</label><input type="number" value={form.unitPrice||0} onChange={e=>setForm({...form,unitPrice:+e.target.value})}/></div>}
          </div>
          <div className="field">
            <label>Lot No. {form.item&&itemLots.length>0&&<span style={{color:"#888",fontSize:11}}>(해당 품목 LOT {itemLots.length}개)</span>}</label>
            <select value={form.lot} onChange={e=>setForm({...form,lot:e.target.value})}>
              <option value="">-- LOT 선택 (선택사항) --</option>
              {itemLots.map(l=>{const rem=lotRemaining(l.code);return<option key={l.code} value={l.code}>{l.code} (잔여 {fmt3(rem??l.qty)}개)</option>;})}
            </select>
          </div>
          {selLot&&(
            <div style={{background:"#f0f9ff",borderRadius:8,padding:"10px 14px",fontSize:12,marginTop:4}}>
              <div style={{fontWeight:600,color:"#2563eb",marginBottom:4}}>📦 LOT 정보</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
                <div><span style={{color:"#888"}}>초기수량: </span><b>{fmt3(selLot.qty)}</b></div>
                <div><span style={{color:"#888"}}>사용량: </span><b>{fmt3(selLot.qty-(selLotRem??selLot.qty))}</b></div>
                <div><span style={{color:selLotRem<=0?"#e74c3c":"#16a34a"}}>잔여수량: </span><b style={{color:selLotRem<=0?"#e74c3c":"#16a34a"}}>{fmt3(selLotRem??selLot.qty)}</b></div>
              </div>
            </div>
          )}
          <div className="field-row" style={{marginTop:8}}>
            <div className="field">
              <label>{form.type==="출고"?"사용출처":"입고구분"}</label>
              <select value={form.destination||""} onChange={e=>setForm({...form,destination:e.target.value})}>
                <option value="">선택</option>
                {form.type==="출고"?<><option value="P">P — 생산</option><option value="Q">Q — 품질</option><option value="R">R — 연구</option><option value="E">E — 기타</option></>:<><option value="BUY">구매입고</option><option value="RTN">반품입고</option><option value="TRF">이월</option><option value="ETC">기타</option></>}
              </select>
            </div>
            <div className="field"><label>담당자</label><input value={form.manager||""} onChange={e=>setForm({...form,manager:e.target.value})}/></div>
            <div className="field"><label>확인자</label><input value={form.approver||""} onChange={e=>setForm({...form,approver:e.target.value})}/></div>
          </div>
          <div className="field"><label>비고</label><input value={form.note} onChange={e=>setForm({...form,note:e.target.value})}/></div>
        </div>
        <div className="modal-foot">
          <button className="btn btn-outline" onClick={()=>{setModal(false);setEditIdx(null);}}>취소</button>
          <button className="btn btn-primary" onClick={save}>저장</button>
        </div>
      </div></div>)}

    </div>
  );
}

function OrdersPage({orders,setOrders,items,setItems,bom,processes,factories,lots,setLots,io,setIo,warehouses,defectWarehouse,goodWarehouse,currentUser,perm,showToast,tryDelete,checkOrderLinks}) {
  const [activeTab,setActiveTab]=useState("list");
  const [sel,setSel]=useState(new Set());
  const [viewWo,setViewWo]=useState(null);
  const [modal,setModal]=useState(null);
  const [completeModal,setCompleteModal]=useState(null);
  const [compForm,setCompForm]=useState({doneDate:"",defectQty:0,processTimes:[]});
  const [form,setForm]=useState({code:"",product:"",productName:"",orderQty:0,lot:"",processes:[],materials:[],status:"대기",date:"",factoryCode:""});
  const [startDate,setStartDate]=useState("");
  const [endDate,setEndDate]=useState("");
  const todayStr=new Date().toISOString().slice(0,10);
  const dateStyle={border:"1px solid #ddd",borderRadius:5,padding:"5px 8px",fontSize:12,cursor:"pointer"};
  const filteredOrders=orders.filter(o=>{
    if(startDate&&o.date<startDate) return false;
    if(endDate&&o.date>endDate) return false;
    return true;
  });
  // 작업 입력 탭 state
  const [workWoCode,setWorkWoCode]=useState("");
  const [workProcTimes,setWorkProcTimes]=useState([]); // [{code,name,hours}]
  const [workMatQty,setWorkMatQty]=useState({});       // {itemCode: qty to deduct now}
  const [workMatLot,setWorkMatLot]=useState({});       // {itemCode: lotCode}
  const [workExtraMats,setWorkExtraMats]=useState([]); // [{code,name,qty,unit,lotCode}]
  const products=items.filter(i=>i.type==="완제품"||i.type==="반제품");
  const [prodCodeInput,setProdCodeInput]=useState("");
  const toggleSel=(code)=>setSel(prev=>{const s=new Set(prev);s.has(code)?s.delete(code):s.add(code);return s;});
  const SBadge=({s})=><span className={`badge ${s==="완료"?"badge-green":s==="진행중"?"badge-blue":s==="대기"?"badge-gray":"badge-red"}`}>{s}</span>;

  const selectProduct=(productCode)=>{
    const prd=items.find(i=>i.code===productCode);
    const itemProcCodes=prd?.processes||[];
    const autoProcs=itemProcCodes.map(pc=>{const proc=processes.find(p=>p.code===pc);return{code:pc,name:proc?.name||pc};});
    setForm(f=>({...f,product:productCode,processes:autoProcs}));
  };

  const openAdd=()=>{
    const _today=new Date();const _ymd=String(_today.getFullYear()).slice(2)+String(_today.getMonth()+1).padStart(2,"0")+String(_today.getDate()).padStart(2,"0");const _seq=String((orders.filter(o=>o.code.startsWith("I"+_ymd)).length)+1).padStart(3,"0");const _newCode="I"+_ymd+_seq;
    setForm({code:_newCode,product:"",productName:"",orderQty:0,lot:"",warehouse:goodWarehouse?.name||"",processes:[],materials:[],status:"대기",date:new Date().toISOString().slice(0,10),factoryCode:factories[0]?.code||""});
    setProdCodeInput("");setModal("add");
  };
  const addProcess=()=>setForm(f=>({...f,processes:[...f.processes,{code:"",name:""}]}));
  const setProc=(idx,val)=>{const ps=[...form.processes];const proc=processes.find(p=>p.code===val);ps[idx]={code:val,name:proc?.name||val};setForm(f=>({...f,processes:ps}));};
  const delProc=(idx)=>setForm(f=>({...f,processes:f.processes.filter((_,i)=>i!==idx)}));
  const addMat=()=>setForm(f=>({...f,materials:[...(f.materials||[]),{code:"",name:"",qty:1,unit:"EA"}]}));
  const delMat=(idx)=>setForm(f=>({...f,materials:f.materials.filter((_,i)=>i!==idx)}));
  const setMatField=(idx,field,val)=>setForm(f=>{const ms=[...(f.materials||[])];ms[idx]={...ms[idx],[field]:["qty"].includes(field)?+val:val};return{...f,materials:ms};});

  const openComplete=(order)=>{
    if(order.status==="취소"){
      alert("취소된 작업지시서입니다.");
      return;
    }
    // 작업실적에서 저장된 공정시간(processTimes)을 그대로 사용. 없으면 0
    const existingTimes=order.processTimes||[];
    const pts=(order.processes||[]).map(p=>{
      const ex=existingTimes.find(t=>t.code===p.code);
      return{code:p.code,name:p.name,hours:ex?ex.hours:0};
    });
    setCompForm({doneDate:order.doneDate||new Date().toISOString().slice(0,10),defectQty:order.defectQty||0,processTimes:pts});
    setCompleteModal(order);
  };

  const handleComplete=(order,doneDate,defectQty,isReComplete=false)=>{
    // 자재 출고: 이미 수동 출고된 수량을 제외하고 나머지만 자동 출고
    // 재완료(isReComplete=true)일 때는 자재 출고도 건너뜀 (이미 이전 완료 시 처리됨)
    if(!isReComplete){
      const bomMats=order.materials?.length>0 ? order.materials : (bom.find(b=>b.product===order.product)?.materials||[]);
      if(bomMats.length>0&&order.orderQty>0){
        const ioRecs=[];
        const stockUpdates={};
        bomMats.forEach(m=>{
          const need=m.qty*order.orderQty;
          // 이미 이 WO에 대해 출고된 수량
          const alreadyDone=(io||[]).filter(r=>r.type==="출고"&&r.item===m.code&&r.note&&r.note.includes(order.code)).reduce((s,r)=>s+(r.qty||0),0);
          const remaining=need-alreadyDone;
          if(remaining>0){
            ioRecs.push({date:doneDate,type:"출고",item:m.code,itemName:m.name,qty:remaining,unitPrice:items.find(i=>i.code===m.code)?.price||0,lot:"",destination:"P",manager:"",approver:"",note:"작업지시서 "+order.code+" 투입(완료자동)"});
            stockUpdates[m.code]=(stockUpdates[m.code]||0)+remaining;
          }
        });
        if(ioRecs.length>0){
          setItems(prev=>prev.map(it=>stockUpdates[it.code]!=null?{...it,stock:Math.max(0,it.stock-stockUpdates[it.code])}:it));
          setIo(prev=>[...ioRecs,...prev]);
        }
      }
      const goodQty=(order.orderQty||0)-(defectQty||0);
      if(goodQty>0){
        const glot={code:order.lot||"LOT"+Date.now(),item:order.product,itemName:order.productName,qty:goodQty,mfg:doneDate,exp:"",status:"정상",warehouse:order.warehouse||goodWarehouse.name};
        setLots(prev=>[...prev,glot]);
        setItems(prev=>prev.map(it=>it.code===order.product?{...it,stock:it.stock+goodQty}:it));
        setIo(prev=>[{date:doneDate,type:"입고",item:order.product,itemName:order.productName,qty:goodQty,unitPrice:items.find(i=>i.code===order.product)?.price||0,lot:glot.code,note:`작업지시서 ${order.code} 완료`},...prev]);
      }
      if((defectQty||0)>0){
        setLots(prev=>[...prev,{code:"DEF"+Date.now(),item:order.product,itemName:order.productName,qty:defectQty,mfg:doneDate,exp:"",status:"불량",warehouse:defectWarehouse.name}]);
      }
    }
  };

  const saveComplete=()=>{
    if(!compForm.doneDate){showToast("완료일을 입력해주세요");return;}
    const isReComplete=completeModal.status==="완료"; // 이미 완료된 WO를 재완료하는 경우
    const updated={...completeModal,status:"완료",defectQty:compForm.defectQty,doneDate:compForm.doneDate,processTimes:compForm.processTimes,worker:currentUser?.name||completeModal.worker||""};
    handleComplete(completeModal,compForm.doneDate,compForm.defectQty,isReComplete);
    setOrders(orders.map(o=>o.code===completeModal.code?updated:o));
    showToast(isReComplete?"완료 정보 수정 완료 (입고 중복 방지)":"완료 처리 — 자재 차감·LOT 생성 완료");
    setCompleteModal(null);setViewWo(null);
  };

  // 작업 입력 탭 로직
  const activeWOs=orders.filter(o=>o.status==="대기"||o.status==="진행중");
  const workOrder=orders.find(o=>o.code===workWoCode)||null;
  const _baseBom=workOrder?bom.find(b=>b.product===workOrder.product):null;
  const workBom=workOrder?{...(_baseBom||{}),materials:(workOrder.materials?.length>0?workOrder.materials:_baseBom?.materials)||[]}:null;
  const alreadyDeducted=(itemCode)=>io.filter(r=>r.type==="출고"&&r.item===itemCode&&r.note&&r.note.includes(workWoCode)).reduce((s,r)=>s+(r.qty||0),0);

  const selectWorkWo=(code)=>{
    setWorkWoCode(code);
    const wo=orders.find(o=>o.code===code);
    if(wo){
      const existing=wo.processTimes||[];
      const pts=(wo.processes||[]).map(p=>{const ex=existing.find(t=>t.code===p.code);return{code:p.code,name:p.name,hours:ex?ex.hours:0};});
      setWorkProcTimes(pts);
      // BOM 수량 기반으로 필요량 자동 채우기
      const wb=bom.find(b=>b.product===wo.product);
      const preQty={};
      if(wb){
        wb.materials.forEach(mat=>{
          const need=mat.qty*(wo.orderQty||1);
          const done=io.filter(r=>r.type==="출고"&&r.item===mat.code&&r.note&&r.note.includes(code)).reduce((s,r)=>s+(r.qty||0),0);
          const remain=need-done;
          preQty[mat.code]=remain>0?remain:0;
        });
      }
      setWorkMatQty(preQty);
      // LOT 자동 초기화: 각 자재의 첫 번째 LOT 선택
      const preLot={};
      if(wb){
        wb.materials.forEach(mat=>{
          const matLots=lots.filter(l=>l.item===mat.code&&l.qty>0);
          preLot[mat.code]=matLots.length>0?matLots[0].code:"";
        });
      }
      setWorkMatLot(preLot);
      setWorkExtraMats([]);
    }
  };

  const _doDeduct=(matCode,matName,matUnit,qty,selectedLot,isExtra=false)=>{
    const today=new Date().toISOString().slice(0,10);
    const it=items.find(i=>i.code===matCode);
    const curStock=it?.stock||0;
    const newStock=curStock-qty;
    if(newStock<0){
      alert(`❌ 재고 부족으로 출고할 수 없습니다.\n\n품목: ${matName}\n현재 재고: ${fmt3(curStock)}${matUnit}\n출고 요청: ${fmt3(qty)}${matUnit}\n부족량: ${fmt3(qty-curStock)}${matUnit}`);
      return false;
    }
    setIo(prev=>[{date:today,type:"출고",item:matCode,itemName:matName,qty,unitPrice:it?.price||0,lot:selectedLot,destination:"P",manager:"",approver:"",note:"작업지시서 "+workWoCode+" 투입"},...prev]);
    setItems(prev=>prev.map(i=>i.code===matCode?{...i,stock:i.stock-qty}:i));
    if(selectedLot){setLots(prev=>prev.map(l=>l.code===selectedLot&&l.item===matCode?{...l,qty:Math.max(0,l.qty-qty)}:l));}
    showToast(`${matName} ${fmt3(qty)}${matUnit} 출고 완료 (LOT: ${selectedLot||"없음"})`);
    return true;
  };

  const deductMaterial=(mat)=>{
    const qty=workMatQty[mat.code]||0;
    if(qty<=0){showToast("수량을 입력하세요");return;}
    const selectedLot=workMatLot[mat.code]||"";
    if(!selectedLot){
      const matLots=lots.filter(l=>l.item===mat.code&&l.qty>0);
      if(matLots.length>0&&!window.confirm("LOT를 선택하지 않았습니다. LOT 없이 출고하시겠습니까?")) return;
    }
    const ok=_doDeduct(mat.code,mat.name,mat.unit,qty,selectedLot);
    if(!ok) return;
    setWorkMatQty(q=>({...q,[mat.code]:0}));
    // 전체 자재 출고 완료 체크
    if(workBom){
      const allDone=workBom.materials.every(m=>{
        const need=m.qty*(workOrder?.orderQty||1);
        const alreadyQty=alreadyDeducted(m.code)+(m.code===mat.code?qty:0);
        return alreadyQty>=need;
      });
      if(allDone){
        setTimeout(()=>{if(window.confirm("🎉 모든 자재 출고가 완료되었습니다!\n완료 처리를 진행하시겠습니까?"))startWorkComplete();},200);
      }
    }
  };

  const deductExtraMat=(idx)=>{
    const mat=workExtraMats[idx];
    if(!mat.code){showToast("품목코드를 입력하세요");return;}
    if((mat.qty||0)<=0){showToast("수량을 입력하세요");return;}
    const selectedLot=mat.lotCode||"";
    if(!selectedLot){
      const matLots=lots.filter(l=>l.item===mat.code&&l.qty>0);
      if(matLots.length>0&&!window.confirm("LOT를 선택하지 않았습니다. LOT 없이 출고하시겠습니까?")) return;
    }
    const ok=_doDeduct(mat.code,mat.name||mat.code,mat.unit||"EA",mat.qty,selectedLot,true);
    if(ok){setWorkExtraMats(prev=>prev.filter((_,i)=>i!==idx));}
  };

  const saveWorkProgress=()=>{
    if(!workOrder){showToast("작업지시서를 선택하세요");return;}
    setOrders(orders.map(o=>o.code===workWoCode?{...o,status:"진행중",processTimes:workProcTimes,worker:currentUser?.name||o.worker||""}:o));
    showToast("공정 시간 임시저장 완료");
  };

  const startWorkComplete=()=>{
    if(!workOrder){showToast("작업지시서를 선택하세요");return;}
    if(workOrder.status==="완료"||workOrder.status==="취소"){
      alert(`이미 ${workOrder.status} 처리된 작업지시서입니다.`);
      return;
    }
    // 자재 출고 여부 체크
    if(workBom&&workBom.materials.length>0){
      const notDeducted=workBom.materials.filter(m=>{
        const done=alreadyDeducted(m.code);
        return done<=0;
      });
      if(notDeducted.length>0){
        const list=notDeducted.map(m=>`• ${m.name} (${fmt3(m.qty*workOrder.orderQty)}${m.unit})`).join("\n");
        alert(`⚠️ 아직 출고되지 않은 자재가 있습니다.\n자재 출고 처리 후 완료해주세요.\n\n미출고 자재:\n${list}`);
        return;
      }
    }
    setCompForm({doneDate:new Date().toISOString().slice(0,10),defectQty:workOrder.defectQty||0,processTimes:workProcTimes});
    setCompleteModal(workOrder);
  };

  const save=()=>{
    if(!form.product){showToast("품목을 선택해주세요");return;}
    const prd=products.find(p=>p.code===form.product);
    const entry={...form,productName:prd?prd.name:form.productName,status:modal==="add"?"대기":form.status};
    if(modal==="add"){setOrders([...orders,entry]);}else{setOrders(orders.map(o=>o.code===form.code?entry:o));}
    showToast("저장되었습니다.");setModal(null);
  };
  const del=(code)=>{
    const o=orders.find(x=>x.code===code);
    let msg="삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.";
    if(o?.status==="완료") msg=`완료된 작업지시서(${code})입니다.\n삭제 시 관련 입출고 이력은 남습니다.\n정말 삭제하시겠습니까?`;
    else if(o?.status==="진행중") msg=`진행중인 작업지시서(${code})입니다.\n삭제하시겠습니까? 삭제 후 복구할 수 없습니다.`;
    if(!window.confirm(msg)) return;
    setOrders(orders.filter(x=>x.code!==code));showToast("삭제되었습니다.");
  };
  const bulkDel=()=>{
    const hasCompleted=[...sel].some(c=>{const o=orders.find(x=>x.code===c);return o&&o.status==="완료";});
    const n=sel.size;
    const msg=hasCompleted
      ?`선택 항목 중 완료된 작업지시서가 포함되어 있습니다.\n${n}개 모두 삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.`
      :`선택한 ${n}개를 삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.`;
    if(!window.confirm(msg))return;
    setOrders(orders.filter(o=>!sel.has(o.code)));setSel(new Set());showToast(`${n}개 삭제되었습니다.`);
  };

  const formBom=bom.find(b=>b.product===form.product);

  return (
    <div>
      <div className="page-header">
        <div><div className="page-title">작업지시서</div><div className="page-sub">작업 지시 등록 → 작업 입력(공정시간·자재출고) → 완료 처리</div></div>
        <div style={{display:"flex",gap:8}}>
          {activeTab==="list"&&perm.canDelete&&sel.size>0&&<button className="btn btn-danger" onClick={bulkDel}>🗑 선택 삭제 ({sel.size})</button>}
          {activeTab==="list"&&perm.canCreate&&<button className="btn btn-primary" onClick={openAdd}>+ 작업지시 등록</button>}
        </div>
      </div>

      <div className="tabs">
        <div className={`tab${activeTab==="list"?" active":""}`} onClick={()=>setActiveTab("list")}>📋 작업지시서 목록</div>
        <div className={`tab${activeTab==="work"?" active":""}`} onClick={()=>setActiveTab("work")}>⚙️ 작업 입력</div>
      </div>

      {/* ── 탭1: 목록 ── */}
      {activeTab==="list"&&<div className="panel">
        <div className="panel-top">
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:12,color:"#666"}}>지시일</span>
            <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} style={dateStyle}/>
            <span style={{fontSize:12,color:"#aaa"}}>~</span>
            <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} style={dateStyle}/>
            <button className="btn btn-outline btn-sm" onClick={()=>{setStartDate(todayStr);setEndDate(todayStr);}}>오늘</button>
            <button className="btn btn-outline btn-sm" onClick={()=>{setStartDate("");setEndDate("");}}>전체</button>
          </div>
          <span style={{fontSize:12,color:"#aaa"}}>{filteredOrders.length}건</span>
        </div>
        <table>
          <thead><tr>
            <th style={{width:36,textAlign:"center"}}>선택</th>
            <th>지시번호</th><th>완제품</th><th style={{textAlign:"right"}}>지시수량</th>
            <th>공장</th><th>작업자</th><th>지시일</th><th>완료일</th><th>상태</th><th>LOT</th><th>관리</th>
          </tr></thead>
          <tbody>{filteredOrders.map(o=>(
            <tr key={o.code} style={{cursor:"pointer"}} onClick={()=>setViewWo(o)}>
              <td style={{textAlign:"center"}} onClick={e=>e.stopPropagation()}>
                <input type="checkbox" checked={sel.has(o.code)} onChange={()=>toggleSel(o.code)} style={{cursor:"pointer"}}/>
              </td>
              <td><b style={{color:"#2563eb"}}>{o.code}</b></td>
              <td>{o.productName}</td>
              <td style={{textAlign:"right"}}>{o.orderQty} EA</td>
              <td>{factories.find(f=>f.code===o.factoryCode)?.name||"-"}</td>
              <td style={{fontSize:12,color:o.worker?"#16a34a":"#aaa",fontWeight:o.worker?600:400}}>{o.worker||"-"}</td>
              <td>{o.date}</td>
              <td style={{color:o.doneDate?"#16a34a":"#aaa"}}>{o.doneDate||"-"}</td>
              <td><SBadge s={o.status}/></td>
              <td style={{fontSize:11,color:"#888"}}>{o.lot||"-"}</td>
              <td style={{display:"flex",gap:4,flexWrap:"wrap"}} onClick={e=>e.stopPropagation()}>
                {perm.canEdit&&o.status!=="완료"&&o.status!=="취소"&&(
                  <button className="btn btn-sm" style={{background:"#16a34a",color:"#fff",border:"none",padding:"4px 8px",borderRadius:4,cursor:"pointer",fontSize:12}}
                    onClick={()=>{selectWorkWo(o.code);setActiveTab("work");}}>⚙️ 작업입력</button>
                )}
                {perm.canEdit&&o.status!=="취소"&&(
                  <button className="btn btn-sm" style={{background:o.status==="완료"?"#6366f1":"#16a34a",color:"#fff",border:"none"}} onClick={()=>openComplete(o)}>{o.status==="완료"?"🔄 재완료":"✅ 완료"}</button>
                )}
                {perm.canEdit&&<button className="btn btn-outline btn-sm" onClick={()=>{const bomEntry=bom.find(b=>b.product===o.product);setForm({...o,processes:o.processes||[],materials:o.materials||(bomEntry?.materials?[...bomEntry.materials]:[])});setProdCodeInput(o.product||"");setModal("edit");}}>수정</button>}
                {perm.canDelete&&<button className="btn btn-danger btn-sm" onClick={()=>del(o.code)}>삭제</button>}
              </td>
            </tr>
          ))}{!filteredOrders.length&&<tr><td colSpan={11} className="empty">{orders.length?"해당 기간에 작업지시 없음":"작업지시 없음"}</td></tr>}</tbody>
        </table>
      </div>}

      {/* ── 탭2: 작업 입력 ── */}
      {activeTab==="work"&&(
        <div>
          {/* WO 선택 */}
          <div className="panel" style={{marginBottom:16}}>
            <div className="panel-top">
              <b>⚙️ 작업 입력 — 작업지시서 선택</b>
              <select value={workWoCode} onChange={e=>selectWorkWo(e.target.value)}
                style={{border:"1px solid #2563eb",borderRadius:6,padding:"6px 12px",fontSize:13,fontWeight:600,color:"#2563eb"}}>
                <option value="">-- 작업지시서 선택 --</option>
                {activeWOs.map(o=><option key={o.code} value={o.code}>{o.code} | {o.productName} | {o.orderQty}EA {o.lot?`| LOT: ${o.lot}`:""} | {o.status}</option>)}
              </select>
            </div>
            {!workOrder&&<div className="empty" style={{padding:40}}>대기 또는 진행중 상태의 작업지시서를 선택하세요</div>}
          </div>

          {workOrder&&(
            <>
              {/* WO 정보 */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:12,marginBottom:16}}>
                {[["완제품",workOrder.productName],["지시수량",workOrder.orderQty+"EA"],["LOT",workOrder.lot||"-"],["상태",workOrder.status],["작업자",currentUser?.name||"-"]].map(([k,v])=>(
                  <div key={k} className={`card${k==="작업자"?" ok":""}`}><div className="card-label">{k}</div><div className="card-val" style={{fontSize:15}}>{v}</div></div>
                ))}
              </div>

              {/* 공정 시간 입력 */}
              <div className="panel" style={{marginBottom:12}}>
                <div className="panel-top"><b>⚙️ 공정별 소요시간 입력</b>
                  <span style={{fontSize:11,color:"#888"}}>총 {workProcTimes.reduce((s,p)=>s+(p.hours||0),0)}h</span>
                </div>
                {workProcTimes.length===0&&<div className="empty" style={{padding:24}}>등록된 공정 없음 — 품목관리에서 완제품에 공정 설정</div>}
                <table>
                  <thead><tr><th>공정명</th><th style={{textAlign:"right",width:160}}>소요시간 (h)</th></tr></thead>
                  <tbody>{workProcTimes.map((p,i)=>(
                    <tr key={i}>
                      <td>{p.name||p.code}</td>
                      <td style={{textAlign:"right"}}>
                        <input type="number" value={p.hours}
                          onChange={e=>{const t=[...workProcTimes];t[i]={...t[i],hours:+e.target.value};setWorkProcTimes(t);}}
                          style={{width:90,border:"1px solid #ddd",borderRadius:5,padding:"4px 8px",fontSize:13,textAlign:"right"}}/>
                        <span style={{fontSize:12,color:"#888",marginLeft:4}}>h</span>
                      </td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>

              {/* 자재 출고 — 전체 너비 */}
              <div className="panel" style={{marginBottom:16}}>
                <div className="panel-top">
                  <b>📦 자재 출고 처리</b>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <span style={{fontSize:11,color:"#888"}}>지시수량 기준 필요량 대비 출고 현황</span>
                    <button className="btn btn-outline btn-sm" onClick={()=>setWorkExtraMats(prev=>[...prev,{code:"",name:"",qty:0,unit:"EA",lotCode:""}])}>+ 추가 자재 출고</button>
                  </div>
                </div>
                {(!workBom||workBom.materials.length===0)&&workExtraMats.length===0&&<div className="empty" style={{padding:24}}>BOM이 등록되지 않은 완제품입니다 — 추가 자재 출고 버튼으로 직접 출고 가능</div>}
                {(workBom?.materials?.length>0||workExtraMats.length>0)&&(
                  <div style={{overflowX:"auto"}}>
                    <table style={{minWidth:700}}>
                      <thead><tr>
                        <th>자재명 / 코드</th>
                        <th style={{textAlign:"right",width:100}}>필요량</th>
                        <th style={{textAlign:"right",width:90}}>출고됨</th>
                        <th style={{textAlign:"right",width:90}}>잔여</th>
                        <th style={{textAlign:"right",width:90}}>현재재고</th>
                        <th style={{width:180}}>LOT 선택</th>
                        <th style={{width:140}}>지금 출고량</th>
                      </tr></thead>
                      <tbody>
                        {(workBom?.materials||[]).map((mat,i)=>{
                          const need=mat.qty*workOrder.orderQty;
                          const done=alreadyDeducted(mat.code);
                          const remain=need-done;
                          const it=items.find(x=>x.code===mat.code);
                          const matLots=lots.filter(l=>l.item===mat.code&&l.qty>0);
                          const selLot=workMatLot[mat.code]||"";
                          const selLotObj=matLots.find(l=>l.code===selLot);
                          const finished=remain<=0;
                          return(
                            <tr key={i} style={{background:finished?"#f0fdf4":""}}>
                              <td>
                                <div style={{fontWeight:600,fontSize:13}}>{mat.name}</div>
                                <div style={{fontSize:11,color:"#888",fontFamily:"monospace"}}>{mat.code}</div>
                              </td>
                              <td style={{textAlign:"right"}}>{fmt3(need)}<span style={{fontSize:11,color:"#888"}}>{mat.unit}</span></td>
                              <td style={{textAlign:"right",color:done>0?"#16a34a":"#aaa"}}>{fmt3(done)}<span style={{fontSize:11}}>{mat.unit}</span></td>
                              <td style={{textAlign:"right",color:finished?"#16a34a":"#e74c3c",fontWeight:700}}>
                                {finished?"✅":fmt3(remain)}<span style={{fontSize:11}}>{!finished&&mat.unit}</span>
                              </td>
                              <td style={{textAlign:"right",color:(it?.stock||0)<(finished?0:remain)?"#e74c3c":"#555"}}>
                                {it?fmt3(it.stock):"-"}<span style={{fontSize:11,color:"#888"}}>{mat.unit}</span>
                              </td>
                              <td>
                                {matLots.length>0?(
                                  <div>
                                    <select value={selLot} onChange={e=>setWorkMatLot(q=>({...q,[mat.code]:e.target.value}))}
                                      style={{width:"100%",border:"1px solid #ddd",borderRadius:5,padding:"3px 6px",fontSize:11}}>
                                      {matLots.map(l=><option key={l.code} value={l.code}>{l.code} ({fmt3(l.qty)}{mat.unit})</option>)}
                                    </select>
                                    {selLotObj&&<div style={{fontSize:10,color:"#2563eb",marginTop:2}}>LOT 잔여: {fmt3(selLotObj.qty)}{mat.unit}</div>}
                                  </div>
                                ):<span style={{fontSize:11,color:"#aaa"}}>LOT 없음 (재고 {fmt3(it?.stock||0)})</span>}
                              </td>
                              <td>
                                {!finished?(
                                  <div style={{display:"flex",gap:4,alignItems:"center"}}>
                                    <input type="number" value={workMatQty[mat.code]||0}
                                      onChange={e=>setWorkMatQty(q=>({...q,[mat.code]:+e.target.value}))}
                                      style={{width:65,border:"1px solid #ddd",borderRadius:5,padding:"3px 6px",fontSize:12,textAlign:"right"}}/>
                                    <button className="btn btn-sm" style={{background:"#2563eb",color:"#fff",border:"none",padding:"4px 10px",borderRadius:4,cursor:"pointer",fontSize:11,whiteSpace:"nowrap"}}
                                      onClick={()=>deductMaterial(mat)}>출고</button>
                                  </div>
                                ):<span style={{fontSize:12,color:"#16a34a",fontWeight:600}}>완료</span>}
                              </td>
                            </tr>
                          );
                        })}
                        {/* 추가 자재 행 */}
                        {workExtraMats.map((mat,i)=>{
                          const it=items.find(x=>x.code===mat.code);
                          const matLots=lots.filter(l=>l.item===mat.code&&l.qty>0);
                          return(
                            <tr key={`x${i}`} style={{background:"#fffbeb",borderTop:"2px dashed #fcd34d"}}>
                              <td colSpan={2}>
                                <div style={{fontSize:11,color:"#b45309",fontWeight:600,marginBottom:4}}>➕ 추가 자재</div>
                                <div style={{display:"flex",gap:4}}>
                                  <input style={{width:80,border:"1px solid #fcd34d",borderRadius:5,padding:"3px 6px",fontSize:11,fontFamily:"monospace"}}
                                    placeholder="품목코드" value={mat.code}
                                    onChange={e=>{const v=e.target.value;const found=items.find(x=>x.code===v);setWorkExtraMats(prev=>{const n=[...prev];n[i]={...n[i],code:v,name:found?found.name:n[i].name,unit:found?found.unit||"EA":n[i].unit};return n;});}}/>
                                  <input style={{flex:1,border:"1px solid #fcd34d",borderRadius:5,padding:"3px 6px",fontSize:11}}
                                    placeholder="자재명" value={mat.name}
                                    onChange={e=>setWorkExtraMats(prev=>{const n=[...prev];n[i]={...n[i],name:e.target.value};return n;})}/>
                                </div>
                              </td>
                              <td colSpan={2}>
                                <div style={{display:"flex",gap:4,alignItems:"center"}}>
                                  <input type="number" style={{width:65,border:"1px solid #fcd34d",borderRadius:5,padding:"3px 6px",fontSize:12,textAlign:"right"}}
                                    placeholder="수량" value={mat.qty||0}
                                    onChange={e=>setWorkExtraMats(prev=>{const n=[...prev];n[i]={...n[i],qty:+e.target.value};return n;})}/>
                                  <input style={{width:40,border:"1px solid #fcd34d",borderRadius:5,padding:"3px 4px",fontSize:11}}
                                    placeholder="단위" value={mat.unit||""}
                                    onChange={e=>setWorkExtraMats(prev=>{const n=[...prev];n[i]={...n[i],unit:e.target.value};return n;})}/>
                                </div>
                              </td>
                              <td style={{textAlign:"right",color:"#555"}}>{it?fmt3(it.stock):"-"}</td>
                              <td>
                                {matLots.length>0?(
                                  <select value={mat.lotCode||""} onChange={e=>setWorkExtraMats(prev=>{const n=[...prev];n[i]={...n[i],lotCode:e.target.value};return n;})}
                                    style={{width:"100%",border:"1px solid #fcd34d",borderRadius:5,padding:"3px 6px",fontSize:11}}>
                                    <option value="">-- LOT 선택 --</option>
                                    {matLots.map(l=><option key={l.code} value={l.code}>{l.code} ({fmt3(l.qty)})</option>)}
                                  </select>

              {modal==="edit"&&(
                <div className="field"><label>상태</label><select value={form.status} onChange={e=>setForm(f=>({...f,status:e.target.value}))}><option>대기</option><option>진행중</option><option>완료</option><option>취소</option></select></div>

                  </div>
                ))}
                {!form.processes.length&&<div style={{fontSize:12,color:"#aaa",padding:"4px 0"}}>품목 관리에서 완제품에 공정을 설정하면 자동으로 불러옵니다</div>}
              </div>

              {/* 투입 자재 편집 */}
              <div style={{marginTop:12}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
                  <label style={{fontSize:12,fontWeight:600,color:"#555"}}>🧪 투입 자재 <span style={{color:"#aaa",fontWeight:400,fontSize:11}}>(BOM 자동 로드 — 추가·수정·삭제 가능)</span></label>
                  <button className="btn btn-outline btn-sm" onClick={addMat}>+ 자재 추가</button>
                </div>
                {(form.materials||[]).length===0&&<div style={{fontSize:12,color:"#aaa",padding:"4px 0"}}>자재 없음 — 제품 선택 시 BOM에서 자동 로드됩니다</div>}
                {(form.materials||[]).map((m,i)=>{
                  const it=items.find(x=>x.code===m.code);

                  const ok=it&&it.stock>=need;
                  return(
                    <div key={i} style={{display:"flex",gap:4,marginBottom:5,alignItems:"center",background:ok?"#f0fdf4":"#fef2f2",borderRadius:6,padding:"4px 6px"}}>

                        placeholder="코드" value={m.code}

                      <input style={{flex:1,border:"1px solid #ddd",borderRadius:5,padding:"5px 6px",fontSize:11,background:"#fff"}}

                      <input type="number" style={{width:65,border:"1px solid #ddd",borderRadius:5,padding:"5px 6px",fontSize:11,textAlign:"right",background:"#fff"}}
                        placeholder="소요량" value={m.qty} onChange={e=>setMatField(i,"qty",e.target.value)}/>
                      <input style={{width:42,border:"1px solid #ddd",borderRadius:5,padding:"5px 4px",fontSize:11,background:"#fff"}}

                      <div style={{fontSize:10,whiteSpace:"nowrap",minWidth:80,textAlign:"right"}}>
                        <div style={{color:"#888"}}>재고: <b style={{color:ok?"#16a34a":"#e74c3c"}}>{it?fmt3(it.stock):"?"}</b></div>
                        {form.orderQty>0&&<div style={{color:ok?"#16a34a":"#e74c3c"}}>{ok?"✅ 충분":`⚠️ 필요 ${fmt3(need)}`}</div>}
                      </div>
                      <button className="btn btn-danger btn-sm" onClick={()=>delMat(i)}>✕</button>
                    </div>

              </div>
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={()=>setModal(null)}>취소</button>
              <button className="btn btn-primary" onClick={save}>저장</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function CostPage({costBom,setCostBom,factories,bom,items,processes,costMaster,setCostMaster,orders,io,perm,showToast,downloadCSV}) {
  const [activeTab,setActiveTab]=useState("calc");
  const [selId,setSelId]=useState(costBom[0]?.id||"");
  const [selWoCode,setSelWoCode]=useState("");
  const [addModal,setAddModal]=useState(false);
  const [newName,setNewName]=useState("");
  const [newItemQ,setNewItemQ]=useState("");
  const [newLinkedProduct,setNewLinkedProduct]=useState("");
  const [prodSearchQ,setProdSearchQ]=useState("");
  const [codeSearchQ,setCodeSearchQ]=useState("");

  const th={color:"#fff",background:"#1a2236"};
  const iStyle={border:"1px solid #ddd",borderRadius:4,padding:"3px 6px",fontSize:12,textAlign:"right"};

  // ── 원가마스터 헬퍼 ──
  const updProcRate=(idx,field,val)=>{const pr=[...costMaster.processRates];pr[idx]={...pr[idx],[field]:val};setCostMaster({...costMaster,processRates:pr});};
  const updFactSetting=(idx,field,val)=>{const fs=[...costMaster.factorySettings];fs[idx]={...fs[idx],[field]:val};setCostMaster({...costMaster,factorySettings:fs});};
  const updFacilityRate=(idx,field,val)=>{const fr=[...(costMaster.facilityRates||[])];fr[idx]={...fr[idx],[field]:field==="ratePerHour"?+val:val};setCostMaster({...costMaster,facilityRates:fr});};

  const delFacilityRate=(idx)=>setCostMaster({...costMaster,facilityRates:(costMaster.facilityRates||[]).filter((_,i)=>i!==idx)});
  const syncProcessRates=()=>{const ex=costMaster.processRates;const sy=processes.map(p=>{const e=ex.find(r=>r.processCode===p.code);return e||{processCode:p.code,processName:p.name,ratePerHour:26000,stdHoursPerUnit:0};});setCostMaster({...costMaster,processRates:sy});showToast("공정 목록과 동기화 완료");};
  const syncFactorySettings=()=>{const ex=costMaster.factorySettings;const sy=factories.map(f=>{const e=ex.find(s=>s.factoryCode===f.code);return e||{factoryCode:f.code,monthlyCapacity:1000,depreciation:0,utilities:0};});setCostMaster({...costMaster,factorySettings:sy});showToast("공장 목록과 동기화 완료");};

  // ── 원가계산 ──
  const entry=costBom.find(c=>c.id===selId)||null;
  const updEntry=(field,val)=>setCostBom(costBom.map(c=>c.id===selId?{...c,[field]:val}:c));
  const updMfg=(field,val)=>setCostBom(costBom.map(c=>c.id===selId?{...c,mfgSection:{...c.mfgSection,[field]:["laborRate","processHours","packingHours","testHours","depreciation"].includes(field)?+val:val}}:c));
  const updGroupItem=(gType,gIdx,iIdx,field,val)=>{setCostBom(costBom.map(c=>{if(c.id!==selId)return c;const gs=[...(c[gType]||[])];const its=[...gs[gIdx].items];its[iIdx]={...its[iIdx],[field]:["price","qty"].includes(field)?+val:val};gs[gIdx]={...gs[gIdx],items:its};return{...c,[gType]:gs};}));};
  const addGroupItem=(gType,gIdx)=>{setCostBom(costBom.map(c=>{if(c.id!==selId)return c;const gs=[...(c[gType]||[])];gs[gIdx]={...gs[gIdx],items:[...gs[gIdx].items,{name:"",spec:"",price:0,qty:0,unit:"EA"}]};return{...c,[gType]:gs};}));};
  const delGroupItem=(gType,gIdx,iIdx)=>{setCostBom(costBom.map(c=>{if(c.id!==selId)return c;const gs=[...(c[gType]||[])];gs[gIdx]={...gs[gIdx],items:gs[gIdx].items.filter((_,i)=>i!==iIdx)};return{...c,[gType]:gs};}));};
  const calcGT=(g)=>(g.items||[]).reduce((s,it)=>s+(it.price||0)*(it.qty||0),0);
  const packingTotal=(entry?.packingGroups||[]).reduce((s,g)=>s+calcGT(g),0);

  const mfg=entry?.mfgSection||{};
  const woList=(orders||[]).filter(o=>o.status==="완료"||o.status==="진행중"||o.status==="대기");
  const selWo=(orders||[]).find(o=>o.code===selWoCode)||null;

  // 노무비: 반드시 작업지시서 연동 후 processTimes 기반으로 계산 (수동 고정시간 제거)
  let laborRows=[],laborTotal=0;
  if(selWo&&(selWo.processTimes||[]).length>0){
    laborRows=selWo.processTimes.map(pt=>{const master=costMaster.processRates.find(r=>r.processCode===pt.code);const rate=master?.ratePerHour||0;const cost=Math.round(rate*(pt.hours||0));return{name:pt.name||pt.code,hours:pt.hours||0,rate,cost,fromWo:true};});
    laborTotal=laborRows.reduce((s,r)=>s+r.cost,0);
  }
  // WO 미연동 시 laborRows = [] → 노무비 0, 시설비 0

  const depreciation=mfg.depreciation||0;

  // ── 실제 자재 사용 (io 연동) ──
  // 반제품인 경우 해당 BOM의 원자재 단가 합계로 단위원가 계산
  const calcItemUnitCost=(itemCode)=>{
    const it=items.find(i=>i.code===itemCode);
    if(!it) return 0;
    if(it.type==="반제품"){
      const semiB=bom.find(b=>b.product===itemCode);
      if(semiB){
        return semiB.materials.reduce((s,m)=>{const mat=items.find(i=>i.code===m.code);return s+(mat?.price||0)*m.qty;},0);
      }
    }
    return it.price||0;
  };
  // 동일 WO에 대한 출고 기록을 품목별로 합산 (중복 방지)
  const actualMatsRaw=selWo?(io||[]).filter(r=>r.type==="출고"&&r.note&&r.note.includes(selWo.code)):[];
  const actualMatsMap={};
  actualMatsRaw.forEach(r=>{
    if(!actualMatsMap[r.item]){actualMatsMap[r.item]={...r,qty:0};}
    actualMatsMap[r.item].qty+=r.qty||0;
  });
  const actualMats=Object.values(actualMatsMap);
  const actualMatCost=actualMats.reduce((s,r)=>{const unitCostR=calcItemUnitCost(r.item)||r.unitPrice||0;return s+unitCostR*r.qty;},0);
  const selWoBom=selWo?bom.find(b=>b.product===selWo.product):null;

  // ── 시설비 (임차료·청정실 운영비) = 총 가동시간 × 시간당 단가 (공장별) ──
  const totalLaborHours=laborRows.reduce((s,r)=>s+(r.hours||0),0);
  const woFactoryCode=selWo?.factoryCode||"";
  const woFactory=factories.find(f=>f.code===woFactoryCode)||null;
  const allFacilityRates=costMaster.facilityRates||[];
  const facilityRates=woFactoryCode?allFacilityRates.filter(f=>f.factoryCode===woFactoryCode):allFacilityRates;
  const facilityRows=facilityRates.map(f=>({...f,cost:Math.round(totalLaborHours*(f.ratePerHour||0))}));
  const facilityTotal=facilityRows.reduce((s,r)=>s+r.cost,0);

  const grandTotal=actualMatCost+packingTotal+laborTotal+facilityTotal+depreciation;

  // ── 작업지시 원가 목록 (상세보기와 동일한 방식으로 계산) ──
  const woCostList=(orders||[]).map(o=>{
    // 자재비
    const actualIo=(io||[]).filter(r=>r.type==="출고"&&r.note&&r.note.includes(o.code));
    let matCost=0;let matFromActual=false;
    if(actualIo.length>0){
      const ioMap={};
      actualIo.forEach(r=>{if(!ioMap[r.item]){ioMap[r.item]={...r,qty:0};}ioMap[r.item].qty+=r.qty||0;});
      matCost=Object.values(ioMap).reduce((s,r)=>{return s+calcItemUnitCost(r.item)*r.qty;},0);
      matFromActual=true;
    } else {
      const bomEntry=bom.find(b=>b.product===o.product);
      matCost=(bomEntry?.materials||[]).reduce((s,m)=>{return s+calcItemUnitCost(m.code)*m.qty*o.orderQty;},0);
    }
    // 노무비
    const laborRows=(o.processTimes||[]).map(pt=>{const master=costMaster.processRates.find(r=>r.processCode===pt.code);const rate=master?.ratePerHour||0;return Math.round(rate*(pt.hours||0));});
    const laborCost=laborRows.reduce((s,c)=>s+c,0);
    // 시설비 (임차료·청정실 = 총 공정시간 × 시설 단가)
    const totalHours=(o.processTimes||[]).reduce((s,pt)=>s+(pt.hours||0),0);
    const facRates=(costMaster.facilityRates||[]).filter(f=>!o.factoryCode||f.factoryCode===o.factoryCode);
    const facilityCost=Math.round(totalHours*facRates.reduce((s,f)=>s+(f.ratePerHour||0),0));
    // 포장비 (costBom에서 해당 제품 연동)
    const linkedCostBom=costBom.find(c=>c.linkedProduct===o.product);
    const packCost=linkedCostBom?(linkedCostBom.packingGroups||[]).reduce((s,g)=>s+g.items.reduce((ss,it)=>ss+(it.price||0)*(it.qty||0),0),0):0;
    // 감가상각
    const depr=linkedCostBom?.mfgSection?.depreciation||0;
    const total=matCost+laborCost+facilityCost+packCost+depr;
    const unitCost=o.orderQty>0?Math.round(total/o.orderQty):0;
    return{...o,matCost,laborCost,facilityCost,packCost,depr,total,unitCost,matFromActual};
  });
  const batchSz=selWo?selWo.orderQty:(entry?.batchSize||1);
  const unitCost=batchSz>0?Math.round(grandTotal/batchSz):0;

  const doExport=()=>{
    if(!entry)return;
    const rows=[["구분","코드/그룹","품명","단가","수량","단위","소계"]];
    actualMats.forEach(r=>{const it=items.find(i=>i.code===r.item);const price=it?.price||r.unitPrice||0;rows.push(["자재비",r.item,r.itemName,price,r.qty,r.unit||"",price*r.qty]);});
    (entry.packingGroups||[]).forEach(g=>g.items.forEach(it=>rows.push(["포장비",g.name,it.name,it.price,it.qty,it.unit,(it.price||0)*(it.qty||0)])));
    laborRows.forEach(r=>rows.push(["노무비","",r.name,r.rate,r.hours,"h",r.cost]));
    rows.push(["감가상각","","","","","",depreciation]);
    rows.push(["총원가","","","","","",grandTotal],[`단위원가(÷${batchSz})`,""," ","","","",unitCost]);
    downloadCSV(rows[0],rows.slice(1),"원가계산.csv");
  };

  const PackingGroupTable=()=>{
    if(!entry)return null;
    const groups=entry.packingGroups||[];
    return(
      <div className="panel" style={{marginBottom:14}}>
        <div className="panel-top" style={{background:"#f0fdf4"}}><b>📦 포장비 (수동 입력)</b><span style={{fontSize:12,color:"#888"}}>소계: <b style={{color:"#16a34a"}}>{packingTotal.toLocaleString()}원</b></span></div>
        {groups.map((g,gIdx)=>(
          <div key={gIdx}>
            <div style={{background:"#dcfce7",padding:"6px 18px",fontWeight:600,fontSize:12,color:"#16a34a",borderBottom:"1px solid #eee",display:"flex",justifyContent:"space-between"}}>
              <span>{g.name}</span><span style={{color:"#555"}}>{calcGT(g).toLocaleString()}원</span>
            </div>
            <table>
              <thead><tr><th style={th}>품명</th><th style={th}>규격</th><th style={{...th,textAlign:"right",width:90}}>단가</th><th style={{...th,textAlign:"right",width:80}}>수량</th><th style={{...th,width:55}}>단위</th><th style={{...th,textAlign:"right",width:100}}>소계</th>{perm.canEdit&&<th style={{...th,width:36}}></th>}</tr></thead>
              <tbody>
                {g.items.map((it,iIdx)=>(
                  <tr key={iIdx}>
                    <td>{perm.canEdit?<input value={it.name} onChange={e=>updGroupItem("packingGroups",gIdx,iIdx,"name",e.target.value)} style={{...iStyle,width:"100%",textAlign:"left"}}/>:<b>{it.name}</b>}</td>
                    <td>{perm.canEdit?<input value={it.spec||""} onChange={e=>updGroupItem("packingGroups",gIdx,iIdx,"spec",e.target.value)} style={{...iStyle,width:"100%",textAlign:"left"}}/>:it.spec||"-"}</td>
                    <td style={{textAlign:"right"}}>{perm.canEdit?<input type="number" value={it.price} onChange={e=>updGroupItem("packingGroups",gIdx,iIdx,"price",e.target.value)} style={{...iStyle,width:85}}/>:(it.price||0).toLocaleString()}</td>
                    <td style={{textAlign:"right"}}>{perm.canEdit?<input type="number" value={it.qty} onChange={e=>updGroupItem("packingGroups",gIdx,iIdx,"qty",e.target.value)} style={{...iStyle,width:75}}/>:it.qty}</td>
                    <td>{perm.canEdit?<input value={it.unit} onChange={e=>updGroupItem("packingGroups",gIdx,iIdx,"unit",e.target.value)} style={{...iStyle,width:50,textAlign:"left"}}/>:it.unit}</td>
                    <td style={{textAlign:"right",fontWeight:600,color:"#16a34a"}}>{((it.price||0)*(it.qty||0)).toLocaleString()}</td>
                    {perm.canEdit&&<td style={{textAlign:"center"}}><button style={{background:"none",border:"none",color:"#e74c3c",cursor:"pointer",fontSize:14,lineHeight:1}} onClick={()=>delGroupItem("packingGroups",gIdx,iIdx)}>✕</button></td>}
                  </tr>
                ))}
                {perm.canEdit&&<tr><td colSpan={7} style={{textAlign:"center",padding:"6px"}}><button className="btn btn-outline btn-sm" onClick={()=>addGroupItem("packingGroups",gIdx)}>+ 항목 추가</button></td></tr>}
              </tbody>
            </table>
          </div>
        ))}
      </div>
    );
  };

  return(
    <div>
      <div className="page-header">
        <div><div className="page-title">원가 관리</div><div className="page-sub">제품별 원가 계산 (재료비·노무비·제조경비) 및 원가 마스터 관리</div></div>
        {activeTab==="calc"&&<button className="btn btn-outline" onClick={doExport}>📥 엑셀 다운로드</button>}
      </div>
      <div className="tabs">
        <div className={`tab${activeTab==="calc"?" active":""}`} onClick={()=>setActiveTab("calc")}>💰 원가 계산</div>
        <div className={`tab${activeTab==="wolist"?" active":""}`} onClick={()=>setActiveTab("wolist")}>📊 작업지시 원가</div>
        <div className={`tab${activeTab==="master"?" active":""}`} onClick={()=>setActiveTab("master")}>📋 원가 마스터</div>
      </div>

      {activeTab==="calc"&&(
        <div>
          {/* 제품 선택 바 */}
          <div style={{background:"#fff",borderRadius:10,padding:"12px 18px",boxShadow:"0 1px 3px rgba(0,0,0,0.07)",marginBottom:16,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <span style={{fontSize:13,fontWeight:600,color:"#555"}}>제품:</span>
              <div style={{position:"relative"}}>
                <input placeholder="품목코드 직접입력..." value={codeSearchQ} onChange={e=>{
                  const v=e.target.value; setCodeSearchQ(v);
                  if(v){
                    const hit=costBom.find(c=>c.linkedProduct&&c.linkedProduct.toLowerCase()===v.toLowerCase());
                    if(hit){setSelId(hit.id);setProdSearchQ("");}
                  }
                }} style={{width:150,border:"1px solid #2563eb",borderRadius:5,padding:"5px 8px",fontSize:12,color:"#2563eb"}} title="품목코드 입력 시 자동 연동"/>
                {codeSearchQ&&(()=>{
                  const hits=items.filter(i=>(i.type==="완제품"||i.type==="반제품")&&(i.code.toLowerCase().includes(codeSearchQ.toLowerCase())||i.name.toLowerCase().includes(codeSearchQ.toLowerCase())));
                  if(!hits.length) return null;
                  return(
                    <div style={{position:"absolute",top:"100%",left:0,zIndex:50,background:"#fff",border:"1px solid #e0e0e0",borderRadius:6,boxShadow:"0 4px 12px rgba(0,0,0,0.1)",minWidth:200,maxHeight:150,overflowY:"auto"}}>
                      {hits.map(i=>(
                        <div key={i.code} style={{padding:"7px 12px",cursor:"pointer",fontSize:12,borderBottom:"1px solid #f5f5f5"}}
                          onClick={()=>{
                            const linked=costBom.find(c=>c.linkedProduct===i.code);
                            if(linked){setSelId(linked.id);}
                            setCodeSearchQ(i.code);
                          }}
                          onMouseEnter={e=>e.currentTarget.style.background="#eff6ff"}
                          onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
                          <span style={{fontFamily:"monospace",color:"#2563eb",fontWeight:600}}>{i.code}</span>
                          <span style={{marginLeft:8,color:"#555"}}>{i.name}</span>
                          {costBom.find(c=>c.linkedProduct===i.code)&&<span style={{marginLeft:6,fontSize:10,background:"#dcfce7",color:"#16a34a",padding:"1px 4px",borderRadius:3}}>연동됨</span>}
                        </div>
                      ))}
                    </div>
                  );
                })()}
              </div>
              <input placeholder="코드/제품명 검색..." value={prodSearchQ} onChange={e=>setProdSearchQ(e.target.value)} style={{width:130,border:"1px solid #ddd",borderRadius:5,padding:"5px 8px",fontSize:12}}/>
              <select value={selId} onChange={e=>{setSelId(e.target.value);setProdSearchQ("");setCodeSearchQ("");}} style={{border:"1px solid #ddd",borderRadius:6,padding:"5px 10px",fontSize:13}}>
                {costBom.filter(c=>!prodSearchQ||c.id.toLowerCase().includes(prodSearchQ.toLowerCase())||c.productName.toLowerCase().includes(prodSearchQ.toLowerCase())||(c.linkedProduct&&c.linkedProduct.toLowerCase().includes(prodSearchQ.toLowerCase()))).map(c=><option key={c.id} value={c.id}>{c.id}{c.linkedProduct?` [${c.linkedProduct}]`:""} — {c.productName}</option>)}
              </select>
              {perm.canCreate&&<button className="btn btn-outline btn-sm" onClick={()=>{setNewName("");setNewItemQ("");setNewLinkedProduct("");setAddModal(true);}}>+ 제품 추가</button>}
              {perm.canDelete&&entry&&costBom.length>1&&<button className="btn btn-danger btn-sm" onClick={()=>{if(window.confirm(`"${entry.productName}" 원가를 삭제하시겠습니까?`)){const rest=costBom.filter(c=>c.id!==selId);setCostBom(rest);setSelId(rest[0]?.id||"");}}}>삭제</button>}
            </div>
            {entry&&<div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontSize:13,fontWeight:600,color:"#555"}}>배치사이즈:</span>
              <input type="number" value={entry.batchSize} onChange={e=>updEntry("batchSize",+e.target.value)} style={{width:80,border:"1px solid #ddd",borderRadius:5,padding:"4px 8px",fontSize:13,textAlign:"right"}}/>
              <input value={entry.batchUnit||"ea"} onChange={e=>updEntry("batchUnit",e.target.value)} style={{width:45,border:"1px solid #ddd",borderRadius:5,padding:"4px 8px",fontSize:13}}/>
            </div>}
            {entry&&<div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:13,fontWeight:600,color:"#555"}}>작업지시서 연동:</span>
              <select value={selWoCode} onChange={e=>setSelWoCode(e.target.value)} style={{border:"1px solid #2563eb",borderRadius:6,padding:"5px 10px",fontSize:12,color:"#2563eb"}}>
                <option value="">-- WO를 선택하면 실제 수량·공정시간 자동 반영 --</option>
                {woList.map(o=><option key={o.code} value={o.code}>{o.code} | {o.productName} | {o.status}{o.doneDate?` | ${o.doneDate}`:""}</option>)}
              </select>
              {selWo&&<span style={{fontSize:11,color:"#16a34a",fontWeight:600}}>✅ {(selWo.processTimes||[]).length}개 공정 실적 자동 적용 (작업실적 입력값 반영)</span>}
            </div>}
          </div>

          {!entry&&<div className="empty" style={{padding:60,background:"#fff",borderRadius:10}}>제품을 선택하거나 추가하세요.</div>}
          {entry&&(
            <>
              {/* BOM 연동 패널 — WO 연동 시 숨김 (실제 자재 패널로 대체) */}
              {entry.linkedProduct&&!selWo&&(()=>{
                const linkedItem=items.find(i=>i.code===entry.linkedProduct);
                const linkedBom=bom.find(b=>b.product===entry.linkedProduct);
                return(
                  <div className="panel" style={{marginBottom:14,border:"2px solid #bfdbfe"}}>
                    <div className="panel-top" style={{background:"#eff6ff"}}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <b style={{color:"#2563eb"}}>🔗 품목 연동</b>
                        <span className="badge badge-blue">{entry.linkedProduct}</span>
                        <span style={{fontWeight:600,fontSize:13}}>{linkedItem?.name||"-"}</span>
                        <span style={{fontSize:12,color:"#888"}}>규격: {linkedItem?.spec||linkedItem?.capacity||"-"} | 단위: {linkedItem?.unit||"-"}</span>
                      </div>
                      <span style={{fontSize:12,color:"#2563eb",fontWeight:600}}>등록단가: {(linkedItem?.price||0).toLocaleString()}원</span>
                    </div>
                    {linkedBom?(
                      <table>
                        <thead><tr><th style={{background:"#eff6ff",color:"#2563eb"}}>자재명</th><th style={{background:"#eff6ff",color:"#2563eb"}}>코드</th><th style={{background:"#eff6ff",color:"#2563eb",textAlign:"right"}}>소요량</th><th style={{background:"#eff6ff",color:"#2563eb"}}>단위</th><th style={{background:"#eff6ff",color:"#2563eb",textAlign:"right"}}>현재고</th><th style={{background:"#eff6ff",color:"#2563eb",textAlign:"right"}}>자재단가</th><th style={{background:"#eff6ff",color:"#2563eb",textAlign:"right"}}>소계</th></tr></thead>
                        <tbody>
                          {linkedBom.materials.map((m,i)=>{
                            const mat=items.find(x=>x.code===m.code);
                            const price=mat?.price||0;
                            return(
                              <tr key={i}>
                                <td><b>{m.name}</b></td>
                                <td style={{fontSize:11,color:"#888",fontFamily:"monospace"}}>{m.code}</td>
                                <td style={{textAlign:"right"}}>{fmt3(m.qty)}</td>
                                <td style={{color:"#888"}}>{m.unit}</td>
                                <td style={{textAlign:"right",color:mat&&mat.stock>=m.qty?"#27ae60":"#e74c3c",fontWeight:600}}>{mat?fmt3(mat.stock):"?"}</td>
                                <td style={{textAlign:"right"}}>{price>0?price.toLocaleString()+"원":"-"}</td>
                                <td style={{textAlign:"right",fontWeight:600,color:"#2563eb"}}>{price>0?(price*m.qty).toLocaleString()+"원":"-"}</td>
                              </tr>
                            );
                          })}
                          <tr style={{background:"#eff6ff",fontWeight:700}}>
                            <td colSpan={6} style={{textAlign:"right",paddingRight:14}}>BOM 자재비 합계 (1EA)</td>
                            <td style={{textAlign:"right",color:"#2563eb"}}>{linkedBom.materials.reduce((s,m)=>{const mat=items.find(x=>x.code===m.code);return s+(mat?.price||0)*m.qty;},0).toLocaleString()}원</td>
                          </tr>
                        </tbody>
                      </table>
                    ):<div style={{padding:"12px 18px",fontSize:12,color:"#aaa"}}>BOM 미등록 — BOM 관리에서 {entry.linkedProduct} 제품의 BOM을 등록해주세요</div>}
                  </div>
                );
              })()}

              {/* 작업지시 실제 자재 사용 */}
              {selWo&&(
                <div className="panel" style={{marginBottom:14}}>
                  <div className="panel-top" style={{background:"#f0fdf4"}}>
                    <b>🔗 실제 자재 사용 ({selWo.code} 연동)</b>
                    <span style={{fontSize:12,color:"#888"}}>
                      {actualMats.length>0?`${actualMats.length}건 실제 출고 기록`:
                        selWoBom?`BOM 기준 자재 ${selWoBom.materials.length}종 (실제 출고 기록 없음)`:"BOM 미등록"}
                    </span>
                  </div>
                  <table>

function OrdersLedgerPage({ordersLedger,setOrdersLedger,currentUser,perm,showToast}) {
  const today = new Date().toISOString().slice(0,10);
  const ym = today.slice(0,7);
  const [filterYm, setFilterYm] = useState(ym);
  const [q, setQ] = useState("");
  const [modal, setModal] = useState(null);
  const [viewDetail, setViewDetail] = useState(null);
  const emptyForm = {no:0,date:today,receiver:currentUser?.name||"",client:"",orderNo:"",product:"",spec:"",desc:"",qty:1,dueDate:"N/A",paymentTerms:"N/A",requirements:"N/A",customerReq:"이상없음",feasible:"O",deliveryDate:"",note:"",taxInvoice:""};
  const [form, setForm] = useState(emptyForm);

  const genOrderNo = (dateStr) => {
    const d = dateStr||today;
    const yy = d.slice(2,4); const mm = d.slice(5,7);
    const prefix = `IO${yy}${mm}`;
    const existing = ordersLedger.filter(r=>r.orderNo.startsWith(prefix));
    const next = String(existing.length+1).padStart(3,"0");
    return `${prefix}${next}`;
  };

  const filtered = ordersLedger.filter(r=>{
    const matchYm = !filterYm || r.date.startsWith(filterYm);
    const matchQ = !q || r.client.includes(q)||r.product.includes(q)||r.orderNo.includes(q)||r.receiver.includes(q);
    return matchYm && matchQ;
  });

  const openAdd = () => {
    const newNo = ordersLedger.length>0 ? Math.max(...ordersLedger.map(r=>r.no))+1 : 1;
    const orderNo = genOrderNo(today);
    setForm({...emptyForm, no:newNo, orderNo, date:today, receiver:currentUser?.name||""});
    setModal("add");
  };
  const openEdit = (r) => { setForm({...r}); setModal("edit"); };

      setOrdersLedger([...ordersLedger, form]);

function UserPage({users, setUsers, currentUser, showToast}) {
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({id:"",pw:"",name:"",role:"viewer"});
  const roleLabel = {admin:"관리자",manager:"담당자",viewer:"조회자"};
  const roleBadge = {admin:"badge-blue",manager:"badge-green",viewer:"badge-gray"};

  const openAdd = () => { setForm({id:"",pw:"",name:"",role:"viewer"}); setModal("add"); };
  const save = () => {
    if(!form.id||!form.pw||!form.name){showToast("아이디, 비밀번호, 이름은 필수입니다.");return;}
    if(modal==="add"){
      if(users.find(u=>u.id===form.id)){showToast("이미 존재하는 아이디입니다.");return;}
      setUsers([...users,form]);
    } else {
      setUsers(users.map(u=>u.id===form.id?form:u));
    }
    showToast("저장되었습니다."); setModal(null);
  };
  const del = (id) => {
    if(id===currentUser.id){showToast("현재 로그인된 계정은 삭제할 수 없습니다.");return;}
    setUsers(users.filter(u=>u.id!==id));

    <div>

                <td><span className={`badge ${roleBadge[u.role]}`}>{roleLabel[u.role]}</span></td>

            <div className="modal-body">
              <div className="field-row">
                <div className="field"><label>아이디 *</label><input value={form.id} onChange={e=>setForm({...form,id:e.target.value})} disabled={modal==="edit"} placeholder="로그인 ID"/></div>
                <div className="field"><label>이름 *</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="표시 이름"/></div>
              </div>
              <div className="field-row">
                <div className="field"><label>비밀번호 *</label><input type="password" value={form.pw} onChange={e=>setForm({...form,pw:e.target.value})} placeholder="비밀번호"/></div>
                <div className="field">
                  <label>역할 (권한)</label>
                  <select value={form.role} onChange={e=>setForm({...form,role:e.target.value})}>
                    <option value="admin">관리자 - 모든 기능</option>
                    <option value="manager">담당자 - 등록/수정 가능</option>
                    <option value="viewer">조회자 - 조회만 가능</option>
                  </select>
                </div>
              </div>
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={()=>setModal(null)}>취소</button>
              <button className="btn btn-primary" onClick={save}>저장</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
