function IOPage({io,setIo,items,setItems,lots,perm,showToast,downloadCSV}) {
  const [modal,setModal]=useState(false);
  const [form,setForm]=useState({date:"",type:"입고",item:"",itemName:"",qty:0,unitPrice:0,lot:"",note:""});
  const [sel,setSel]=useState(new Set());
  const [warnNeg,setWarnNeg]=useState(null);
  const toggleSel=(idx)=>setSel(prev=>{const s=new Set(prev);s.has(idx)?s.delete(idx):s.add(idx);return s;});

  const lotRemaining=(lotCode)=>{
    if(!lotCode) return null;
    const lot=lots.find(l=>l.code===lotCode);
    if(!lot) return null;
    const out=io.filter(r=>r.lot===lotCode&&r.type==="출고").reduce((s,r)=>s+(r.qty||0),0);
    return lot.qty - out;
  };

  const doSave=()=>{
    if(!form.item){showToast("품목을 선택해주세요");return;}
    setIo([{...form},...io]);
    if(form.type==="입고"&&form.unitPrice>0){
      setItems(items.map(i=>i.code===form.item?{...i,price:form.unitPrice}:i));
    }
    showToast("저장되었습니다.");
    setModal(false);setWarnNeg(null);
  };

  const save=()=>{
    if(!form.item){showToast("품목을 선택해주세요");return;}
    if(form.type==="출고"){
      const it=items.find(i=>i.code===form.item);
      const curStock=it?it.stock:0;
      if(curStock - form.qty < 0){
        setWarnNeg({itemName:form.itemName,current:curStock,after:curStock-form.qty});
        return;
      }
    }
    doSave();
  };

  const bulkDel=()=>{setIo(io.filter((_,i)=>!sel.has(i)));const n=sel.size;setSel(new Set());showToast(`${n}개 삭제되었습니다.`);};

  const selLot=form.lot?lots.find(l=>l.code===form.lot):null;
  const selLotRem=form.lot?lotRemaining(form.lot):null;
  const itemLots=lots.filter(l=>l.item===form.item);

  return (
    <div>
      <div className="page-header">
        <div><div className="page-title">입출고관리</div><div className="page-sub">자재 입고 / 제품 출고 이력 — LOT별 잔여수량 추적 — 재고 부족 시 경고</div></div>
        <div style={{display:"flex",gap:8}}>
          {perm.canDelete&&sel.size>0&&<button className="btn btn-danger" onClick={bulkDel}>🗑 선택 삭제 ({sel.size})</button>}
          <button className="btn btn-outline" onClick={()=>downloadCSV(["일자","유형","품목명","수량","단가","금액","LOT","비고"],io.map(r=>[r.date,r.type,r.itemName,r.qty,r.unitPrice||0,(r.unitPrice||0)*r.qty,r.lot,r.note]),"입출고이력.csv")}>📥 엑셀</button>
          {perm.canCreate&&<button className="btn btn-primary" onClick={()=>{setForm({date:new Date().toISOString().slice(0,10),type:"입고",item:"",itemName:"",qty:0,unitPrice:0,lot:"",note:""});setModal(true);}}>+ 입출고 등록</button>}
        </div>
      </div>
      <div className="panel">
        <table>
          <thead><tr><th style={{width:36,textAlign:"center"}}>선택</th><th>일자</th><th>유형</th><th>품목명</th><th style={{textAlign:"right"}}>수량</th><th style={{textAlign:"right"}}>단가</th><th style={{textAlign:"right"}}>금액</th><th>LOT</th><th>비고</th></tr></thead>
          <tbody>{io.map((r,i)=>(
            <tr key={i}>
              <td style={{textAlign:"center"}}><input type="checkbox" checked={sel.has(i)} onChange={()=>toggleSel(i)} style={{cursor:"pointer"}}/></td>
              <td>{r.date}</td>
              <td><span className={`badge ${r.type==="입고"?"badge-blue":"badge-orange"}`}>{r.type}</span></td>
              <td>{r.itemName}</td>
              <td style={{textAlign:"right"}}>{r.qty}</td>
              <td style={{textAlign:"right",color:r.unitPrice>0?"#2563eb":"#aaa"}}>{r.unitPrice>0?r.unitPrice.toLocaleString()+"원":"-"}</td>
              <td style={{textAlign:"right",fontWeight:r.unitPrice>0?600:400}}>{r.unitPrice>0?(r.unitPrice*r.qty).toLocaleString()+"원":"-"}</td>
              <td style={{fontSize:11,color:"#888"}}>{r.lot||"-"}</td><td>{r.note||"-"}</td>
            </tr>
          ))}{!io.length&&<tr><td colSpan={9} className="empty">이력 없음</td></tr>}</tbody>
        </table>
      </div>

      {/* 등록 모달 */}
      {modal&&(<div className="overlay" onClick={()=>setModal(false)}><div className="modal" style={{width:580}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><span className="modal-title">입출고 등록</span><button className="modal-close" onClick={()=>setModal(false)}>✕</button></div>
        <div className="modal-body">
          <div className="field-row">
            <div className="field"><label>일자</label><input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></div>
            <div className="field"><label>유형</label><select value={form.type} onChange={e=>setForm({...form,type:e.target.value,lot:""})}><option>입고</option><option>출고</option></select></div>
          </div>
          <div className="field"><label>품목 *</label>
            <select value={form.item} onChange={e=>{const it=items.find(i=>i.code===e.target.value);setForm({...form,item:e.target.value,itemName:it?it.name:"",unitPrice:it?.price||0,lot:""});}}>
              <option value="">선택</option>{items.map(i=><option key={i.code} value={i.code}>{i.name} ({i.type})</option>)}
            </select>
          </div>
          <div className="field-row">
            <div className="field"><label>수량</label><input type="number" value={form.qty} onChange={e=>setForm({...form,qty:+e.target.value})}/></div>
            {form.type==="입고"&&<div className="field"><label>단가 (원) <span style={{color:"#2563eb",fontSize:11}}>★ 품목 단가 자동 반영</span></label><input type="number" value={form.unitPrice||0} onChange={e=>setForm({...form,unitPrice:+e.target.value})}/></div>}
          </div>
          <div className="field">
            <label>LOT번호 {form.item&&itemLots.length>0&&<span style={{color:"#888",fontSize:11}}>(해당 품목 LOT {itemLots.length}개)</span>}</label>
            <select value={form.lot} onChange={e=>setForm({...form,lot:e.target.value})}>
              <option value="">-- LOT 선택 (선택사항) --</option>
              {itemLots.map(l=>{const rem=lotRemaining(l.code);return<option key={l.code} value={l.code}>{l.code} (잔여 {rem??l.qty}개)</option>;})}
            </select>
          </div>
          {selLot&&(
            <div style={{background:"#f0f9ff",borderRadius:8,padding:"10px 14px",fontSize:12,marginTop:4}}>
              <div style={{fontWeight:600,color:"#2563eb",marginBottom:4}}>📦 선택된 LOT 정보</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
                <div><span style={{color:"#888"}}>초기수량: </span><b>{selLot.qty}</b></div>
                <div><span style={{color:"#888"}}>사용량: </span><b>{selLot.qty-(selLotRem??selLot.qty)}</b></div>
                <div><span style={{color:selLotRem<=0?"#e74c3c":"#16a34a"}}>잔여수량: </span><b style={{color:selLotRem<=0?"#e74c3c":"#16a34a"}}>{selLotRem??selLot.qty}</b></div>
              </div>
              {form.type==="출고"&&form.qty>0&&(selLotRem??selLot.qty)-form.qty<0&&(
                <div style={{marginTop:6,color:"#e74c3c",fontWeight:600}}>⚠️ 출고 후 LOT 잔여수량: {(selLotRem??selLot.qty)-form.qty} (마이너스)</div>
              )}
            </div>
          )}
          <div className="field"><label>비고</label><input value={form.note} onChange={e=>setForm({...form,note:e.target.value})}/></div>
          {form.type==="입고"&&form.unitPrice>0&&form.qty>0&&<div style={{background:"#eff6ff",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#2563eb"}}>입고 금액: <b>{(form.unitPrice*form.qty).toLocaleString()}원</b></div>}
        </div>
        <div className="modal-foot"><button className="btn btn-outline" onClick={()=>setModal(false)}>취소</button><button className="btn btn-primary" onClick={save}>저장</button></div>
      </div></div>)}

      {/* 재고 마이너스 경고 팝업 */}
      {warnNeg&&(<div className="overlay" onClick={()=>setWarnNeg(null)}><div className="modal" style={{width:400,textAlign:"center"}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><span className="modal-title" style={{color:"#e74c3c"}}>⚠️ 재고 부족 경고</span><button className="modal-close" onClick={()=>setWarnNeg(null)}>✕</button></div>
        <div className="modal-body">
          <div style={{fontSize:16,fontWeight:700,marginBottom:12}}>{warnNeg.itemName}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            <div style={{background:"#f8f9fb",borderRadius:8,padding:"10px"}}><div style={{fontSize:11,color:"#888"}}>현재 재고</div><div style={{fontSize:20,fontWeight:700}}>{warnNeg.current}</div></div>
            <div style={{background:"#fef2f2",borderRadius:8,padding:"10px"}}><div style={{fontSize:11,color:"#e74c3c"}}>출고 후 재고</div><div style={{fontSize:20,fontWeight:700,color:"#e74c3c"}}>{warnNeg.after}</div></div>
          </div>
          <div style={{fontSize:13,color:"#666",marginBottom:16}}>재고가 부족합니다. 그래도 출고 처리하시겠습니까?</div>
        </div>
        <div className="modal-foot">
          <button className="btn btn-outline" onClick={()=>setWarnNeg(null)}>취소</button>
          <button className="btn btn-danger" onClick={doSave}>강제 출고</button>
        </div>
      </div></div>)}
    </div>
  );
}

function OrdersPage({orders,setOrders,items,setItems,bom,processes,factories,lots,setLots,setIo,warehouses,defectWarehouse,goodWarehouse,perm,showToast,tryDelete,checkOrderLinks}) {
  const [activeTab,setActiveTab]=useState("list");
  const [sel,setSel]=useState(new Set());
  const [viewWo,setViewWo]=useState(null);
  const [modal,setModal]=useState(null);
  const [completeModal,setCompleteModal]=useState(null);
  const [compForm,setCompForm]=useState({doneDate:"",defectQty:0,processTimes:[]});
  const [form,setForm]=useState({code:"",product:"",productName:"",orderQty:0,lot:"",processes:[],status:"대기",date:"",factoryCode:""});
  // 작업 입력 탭 state
  const [workWoCode,setWorkWoCode]=useState("");
  const [workProcTimes,setWorkProcTimes]=useState([]); // [{code,name,hours}]
  const [workMatQty,setWorkMatQty]=useState({});       // {itemCode: qty to deduct now}
  const products=items.filter(i=>i.type==="완제품");
  const toggleSel=(code)=>setSel(prev=>{const s=new Set(prev);s.has(code)?s.delete(code):s.add(code);return s;});
  const SBadge=({s})=><span className={`badge ${s==="완료"?"badge-green":s==="진행중"?"badge-blue":s==="대기"?"badge-gray":"badge-red"}`}>{s}</span>;

  const selectProduct=(productCode)=>{
    const prd=items.find(i=>i.code===productCode);
    const itemProcCodes=prd?.processes||[];
    const autoProcs=itemProcCodes.map(pc=>{const proc=processes.find(p=>p.code===pc);return{code:pc,name:proc?.name||pc};});
    setForm(f=>({...f,product:productCode,processes:autoProcs}));
  };

  const openAdd=()=>{
    setForm({code:"WO"+Date.now(),product:"",productName:"",orderQty:0,lot:"LOT"+Date.now(),processes:[],status:"대기",date:new Date().toISOString().slice(0,10),factoryCode:factories[0]?.code||""});
    setModal("add");
  };
  const addProcess=()=>setForm(f=>({...f,processes:[...f.processes,{code:"",name:""}]}));
  const setProc=(idx,val)=>{const ps=[...form.processes];const proc=processes.find(p=>p.code===val);ps[idx]={code:val,name:proc?.name||val};setForm(f=>({...f,processes:ps}));};
  const delProc=(idx)=>setForm(f=>({...f,processes:f.processes.filter((_,i)=>i!==idx)}));

  const openComplete=(order)=>{
    const pts=(order.processes||[]).map(p=>({code:p.code,name:p.name,hours:0}));
    setCompForm({doneDate:new Date().toISOString().slice(0,10),defectQty:order.defectQty||0,processTimes:pts});
    setCompleteModal(order);
  };

  const handleComplete=(order,doneDate,defectQty)=>{
    const bomEntry=bom.find(b=>b.product===order.product);
    if(bomEntry&&order.orderQty>0){
      setItems(prev=>prev.map(it=>{const mat=bomEntry.materials.find(m=>m.code===it.code);return mat?{...it,stock:Math.max(0,it.stock-mat.qty*order.orderQty)}:it;}));
      const ioRecs=bomEntry.materials.map(m=>({date:doneDate,type:"출고",item:m.code,itemName:m.name,qty:m.qty*order.orderQty,unitPrice:items.find(i=>i.code===m.code)?.price||0,lot:order.lot||"",note:`작업지시서 ${order.code} 투입`}));
      setIo(prev=>[...ioRecs,...prev]);
    }
    const goodQty=(order.orderQty||0)-(defectQty||0);
    if(goodQty>0){
      const glot={code:order.lot||"LOT"+Date.now(),item:order.product,itemName:order.productName,qty:goodQty,mfg:doneDate,exp:"",status:"정상",warehouse:goodWarehouse.name};
      setLots(prev=>[...prev,glot]);
      setItems(prev=>prev.map(it=>it.code===order.product?{...it,stock:it.stock+goodQty}:it));
      setIo(prev=>[{date:doneDate,type:"입고",item:order.product,itemName:order.productName,qty:goodQty,unitPrice:items.find(i=>i.code===order.product)?.price||0,lot:glot.code,note:`작업지시서 ${order.code} 완료`},...prev]);
    }
    if((defectQty||0)>0){
      setLots(prev=>[...prev,{code:"DEF"+Date.now(),item:order.product,itemName:order.productName,qty:defectQty,mfg:doneDate,exp:"",status:"불량",warehouse:defectWarehouse.name}]);
    }
  };

  const saveComplete=()=>{
    if(!compForm.doneDate){showToast("완료일을 입력해주세요");return;}
    const updated={...completeModal,status:"완료",defectQty:compForm.defectQty,doneDate:compForm.doneDate,processTimes:compForm.processTimes};
    handleComplete(completeModal,compForm.doneDate,compForm.defectQty);
    setOrders(orders.map(o=>o.code===completeModal.code?updated:o));
    showToast("완료 처리 — 자재 차감·LOT 생성 완료");
    setCompleteModal(null);setViewWo(null);
  };

  // 작업 입력 탭 로직
  const activeWOs=orders.filter(o=>o.status==="대기"||o.status==="진행중");
  const workOrder=orders.find(o=>o.code===workWoCode)||null;
  const workBom=workOrder?bom.find(b=>b.product===workOrder.product):null;
  const alreadyDeducted=(itemCode)=>io.filter(r=>r.type==="출고"&&r.item===itemCode&&r.note&&r.note.includes(workWoCode)).reduce((s,r)=>s+(r.qty||0),0);

  const selectWorkWo=(code)=>{
    setWorkWoCode(code);
    const wo=orders.find(o=>o.code===code);
    if(wo){
      const existing=wo.processTimes||[];
      const pts=(wo.processes||[]).map(p=>{const ex=existing.find(t=>t.code===p.code);return{code:p.code,name:p.name,hours:ex?ex.hours:0};});
      setWorkProcTimes(pts);
      setWorkMatQty({});
    }
  };

  const deductMaterial=(mat)=>{
    const qty=workMatQty[mat.code]||0;
    if(qty<=0){showToast("수량을 입력하세요");return;}
    const today=new Date().toISOString().slice(0,10);
    const it=items.find(i=>i.code===mat.code);
    const newStock=(it?.stock||0)-qty;
    if(newStock<0&&!window.confirm(`재고가 부족합니다 (현재 ${it?.stock||0}, 출고 ${qty}). 계속하시겠습니까?`)) return;
    setIo(prev=>[{date:today,type:"출고",item:mat.code,itemName:mat.name,qty,unitPrice:it?.price||0,lot:workOrder.lot||"",note:`작업지시서 ${workWoCode} 투입`},...prev]);
    setItems(prev=>prev.map(i=>i.code===mat.code?{...i,stock:i.stock-qty}:i));
    setWorkMatQty(q=>({...q,[mat.code]:0}));
    showToast(`${mat.name} ${qty}${mat.unit} 출고 처리 완료`);
  };

  const saveWorkProgress=()=>{
    if(!workOrder){showToast("작업지시서를 선택하세요");return;}
    setOrders(orders.map(o=>o.code===workWoCode?{...o,status:"진행중",processTimes:workProcTimes}:o));
    showToast("공정 시간 임시저장 완료");
  };

  const startWorkComplete=()=>{
    if(!workOrder){showToast("작업지시서를 선택하세요");return;}
    setCompForm({doneDate:new Date().toISOString().slice(0,10),defectQty:workOrder.defectQty||0,processTimes:workProcTimes});
    setCompleteModal(workOrder);
  };

  const save=()=>{
    if(!form.product){showToast("완제품을 선택해주세요");return;}
    const prd=products.find(p=>p.code===form.product);
    const entry={...form,productName:prd?prd.name:"",status:modal==="add"?"대기":form.status};
    if(modal==="add"){setOrders([...orders,entry]);}else{setOrders(orders.map(o=>o.code===form.code?entry:o));}
    showToast("저장되었습니다.");setModal(null);
  };
  const del=(code)=>{const r=checkOrderLinks(code);tryDelete(r,()=>{setOrders(orders.filter(o=>o.code!==code));showToast("삭제되었습니다.");},"작업지시서 삭제 불가");};
  const bulkDel=()=>{
    const blocked=[...sel].find(c=>{const o=orders.find(x=>x.code===c);return o&&o.status==="완료";});
    if(blocked){showToast("완료된 작업지시서가 포함되어 있습니다.");return;}
    setOrders(orders.filter(o=>!sel.has(o.code)));const n=sel.size;setSel(new Set());showToast(`${n}개 삭제되었습니다.`);
  };

  const formBom=bom.find(b=>b.product===form.product);

  return (
    <div>
      <div className="page-header">
        <div><div className="page-title">작업지시서</div><div className="page-sub">작업 지시 등록 → 작업 입력(공정시간·자재출고) → 완료 처리</div></div>
        <div style={{display:"flex",gap:8}}>
          {activeTab==="list"&&perm.canDelete&&sel.size>0&&<button className="btn btn-danger" onClick={bulkDel}>🗑 선택 삭제 ({sel.size})</button>}
          {activeTab==="list"&&perm.canCreate&&<button className="btn btn-primary" onClick={openAdd}>+ 작업지시 등록</button>}
        </div>
      </div>

      <div className="tabs">
        <div className={`tab${activeTab==="list"?" active":""}`} onClick={()=>setActiveTab("list")}>📋 작업지시서 목록</div>
        <div className={`tab${activeTab==="work"?" active":""}`} onClick={()=>setActiveTab("work")}>⚙️ 작업 입력</div>
      </div>

      {/* ── 탭1: 목록 ── */}
      {activeTab==="list"&&<div className="panel">
        <table>
          <thead><tr>
            <th style={{width:36,textAlign:"center"}}>선택</th>
            <th>지시번호</th><th>완제품</th><th style={{textAlign:"right"}}>지시수량</th>
            <th>공장</th><th>지시일</th><th>완료일</th><th>상태</th><th>LOT</th><th>관리</th>
          </tr></thead>
          <tbody>{orders.map(o=>(
            <tr key={o.code} style={{cursor:"pointer"}} onClick={()=>setViewWo(o)}>
              <td style={{textAlign:"center"}} onClick={e=>e.stopPropagation()}>
                <input type="checkbox" checked={sel.has(o.code)} onChange={()=>toggleSel(o.code)} style={{cursor:"pointer"}}/>
              </td>
              <td><b style={{color:"#2563eb"}}>{o.code}</b></td>
              <td>{o.productName}</td>
              <td style={{textAlign:"right"}}>{o.orderQty} EA</td>
              <td>{factories.find(f=>f.code===o.factoryCode)?.name||"-"}</td>
              <td>{o.date}</td>
              <td style={{color:o.doneDate?"#16a34a":"#aaa"}}>{o.doneDate||"-"}</td>
              <td><SBadge s={o.status}/></td>
              <td style={{fontSize:11,color:"#888"}}>{o.lot||"-"}</td>
              <td style={{display:"flex",gap:4,flexWrap:"wrap"}} onClick={e=>e.stopPropagation()}>
                {perm.canEdit&&o.status!=="완료"&&o.status!=="취소"&&(
                  <button className="btn btn-sm" style={{background:"#16a34a",color:"#fff",border:"none",padding:"4px 8px",borderRadius:4,cursor:"pointer",fontSize:12}}
                    onClick={()=>{selectWorkWo(o.code);setActiveTab("work");}}>⚙️ 작업입력</button>
                )}
                {perm.canEdit&&o.status!=="완료"&&o.status!=="취소"&&(
                  <button className="btn btn-sm" style={{background:"#16a34a",color:"#fff",border:"none"}} onClick={()=>openComplete(o)}>✅ 완료</button>
                )}
                {perm.canEdit&&o.status!=="완료"&&<button className="btn btn-outline btn-sm" onClick={()=>{setForm({...o,processes:o.processes||[]});setModal("edit");}}>수정</button>}
                {perm.canDelete&&<button className="btn btn-danger btn-sm" onClick={()=>del(o.code)}>삭제</button>}
              </td>
            </tr>
          ))}{!orders.length&&<tr><td colSpan={10} className="empty">작업지시 없음</td></tr>}</tbody>
        </table>
      </div>}

      {/* ── 탭2: 작업 입력 ── */}
      {activeTab==="work"&&(
        <div>
          {/* WO 선택 */}
          <div className="panel" style={{marginBottom:16}}>
            <div className="panel-top">
              <b>⚙️ 작업 입력 — 작업지시서 선택</b>
              <select value={workWoCode} onChange={e=>selectWorkWo(e.target.value)}
                style={{border:"1px solid #2563eb",borderRadius:6,padding:"6px 12px",fontSize:13,fontWeight:600,color:"#2563eb"}}>
                <option value="">-- 작업지시서 선택 --</option>
                {activeWOs.map(o=><option key={o.code} value={o.code}>{o.code} | {o.productName} | {o.orderQty}EA | <SBadge s={o.status}/></option>)}
              </select>
            </div>
            {!workOrder&&<div className="empty" style={{padding:40}}>대기 또는 진행중 상태의 작업지시서를 선택하세요</div>}
          </div>

          {workOrder&&(
            <>
              {/* WO 정보 */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:16}}>
                {[["완제품",workOrder.productName],["지시수량",workOrder.orderQty+"EA"],["LOT",workOrder.lot||"-"],["상태",workOrder.status]].map(([k,v])=>(
                  <div key={k} className="card"><div className="card-label">{k}</div><div className="card-val" style={{fontSize:16}}>{v}</div></div>
                ))}
              </div>

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
                {/* 공정 시간 입력 */}
                <div className="panel">
                  <div className="panel-top"><b>⚙️ 공정별 소요시간 입력</b>
                    <span style={{fontSize:11,color:"#888"}}>총 {workProcTimes.reduce((s,p)=>s+(p.hours||0),0)}h</span>
                  </div>
                  {workProcTimes.length===0&&<div className="empty" style={{padding:24}}>등록된 공정 없음 — 품목관리에서 완제품에 공정 설정</div>}
                  <table>
                    <thead><tr><th>공정명</th><th style={{textAlign:"right",width:130}}>소요시간 (h)</th></tr></thead>
                    <tbody>{workProcTimes.map((p,i)=>(
                      <tr key={i}>
                        <td>{p.name||p.code}</td>
                        <td style={{textAlign:"right"}}>
                          <input type="number" value={p.hours}
                            onChange={e=>{const t=[...workProcTimes];t[i]={...t[i],hours:+e.target.value};setWorkProcTimes(t);}}
                            style={{width:90,border:"1px solid #ddd",borderRadius:5,padding:"4px 8px",fontSize:13,textAlign:"right"}}/>
                          <span style={{fontSize:12,color:"#888",marginLeft:4}}>h</span>
                        </td>
                      </tr>
                    ))}</tbody>
                  </table>
                </div>

                {/* 자재 출고 */}
                <div className="panel">
                  <div className="panel-top"><b>📦 자재 출고 처리</b>
                    <span style={{fontSize:11,color:"#888"}}>BOM 기준 소요량 대비 출고 현황</span>
                  </div>
                  {!workBom&&<div className="empty" style={{padding:24}}>BOM이 등록되지 않은 완제품입니다</div>}
                  {workBom&&<table>
                    <thead><tr><th>자재명</th><th style={{textAlign:"right"}}>필요량</th><th style={{textAlign:"right"}}>출고됨</th><th style={{textAlign:"right"}}>잔여</th><th style={{width:130}}>지금 출고</th></tr></thead>
                    <tbody>{workBom.materials.map((mat,i)=>{
                      const need=mat.qty*workOrder.orderQty;
                      const done=alreadyDeducted(mat.code);
                      const remain=need-done;
                      const it=items.find(x=>x.code===mat.code);
                      return(
                        <tr key={i}>
                          <td><b>{mat.name}</b><br/><span style={{fontSize:11,color:"#888"}}>{mat.code}</span></td>
                          <td style={{textAlign:"right"}}>{need}{mat.unit}</td>
                          <td style={{textAlign:"right",color:done>0?"#16a34a":"#aaa"}}>{done}{mat.unit}</td>
                          <td style={{textAlign:"right",color:remain>0?"#e74c3c":"#16a34a",fontWeight:600}}>{remain}{mat.unit}</td>
                          <td>
                            <div style={{display:"flex",gap:4,alignItems:"center"}}>
                              <input type="number" value={workMatQty[mat.code]||0}
                                onChange={e=>setWorkMatQty(q=>({...q,[mat.code]:+e.target.value}))}
                                style={{width:60,border:"1px solid #ddd",borderRadius:5,padding:"3px 6px",fontSize:12}}/>
                              <button className="btn btn-sm" style={{background:"#2563eb",color:"#fff",border:"none",padding:"4px 8px",borderRadius:4,cursor:"pointer",fontSize:11,whiteSpace:"nowrap"}}
                                onClick={()=>deductMaterial(mat)}>출고</button>
                            </div>
                            {it&&<div style={{fontSize:10,color:"#aaa",marginTop:2}}>재고: {it.stock}{mat.unit}</div>}
                          </td>
                        </tr>
                      );
                    })}</tbody>
                  </table>}
                </div>
              </div>

              <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
                <button className="btn btn-outline" onClick={saveWorkProgress}>💾 임시저장 (공정시간)</button>
                <button className="btn btn-sm" style={{background:"#16a34a",color:"#fff",border:"none",padding:"8px 20px",borderRadius:6,cursor:"pointer",fontWeight:600,fontSize:13}}
                  onClick={startWorkComplete}>✅ 완료 처리</button>
              </div>
            </>
          )}
        </div>
      )}

      {/* 상세보기 팝업 */}
      {viewWo&&(
        <div className="overlay" onClick={()=>setViewWo(null)}>
          <div className="modal" style={{width:700}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <span className="modal-title">📋 작업지시서 상세 — {viewWo.code}</span>
              <button className="modal-close" onClick={()=>setViewWo(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>
                <div style={{background:"#f8f9fb",borderRadius:8,padding:"10px 14px"}}><div style={{fontSize:11,color:"#888",marginBottom:3}}>완제품</div><div style={{fontWeight:700}}>{viewWo.productName}</div></div>
                <div style={{background:"#f8f9fb",borderRadius:8,padding:"10px 14px"}}><div style={{fontSize:11,color:"#888",marginBottom:3}}>지시수량 / 불량</div><div style={{fontWeight:700}}>{viewWo.orderQty}EA {(viewWo.defectQty||0)>0&&<span style={{color:"#e74c3c"}}>/ {viewWo.defectQty}EA 불량</span>}</div></div>
                <div style={{background:"#f8f9fb",borderRadius:8,padding:"10px 14px"}}><div style={{fontSize:11,color:"#888",marginBottom:3}}>상태</div><div style={{fontWeight:700}}><SBadge s={viewWo.status}/>{viewWo.doneDate&&<span style={{fontSize:11,color:"#16a34a",marginLeft:6}}>완료일: {viewWo.doneDate}</span>}</div></div>
              </div>
              {(viewWo.processes||[]).length>0&&(
                <div style={{marginBottom:12}}>
                  <div style={{fontWeight:600,fontSize:13,marginBottom:6}}>⚙️ 공정 목록</div>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                    <thead><tr style={{background:"#1a2236",color:"#fff"}}>
                      <th style={{padding:"6px 12px",textAlign:"left"}}>공정명</th>
                      {viewWo.processTimes&&<th style={{padding:"6px 12px",textAlign:"right"}}>실제 소요시간</th>}
                    </tr></thead>
                    <tbody>{viewWo.processes.map((p,i)=>{
                      const pt=viewWo.processTimes?.find(t=>t.code===p.code);
                      return<tr key={i} style={{borderBottom:"1px solid #f0f0f0"}}>
                        <td style={{padding:"6px 12px"}}>{p.name||p.code}</td>
                        {viewWo.processTimes&&<td style={{padding:"6px 12px",textAlign:"right",color:"#2563eb",fontWeight:600}}>{pt?`${pt.hours}h`:"미기록"}</td>}
                      </tr>;
                    })}</tbody>
                    {viewWo.processTimes&&<tfoot><tr style={{background:"#f0f9ff"}}><td style={{padding:"6px 12px",fontWeight:600}}>총 실제 소요시간</td><td style={{padding:"6px 12px",textAlign:"right",fontWeight:700,color:"#2563eb"}}>{(viewWo.processTimes||[]).reduce((s,p)=>s+(p.hours||0),0)}h</td></tr></tfoot>}
                  </table>
                </div>
              )}
              {(()=>{const be=bom.find(b=>b.product===viewWo.product);return be?(
                <div>
                  <div style={{fontWeight:600,fontSize:13,marginBottom:6}}>🧪 BOM 자재 소요량 (지시수량 {viewWo.orderQty}EA 기준)</div>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                    <thead><tr style={{background:"#1a2236",color:"#fff"}}><th style={{padding:"6px 12px",textAlign:"left"}}>자재명</th><th style={{padding:"6px 12px",textAlign:"right"}}>단위소요</th><th style={{padding:"6px 12px",textAlign:"right"}}>총소요량</th><th style={{padding:"6px 12px",textAlign:"right"}}>현재재고</th><th style={{padding:"6px 12px",textAlign:"center"}}>충분</th></tr></thead>
                    <tbody>{be.materials.map((m,i)=>{const it=items.find(x=>x.code===m.code);const need=m.qty*viewWo.orderQty;const ok=it&&it.stock>=need;return(<tr key={i} style={{borderBottom:"1px solid #f0f0f0"}}><td style={{padding:"6px 12px"}}>{m.name}</td><td style={{padding:"6px 12px",textAlign:"right"}}>{m.qty}{m.unit}</td><td style={{padding:"6px 12px",textAlign:"right",fontWeight:600}}>{need}{m.unit}</td><td style={{padding:"6px 12px",textAlign:"right",color:ok?"inherit":"#e74c3c"}}>{it?it.stock:"-"}</td><td style={{padding:"6px 12px",textAlign:"center"}}>{ok?"✅":"⚠️ 부족"}</td></tr>);})}</tbody>
                  </table>
                  {viewWo.status==="완료"&&<div style={{background:"#dcfce7",borderRadius:8,padding:"8px 12px",marginTop:8,fontSize:12,color:"#16a34a",fontWeight:600}}>✅ 완료 처리됨 — 자재 차감 및 LOT 생성 완료</div>}
                </div>
              ):null;})()}
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={()=>setViewWo(null)}>닫기</button>
              {perm.canEdit&&viewWo.status!=="완료"&&viewWo.status!=="취소"&&(
                <button className="btn btn-sm" style={{background:"#16a34a",color:"#fff",border:"none",padding:"7px 16px",borderRadius:6,cursor:"pointer"}} onClick={()=>{openComplete(viewWo);setViewWo(null);}}>✅ 완료 처리</button>
              )}
              {perm.canEdit&&viewWo.status!=="완료"&&<button className="btn btn-primary" onClick={()=>{setForm({...viewWo,processes:viewWo.processes||[]});setModal("edit");setViewWo(null);}}>수정</button>}
            </div>
          </div>
        </div>
      )}

      {/* 완료 처리 팝업 */}
      {completeModal&&(
        <div className="overlay" onClick={()=>setCompleteModal(null)}>
          <div className="modal" style={{width:560}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <span className="modal-title" style={{color:"#16a34a"}}>✅ 완료 처리 — {completeModal.code}</span>
              <button className="modal-close" onClick={()=>setCompleteModal(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div style={{background:"#f0fdf4",borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:13}}>
                <b>{completeModal.productName}</b> · 지시수량 {completeModal.orderQty}EA · LOT: {completeModal.lot||"미지정"}
              </div>
              <div className="field-row">
                <div className="field"><label>완료일 *</label><input type="date" value={compForm.doneDate} onChange={e=>setCompForm(f=>({...f,doneDate:e.target.value}))}/></div>
                <div className="field"><label>불량수량 (EA)</label><input type="number" value={compForm.defectQty} onChange={e=>setCompForm(f=>({...f,defectQty:+e.target.value}))}/></div>
              </div>
              {compForm.defectQty>0&&<div style={{background:"#fef2f2",borderRadius:6,padding:"6px 12px",fontSize:12,color:"#e74c3c",marginBottom:8}}>⚠️ 불량 {compForm.defectQty}EA → {defectWarehouse.name}으로 LOT 이동 · 양품: {Math.max(0,(completeModal.orderQty||0)-compForm.defectQty)}EA</div>}
              {compForm.processTimes.length>0&&(
                <div>
                  <label style={{fontSize:12,fontWeight:600,color:"#555",display:"block",marginBottom:6}}>⚙️ 공정별 실제 소요시간</label>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                    <thead><tr style={{background:"#1a2236",color:"#fff"}}><th style={{padding:"6px 12px",textAlign:"left"}}>공정명</th><th style={{padding:"6px 12px",textAlign:"right",width:120}}>실제 소요시간 (h)</th></tr></thead>
                    <tbody>{compForm.processTimes.map((p,i)=>(
                      <tr key={i} style={{borderBottom:"1px solid #f0f0f0"}}>
                        <td style={{padding:"6px 12px"}}>{p.name||p.code}</td>
                        <td style={{padding:"4px 8px",textAlign:"right"}}>
                          <input type="number" value={p.hours}
                            onChange={e=>{const ts=[...compForm.processTimes];ts[i]={...ts[i],hours:+e.target.value};setCompForm(f=>({...f,processTimes:ts}));}}
                            style={{width:80,border:"1px solid #ddd",borderRadius:5,padding:"4px 8px",fontSize:12,textAlign:"right"}}/>
                        </td>
                      </tr>
                    ))}</tbody>
                    <tfoot><tr style={{background:"#f0f9ff"}}><td style={{padding:"6px 12px",fontWeight:600}}>합계</td><td style={{padding:"6px 12px",textAlign:"right",fontWeight:700,color:"#2563eb"}}>{compForm.processTimes.reduce((s,p)=>s+(p.hours||0),0)}h</td></tr></tfoot>
                  </table>
                </div>
              )}
              {compForm.processTimes.length===0&&<div style={{fontSize:12,color:"#aaa",padding:"8px 0"}}>등록된 공정이 없습니다 (품목 관리에서 완제품에 공정을 설정하면 자동 표시됩니다)</div>}
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={()=>setCompleteModal(null)}>취소</button>
              <button className="btn btn-sm" style={{background:"#16a34a",color:"#fff",border:"none",padding:"7px 20px",borderRadius:6,cursor:"pointer",fontWeight:600}} onClick={saveComplete}>✅ 완료 확정</button>
            </div>
          </div>
        </div>
      )}

      {/* 등록/수정 모달 */}
      {modal&&(
        <div className="overlay" onClick={()=>setModal(null)}>
          <div className="modal" style={{width:620}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <span className="modal-title">작업지시서 {modal==="add"?"등록":"수정"}</span>
              <button className="modal-close" onClick={()=>setModal(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div className="field-row">
                <div className="field"><label>지시번호</label><input value={form.code} disabled/></div>
                <div className="field"><label>지시일</label><input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
              </div>
              <div className="field-row">
                <div className="field">
                  <label>완제품 * {form.product&&<span style={{fontSize:11,color:"#16a34a"}}>✅ 공정 {form.processes.length}개 자동 로드</span>}</label>
                  <select value={form.product} onChange={e=>selectProduct(e.target.value)}>
                    <option value="">선택</option>{products.map(p=><option key={p.code} value={p.code}>{p.name}</option>)}
                  </select>
                </div>
                <div className="field"><label>공장</label><select value={form.factoryCode} onChange={e=>setForm(f=>({...f,factoryCode:e.target.value}))}><option value="">선택</option>{factories.map(f=><option key={f.code} value={f.code}>{f.name}</option>)}</select></div>
              </div>
              <div className="field-row">
                <div className="field"><label>지시수량 (EA)</label><input type="number" value={form.orderQty} onChange={e=>setForm(f=>({...f,orderQty:+e.target.value}))}/></div>
                <div className="field"><label>LOT번호</label><input value={form.lot} onChange={e=>setForm(f=>({...f,lot:e.target.value}))}/></div>
              </div>
              {modal==="edit"&&(
                <div className="field"><label>상태</label><select value={form.status} onChange={e=>setForm(f=>({...f,status:e.target.value}))}><option>대기</option><option>진행중</option><option>취소</option></select></div>
              )}
              <div style={{marginTop:10}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
                  <label style={{fontSize:12,fontWeight:600,color:"#555"}}>⚙️ 투입 공정 <span style={{color:"#aaa",fontWeight:400,fontSize:11}}>(소요시간은 완료처리 시 입력)</span></label>
                  <button className="btn btn-outline btn-sm" onClick={addProcess}>+ 추가</button>
                </div>
                {form.processes.map((p,i)=>(
                  <div key={i} style={{display:"flex",gap:6,marginBottom:6,alignItems:"center"}}>
                    <select style={{flex:1,border:"1px solid #ddd",borderRadius:5,padding:"6px 8px",fontSize:12}} value={p.code} onChange={e=>setProc(i,e.target.value)}>
                      <option value="">공정 선택</option>
                      {processes.map(pr=><option key={pr.code} value={pr.code}>{pr.name}</option>)}
                    </select>
                    <button className="btn btn-danger btn-sm" onClick={()=>delProc(i)}>✕</button>
                  </div>
                ))}
                {!form.processes.length&&<div style={{fontSize:12,color:"#aaa",padding:"4px 0"}}>품목 관리에서 완제품에 공정을 설정하면 자동으로 불러옵니다</div>}
              </div>
              {formBom&&form.orderQty>0&&(
                <div style={{background:"#f0f9ff",borderRadius:8,padding:"10px 14px",marginTop:10,fontSize:12}}>
                  <div style={{fontWeight:600,marginBottom:6,color:"#2563eb"}}>🧪 투입 자재 소요량 (지시수량 {form.orderQty}EA)</div>
                  {formBom.materials.map((m,i)=>{const it=items.find(x=>x.code===m.code);const need=m.qty*form.orderQty;const ok=it&&it.stock>=need;return <div key={i} style={{display:"flex",justifyContent:"space-between",marginBottom:2}}><span>{m.name}</span><span style={{color:ok?"#16a34a":"#e74c3c",fontWeight:600}}>{need}{m.unit} {ok?"✅":`⚠️ 재고${it?it.stock:0}`}</span></div>;})}
                </div>
              )}
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={()=>setModal(null)}>취소</button>
              <button className="btn btn-primary" onClick={save}>저장</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function CostPage({costBom,setCostBom,factories,bom,items,processes,costMaster,setCostMaster,perm,showToast,downloadCSV}) {
  const [activeTab,setActiveTab]=useState("calc");
  const [selBomCode,setSelBomCode]=useState(bom[0]?.code||"");
  const [selFactoryCode,setSelFactoryCode]=useState(factories[0]?.code||"");

  const th={color:"#fff",background:"#1a2236"};

  // ── 원가마스터 편집 헬퍼 ──
  const updProcRate=(idx,field,val)=>{
    const pr=[...costMaster.processRates];
    pr[idx]={...pr[idx],[field]:val};
    setCostMaster({...costMaster,processRates:pr});
  };
  const updFactSetting=(idx,field,val)=>{
    const fs=[...costMaster.factorySettings];
    fs[idx]={...fs[idx],[field]:val};
    setCostMaster({...costMaster,factorySettings:fs});
  };
  const syncProcessRates=()=>{
    const existing=costMaster.processRates;
    const synced=processes.map(p=>{
      const ex=existing.find(r=>r.processCode===p.code);
      return ex||{processCode:p.code,processName:p.name,ratePerHour:26000,stdHoursPerUnit:0};
    });
    setCostMaster({...costMaster,processRates:synced});
    showToast("공정 목록과 동기화 완료");
  };
  const syncFactorySettings=()=>{
    const existing=costMaster.factorySettings;
    const synced=factories.map(f=>{
      const ex=existing.find(s=>s.factoryCode===f.code);
      return ex||{factoryCode:f.code,monthlyCapacity:1000,depreciation:0,utilities:0};
    });
    setCostMaster({...costMaster,factorySettings:synced});
    showToast("공장 목록과 동기화 완료");
  };

  // ── 원가계산 ──
  const selBom=bom.find(b=>b.code===selBomCode)||bom[0]||null;
  const selFactory=factories.find(f=>f.code===selFactoryCode)||null;
  const selFactSetting=costMaster.factorySettings.find(s=>s.factoryCode===selFactoryCode)||{monthlyCapacity:1000,depreciation:0,utilities:0};

  // 재료비
  const materials=(selBom?.materials||[]).map(m=>{
    const it=items.find(i=>i.code===m.code);
    const unitPrice=it?.price||0;
    return{...m,unitPrice,total:unitPrice*m.qty};
  });
  const materialTotal=materials.reduce((s,m)=>s+m.total,0);
  const missingPrice=materials.filter(m=>m.unitPrice===0);

  // 인건비: 완제품 item의 processes → 각 공정 × stdHoursPerUnit × ratePerHour
  const calcItem=selBom?items.find(i=>i.code===selBom.product):null;
  const itemProcCodes=calcItem?.processes||[];
  const laborRows=itemProcCodes.map(pc=>{
    const proc=processes.find(p=>p.code===pc);
    const master=costMaster.processRates.find(r=>r.processCode===pc);
    const rate=master?.ratePerHour||0;
    const stdH=master?.stdHoursPerUnit||0;
    const cost=Math.round(rate*stdH);
    return{code:pc,name:proc?.name||pc,rate,stdH,cost};
  });
  const laborTotal=laborRows.reduce((s,r)=>s+r.cost,0);

  // 제조경비: 공장 고정비 ÷ 월 생산용량
  const cap=selFactSetting.monthlyCapacity||1;
  const rentH=selFactory?Math.round(selFactory.monthlyRent/selFactory.workDays/selFactory.hoursPerDay):0;
  const cleanH=selFactory?Math.round(selFactory.monthlyCleanroom/selFactory.workDays/selFactory.hoursPerDay):0;
  const totalFixedPerMonth=(selFactory?(selFactory.monthlyRent+selFactory.monthlyCleanroom):0)+(selFactSetting.depreciation||0)+(selFactSetting.utilities||0);
  const mfgCostPerUnit=selFactSetting.monthlyCapacity>0?Math.round(totalFixedPerMonth/selFactSetting.monthlyCapacity):0;
  const grandTotal=materialTotal+laborTotal+mfgCostPerUnit;

  const doExport=()=>{
    if(!selBom) return;
    const rows=[["구분","항목","단위수량/시간","단가","비용"]];
    materials.forEach(m=>rows.push(["재료비",m.name,m.qty,m.unitPrice,m.total]));
    rows.push(["재료비 합계","","","",materialTotal]);
    laborRows.forEach(r=>rows.push(["인건비",r.name,r.stdH+"h",r.rate,r.cost]));
    rows.push(["인건비 합계","","","",laborTotal]);
    rows.push(["제조경비","공장고정비/월생산량",selFactSetting.monthlyCapacity,"",mfgCostPerUnit]);
    rows.push(["총 원가","","","",grandTotal]);
    downloadCSV(rows[0],rows.slice(1),"원가계산.csv");
  };

  return(
    <div>
      <div className="page-header">
        <div><div className="page-title">원가 관리</div><div className="page-sub">원가마스터(인건비·공장설정) 관리 및 BOM 기반 정확한 원가 계산</div></div>
        {activeTab==="calc"&&<button className="btn btn-outline" onClick={doExport}>📥 엑셀 다운로드</button>}
      </div>

      <div className="tabs">
        <div className={`tab${activeTab==="calc"?" active":""}`} onClick={()=>setActiveTab("calc")}>💰 원가 계산</div>
        <div className={`tab${activeTab==="master"?" active":""}`} onClick={()=>setActiveTab("master")}>📋 원가 마스터</div>
      </div>

      {/* ── 탭1: 원가계산 ── */}
      {activeTab==="calc"&&(
        <div>
          {!bom.length&&<div className="empty" style={{padding:60,background:"#fff",borderRadius:10}}>BOM을 먼저 등록해야 원가 계산이 가능합니다.</div>}
          {bom.length>0&&(
            <>
              {/* 선택 바 */}
              <div style={{display:"flex",gap:16,alignItems:"center",marginBottom:16,background:"#fff",borderRadius:10,padding:"12px 18px",boxShadow:"0 1px 3px rgba(0,0,0,0.07)"}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:13,fontWeight:600,color:"#555"}}>완제품:</span>
                  <select value={selBomCode} onChange={e=>setSelBomCode(e.target.value)} style={{border:"1px solid #ddd",borderRadius:6,padding:"5px 10px",fontSize:13}}>
                    {bom.map(b=><option key={b.code} value={b.code}>{b.productName}</option>)}
                  </select>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:13,fontWeight:600,color:"#555"}}>공장:</span>
                  <select value={selFactoryCode} onChange={e=>setSelFactoryCode(e.target.value)} style={{border:"1px solid #ddd",borderRadius:6,padding:"5px 10px",fontSize:13}}>
                    {factories.map(f=><option key={f.code} value={f.code}>{f.name}</option>)}
                  </select>
                </div>
                {missingPrice.length>0&&<span style={{fontSize:12,color:"#e74c3c",fontWeight:600}}>⚠️ 단가 미입력 {missingPrice.length}개</span>}
              </div>

              {/* 재료비 */}
              <div className="panel" style={{marginBottom:14}}>
                <div className="panel-top"><b>🧪 재료비</b><span style={{fontSize:12,color:"#888"}}>BOM × 품목 단가 &nbsp;|&nbsp; 합계: <b style={{color:"#2563eb"}}>{materialTotal.toLocaleString()}원</b></span></div>
                <table>
                  <thead><tr><th style={th}>자재명</th><th style={th}>코드</th><th style={{...th,textAlign:"right"}}>수량</th><th style={th}>단위</th><th style={{...th,textAlign:"right"}}>단가</th><th style={{...th,textAlign:"right"}}>비용</th></tr></thead>
                  <tbody>
                    {materials.map((m,i)=><tr key={i}>
                      <td><b>{m.name}</b></td><td style={{color:"#888",fontSize:12}}>{m.code}</td>
                      <td style={{textAlign:"right"}}>{m.qty}</td><td>{m.unit}</td>
                      <td style={{textAlign:"right",color:m.unitPrice===0?"#e74c3c":"#2563eb",fontWeight:600}}>{m.unitPrice===0?"미입력":m.unitPrice.toLocaleString()}</td>
                      <td style={{textAlign:"right",fontWeight:600}}>{m.total>0?m.total.toLocaleString():"-"}</td>
                    </tr>)}
                    {!materials.length&&<tr><td colSpan={6} className="empty">BOM에 자재 없음</td></tr>}
                    <tr style={{background:"#dbeafe",fontWeight:700}}>
                      <td colSpan={5} style={{textAlign:"right",paddingRight:14}}>재료비 합계</td>
                      <td style={{textAlign:"right",color:"#2563eb",fontSize:14}}>{materialTotal.toLocaleString()}</td>
                    </tr>
                  </tbody>
                </table>
              </div>

              {/* 인건비 */}
              <div className="panel" style={{marginBottom:14}}>
                <div className="panel-top"><b>👷 인건비</b><span style={{fontSize:12,color:"#888"}}>품목에 설정된 공정 × 원가마스터 단가 &nbsp;|&nbsp; 합계: <b style={{color:"#16a34a"}}>{laborTotal.toLocaleString()}원</b></span></div>
                {laborRows.length===0&&<div className="empty" style={{padding:24}}>품목 관리에서 완제품에 투입 공정을 설정하고, 원가마스터에서 공정별 단가·표준시간을 입력하세요</div>}
                {laborRows.length>0&&<table>
                  <thead><tr><th style={th}>공정명</th><th style={{...th,textAlign:"right"}}>표준시간/EA</th><th style={{...th,textAlign:"right"}}>시간당 단가</th><th style={{...th,textAlign:"right"}}>비용</th></tr></thead>
                  <tbody>
                    {laborRows.map((r,i)=><tr key={i}>
                      <td><b>{r.name}</b></td>
                      <td style={{textAlign:"right",color:r.stdH===0?"#e74c3c":"inherit"}}>{r.stdH===0?"미설정":r.stdH+"h"}</td>
                      <td style={{textAlign:"right",color:r.rate===0?"#e74c3c":"inherit"}}>{r.rate===0?"미설정":r.rate.toLocaleString()+"원"}</td>
                      <td style={{textAlign:"right",fontWeight:600,color:r.cost===0?"#aaa":"inherit"}}>{r.cost===0?"-":r.cost.toLocaleString()}</td>
                    </tr>)}
                    <tr style={{background:"#dcfce7",fontWeight:700}}>
                      <td colSpan={3} style={{textAlign:"right",paddingRight:14}}>인건비 합계</td>
                      <td style={{textAlign:"right",color:"#16a34a",fontSize:14}}>{laborTotal.toLocaleString()}</td>
                    </tr>
                  </tbody>
                </table>}
              </div>

              {/* 제조경비 */}
              <div className="panel" style={{marginBottom:14}}>
                <div className="panel-top"><b>🏭 제조경비</b><span style={{fontSize:12,color:"#888"}}>공장 고정비 ÷ 월 생산용량 &nbsp;|&nbsp; 단위당: <b style={{color:"#d97706"}}>{mfgCostPerUnit.toLocaleString()}원</b></span></div>
                <table>
                  <thead><tr><th style={th}>항목</th><th style={{...th,textAlign:"right"}}>월 금액</th><th style={{...th,textAlign:"right"}}>월 생산용량</th><th style={{...th,textAlign:"right"}}>단위당 비용</th></tr></thead>
                  <tbody>
                    <tr><td>임차료</td><td style={{textAlign:"right"}}>{selFactory?(selFactory.monthlyRent).toLocaleString():"-"}</td><td rowSpan={4} style={{textAlign:"right",verticalAlign:"middle",fontSize:16,fontWeight:700,color:"#2563eb"}}>{selFactSetting.monthlyCapacity.toLocaleString()} EA</td><td rowSpan={4} style={{textAlign:"right",verticalAlign:"middle",fontSize:16,fontWeight:700,color:"#d97706"}}>{mfgCostPerUnit.toLocaleString()} 원</td></tr>
                    <tr><td>청정실 운영비</td><td style={{textAlign:"right"}}>{selFactory?(selFactory.monthlyCleanroom).toLocaleString():"-"}</td></tr>
                    <tr><td>감가상각비</td><td style={{textAlign:"right"}}>{(selFactSetting.depreciation||0).toLocaleString()}</td></tr>
                    <tr><td>유틸리티비</td><td style={{textAlign:"right"}}>{(selFactSetting.utilities||0).toLocaleString()}</td></tr>
                    <tr style={{background:"#fef3c7",fontWeight:700}}>
                      <td>합계</td><td style={{textAlign:"right"}}>{totalFixedPerMonth.toLocaleString()}</td>
                      <td colSpan={2} style={{textAlign:"right",color:"#d97706",fontSize:14}}>단위당 {mfgCostPerUnit.toLocaleString()} 원</td>
                    </tr>
                  </tbody>
                </table>
              </div>

              {/* 총 원가 */}
              <div className="panel">
                <table><tbody>
                  <tr style={{background:"#eff6ff"}}><td style={{fontWeight:600,padding:"11px 18px"}}>재료비</td><td style={{textAlign:"right",padding:"11px 18px",fontWeight:700,color:"#2563eb",fontSize:14}}>{materialTotal.toLocaleString()} 원</td></tr>
                  <tr style={{background:"#f0fdf4"}}><td style={{fontWeight:600,padding:"11px 18px"}}>인건비</td><td style={{textAlign:"right",padding:"11px 18px",fontWeight:700,color:"#16a34a",fontSize:14}}>{laborTotal.toLocaleString()} 원</td></tr>
                  <tr style={{background:"#fffbeb"}}><td style={{fontWeight:600,padding:"11px 18px"}}>제조경비</td><td style={{textAlign:"right",padding:"11px 18px",fontWeight:700,color:"#d97706",fontSize:14}}>{mfgCostPerUnit.toLocaleString()} 원</td></tr>
                  <tr style={{background:"#1a2236"}}>
                    <td style={{fontWeight:700,padding:"14px 18px",color:"#fff",fontSize:15}}>총 원가 (단위당)</td>
                    <td style={{textAlign:"right",padding:"14px 18px",color:"#facc15",fontWeight:700,fontSize:20}}>{grandTotal.toLocaleString()} 원</td>
                  </tr>
                </tbody></table>
              </div>
            </>
          )}
        </div>
      )}

      {/* ── 탭2: 원가마스터 ── */}
      {activeTab==="master"&&(
        <div>
          {/* 공정별 인건비 */}
          <div className="panel" style={{marginBottom:16}}>
            <div className="panel-top">
              <b>👷 공정별 인건비 마스터</b>
              <button className="btn btn-outline btn-sm" onClick={syncProcessRates}>🔄 공정 목록 동기화</button>
            </div>
            {costMaster.processRates.length===0&&<div className="empty" style={{padding:24}}>위 "공정 목록 동기화" 버튼을 눌러 공정 관리의 공정을 불러오세요</div>}
            {costMaster.processRates.length>0&&<table>
              <thead><tr>
                <th style={th}>공정코드</th><th style={th}>공정명</th>
                <th style={{...th,textAlign:"right"}}>시간당 인건비 (원/h)</th>
                <th style={{...th,textAlign:"right"}}>단위당 표준시간 (h/EA)</th>
                <th style={{...th,textAlign:"right"}}>단위당 인건비</th>
              </tr></thead>
              <tbody>{costMaster.processRates.map((r,i)=>(
                <tr key={i}>
                  <td style={{color:"#888",fontSize:12}}>{r.processCode}</td>
                  <td><b>{r.processName}</b></td>
                  <td style={{textAlign:"right"}}>
                    <input type="number" value={r.ratePerHour} onChange={e=>updProcRate(i,"ratePerHour",+e.target.value)}
                      style={{width:110,border:"1px solid #ddd",borderRadius:5,padding:"4px 8px",fontSize:13,textAlign:"right"}}/>
                  </td>
                  <td style={{textAlign:"right"}}>
                    <input type="number" value={r.stdHoursPerUnit} onChange={e=>updProcRate(i,"stdHoursPerUnit",+e.target.value)}
                      style={{width:90,border:"1px solid #ddd",borderRadius:5,padding:"4px 8px",fontSize:13,textAlign:"right"}}/>
                  </td>
                  <td style={{textAlign:"right",fontWeight:600,color:"#16a34a"}}>{Math.round(r.ratePerHour*r.stdHoursPerUnit).toLocaleString()} 원</td>
                </tr>
              ))}</tbody>
            </table>}
          </div>

          {/* 공장별 제조경비 설정 */}
          <div className="panel">
            <div className="panel-top">
              <b>🏭 공장별 제조경비 설정</b>
              <button className="btn btn-outline btn-sm" onClick={syncFactorySettings}>🔄 공장 목록 동기화</button>
            </div>
            <div style={{padding:"8px 18px",fontSize:12,color:"#888",borderBottom:"1px solid #f0f0f0"}}>임차료·청정실비는 공장 관리에서 설정 | 아래에서 추가 비용 및 월 생산용량 설정</div>
            {costMaster.factorySettings.length===0&&<div className="empty" style={{padding:24}}>공장 목록 동기화를 먼저 실행하세요</div>}
            {costMaster.factorySettings.length>0&&<table>
              <thead><tr>
                <th style={th}>공장명</th>
                <th style={{...th,textAlign:"right"}}>임차료/월</th>
                <th style={{...th,textAlign:"right"}}>청정실비/월</th>
                <th style={{...th,textAlign:"right"}}>감가상각비/월</th>
                <th style={{...th,textAlign:"right"}}>유틸리티비/월</th>
                <th style={{...th,textAlign:"right"}}>월 생산용량(EA)</th>
                <th style={{...th,textAlign:"right"}}>단위당 고정비</th>
              </tr></thead>
              <tbody>{costMaster.factorySettings.map((s,i)=>{
                const f=factories.find(x=>x.code===s.factoryCode);
                const fixedMonth=(f?(f.monthlyRent+f.monthlyCleanroom):0)+(s.depreciation||0)+(s.utilities||0);
                const perUnit=s.monthlyCapacity>0?Math.round(fixedMonth/s.monthlyCapacity):0;
                return<tr key={i}>
                  <td><b>{f?.name||s.factoryCode}</b></td>
                  <td style={{textAlign:"right",color:"#888"}}>{f?f.monthlyRent.toLocaleString():"-"}</td>
                  <td style={{textAlign:"right",color:"#888"}}>{f?f.monthlyCleanroom.toLocaleString():"-"}</td>
                  <td style={{textAlign:"right"}}>
                    <input type="number" value={s.depreciation||0} onChange={e=>updFactSetting(i,"depreciation",+e.target.value)}
                      style={{width:100,border:"1px solid #ddd",borderRadius:5,padding:"4px 8px",fontSize:12,textAlign:"right"}}/>
                  </td>
                  <td style={{textAlign:"right"}}>
                    <input type="number" value={s.utilities||0} onChange={e=>updFactSetting(i,"utilities",+e.target.value)}
                      style={{width:100,border:"1px solid #ddd",borderRadius:5,padding:"4px 8px",fontSize:12,textAlign:"right"}}/>
                  </td>
                  <td style={{textAlign:"right"}}>
                    <input type="number" value={s.monthlyCapacity||0} onChange={e=>updFactSetting(i,"monthlyCapacity",+e.target.value)}
                      style={{width:100,border:"1px solid #ddd",borderRadius:5,padding:"4px 8px",fontSize:12,textAlign:"right"}}/>
                  </td>
                  <td style={{textAlign:"right",fontWeight:700,color:"#d97706"}}>{perUnit.toLocaleString()} 원</td>
                </tr>;
              })}</tbody>
            </table>}
          </div>
        </div>
      )}
    </div>
  );
}

function FactoryPage({factories, setFactories, perm, showToast}) {
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({code:"",name:"",monthlyRent:0,monthlyCleanroom:0,workDays:30,hoursPerDay:8});
  const openAdd = () => { setForm({code:"",name:"",monthlyRent:0,monthlyCleanroom:0,workDays:30,hoursPerDay:8}); setModal("add"); };
  const save = () => {
    if(!form.code||!form.name){showToast("코드와 공장명은 필수입니다.");return;}
    if(modal==="add"){
      if(factories.find(f=>f.code===form.code)){showToast("이미 존재하는 코드입니다.");return;}
      setFactories([...factories,form]);
    } else { setFactories(factories.map(f=>f.code===form.code?form:f)); }
    showToast("저장되었습니다."); setModal(null);
  };
  const del = (code) => { setFactories(factories.filter(f=>f.code!==code)); showToast("삭제되었습니다."); };
  return (
    <div>
      <div className="page-header">
        <div><div className="page-title">공장 관리</div><div className="page-sub">공장별 임차료·청정실 단가 관리 (원가계산 자동 연동)</div></div>
        {perm.canAdmin&&<button className="btn btn-primary" onClick={openAdd}>+ 공장 등록</button>}
      </div>
      <div className="panel">
        <table>
          <thead><tr><th>공장코드</th><th>공장명</th><th style={{textAlign:"right"}}>월 임차료</th><th style={{textAlign:"right"}}>1일 임차료</th><th style={{textAlign:"right"}}>1시간 임차료</th><th style={{textAlign:"right"}}>월 청정실비</th><th style={{textAlign:"right"}}>1시간 청정실비</th><th>월 근무일</th><th>일 근무시간</th><th>관리</th></tr></thead>
          <tbody>
            {factories.map(f=>{
              const rentDay = Math.round(f.monthlyRent/f.workDays);
              const rentHour = Math.round(f.monthlyRent/f.workDays/f.hoursPerDay);
              const cleanHour = Math.round(f.monthlyCleanroom/f.workDays/f.hoursPerDay);
              return (
                <tr key={f.code}>
                  <td>{f.code}</td><td><b>{f.name}</b></td>
                  <td style={{textAlign:"right"}}>{f.monthlyRent.toLocaleString()}</td>
                  <td style={{textAlign:"right"}}>{rentDay.toLocaleString()}</td>
                  <td style={{textAlign:"right",color:"#2563eb",fontWeight:600}}>{rentHour.toLocaleString()}</td>
                  <td style={{textAlign:"right"}}>{f.monthlyCleanroom.toLocaleString()}</td>
                  <td style={{textAlign:"right",color:"#2563eb",fontWeight:600}}>{cleanHour.toLocaleString()}</td>
                  <td style={{textAlign:"center"}}>{f.workDays}일</td>
                  <td style={{textAlign:"center"}}>{f.hoursPerDay}h</td>
                  <td style={{display:"flex",gap:4}}>
                    {perm.canAdmin&&<button className="btn btn-outline btn-sm" onClick={()=>{setForm({...f});setModal("edit");}}>수정</button>}
                    {perm.canAdmin&&<button className="btn btn-danger btn-sm" onClick={()=>del(f.code)}>삭제</button>}
                  </td>
                </tr>
              );
            })}
            {!factories.length&&<tr><td colSpan={10} className="empty">등록된 공장 없음</td></tr>}
          </tbody>
        </table>
      </div>
      {modal&&(
        <div className="overlay" onClick={()=>setModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-head"><span className="modal-title">{modal==="add"?"공장 등록":"공장 수정"}</span><button className="modal-close" onClick={()=>setModal(null)}>✕</button></div>
            <div className="modal-body">
              <div className="field-row">
                <div className="field"><label>공장코드 *</label><input value={form.code} onChange={e=>setForm({...form,code:e.target.value})} disabled={modal==="edit"}/></div>
                <div className="field"><label>공장명 *</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></div>
              </div>
              <div className="field-row">
                <div className="field"><label>월 임차료 (원)</label><input type="number" value={form.monthlyRent} onChange={e=>setForm({...form,monthlyRent:+e.target.value})}/></div>
                <div className="field"><label>월 청정실 운영비 (원)</label><input type="number" value={form.monthlyCleanroom} onChange={e=>setForm({...form,monthlyCleanroom:+e.target.value})}/></div>
              </div>
              <div className="field-row">
                <div className="field"><label>월 근무일수</label><input type="number" value={form.workDays} onChange={e=>setForm({...form,workDays:+e.target.value})}/></div>
                <div className="field"><label>1일 근무시간</label><input type="number" value={form.hoursPerDay} onChange={e=>setForm({...form,hoursPerDay:+e.target.value})}/></div>
              </div>
              {form.monthlyRent>0&&form.workDays>0&&form.hoursPerDay>0&&(
                <div style={{background:"#eff6ff",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#2563eb"}}>
                  계산 결과 → 1일 임차료: <b>{Math.round(form.monthlyRent/form.workDays).toLocaleString()}원</b> &nbsp;|&nbsp; 1시간: <b>{Math.round(form.monthlyRent/form.workDays/form.hoursPerDay).toLocaleString()}원</b>
                  {form.monthlyCleanroom>0&&<> &nbsp;|&nbsp; 청정실 1h: <b>{Math.round(form.monthlyCleanroom/form.workDays/form.hoursPerDay).toLocaleString()}원</b></>}
                </div>
              )}
            </div>
            <div className="modal-foot"><button className="btn btn-outline" onClick={()=>setModal(null)}>취소</button><button className="btn btn-primary" onClick={save}>저장</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

function UserPage({users, setUsers, currentUser, showToast}) {
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({id:"",pw:"",name:"",role:"viewer"});
  const roleLabel = {admin:"관리자",manager:"담당자",viewer:"조회자"};
  const roleBadge = {admin:"badge-blue",manager:"badge-green",viewer:"badge-gray"};

  const openAdd = () => { setForm({id:"",pw:"",name:"",role:"viewer"}); setModal("add"); };
  const save = () => {
    if(!form.id||!form.pw||!form.name){showToast("아이디, 비밀번호, 이름은 필수입니다.");return;}
    if(modal==="add"){
      if(users.find(u=>u.id===form.id)){showToast("이미 존재하는 아이디입니다.");return;}
      setUsers([...users,form]);
    } else {
      setUsers(users.map(u=>u.id===form.id?form:u));
    }
    showToast("저장되었습니다."); setModal(null);
  };
  const del = (id) => {
    if(id===currentUser.id){showToast("현재 로그인된 계정은 삭제할 수 없습니다.");return;}
    setUsers(users.filter(u=>u.id!==id));
    showToast("삭제되었습니다.");
  };

  return (
    <div>
      <div className="page-header">
        <div><div className="page-title">사용자 관리</div><div className="page-sub">로그인 계정 및 권한 관리</div></div>
        <button className="btn btn-primary" onClick={openAdd}>+ 사용자 추가</button>
      </div>

      <div className="panel" style={{marginBottom:16}}>
        <div className="panel-top"><b>권한 안내</b></div>
        <table>
          <thead><tr><th>역할</th><th>조회</th><th>등록/수정</th><th>삭제</th><th>사용자·공장 관리</th></tr></thead>
          <tbody>
            <tr><td><span className="badge badge-blue">관리자 (admin)</span></td><td>✅</td><td>✅</td><td>✅</td><td>✅</td></tr>
            <tr><td><span className="badge badge-green">담당자 (manager)</span></td><td>✅</td><td>✅</td><td>❌</td><td>❌</td></tr>
            <tr><td><span className="badge badge-gray">조회자 (viewer)</span></td><td>✅</td><td>❌</td><td>❌</td><td>❌</td></tr>
          </tbody>
        </table>
      </div>

      <div className="panel">
        <table>
          <thead><tr><th>아이디</th><th>이름</th><th>역할</th><th>관리</th></tr></thead>
          <tbody>
            {users.map(u=>(
              <tr key={u.id}>
                <td><b>{u.id}</b>{u.id===currentUser.id&&<span style={{fontSize:11,color:"#2563eb",marginLeft:6}}>(현재 계정)</span>}</td>
                <td>{u.name}</td>
                <td><span className={`badge ${roleBadge[u.role]}`}>{roleLabel[u.role]}</span></td>
                <td style={{display:"flex",gap:4}}>
                  <button className="btn btn-outline btn-sm" onClick={()=>{setForm({...u,pw:u.pw});setModal("edit");}}>수정</button>
                  <button className="btn btn-danger btn-sm" onClick={()=>del(u.id)} disabled={u.id===currentUser.id}>삭제</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {modal&&(
        <div className="overlay" onClick={()=>setModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <span className="modal-title">{modal==="add"?"사용자 추가":"사용자 수정"}</span>
              <button className="modal-close" onClick={()=>setModal(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div className="field-row">
                <div className="field"><label>아이디 *</label><input value={form.id} onChange={e=>setForm({...form,id:e.target.value})} disabled={modal==="edit"} placeholder="로그인 ID"/></div>
                <div className="field"><label>이름 *</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="표시 이름"/></div>
              </div>
              <div className="field-row">
                <div className="field"><label>비밀번호 *</label><input type="password" value={form.pw} onChange={e=>setForm({...form,pw:e.target.value})} placeholder="비밀번호"/></div>
                <div className="field">
                  <label>역할 (권한)</label>
                  <select value={form.role} onChange={e=>setForm({...form,role:e.target.value})}>
                    <option value="admin">관리자 - 모든 기능</option>
                    <option value="manager">담당자 - 등록/수정 가능</option>
                    <option value="viewer">조회자 - 조회만 가능</option>
                  </select>
                </div>
              </div>
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={()=>setModal(null)}>취소</button>
              <button className="btn btn-primary" onClick={save}>저장</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
