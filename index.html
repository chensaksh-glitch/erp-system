            {!filtered.length&&<tr><td colSpan={12} className="empty">{shipments.length?"해당 조건의 출하 없음":"출하 기록 없음"}</td></tr>}
          </tbody>
        </table>
      </div>

      {modal&&(
        <div className="overlay"><div className="modal" style={{width:580}} onClick={e=>e.stopPropagation()}>
          <div className="modal-head">
            <span className="modal-title">출하 {modal==="add"?"등록":"수정"}</span>
            <button className="modal-close" onClick={()=>setModal(null)}>✕</button>
          </div>
          <div className="modal-body">
            <div className="field-row">
              <div className="field"><label>출하번호</label><input value={form.code} disabled/></div>
              <div className="field"><label>출하일 *</label><input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
            </div>
            <div className="field"><label>거래처 *</label>
              <input value={form.customer} onChange={e=>setForm(f=>({...f,customer:e.target.value}))} placeholder="거래처명 입력" list="customer-list"/>
              <datalist id="customer-list">{customers.map(c=><option key={c} value={c}/>)}</datalist>
            </div>
            <div className="field" style={{position:"relative"}}>
              <label>완제품 *</label>
              <input value={codeInput} onChange={e=>{setCodeInput(e.target.value);const it=finishedItems.find(i=>i.code===e.target.value);if(it) pickItem(it.code);else setForm(f=>({...f,item:"",itemName:""}));}} placeholder="품목코드 또는 제품명" autoComplete="off"/>
              {codeInput&&!form.item&&(()=>{
                const hits=finishedItems.filter(i=>i.code.toLowerCase().includes(codeInput.toLowerCase())||i.name.toLowerCase().includes(codeInput.toLowerCase()));
                return hits.length>0?(
                  <div style={{position:"absolute",top:"100%",left:0,right:0,background:"#fff",border:"1px solid #2f6df0",borderRadius:6,boxShadow:"0 4px 12px rgba(0,0,0,0.12)",zIndex:300,maxHeight:180,overflowY:"auto"}}>
                    {hits.map(i=>(
                      <div key={i.code} onClick={()=>{pickItem(i.code);setCodeInput(i.code);}} style={{padding:"8px 12px",cursor:"pointer",borderBottom:"1px solid #f0f0f0",fontSize:13}}
                        onMouseEnter={e=>e.currentTarget.style.background="#eff6ff"} onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
                        <b>{i.code}</b> — {i.name} <span style={{fontSize:11,color:"#888"}}>(재고 {fmt3(i.stock)})</span>
                      </div>
                    ))}
                  </div>):null;
              })()}
            </div>
            <div className="field-row">
              <div className="field"><label>LOT 선택</label>
                <select value={form.lot} onChange={e=>setForm(f=>({...f,lot:e.target.value}))}>
                  <option value="">LOT 없이 출하</option>
                  {availableLots.map(l=><option key={l.code} value={l.code}>{l.code} (재고 {fmt3(l.qty)})</option>)}
                </select>
              </div>
              <div className="field"><label>수량 *</label><input type="number" value={form.qty} onChange={e=>setForm(f=>({...f,qty:+e.target.value}))}/></div>
            </div>
            <div className="field-row">
              <div className="field"><label>단가</label><input type="number" value={form.unitPrice} onChange={e=>setForm(f=>({...f,unitPrice:+e.target.value}))}/></div>
              <div className="field"><label>담당자</label><input value={form.manager} onChange={e=>setForm(f=>({...f,manager:e.target.value}))}/></div>
            </div>
            <div className="field"><label>비고</label><input value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))}/></div>
          </div>
          <div className="modal-foot">
            <button className="btn btn-outline" onClick={()=>setModal(null)}>취소</button>
            <button className="btn btn-primary" onClick={save}>저장</button>
          </div>
        </div></div>
      )}
    </div>
  );
}

function OrdersLedgerPage({ordersLedger,setOrdersLedger,items,currentUser,perm,showToast,navSearch,onNavConsumed}) {
  const today = new Date().toISOString().slice(0,10);
  const ym = today.slice(0,7);
  const [filterYm, setFilterYm] = useState(ym);
  const [q, setQ] = useState("");
  // 전체검색에서 주문 클릭 시 해당 주문으로 필터 (1회 소비, 월 필터 해제해 다른 달도 노출)
  useEffect(()=>{ if(navSearch&&navSearch.pg==="ordersLedger"){ setQ(navSearch.v); setFilterYm(""); onNavConsumed&&onNavConsumed(); } },[navSearch]);
  const [modal, setModal] = useState(null);
  const [viewDetail, setViewDetail] = useState(null);
  const [prodQuery, setProdQuery] = useState(null);       // 품명 검색어 (null=검색중 아님)
  const [seqNo, setSeqNo] = useState(null);               // 모달 표시용 순번
  const [view, setView] = useState(0);                    // 0=대장형(SOP 테이블), 1=진행 보드(칸반)
  const finishedItems = (items||[]).filter(i=>i.type==="완제품"||i.type==="반제품");
  const emptyForm = {no:0,date:today,receiver:currentUser?.name||"",client:"",orderNo:"",product:"",spec:"",desc:"",qty:1,dueDate:"N/A",paymentTerms:"N/A",requirements:"N/A",customerReq:"이상없음",feasible:"O",deliveryStatus:"대기",deliveryDate:"",note:"",taxInvoice:""};
  const [form, setForm] = useState(emptyForm);

  // ── 납품상태 (구버전 데이터는 납품일자 유무로 자동 보정) ──
  const effStatus = (r) => r.deliveryStatus || (r.deliveryDate ? "납품완료" : "대기");
  const statusBadge = (s) => s==="납품완료"?"badge-green":s==="진행중"?"badge-orange":"badge-gray";

  const genOrderNo = (dateStr) => {
    const d = dateStr||today;
    const yy = d.slice(2,4); const mm = d.slice(5,7);
    const prefix = `IO${yy}${mm}`;
    const existing = ordersLedger.filter(r=>r.orderNo.startsWith(prefix));
    const next = String(existing.length+1).padStart(3,"0");
    return `${prefix}${next}`;
  };

  const filtered = ordersLedger.filter(r=>{
    const matchYm = !filterYm || r.date.startsWith(filterYm);
    const matchQ = !q || r.client.includes(q)||r.product.includes(q)||r.orderNo.includes(q)||r.receiver.includes(q);
    return matchYm && matchQ;
  });

  const openAdd = () => {
    const newNo = ordersLedger.length>0 ? Math.max(...ordersLedger.map(r=>r.no))+1 : 1;
    const orderNo = genOrderNo(today);
    setForm({...emptyForm, no:newNo, orderNo, date:today, receiver:currentUser?.name||""});
    setSeqNo(ordersLedger.length+1);   // 화면 표시용 순번 (저장 데이터 아님)
    setModal("add");
  };
  const openEdit = (r, seq) => {
    setForm({...r});
    setSeqNo(seq ?? ((filtered.findIndex(x=>x.no===r.no)+1)||r.no));
    setModal("edit");
  };

  const save = () => {
    if(!form.client||!form.product){showToast("거래처명과 품명은 필수입니다.");return;}
    if(form.deliveryStatus==="납품완료"&&!form.deliveryDate){showToast("납품완료 상태는 납품완료일을 입력해야 합니다.");return;}
    if(modal==="add"){
      setOrdersLedger([...ordersLedger, form]);
    } else {
      setOrdersLedger(ordersLedger.map(r=>r.no===form.no?form:r));
    }
    showToast("저장되었습니다."); setModal(null);
  };

  const del = (no) => {
    setOrdersLedger(ordersLedger.filter(r=>r.no!==no));
    showToast("삭제되었습니다.");
  };

  const feasibleBadge = (v) => v==="O"?"badge-green":v==="△"?"badge-orange":"badge-red";

  // ── 엑셀 다운로드 (ExcelJS - 원본 서식 동일) ──
  const downloadExcel = async () => {
    const EJ = window.ExcelJS;
    if(!EJ){ showToast("ExcelJS 로딩 중입니다. 잠시 후 다시 시도해주세요."); return; }
    const wb = new EJ.Workbook();
    wb.creator = "MedERP"; wb.created = new Date();
    const ws = wb.addWorksheet("주문관리대장");

    // ── 열 너비 (세금계산서 제외 16열) ──
    ws.columns = [
      {width:5.5},{width:14},{width:12},{width:22},
      {width:15},{width:17},{width:11},{width:27},
      {width:7},{width:13},{width:11},{width:15},
      {width:12},{width:9},{width:13},{width:15}
    ];

    const grayFill  = { type:"pattern", pattern:"solid", fgColor:{argb:"FFD9D9D9"} };  // #D9D9D9 원본 그레이
    const whiteFill = { type:"pattern", pattern:"solid", fgColor:{argb:"FFFFFFFF"} };
    const altFill   = whiteFill; // 모든 행 흰색
    const border    = { top:{style:"thin",color:{argb:"FF000000"}}, left:{style:"thin",color:{argb:"FF000000"}}, bottom:{style:"thin",color:{argb:"FF000000"}}, right:{style:"thin",color:{argb:"FF000000"}} };
    const borderMed = { top:{style:"medium",color:{argb:"FF000000"}}, left:{style:"medium",color:{argb:"FF000000"}}, bottom:{style:"medium",color:{argb:"FF000000"}}, right:{style:"medium",color:{argb:"FF000000"}} };
    const boldFont  = { name:"맑은 고딕", bold:true, size:8, color:{argb:"FF000000"} };
    const bodyFont  = { name:"맑은 고딕", size:7, color:{argb:"FF000000"} };
    const titleFont = { name:"맑은 고딕", bold:true, size:14, color:{argb:"FF000000"} };
    const noteFont  = { name:"맑은 고딕", size:8, color:{argb:"FF000000"} };
    const centerM   = { horizontal:"center", vertical:"middle", wrapText:true };
    const leftM     = { horizontal:"left",   vertical:"middle", wrapText:true };

    // ── 페이지 설정: 가로(Landscape) A4 ──
    ws.pageSetup = {

    noteCell.font  = noteFont;
    noteCell.alignment = leftM;
    noteCell.fill  = whiteFill;
    noteCell.border = border;

    // ── Row5: 헤더 1단 ──
    ws.getRow(5).height = 20;
    const h5 = [
      { cell:"A5", merge:"A5:A6", value:"No." },
      { cell:"B5", merge:"B5:B6", value:"접수일자" },
      { cell:"C5", merge:"C5:C6", value:"접수자" },
      { cell:"D5", merge:"D5:D6", value:"거래처명/국가" },
      { cell:"E5", merge:"E5:L5", value:"주 문 사 항" },
      { cell:"M5", merge:"M5:N5", value:"검토사항" },
      { cell:"O5", merge:"O5:O6", value:"납품 일자" },

    h5.forEach(({cell,merge,value})=>{
      ws.mergeCells(merge);
      const c=ws.getCell(cell);
      c.value=value; c.font=boldFont; c.fill=grayFill;
      c.alignment=centerM; c.border=border;

    // ── Row6: 헤더 2단 ──
    ws.getRow(6).height = 30;
    const h6cols = [
      {col:5,v:"주문번호"},{col:6,v:"품 명"},{col:7,v:"규 격"},{col:8,v:"내 용"},
      {col:9,v:"수량"},{col:10,v:"납기요청일"},{col:11,v:"지불 조건"},{col:12,v:"기타 요구사항"},
      {col:13,v:"고객요구사항"},{col:14,v:"납품가능\n여부"},
    ];
    h6cols.forEach(({col,v})=>{
      const c=ws.getCell(6,col);
      c.value=v; c.font=boldFont; c.fill=grayFill;

    // ── 데이터 행 ──
    const toDate=(s)=>s?s.replace(/-/g,"."):"-";
    const dataRows = filterYm ? filtered : ordersLedger;
    dataRows.forEach((r,ri)=>{

          <button className="btn btn-outline" onClick={downloadExcel}>📥 엑셀 다운로드</button>

            <button className="btn btn-outline" onClick={()=>downloadTemplate(
              ["날짜","거래처","품명","규격","수량","납기","결제조건","요구사항","고객요구사항","실현가능여부","납품일","비고"],
              [today,"거래처명","제품명","규격","100","2026-06-30","현금","","이상없음","O","",""],
              "주문관리대장_업로드양식.csv"
            )}>📋 양식 다운로드</button>
            <UploadBtn label="📂 CSV 업로드" onUpload={(text)=>{
              const {headers,rows}=parseCsvRows(text);
              const hi=(name)=>headers.findIndex(h=>h===name||h.replace(/\s/g,"")===name);
              const iDate=hi("날짜"); const iClient=hi("거래처"); const iProd=hi("품명");
              const iSpec=hi("규격"); const iQty=hi("수량"); const iDue=hi("납기");
              const iPay=hi("결제조건"); const iReq=hi("요구사항"); const iCReq=hi("고객요구사항");
              const iFeas=hi("실현가능여부"); const iDel=hi("납품일"); const iNote=hi("비고");
              if(iClient<0||iProd<0){showToast("❌ 거래처, 품명 컬럼이 필요합니다");return;}
              let added=0, skipped=0;
              const maxNo = ordersLedger.length>0?Math.max(...ordersLedger.map(r=>r.no||0)):0;
              const newLedger=[...ordersLedger];
              rows.forEach((r,idx)=>{
                const client=(r[iClient]||"").trim();
                const product=(r[iProd]||"").trim();
                if(!client||!product){skipped++;return;}
                const dateStr=iDate>=0?(r[iDate]||today):today;
                const qty=iQty>=0?parseFloat(r[iQty])||1:1;
                // 중복 체크: 날짜 + 거래처 + 품명 + 수량이 모두 같으면 건너뜀
                const isDup=newLedger.some(x=>x.date===dateStr&&x.client===client&&x.product===product&&x.qty===qty);
                if(isDup){skipped++;return;}
                const orderNo=genOrderNo(dateStr);
                newLedger.push({
                  no:maxNo+idx+1, date:dateStr,
                  receiver:currentUser?.name||"",
                  client, orderNo, product, qty,
                  spec:iSpec>=0?(r[iSpec]||""):"",
                  dueDate:iDue>=0?(r[iDue]||"N/A"):"N/A",
                  paymentTerms:iPay>=0?(r[iPay]||"N/A"):"N/A",
                  requirements:iReq>=0?(r[iReq]||"N/A"):"N/A",
                  customerReq:iCReq>=0?(r[iCReq]||"이상없음"):"이상없음",
                  feasible:iFeas>=0?(r[iFeas]||"O"):"O",
                  deliveryDate:iDel>=0?(r[iDel]||""):"",
                  deliveryStatus:(iDel>=0&&r[iDel])?"납품완료":"대기",
                  note:iNote>=0?(r[iNote]||""):"",
                  taxInvoice:""
                });
                added++;
              });
              setOrdersLedger(newLedger);
              showToast(`✅ ${added}개 추가 완료 (중복/오류 ${skipped}건 건너뜀)`);
            }}/>
          </>}
          {perm.canCreate&&<button className="btn btn-primary" onClick={openAdd}>+ 주문 등록</button>}
        </div>
      </div>

      {/* 필터 바 */}
      <div style={{background:"#fff",borderRadius:10,padding:"12px 18px",boxShadow:"0 1px 3px rgba(0,0,0,0.07)",marginBottom:16,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:13,color:"#666",fontWeight:600}}>월별</span>
          <input type="month" value={filterYm} onChange={e=>setFilterYm(e.target.value)}
            style={{border:"1px solid #ddd",borderRadius:6,padding:"5px 10px",fontSize:13}}/>
          <button className="btn btn-outline btn-sm" onClick={()=>setFilterYm("")}>전체</button>
        </div>
        <input placeholder="거래처/품명/주문번호/접수자 검색" value={q} onChange={e=>setQ(e.target.value)}
          style={{width:250,border:"1px solid #ddd",borderRadius:6,padding:"6px 11px",fontSize:13,outline:"none"}}/>
        <span style={{fontSize:12,color:"#aaa",marginLeft:"auto"}}>{filtered.length}건</span>
      </div>

      {/* 요약 카드 */}
      <div className="cards" style={{marginBottom:16}}>
        <div className="card"><div className="card-label">전체 주문</div><div className="card-val">{filtered.length}<span style={{fontSize:16,fontWeight:400}}> 건</span></div></div>
        <div className="card ok"><div className="card-label">납품 완료</div><div className="card-val">{filtered.filter(r=>effStatus(r)==="납품완료").length}<span style={{fontSize:16,fontWeight:400}}> 건</span></div></div>
        <div className="card warn"><div className="card-label">진행중</div><div className="card-val">{filtered.filter(r=>effStatus(r)==="진행중").length}<span style={{fontSize:16,fontWeight:400}}> 건</span></div></div>
        <div className="card warn"><div className="card-label">납품 대기</div><div className="card-val">{filtered.filter(r=>effStatus(r)==="대기").length}<span style={{fontSize:16,fontWeight:400}}> 건</span></div></div>
      </div>

      {/* 테이블 (대장형) */}
      {view===0&&<div className="panel" style={{overflowX:"auto"}}>
        <table style={{minWidth:1200}}>
          <thead>
            <tr>
              <th style={{width:40}}>No.</th>
              <th>접수일자</th>
              <th>접수자</th>
              <th>거래처명/국가</th>
              <th>주문번호</th>
              <th>품명</th>
              <th>규격</th>
              <th>내용</th>
              <th style={{textAlign:"right"}}>수량</th>
              <th>납기요청일</th>
              <th>지불조건</th>
              <th>기타요구사항</th>
              <th>고객요구사항</th>
              <th>납품가능</th>
              <th>납품상태</th>
              <th>납품일자</th>
              <th>비고</th>
              <th>세금계산서</th>
              <th style={{width:80}}>관리</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map((r,idx)=>(
              <tr key={r.no} style={{cursor:"pointer"}} onClick={()=>setViewDetail(r)}>
                <td style={{textAlign:"center",color:"#888",fontSize:12}}>{idx+1}</td>
                <td style={{fontSize:12,color:"#888",whiteSpace:"nowrap"}}>{r.date}</td>
                <td style={{fontSize:12}}>{r.receiver}</td>
                <td><b style={{fontSize:13}}>{r.client}</b></td>
                <td style={{fontFamily:"monospace",color:"#2f6df0",fontSize:12,fontWeight:600}}>{r.orderNo}</td>
                <td><b>{r.product}</b></td>
                <td style={{fontSize:12,color:"#555"}}>{r.spec}</td>
                <td style={{fontSize:12,color:"#666",maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={r.desc}>{r.desc}</td>
                <td style={{textAlign:"right",fontWeight:600}}>{fmt3(r.qty)}</td>
                <td style={{fontSize:12,whiteSpace:"nowrap",color:r.dueDate&&!r.deliveryDate&&r.dueDate<today?"#e74c3c":"#888"}}>{r.dueDate||"-"}</td>
                <td style={{fontSize:12,color:"#888"}}>{r.paymentTerms}</td>
                <td style={{fontSize:12,color:"#888"}}>{r.requirements}</td>
                <td><span className={`badge ${r.customerReq==="이상없음"?"badge-green":"badge-orange"}`}>{r.customerReq}</span></td>
                <td style={{textAlign:"center"}}><span className={`badge ${feasibleBadge(r.feasible)}`}>{r.feasible}</span></td>
                <td style={{textAlign:"center"}}><span className={`badge ${statusBadge(effStatus(r))}`}>{effStatus(r)}</span></td>
                <td style={{fontSize:12,whiteSpace:"nowrap",color:r.deliveryDate?"#27ae60":"#aaa"}}>{r.deliveryDate||"미납품"}</td>
                <td style={{fontSize:12,color:"#888"}}>{r.note||"-"}</td>
                <td>{r.taxInvoice?<span className="badge badge-blue">{r.taxInvoice}</span>:<span style={{fontSize:12,color:"#aaa"}}>-</span>}</td>
                <td onClick={e=>e.stopPropagation()}>
                  <div style={{display:"flex",gap:4}}>
                    {perm.canEdit&&<button className="btn btn-outline btn-sm" onClick={()=>openEdit(r,idx+1)}>수정</button>}
                    {perm.canDelete&&<button className="btn btn-danger btn-sm" onClick={()=>del(r.no)}>삭제</button>}
                  </div>
                </td>
              </tr>
            ))}
            {!filtered.length&&<tr><td colSpan={19} className="empty">등록된 주문이 없습니다</td></tr>}
          </tbody>
        </table>
      </div>}

      {/* 진행 보드 (칸반 — 납품상태 3단계, 실데이터) */}
      {view===1&&<div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14,alignItems:"start"}}>
        {[["대기","badge-gray","#9aa3af"],["진행중","badge-orange","#c47d12"],["납품완료","badge-green","#2f9e63"]].map(([st,bcls,dot])=>{
          const col=filtered.filter(r=>effStatus(r)===st);
          return(
            <div key={st} style={{display:"flex",flexDirection:"column",gap:10}}>
              <div style={{display:"flex",alignItems:"center",gap:8,padding:"2px 4px"}}>
                <span style={{width:9,height:9,borderRadius:"50%",background:dot}}/>
                <span style={{fontWeight:700,fontSize:14}}>{st}</span>
                <span style={{color:"#aaa",fontSize:13}}>{col.length}</span>
              </div>
              {col.map(r=>(
                <div key={r.no} onClick={()=>setViewDetail(r)}
                  style={{background:"#fff",border:"1px solid var(--line)",borderRadius:10,padding:"12px 14px",boxShadow:"0 1px 3px rgba(16,24,40,0.06)",cursor:"pointer",display:"flex",flexDirection:"column",gap:6}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontFamily:"monospace",color:"#2f6df0",fontWeight:600,fontSize:12}}>{r.orderNo}</span>
                    <span className={`badge ${bcls}`} style={{marginLeft:"auto"}}>{st}</span>
                  </div>
                  <div style={{fontWeight:700,fontSize:14}}>{r.product}</div>
                  <div style={{fontSize:12,color:"#888"}}>{r.client}</div>
                  <div style={{display:"flex",alignItems:"center",fontSize:12,color:"#666",marginTop:2}}>
                    <span style={{color:r.dueDate&&!r.deliveryDate&&r.dueDate<today?"#e74c3c":"#888"}}>📅 {r.dueDate||"-"}</span>
                    <span style={{marginLeft:"auto",fontWeight:600,color:"#1b2333"}}>{fmt3(r.qty)} {r.unit||"EA"}</span>
                  </div>
                </div>
              ))}
              {!col.length&&<div style={{color:"#bbb",fontSize:12,textAlign:"center",padding:"18px 0",border:"1px dashed var(--line)",borderRadius:10}}>해당 주문 없음</div>}
            </div>
          );
        })}
      </div>}

      {/* 등록/수정 모달 */}
      {modal&&(
        <div className="overlay">
          <div className="modal" style={{width:680,maxHeight:"90vh"}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <span className="modal-title">{modal==="add"?"주문 등록":"주문 수정"}</span>
              <button className="modal-close" onClick={()=>setModal(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div className="field-row">
                <div className="field"><label>No.</label><input value={seqNo??form.no} disabled style={{background:"#f8f9fb"}}/></div>
                <div className="field"><label>접수일자</label><input type="date" value={form.date} onChange={e=>{const d=e.target.value;setForm(f=>({...f,date:d,orderNo:modal==="add"?genOrderNo(d):f.orderNo}));}}/></div>
                <div className="field"><label>접수자</label><input value={form.receiver} onChange={e=>setForm(f=>({...f,receiver:e.target.value}))}/></div>
              </div>
              <div className="field-row">
                <div className="field"><label>주문번호</label><input value={form.orderNo} onChange={e=>setForm(f=>({...f,orderNo:e.target.value}))}/></div>
                <div className="field"><label>거래처명/국가 *</label><input value={form.client} onChange={e=>setForm(f=>({...f,client:e.target.value}))} placeholder="예) 인터큐어/대한민국"/></div>
              </div>
              <div className="field-row">
                <div className="field" style={{position:"relative"}}>
                  <label>품명 *</label>
                  {(()=>{
                    const searching=prodQuery!==null;
                    const _q=(prodQuery||"").trim().toLowerCase();
                    const hits=searching&&_q?finishedItems.filter(i=>(i.code||"").toLowerCase().includes(_q)||(i.name||"").toLowerCase().includes(_q)).slice(0,20):[];
                    return(<>
                      <input value={searching?prodQuery:(form.product||"")} placeholder="품목코드 또는 제품명 검색" autoComplete="off"
                        onFocus={()=>setProdQuery(form.product||"")}
                        onChange={e=>setProdQuery(e.target.value)}
                        onBlur={()=>setTimeout(()=>setProdQuery(null),150)}/>
                      {searching&&hits.length>0&&(
                        <div style={{position:"absolute",top:"100%",left:0,right:0,background:"#fff",border:"1px solid #2f6df0",borderRadius:6,boxShadow:"0 4px 12px rgba(0,0,0,0.12)",zIndex:300,maxHeight:200,overflowY:"auto"}}>
                          {hits.map(it=>(
                            <div key={it.code} onMouseDown={()=>{setForm(f=>({...f,product:it.name}));setProdQuery(null);}}
                              style={{padding:"8px 12px",cursor:"pointer",borderBottom:"1px solid #f0f0f0",fontSize:13}}
                              onMouseEnter={e=>e.currentTarget.style.background="#eff6ff"} onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
                              <span style={{fontFamily:"monospace",color:"#2f6df0",fontWeight:600}}>{it.code}</span>
                              <span style={{marginLeft:8}}>{it.name}</span>
                              <span style={{marginLeft:6,fontSize:11,color:"#888"}}>{it.type}</span>
                            </div>
                          ))}
                        </div>
                      )}
                      {searching&&_q&&!hits.length&&<div style={{fontSize:11,color:"#e74c3c",marginTop:3}}>등록된 품목이 없습니다 — 품목관리에서 먼저 등록하세요</div>}
                    </>);
                  })()}
                </div>
                <div className="field"><label>규격</label><input value={form.spec} onChange={e=>setForm(f=>({...f,spec:e.target.value}))} placeholder="예) 0.0021"/></div>
                <div className="field"><label>수량</label><input type="number" value={form.qty} onChange={e=>setForm(f=>({...f,qty:+e.target.value}))}/></div>
              </div>
              <div className="field"><label>내용</label><input value={form.desc} onChange={e=>setForm(f=>({...f,desc:e.target.value}))} placeholder="납품 내용 입력"/></div>
              <div className="field-row">
                <div className="field"><label>납기요청일</label><input type="date" value={form.dueDate} onChange={e=>setForm(f=>({...f,dueDate:e.target.value}))}/></div>
                <div className="field"><label>지불조건</label><input value={form.paymentTerms} onChange={e=>setForm(f=>({...f,paymentTerms:e.target.value}))} placeholder="N/A"/></div>
                <div className="field"><label>기타 요구사항</label><input value={form.requirements} onChange={e=>setForm(f=>({...f,requirements:e.target.value}))} placeholder="N/A"/></div>
              </div>
              <div className="field-row">
                <div className="field">
                  <label>고객요구사항</label>
                  <select value={form.customerReq} onChange={e=>setForm(f=>({...f,customerReq:e.target.value}))}>

                </div>
                <div className="field">
                  <label>납품가능여부</label>
                  <select value={form.feasible} onChange={e=>setForm(f=>({...f,feasible:e.target.value}))}>

                    <option value="×">× — 불가능</option>
                  </select>
                </div>
              </div>
              <div className="field-row">
                <div className="field">
                  <label>납품상태</label>
                  <select value={form.deliveryStatus||"대기"} onChange={e=>{
                    const s=e.target.value;
                    setForm(f=>({...f,deliveryStatus:s,
                      // 납품완료로 바꾸면 납품일자 비어있을 때 오늘로 자동 채움
                      deliveryDate:s==="납품완료"&&!f.deliveryDate?today:f.deliveryDate}));
                  }}>
                    <option value="대기">대기</option>
                    <option value="진행중">진행중</option>
                    <option value="납품완료">납품완료</option>
                  </select>
                </div>
                <div className="field">
                  <label>납품완료일{(form.deliveryStatus||"대기")==="납품완료"&&<span style={{color:"#e74c3c"}}> *</span>}</label>
                  <input type="date" value={form.deliveryDate} onChange={e=>setForm(f=>({...f,deliveryDate:e.target.value}))}/>
                </div>
                <div className="field">
                  <label>세금계산서</label>
                  <select value={form.taxInvoice} onChange={e=>setForm(f=>({...f,taxInvoice:e.target.value}))}>

                  </select>
                </div>
              </div>
              <div className="field"><label>비고</label><input value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))} placeholder="예) 제품, 컨사인"/></div>

              <button className="btn btn-primary" onClick={save}>저장</button>

          </div>
        </div>
      )}

      {/* ── 주문 상세 팝업 ── */}
      {viewDetail&&(
        <div className="overlay" style={{zIndex:300}}>
          <div className="modal" style={{width:640,maxHeight:"90vh"}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head" style={{background:"#1F3864",borderRadius:"12px 12px 0 0"}}>
              <div>
                <div className="modal-title" style={{color:"#fff",fontSize:16}}>📋 주문 상세</div>
                <div style={{fontSize:12,color:"#9aabbf",marginTop:2}}>{viewDetail.orderNo} · {viewDetail.date}</div>
              </div>
              <button className="modal-close" onClick={()=>setViewDetail(null)} style={{color:"#9aabbf"}}>✕</button>
            </div>
            <div className="modal-body" style={{padding:"20px 24px"}}>

              {/* 상태 뱃지 행 */}
              <div style={{display:"flex",gap:8,marginBottom:18,flexWrap:"wrap"}}>
                <span className={`badge ${viewDetail.feasible==="O"?"badge-green":viewDetail.feasible==="△"?"badge-orange":"badge-red"}`} style={{fontSize:13,padding:"4px 12px"}}>
                  납품가능: {viewDetail.feasible==="O"?"✅ 가능":viewDetail.feasible==="△"?"⚠️ 조정필요":"❌ 불가"}
                </span>
                <span className={`badge ${viewDetail.customerReq==="이상없음"?"badge-green":"badge-orange"}`} style={{fontSize:13,padding:"4px 12px"}}>
                  고객요구: {viewDetail.customerReq}
                </span>
                <span className={`badge ${statusBadge(effStatus(viewDetail))}`} style={{fontSize:13,padding:"4px 12px"}}>
                  {effStatus(viewDetail)==="납품완료"?"✅ 납품완료":effStatus(viewDetail)==="진행중"?"🔄 진행중":"⏳ 납품대기"}
                </span>
                {viewDetail.taxInvoice&&<span className="badge badge-blue" style={{fontSize:13,padding:"4px 12px"}}>🧾 세금계산서 {viewDetail.taxInvoice}</span>}
              </div>

              {/* 기본 정보 */}
              <div style={{background:"#f8f9fb",borderRadius:8,padding:"14px 16px",marginBottom:14}}>
                <div style={{fontWeight:700,fontSize:13,color:"#1F3864",marginBottom:10}}>📦 주문 정보</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px 20px",fontSize:13}}>
                  <div><span style={{color:"#888",fontSize:12}}>주문번호</span><br/><b style={{color:"#2f6df0",fontFamily:"monospace"}}>{viewDetail.orderNo}</b></div>
                  <div><span style={{color:"#888",fontSize:12}}>접수일자</span><br/><b>{viewDetail.date}</b></div>
                  <div><span style={{color:"#888",fontSize:12}}>접수자</span><br/><b>{viewDetail.receiver||"-"}</b></div>
                  <div><span style={{color:"#888",fontSize:12}}>거래처명/국가</span><br/><b>{viewDetail.client}</b></div>

              {/* 주문 사항 */}
              <div style={{background:"#eff6ff",borderRadius:8,padding:"14px 16px",marginBottom:14}}>
                <div style={{fontWeight:700,fontSize:13,color:"#1F3864",marginBottom:10}}>🛒 주문 사항</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px 20px",fontSize:13}}>
                  <div><span style={{color:"#888",fontSize:12}}>품명</span><br/><b>{viewDetail.product}</b></div>
                  <div><span style={{color:"#888",fontSize:12}}>규격</span><br/><b>{viewDetail.spec||"-"}</b></div>
                  <div><span style={{color:"#888",fontSize:12}}>수량</span><br/><b style={{fontSize:16,color:"#2f6df0"}}>{viewDetail.qty}</b></div>
                </div>
                <div style={{marginTop:10,fontSize:13}}>
                  <span style={{color:"#888",fontSize:12}}>내용</span><br/>
                  <span style={{color:"#333"}}>{viewDetail.desc||"-"}</span>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px 20px",fontSize:13,marginTop:10}}>
                  <div><span style={{color:"#888",fontSize:12}}>납기요청일</span><br/><b style={{color:viewDetail.dueDate&&!viewDetail.deliveryDate&&viewDetail.dueDate<today?"#e74c3c":"#333"}}>{viewDetail.dueDate||"-"}</b></div>
                  <div><span style={{color:"#888",fontSize:12}}>지불조건</span><br/><b>{viewDetail.paymentTerms||"-"}</b></div>
                  <div><span style={{color:"#888",fontSize:12}}>기타 요구사항</span><br/><b>{viewDetail.requirements||"-"}</b></div>
                </div>
              </div>

              {/* 납품 현황 */}
              <div style={{background:"#f0fdf4",borderRadius:8,padding:"14px 16px"}}>
                <div style={{fontWeight:700,fontSize:13,color:"#166534",marginBottom:10}}>🚚 납품 현황</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px 20px",fontSize:13}}>
                  <div><span style={{color:"#888",fontSize:12}}>납품상태</span><br/><span className={`badge ${statusBadge(effStatus(viewDetail))}`}>{effStatus(viewDetail)}</span></div>
                  <div><span style={{color:"#888",fontSize:12}}>납품완료일</span><br/><b style={{color:viewDetail.deliveryDate?"#27ae60":"#aaa"}}>{viewDetail.deliveryDate||"미납품"}</b></div>
                  <div style={{gridColumn:"1 / -1"}}><span style={{color:"#888",fontSize:12}}>비고</span><br/><b>{viewDetail.note||"-"}</b></div>
                </div>
              </div>
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={()=>setViewDetail(null)}>닫기</button>
              {perm.canEdit&&<button className="btn btn-primary" onClick={()=>{openEdit(viewDetail);setViewDetail(null);}}>✏️ 수정</button>}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function UserPage({users, setUsers, currentUser, showToast}) {
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({id:"",pw:"",name:"",role:"viewer"});
  const [q, setQ] = useState("");
  const [roleF, setRoleF] = useState("전체");
  const roleLabel = {admin:"관리자",manager:"담당자",viewer:"조회자"};
  const roleBadge = {admin:"badge-blue",manager:"badge-green",viewer:"badge-gray"};
  const filtered = users.filter(u=>{
    const mq=!q||(u.id||"").toLowerCase().includes(q.toLowerCase())||(u.name||"").includes(q);
    const mr=roleF==="전체"||u.role===roleF;
    return mq&&mr;
  });

  const openAdd = () => { setForm({id:"",pw:"",name:"",role:"viewer"}); setModal("add"); };
  const save = () => {
    if(!form.id||!form.pw||!form.name){showToast("아이디, 비밀번호, 이름은 필수입니다.");return;}
    if(modal==="add"){
      if(users.find(u=>u.id===form.id)){showToast("이미 존재하는 아이디입니다.");return;}
      setUsers([...users,form]);
    } else {
      setUsers(users.map(u=>u.id===form.id?form:u));
    }
    showToast("저장되었습니다."); setModal(null);
  };
  const del = (id) => {
    if(id===currentUser.id){showToast("현재 로그인된 계정은 삭제할 수 없습니다.");return;}
    setUsers(users.filter(u=>u.id!==id));
    showToast("삭제되었습니다.");
  };

  return (
    <div>
      <div className="page-header">
        <div><div className="crumb">MedERP <span>›</span> <b>사용자 관리</b></div><div className="page-title">사용자 관리</div><div className="page-sub">로그인 계정 및 권한 관리</div></div>
        <button className="btn btn-primary" onClick={openAdd}>+ 사용자 추가</button>
      </div>

      <div className="panel" style={{marginBottom:16}}>
        <div className="panel-top"><b>권한 안내</b></div>
        <table>
          <thead><tr><th>역할</th><th>조회</th><th>등록/수정</th><th>삭제</th><th>사용자·공장 관리</th></tr></thead>
          <tbody>
            <tr><td><span className="badge badge-blue">관리자 (admin)</span></td><td>✅</td><td>✅</td><td>✅</td><td>✅</td></tr>
            <tr><td><span className="badge badge-green">담당자 (manager)</span></td><td>✅</td><td>✅</td><td>❌</td><td>❌</td></tr>
            <tr><td><span className="badge badge-gray">조회자 (viewer)</span></td><td>✅</td><td>❌</td><td>❌</td><td>❌</td></tr>
          </tbody>
        </table>
      </div>

      <div className="panel">
        <div className="panel-top" style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <input placeholder="🔍 아이디·이름 검색" value={q} onChange={e=>setQ(e.target.value)}
            style={{width:220,border:"1px solid var(--line)",borderRadius:8,padding:"6px 11px",fontSize:13,outline:"none"}}/>
          <select value={roleF} onChange={e=>setRoleF(e.target.value)} style={{border:"1px solid var(--line)",borderRadius:8,padding:"6px 10px",fontSize:13}}>
            <option value="전체">역할: 전체</option>
            <option value="admin">관리자</option>
            <option value="manager">담당자</option>
            <option value="viewer">조회자</option>
          </select>
          <span style={{fontSize:12,color:"#aaa",marginLeft:"auto"}}>{filtered.length}명</span>
        </div>
        <table>
          <thead><tr><th>아이디</th><th>이름</th><th>역할</th><th>관리</th></tr></thead>
          <tbody>
            {filtered.map(u=>{
              const ini=(u.name||u.id||"?").trim().slice(0,1).toUpperCase();
              const avBg={admin:"#eaf1fe",manager:"#e7f4ec",viewer:"#eef1f5"}[u.role]||"#eef1f5";
              const avFg={admin:"#2560d8",manager:"#2f9e63",viewer:"#667085"}[u.role]||"#667085";
              return(
              <tr key={u.id}>
                <td><b>{u.id}</b>{u.id===currentUser.id&&<span style={{fontSize:11,color:"#2f6df0",marginLeft:6}}>(현재 계정)</span>}</td>
                <td><span style={{display:"inline-flex",alignItems:"center",gap:8}}><span style={{width:26,height:26,borderRadius:"50%",background:avBg,color:avFg,display:"grid",placeItems:"center",fontSize:12,fontWeight:700,flex:"none"}}>{ini}</span>{u.name}</span></td>
                <td><span className={`badge ${roleBadge[u.role]}`}>{roleLabel[u.role]}</span></td>
                <td style={{display:"flex",gap:4}}>
                  <button className="btn btn-outline btn-sm" onClick={()=>{setForm({...u,pw:u.pw});setModal("edit");}}>수정</button>
                  <button className="btn btn-danger btn-sm" onClick={()=>del(u.id)} disabled={u.id===currentUser.id}>삭제</button>
                </td>
              </tr>
            );})}
            {!filtered.length&&<tr><td colSpan={4} className="empty">{users.length?"검색 결과 없음":"등록된 사용자 없음"}</td></tr>}
          </tbody>
        </table>
      </div>

      {modal&&(
        <div className="overlay">
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <span className="modal-title">{modal==="add"?"사용자 추가":"사용자 수정"}</span>
              <button className="modal-close" onClick={()=>setModal(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div className="field-row">
                <div className="field"><label>아이디 *</label><input value={form.id} onChange={e=>setForm({...form,id:e.target.value})} disabled={modal==="edit"} placeholder="로그인 ID"/></div>
                <div className="field"><label>이름 *</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="표시 이름"/></div>
              </div>
              <div className="field-row">
                <div className="field"><label>비밀번호 *</label><input type="password" value={form.pw} onChange={e=>setForm({...form,pw:e.target.value})} placeholder="비밀번호"/></div>
                <div className="field">
                  <label>역할 (권한)</label>
                  <select value={form.role} onChange={e=>setForm({...form,role:e.target.value})}>
                    <option value="admin">관리자 - 모든 기능</option>
                    <option value="manager">담당자 - 등록/수정 가능</option>
                    <option value="viewer">조회자 - 조회만 가능</option>
                  </select>
                </div>
              </div>
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={()=>setModal(null)}>취소</button>
              <button className="btn btn-primary" onClick={save}>저장</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
