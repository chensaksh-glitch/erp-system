<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP 시스템</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ===== Design Tokens (MedERP 클린 테마 — 색은 여기만 바꾸면 전체 적용) ===== */
:root {
  --accent: #2f6df0;          /* MedERP 코발트 포인트색 */
  --accent-strong: #2560d8;
  --accent-soft: #eaf1fe;     /* 연한 포인트 배경 */
  --ok: #2f9e63; --warn: #d6483b; --orange: #c47d12;
  --ink: #1b2333; --muted: #667085; --faint: #98a2b3;
  --line: #e2e7ee;            /* 쿨 그레이 라인 */
  --line-soft: #eef1f5;
  --bg: #eef1f5;              /* 쿨한 페이퍼 배경 → 흰 카드가 도드라짐 */
  --sidebar: #23272f;        /* MedERP 다크 슬레이트 사이드바 */
  --radius: 12px; --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.04);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; -webkit-font-smoothing: antialiased; }
.wrap { display: flex; min-height: 100vh; }

/* NAV — 솔리드 다크 사이드바 (대비로 화면을 잡아줌) */
.nav { width: 236px; background: var(--sidebar); padding: 0; display: flex; flex-direction: column; position: fixed; height: 100vh; overflow-y: auto; z-index: 100; }
.nav-logo { display: flex; align-items: center; gap: 10px; padding: 16px 16px 15px; border-bottom: 1px solid rgba(255,255,255,0.07); }
.nav-mark { width: 32px; height: 32px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 9px; background: var(--accent); color: #fff; }
.nav-brand { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.3px; }
.nav-logo span { color: #fff; }
.nav-section { font-size: 10px; color: #6b7689; padding: 18px 18px 6px; letter-spacing: 0.07em; font-weight: 700; text-transform: uppercase; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; margin: 1px 10px; border-radius: 8px; font-size: 13px; color: #aeb8c7; transition: background 0.13s, color 0.13s; }
.nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
.nav-item.active { background: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 2px 8px -2px var(--accent); }
.nav-item .icon { font-size: 15px; width: 18px; text-align: center; }
/* 그룹(접기/펼치기) 메뉴 */
.nav-solo { margin-top: 6px; font-weight: 600; color: #d4d9e4; }
.nav-group-wrap { margin-top: 5px; }
.nav-group { display: flex; align-items: center; gap: 10px; padding: 9px 14px; margin: 1px 10px; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 700; color: #8b93a7; user-select: none; transition: background 0.13s, color 0.13s; }
.nav-group:hover { background: rgba(255,255,255,0.05); color: #e7eaf2; }
.nav-group.has-active { color: #fff; }
.nav-group .icon { font-size: 15px; width: 18px; text-align: center; }
.nav-group-label { flex: 1; }
.nav-caret { font-size: 16px; color: #6b7689; transition: transform 0.18s ease; }
.nav-caret.open { transform: rotate(90deg); }
.nav-sub { padding-left: 40px; font-size: 12.5px; color: #9aa3b5; }
.nav-sub .icon { font-size: 13px; }

/* MAIN */
.main { flex: 1; margin-left: 236px; padding: 0; min-width: 0; }
.main-inner { padding: 22px 28px 48px; }
/* TOPBAR (MedERP 상단바) */
.topbar { position: sticky; top: 0; z-index: 50; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 24px; background: #fff; border-bottom: 1px solid var(--line); }
.topbar-search { display: flex; align-items: center; gap: 9px; flex: 1; max-width: 420px; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--muted); font-size: 13px; cursor: text; }
.topbar-search-ph { flex: 1; }
.topbar-kbd { font-size: 11px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--faint); }
.topbar-right { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.topbar-icon { position: relative; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: none; border: 1px solid transparent; border-radius: 9px; color: var(--muted); cursor: pointer; transition: background .13s, border-color .13s, color .13s; }
.topbar-icon:hover { background: var(--bg); border-color: var(--line); color: var(--ink); }
.topbar-badge { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.topbar-user { display: flex; align-items: center; gap: 8px; margin-left: 6px; }
.topbar-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); border: 1px solid var(--line); }
.topbar-uname { font-size: 13px; color: var(--muted); white-space: nowrap; }
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.page-title { font-size: 20px; font-weight: 700; color: #18212f; letter-spacing: -0.01em; }
.page-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }

/* CARDS — 납작한 흰 카드 + 얇은 라인 (그림자 최소) */
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 26px; }
.card { background: #fff; border-radius: 12px; padding: 18px 20px; border: 1px solid var(--line); box-shadow: var(--shadow); }
.card-label { font-size: 12px; color: var(--muted); margin-bottom: 7px; font-weight: 500; }
.card-val { font-size: 26px; font-weight: 800; color: #18212f; letter-spacing: -0.02em; }
.card-sub { font-size: 12px; color: var(--faint); margin-top: 4px; }
.card.warn { border-color: #f1bdb6; }
.card.ok { border-color: #b6e0c6; }
.card.warn .card-val { color: var(--warn); }
.card.ok .card-val { color: var(--ok); }

/* KPI CARDS — 대시보드 (아이콘 칩 + 전월대비 추세) */
.kpis { display: grid; gap: 14px; margin-bottom: 20px; }
.kpi { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); cursor: pointer; transition: transform 0.14s ease, box-shadow 0.14s ease; }
.kpi:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16,24,40,0.09); }
.kpi-chip { position: absolute; top: 15px; right: 15px; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; }
.kpi-chip.blue   { background: #eaf1fe; color: var(--accent); }
.kpi-chip.green  { background: #e7f4ec; color: var(--ok); }
.kpi-chip.violet { background: #eceafe; color: #6552e0; }
.kpi-chip.red    { background: #fbe7e4; color: var(--warn); }
.kpi-chip.amber  { background: #fbf0db; color: var(--orange); }
.kpi-chip.cyan   { background: #e2f5f7; color: #1597a6; }
.kpi-label { font-size: 12.5px; color: var(--muted); font-weight: 500; margin-bottom: 9px; padding-right: 44px; }
.kpi-val { font-size: 27px; font-weight: 800; color: #18212f; letter-spacing: -0.02em; line-height: 1.1; }
.kpi-unit { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.kpi-trend { font-size: 12px; font-weight: 600; margin-top: 11px; display: flex; align-items: center; gap: 5px; }
.kpi-trend .t-up { color: var(--ok); }
.kpi-trend .t-down { color: var(--warn); }
.kpi-trend .t-note { color: var(--faint); font-weight: 500; }

/* DASHBOARD 2-COL (MedERP 운영 대시보드) */
.dash-2col { display: grid; grid-template-columns: 1.45fr 1fr; gap: 18px; margin-bottom: 20px; }
@media (max-width: 1100px){ .dash-2col { grid-template-columns: 1fr; } }
.dash-col { display: flex; flex-direction: column; gap: 18px; }
.dash-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.dash-card-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dash-card-hd b { font-size: 14px; color: var(--ink); }
.dash-card-bd { padding: 4px 18px 8px; }
.dash-link { color: var(--accent); cursor: pointer; font-size: 12px; font-weight: 600; }
.prog-row { padding: 12px 0; border-bottom: 1px dashed var(--line); }
.prog-row:last-child { border-bottom: none; }
.prog-row-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
.prog-code { font-size: 12px; color: var(--faint); font-weight: 600; font-variant-numeric: tabular-nums; }
.prog-name { font-weight: 700; font-size: 13px; margin-bottom: 8px; }
.prog-bar { height: 8px; background: var(--line-soft); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.prog-bar > span { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .3s; }
.prog-meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.mini-row { display: flex; align-items: center; gap: 9px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.mini-row:last-child { border-bottom: none; }
.mini-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.mini-name { flex: 1; font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-val { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tl-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.tl-row:last-child { border-bottom: none; }
.tl-time { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; min-width: 64px; white-space: nowrap; }
.tl-name { flex: 1; font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* SEGMENT TOGGLE (요약/위젯) */
.seg-toggle { display: flex; padding: 3px; gap: 3px; background: #f2f5f8; border: 1px solid var(--line); border-radius: 11px; }
.seg-btn { padding: 6px 14px; border: none; background: none; cursor: pointer; font: inherit; font-size: 13px; color: var(--muted); border-radius: 8px; font-weight: 500; }
.seg-btn.is-on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(16,24,40,0.10); font-weight: 700; }

/* WIDGET GRID (위젯 그리드 / bento) */
.wf-bento { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 20px; }
.wf-bento .b-chart { grid-column: span 2; }
.wf-bento .b-kpis { grid-column: span 2; display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.wf-bento .b-donut { grid-column: span 1; }
.wf-bento .b-low { grid-column: span 2; }
.wf-bento .b-cal { grid-column: span 1; }
@media (max-width: 1100px){ .wf-bento { grid-template-columns: 1fr 1fr; } .wf-bento .b-chart, .wf-bento .b-kpis, .wf-bento .b-low { grid-column: span 2; } }
.minichart { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding: 8px 4px 0; }
.minichart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.minichart-bar { width: 100%; max-width: 40px; background: var(--accent); border-radius: 6px 6px 0 0; min-height: 3px; transition: height .3s; }
.minichart-val { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.minichart-lbl { font-size: 11px; color: var(--faint); }
.donut-wrap { display: flex; align-items: center; gap: 18px; padding: 12px 4px; }
.donut { width: 116px; height: 116px; border-radius: 50%; flex: none; display: grid; place-items: center; }
.donut-hole { width: 80px; height: 80px; border-radius: 50%; background: #fff; display: grid; place-items: center; text-align: center; }
.donut-hole b { font-size: 21px; font-weight: 800; color: var(--ink); }
.donut-hole span { font-size: 11px; color: var(--muted); display: block; }
.cal-strip { display: flex; gap: 6px; margin: 4px 0 10px; }
.cal-day { flex: 1; text-align: center; padding: 7px 2px; border: 1px solid var(--line); border-radius: 9px; font-size: 11px; color: var(--muted); }
.cal-day b { display: block; font-size: 15px; color: var(--ink); margin-top: 2px; }
.cal-day.has { border-color: var(--accent); background: var(--accent-soft); }
.cal-dot { display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin: 3px auto 0; }

/* MASTER-DETAIL (마스터-상세형) */
.md-wrap { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
@media (max-width: 1000px){ .md-wrap { grid-template-columns: 1fr; } }
.md-list { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.md-search { margin: 14px 14px 8px; }
.md-rows { flex: 1; overflow-y: auto; max-height: 560px; }
.md-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; background: none; border: none; border-top: 1px solid var(--line-soft); cursor: pointer; font: inherit; text-align: left; }
.md-row:first-child { border-top: none; }
.md-row:hover { background: var(--line-soft); }
.md-row.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.md-row-ic { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 8px; background: var(--line-soft); color: var(--muted); border: 1px solid var(--line); }
.md-row-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.md-row-tx b { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.md-row-tx span { font-size: 11px; color: var(--faint); }
.md-detail { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; }
.md-detail-hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
.md-detail-hd h2 { margin: 2px 0 0; font-size: 20px; font-weight: 700; color: var(--ink); }
.md-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.md-grid .span2 { grid-column: span 2; }
@media (max-width: 700px){ .md-grid { grid-template-columns: 1fr; } .md-grid .span2 { grid-column: auto; } }
.kv-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.kv-row:last-child { border-bottom: none; }
.kv-k { color: var(--muted); font-size: 13px; white-space: nowrap; }
.kv-v { font-weight: 700; font-size: 13px; text-align: right; }
.stockbig { display: flex; align-items: baseline; gap: 7px; margin: 4px 0 10px; }
.stockbig b { font-size: 26px; font-weight: 800; }
.stockbig span { color: var(--muted); font-size: 13px; }
.wf-route { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.route-step { padding: 5px 12px; border: 1px solid var(--line); border-radius: 20px; background: var(--bg); font-weight: 700; font-size: 12px; color: var(--ink); }

/* CHART CARD */
.chart-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px 14px; box-shadow: var(--shadow); margin-bottom: 20px; }
.chart-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.chart-card-title { font-size: 14px; font-weight: 700; color: #18212f; }

/* MENU LAUNCHER — 대시보드 전체 메뉴 바로가기 */
.menu-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.menu-tile { display: flex; flex-direction: column; align-items: center; gap: 9px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px 10px; cursor: pointer; text-align: center; transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s; }
.menu-tile:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16,24,40,0.10); border-color: #dfe3ee; }
.menu-tile-chip { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; background: var(--accent-soft); }
.menu-tile-chip.blue   { background: #eaf1fe; }
.menu-tile-chip.green  { background: #e7f4ec; }
.menu-tile-chip.violet { background: #eceafe; }
.menu-tile-chip.amber  { background: #fbf0db; }
.menu-tile-chip.red    { background: #fbe7e4; }
.menu-tile-label { font-size: 12.5px; font-weight: 600; color: #374151; }

/* BREADCRUMB */
.crumb { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--faint); margin-bottom: 11px; }
.crumb b { color: var(--muted); font-weight: 600; }
/* 재고현황 카드뷰 좌측 필터 패널 */
.stk-card-wrap { display: grid; grid-template-columns: 210px 1fr; gap: 16px; align-items: start; }
.stk-filter { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 0 4px; position: sticky; top: 12px; }
.stk-fsearch { display: flex; align-items: center; gap: 7px; margin: 0 12px 10px; padding: 0 10px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.stk-fsearch input { border: none; outline: none; background: none; flex: 1; font-size: 13px; min-width: 0; font-family: inherit; color: var(--ink); }
.stk-fgroup { padding: 10px 12px; border-top: 1px solid var(--line-soft); }
.stk-flabel { font-size: 11px; font-weight: 700; color: var(--faint); letter-spacing: .04em; margin-bottom: 6px; }
.stk-fitem { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; font-size: 13px; color: var(--ink); }
.stk-fitem input { cursor: pointer; }
.stk-fname { flex: 1; }
.stk-fcount { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.stk-cardbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.stk-count { font-size: 13px; font-weight: 600; color: var(--muted); }
@media (max-width: 900px){ .stk-card-wrap { grid-template-columns: 1fr; } .stk-filter { position: static; } }

/* 기준정보 툴바 + 카드 그리드 (창고·공정 등) */
.kbar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.kbar-search { display: flex; align-items: center; gap: 7px; padding: 0 11px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 210px; color: var(--faint); }
.kbar-search input { border: none; outline: none; background: none; flex: 1; font-size: 13px; font-family: inherit; min-width: 0; color: var(--ink); }
.kbar-sel { border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; height: 34px; font-size: 13px; font-family: inherit; background: #fff; color: var(--ink); cursor: pointer; }
.ent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 14px; }
.ent-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.ent-card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ent-ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); font-size: 19px; flex: none; }
.ent-name { font-size: 15px; font-weight: 700; color: var(--ink); line-height: 1.3; }
.ent-code { font-size: 12px; color: var(--faint); font-family: monospace; }
.ent-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 9px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); }
.ent-num { font-size: 20px; font-weight: 800; color: var(--ink); }
.ent-num span { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 3px; }
.flow-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 16px; }
.flow-card-title { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 12px; }
.route-num { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; margin-right: 6px; }

/* TABLE PANEL */
