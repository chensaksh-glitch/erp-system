// ── 공용 CSV 유틸 ──
function parseCsvRows(text) {
  const lines = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n");
  const nonEmpty = lines.filter(l=>l.trim());
  if(nonEmpty.length < 2) return {headers:[], rows:[]};
  const parseRow = (line) => {
    const result = []; let cur = ""; let inQ = false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
      else if(c===','&&!inQ){result.push(cur.trim());cur="";}
      else cur+=c;
    }
    result.push(cur.trim());
    return result;
  };
  const headers = parseRow(nonEmpty[0]);
  const rows = nonEmpty.slice(1).map(l=>parseRow(l));
  return {headers, rows};
}

function downloadTemplate(headers, exampleRow, filename) {
  const bom = "﻿";
  const csv = [headers.join(","), exampleRow.map(v=>`"${v}"`).join(",")].join("\n");
  const blob = new Blob([bom+csv],{type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

// CSV 파일을 인코딩 자동 감지로 읽는다 (UTF-8 우선, 깨지면 EUC-KR로 재시도, BOM 제거)
async function readCsvFile(f){
  const buf = await f.arrayBuffer();
  let text = new TextDecoder("utf-8").decode(buf);
  if(text.includes(" ")){
    try{ text = new TextDecoder("euc-kr").decode(buf); }catch(e){ /* euc-kr 미지원 시 UTF-8 유지 */ }
  }
  return text.replace(/^﻿/,""); // 선두 BOM 제거
}

function UploadBtn({onUpload, label="📂 업로드"}) {
  const ref = React.useRef(null);
  return (
    <>
      <button className="btn btn-outline" onClick={()=>ref.current&&ref.current.click()}>{label}</button>
      <input ref={ref} type="file" accept=".csv" style={{display:"none"}} onChange={async e=>{
        const f=e.target.files[0]; if(!f) return; e.target.value="";
        const text = await readCsvFile(f);
        onUpload(text);
      }}/>
    </>
  );
}

// ── 제조지시서 보기 공통 헬퍼 (PDF=미리보기 / Excel=표 렌더 / 그 외=다운로드) ──
function dataURLToArrayBuffer(dataURL){
  const base64=String(dataURL||"").split(",")[1]||"";
  const bin=atob(base64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes.buffer;
}
function excelToHTML(wb, filename){
  const colNum=letters=>{let n=0;for(const ch of String(letters).toUpperCase())n=n*26+(ch.charCodeAt(0)-64);return n;};
  const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
  // 색상 해석: argb / theme+tint / indexed (엑셀 음영·글자색 재현)
  const THEME=["FFFFFF","000000","E7E6E6","44546A","4472C4","ED7D31","A5A5A5","FFC000","5B9BD5","70AD47","0563C1","954F72"];
  const IDX={0:"000000",1:"FFFFFF",8:"000000",9:"FFFFFF",22:"C0C0C0",23:"808080"};
  const hx=h=>({r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)});
  const toHex=o=>{const c=v=>("0"+Math.max(0,Math.min(255,Math.round(v))).toString(16)).slice(-2);return "#"+c(o.r)+c(o.g)+c(o.b);};
  const tint=(o,t)=>!t?o:(t<0?{r:o.r*(1+t),g:o.g*(1+t),b:o.b*(1+t)}:{r:o.r*(1-t)+255*t,g:o.g*(1-t)+255*t,b:o.b*(1-t)+255*t});
  const color=c=>{
    if(!c) return null;
    if(c.argb){const h=String(c.argb);return h.length===8?"#"+h.slice(2):(h.length===6?"#"+h:null);}
    if(c.theme!=null){const base=THEME[c.theme];if(!base)return null;return toHex(tint(hx(base),c.tint||0));}
    if(c.indexed!=null){const h=IDX[c.indexed];return h?"#"+h:null;}
    return null;
  };
  const numFmt=(n,nf)=>{
    if(typeof n!=="number"||!nf||nf==="@"||/general/i.test(nf)) return String(n);
    if(/#,##0/.test(nf)){const dm=nf.match(/\.(0+)/);const d=dm?dm[1].length:0;return n.toLocaleString("ko-KR",{minimumFractionDigits:d,maximumFractionDigits:d});}
    if(/%/.test(nf)){const dm=nf.match(/\.(0+)/);return (n*100).toFixed(dm?dm[1].length:0)+"%";}
    const dm=nf.match(/0\.(0+)/);if(dm)return n.toFixed(dm[1].length);
    return String(n);
  };
  // ExcelJS .text getter는 일부 병합셀에서 예외를 던지므로 안전 추출 사용
  const cellText=cell=>{
    try{
      const v=cell.value;
      if(v==null) return "";
      if(typeof v==="number") return numFmt(v, cell.numFmt);
      if(typeof v!=="object") return String(v);
      if(v instanceof Date) return v.toISOString().slice(0,10);
      if(Array.isArray(v.richText)) return v.richText.map(t=>t.text).join("");
      if(v.result!=null) return typeof v.result==="number"?numFmt(v.result,cell.numFmt):String(v.result);
      if(v.text!=null) return String(v.text);
      return "";
    }catch(e){ return ""; }
  };
  const bWidth=st=>!st?null:(/thick/.test(st)?"2.5px":(/medium|double/.test(st)?"1.5px":"1px"));
  const bStyle=st=>!st?null:(/dash/i.test(st)?"dashed":(/dot|hair/i.test(st)?"dotted":(st==="double"?"double":"solid")));
  const borderCss=b=>{ if(!b) return ""; let css=""; ["top","left","right","bottom"].forEach(side=>{ const s=b[side]; if(s&&s.style){ css+=`border-${side}:${bWidth(s.style)} ${bStyle(s.style)} ${color(s.color)||"#000"};`; } }); return css; };
  const fillCss=cell=>{ const f=cell.fill; if(f&&f.type==="pattern"&&f.pattern==="solid"){ const bg=color(f.fgColor); if(bg&&bg.toUpperCase()!=="#FFFFFF") return `background:${bg};`; } return ""; };
  const fontCss=cell=>{ const f=cell.font; let css=`font-size:${Math.max(7,Math.round((f&&f.size||10)*1.2))}px;`; if(f){ if(f.bold)css+="font-weight:bold;"; if(f.italic)css+="font-style:italic;"; const col=color(f.color); if(col){const u=col.toUpperCase();if(u!=="#000000"&&u!=="#FFFFFF")css+=`color:${col};`;} } return css; };
  let body="";
  wb.eachSheet(ws=>{
    const merges=(ws.model&&ws.model.merges)||[];
    const covered={}, masterSpan={};
    merges.forEach(rng=>{
      const parts=String(rng).split(":");const ma=parts[0].match(/([A-Z]+)(\d+)/),mb=(parts[1]||parts[0]).match(/([A-Z]+)(\d+)/);
      if(!ma||!mb) return;
      const l=colNum(ma[1]),t=+ma[2],r=colNum(mb[1]),bt=+mb[2];
      masterSpan[t+":"+l]={cs:r-l+1,rs:bt-t+1};
      for(let rr=t;rr<=bt;rr++)for(let cc=l;cc<=r;cc++){ if(!(rr===t&&cc===l)) covered[rr+":"+cc]=true; }
    });
    const rowCount=Math.min(ws.rowCount||0,600),colCount=Math.min(ws.columnCount||0,80);
    // 실제 열 너비 → px (콜그룹)
    let colgroup="<colgroup>",totalW=0;
    for(let c=1;c<=colCount;c++){ const w=ws.getColumn(c).width; const px=Math.round((w||8.43)*7)+5; totalW+=px; colgroup+=`<col style="width:${px}px">`; }
    colgroup+="</colgroup>";
    let rows="";
    for(let r=1;r<=rowCount;r++){
      const rh=ws.getRow(r).height;                                // 행높이(pt)
      const trStyle=rh?` style="height:${Math.round(rh*1.33)}px"`:"";
      let tds="";
      for(let c=1;c<=colCount;c++){
        if(covered[r+":"+c]) continue;
        const cell=ws.getCell(r,c);
        const m=masterSpan[r+":"+c];
        const span=m?` colspan="${m.cs}" rowspan="${m.rs}"`:"";
        const al=cell.alignment||{};
        const ha=al.horizontal?`text-align:${al.horizontal};`:"";
        const va=`vertical-align:${al.vertical||"middle"};`;
        const ws_=al.wrapText?"white-space:pre-wrap;word-break:break-word;":"white-space:nowrap;";
        tds+=`<td${span} style="${borderCss(cell.border)}${fillCss(cell)}${fontCss(cell)}${ha}${va}${ws_}padding:1px 3px;overflow:hidden">${esc(cellText(cell))}</td>`;
      }
      rows+=`<tr${trStyle}>${tds}</tr>`;
    }
    body+=`<div style="font-size:13px;font-weight:700;color:#7c3aed;margin:18px 0 6px">▣ ${esc(ws.name)}</div><div style="overflow-x:auto"><table style="border-collapse:collapse;table-layout:fixed;width:${totalW}px">${colgroup}${rows}</table></div>`;
  });
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(filename)}</title>
<style>body{font-family:'나눔고딕','NanumGothic','맑은 고딕','Malgun Gothic',sans-serif;padding:18px;margin:0;}
table{font-family:inherit;}td{box-sizing:border-box;line-height:1.25;}
@media print{@page{size:A4 landscape;margin:8mm;}button{display:none;}body{padding:0;}}</style></head>
<body><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:2px solid #7c3aed;padding-bottom:8px">
<h2 style="font-size:16px;margin:0;color:#1a2236">📄 ${esc(filename)}</h2>
<button onclick="window.print()" style="padding:6px 14px;cursor:pointer;background:#7c3aed;color:#fff;border:none;border-radius:5px;font-size:13px">🖨️ 인쇄</button></div>
${body||"<p style='color:#888'>표시할 내용이 없습니다.</p>"}</body></html>`;
}
async function openMfgDocIn(win, doc){
  if(!win||!doc) return;
  const fname=doc.filename||"";
  const isPdf=doc.fileType==="application/pdf"||/\.pdf$/i.test(fname);
  const isXlsx=/\.xlsx$/i.test(fname)||String(doc.fileType||"").includes("spreadsheetml.sheet");
  if(isPdf){
    win.document.write(`<html><body style="margin:0"><iframe src="${doc.data}" style="width:100%;height:100vh;border:none"></iframe></body></html>`);
    return;
  }
  if(isXlsx){
    win.document.write(`<html><head><meta charset="utf-8"><title>${fname}</title></head><body style="font-family:'맑은 고딕',sans-serif;padding:20px;color:#888">📄 엑셀 제조지시서를 불러오는 중...</body></html>`);
    try{
      const EJ=window.ExcelJS;
      if(!EJ) throw new Error("ExcelJS 로딩 중");
      const wb=new EJ.Workbook();
      await wb.xlsx.load(dataURLToArrayBuffer(doc.data));
      win.document.open();win.document.write(excelToHTML(wb,fname));win.document.close();
    }catch(e){
      const a=win.document.createElement("a");a.href=doc.data;a.download=fname;a.click();
      try{win.document.open();win.document.write(`<html><body style="font-family:sans-serif;padding:20px">미리보기를 표시할 수 없어 파일을 다운로드했습니다.<br>(${(e&&e.message)||e})</body></html>`);win.document.close();}catch(_){}
    }
    return;
  }
  // 그 외(.xls, Word 등) → 다운로드
  const a=win.document.createElement("a");a.href=doc.data;a.download=fname;a.click();win.close();
}

  const matchType=(t)=>typeFilter==="전체"||t===typeFilter||(typeFilter==="완제품"&&t==="제품");
  const typeCounts=items.reduce((a,i)=>{a[i.type]=(a[i.type]||0)+1;return a;},{});
  const filtered=items.filter(i=>(i.name.includes(q)||i.code.includes(q))&&matchType(i.type));
  const toggleSel=(code)=>setSelected(prev=>{const s=new Set(prev);s.has(code)?s.delete(code):s.add(code);return s;});
  const toggleProc=(code)=>setForm(f=>{const ps=f.processes||[];return{...f,processes:ps.includes(code)?ps.filter(c=>c!==code):[...ps,code]};});

  const handleDocUpload=(itemCode,file)=>{
    if(file.size>10*1024*1024){showToast("❌ 파일 크기는 10MB 이하만 가능합니다.");return;}

  const viewDoc=(doc)=>{ const win=window.open("","_blank"); openMfgDocIn(win,doc); };

  const save=()=>{
    const code=(form.code||"").trim();
    const name=(form.name||"").trim();
    if(!code||!name){showToast("코드와 품목명은 필수입니다.");return;}
    if(modal==="add"){
      // 중복 차단: 공백 제거 + 대소문자 무시 비교 (P0001 / p0001 / "P0001 " 모두 중복으로 처리)
      const dup=items.find(i=>(i.code||"").trim().toLowerCase()===code.toLowerCase());

              const iType=hi("유형")>=0?hi("유형"):hi("품목구분");
              const iUnit=hi("단위"); const iSpec=hi("규격"); const iCap=hi("용량");

              if(iCode<0||iName<0){showToast("❌ 품목코드, 품목명 컬럼이 필요합니다");return;}

              const skips=[]; // {row, code, reason}
              const newItems=[...items];
              rows.forEach((r,idx)=>{

                const name=(r[iName]||"").trim();
                if(!code||!name){skips.push(`${ln}행: 품목코드/품목명 누락`);return;}

                  type: (()=>{const t=iType>=0?(r[iType]||"원자재"):"원자재";return t==="제품"?"완제품":t;})(), // "제품"→"완제품" 정규화

                      {(()=>{const _d=mfgDocs[docModal.item.code];const _f=_d.filename||"";if(_d.fileType==="application/pdf"||/\.pdf$/i.test(_f))return"🔍 PDF 열기";if(/\.xlsx$/i.test(_f))return"📊 엑셀 보기";return"📥 파일 다운로드";})()}
                    </button>
                    {perm.canEdit&&<button className="btn btn-danger" onClick={()=>{if(window.confirm("제조지시서를 삭제하시겠습니까?")){saveMfgDoc(docModal.item.code,null);setDocModal(null);showToast("삭제되었습니다.");}}}>🗑 삭제</button>}
                  </div>
                  {perm.canEdit&&(
                    <div style={{borderTop:"1px solid #f0f0f0",paddingTop:12}}>
                      <label style={{fontSize:12,color:"#888",display:"block",marginBottom:6}}>파일 교체</label>
                      <input type="file" accept=".pdf,.doc,.docx,.xlsx,.xls" onChange={e=>{if(e.target.files[0]) handleDocUpload(docModal.item.code,e.target.files[0]);}} style={{fontSize:12}}/>
                    </div>
                  )}
                </div>
              ):(
                <div>
                  <div style={{textAlign:"center",padding:"20px 0",color:"#aaa",fontSize:13,marginBottom:16}}>첨부된 제조지시서가 없습니다.</div>
                  {perm.canEdit&&(
                    <div>
                      <label style={{fontSize:13,fontWeight:600,color:"#555",display:"block",marginBottom:8}}>📎 파일 첨부 (PDF / Word / Excel, 최대 10MB)</label>
                      <input type="file" accept=".pdf,.doc,.docx,.xlsx,.xls" onChange={e=>{if(e.target.files[0]){handleDocUpload(docModal.item.code,e.target.files[0]);setDocModal(null);}}} style={{fontSize:12}}/>
                    </div>
                  )}
                </div>
              )}
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={()=>setDocModal(null)}>닫기</button>
            </div>
          </div>
        </div>
      )}
      {bomModal&&<ItemBomModal item={bomModal} bom={bom} setBom={setBom} items={items} perm={perm} showToast={showToast} onClose={()=>setBomModal(null)}/>}
    </div>
  );
}

// 품목관리에서 완제품·반제품의 BOM(자재명세서)을 바로 등록/수정하는 모달
function ItemBomModal({item,bom,setBom,items,perm,showToast,onClose}) {
  const existing=bom.find(b=>b.product===item.code);
  const [materials,setMaterials]=useState(existing?existing.materials.map(m=>({...m})):[]);
  const [matQtyInputs,setMatQtyInputs]=useState(existing?existing.materials.map(m=>String(m.qty||"")):[]);
  const [qa,setQa]=useState("");                 // 빠른 추가 검색어
  const [showPick,setShowPick]=useState(false);  // 목록에서 선택(체크박스) 패널
  const [pickQ,setPickQ]=useState("");           // 체크박스 패널 필터
  const [picked,setPicked]=useState(new Set());  // 체크된 자재코드
  const [copyFrom,setCopyFrom]=useState("");     // 다른 품목 BOM 복사 대상
  const allMats=items.filter(i=>(i.type==="원자재"||i.type==="부자재"||i.type==="반제품")&&i.code!==item.code);
  const readOnly=!perm.canEdit;
  const have=()=>new Set(materials.map(m=>m.code).filter(Boolean));
  // 자재 여러 개를 한 번에 추가(중복 코드는 건너뜀)
  const pushMats=(list)=>{
    const h=have();
    const add=list.filter(m=>!m.code||!h.has(m.code));
    if(!add.length){showToast("추가할 새 자재가 없습니다");return 0;}
    setMaterials([...materials,...add.map(m=>({code:m.code||"",name:m.name||"",qty:m.qty||1,unit:m.unit||"EA"}))]);
    setMatQtyInputs([...matQtyInputs,...add.map(m=>String(m.qty||1))]);
    return add.length;
  };
  const addOne=(mat)=>{ if(mat.code&&have().has(mat.code)){showToast("이미 추가된 자재입니다");return;} pushMats([mat]); setQa(""); };
  const addCustomRow=()=>{ setMaterials([...materials,{code:"",name:"",qty:1,unit:"EA"}]); setMatQtyInputs([...matQtyInputs,"1"]); };
  const addPicked=()=>{ const n=pushMats(allMats.filter(m=>picked.has(m.code))); if(n){setPicked(new Set());setShowPick(false);setPickQ("");showToast(`${n}개 자재를 추가했습니다`);} };
  const doCopy=(prodCode)=>{ const src=bom.find(b=>b.product===prodCode); if(src){const n=pushMats(src.materials.map(m=>({...m}))); if(n)showToast(`${src.productName||prodCode}에서 ${n}개 복사했습니다`);} setCopyFrom(""); };
  const togglePick=(code)=>setPicked(prev=>{const s=new Set(prev);s.has(code)?s.delete(code):s.add(code);return s;});
  const setField=(idx,field,val)=>{setMaterials(ms=>{const a=[...ms];a[idx]={...a[idx],[field]:val};return a;});};
  const delMat=(idx)=>{ setMaterials(materials.filter((_,i)=>i!==idx)); setMatQtyInputs(matQtyInputs.filter((_,i)=>i!==idx)); };
  const save=()=>{
    const cleaned=materials.filter(m=>(m.code||m.name)&&(+m.qty)>0);
    if(cleaned.length===0){showToast("자재를 1개 이상 입력하고 소요량을 입력해주세요");return;}
    const entry={code:existing?existing.code:"BOM"+Date.now(),product:item.code,productName:item.name,materials:cleaned};
    setBom(existing?bom.map(b=>b.product===item.code?entry:b):[...bom,entry]);
    showToast("✅ BOM이 저장되었습니다."); onClose();
  };
  const removeBom=()=>{
    if(!existing)return;
    if(!window.confirm(`'${item.name}'의 BOM을 삭제하시겠습니까?`))return;
    setBom(bom.filter(b=>b.product!==item.code));
    showToast("BOM이 삭제되었습니다."); onClose();
  };
  return (
    <div className="overlay" onClick={onClose}><div className="modal" style={{width:620}} onClick={e=>e.stopPropagation()}>
      <div className="modal-head"><span className="modal-title">🧬 BOM {existing?"수정":"등록"} — {item.name}</span><button className="modal-close" onClick={onClose}>✕</button></div>
      <div className="modal-body">
        <div style={{background:"#f6f8fc",border:"1px solid #e6ebf3",borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:12,color:"#555"}}>
          대상 품목: <b style={{color:"#2f6df0"}}>{item.code}</b> {item.name} <span className="badge badge-blue" style={{marginLeft:6,fontSize:10}}>{item.type}</span>
          <span style={{marginLeft:8,color:"#999"}}>· 1 {item.unit} 생산에 필요한 자재</span>
        </div>
        {!readOnly&&(
          <div style={{border:"1px solid #e6ebf3",borderRadius:8,padding:10,marginBottom:12,background:"#fafbfd"}}>
            {/* ① 빠른 추가 검색창 */}
            <div style={{position:"relative",marginBottom:8}}>
              <input placeholder="🔍 자재 빠른 추가 — 코드/자재명 입력 후 클릭하면 바로 추가" value={qa}
                onChange={e=>setQa(e.target.value)}
                style={{width:"100%",border:"1px solid #ccd3df",borderRadius:6,padding:"7px 11px",fontSize:13}} autoComplete="off"/>
              {qa&&(()=>{
                const _q=qa.toLowerCase(); const h=have();
                const hits=allMats.filter(m=>!h.has(m.code)&&(m.code.toLowerCase().includes(_q)||m.name.toLowerCase().includes(_q))).slice(0,30);
                return (
                  <div style={{position:"absolute",top:"100%",left:0,right:0,background:"#fff",border:"1px solid #2f6df0",borderRadius:6,boxShadow:"0 4px 12px rgba(0,0,0,0.12)",zIndex:300,maxHeight:220,overflowY:"auto"}}>
                    {hits.length?hits.map(mat=>(
                      <div key={mat.code} onClick={()=>addOne(mat)}
                        style={{padding:"8px 12px",cursor:"pointer",borderBottom:"1px solid #f0f0f0",fontSize:13,display:"flex",alignItems:"center",justifyContent:"space-between"}}
                        onMouseEnter={e=>e.currentTarget.style.background="#eff6ff"} onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
                        <span><span style={{fontFamily:"monospace",color:"#2f6df0",fontWeight:600}}>{mat.code}</span><span style={{marginLeft:8}}>{mat.name}</span><span className={`badge ${mat.type==="원자재"?"badge-green":mat.type==="반제품"?"badge-blue":"badge-yellow"}`} style={{marginLeft:6,fontSize:10}}>{mat.type}</span></span>
                        <span style={{fontSize:11,color:"#999"}}>재고 {fmt3(mat.stock||0)}</span>
                      </div>
                    )):<div style={{padding:"8px 12px",fontSize:12,color:"#999"}}>검색 결과 없음 (이미 추가됐거나 없는 자재)</div>}
                  </div>
                );
              })()}
            </div>
            {/* ② 다른 품목 BOM 복사 + ③ 목록에서 선택 + 직접입력 */}
            <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
              <select value={copyFrom} onChange={e=>{const v=e.target.value;if(v)doCopy(v);else setCopyFrom("");}}
                style={{border:"1px solid #ccd3df",borderRadius:6,padding:"6px 9px",fontSize:12,maxWidth:280}}>
                <option value="">📋 다른 품목 BOM 복사…</option>
                {bom.filter(b=>b.product!==item.code&&b.materials&&b.materials.length).map(b=>(
                  <option key={b.code} value={b.product}>{b.productName||b.product} (자재 {b.materials.length})</option>
                ))}
              </select>
              <button className="btn btn-outline btn-sm" onClick={()=>setShowPick(s=>!s)}>{showPick?"▲ 목록 닫기":"☑ 목록에서 선택"}</button>
              <button className="btn btn-outline btn-sm" onClick={addCustomRow}>✎ 직접입력 행</button>
            </div>
            {/* ③ 체크박스 다중선택 패널 */}
            {showPick&&(
              <div style={{marginTop:8,border:"1px solid #e0e0e0",borderRadius:6,background:"#fff"}}>
                <div style={{padding:8,borderBottom:"1px solid #eee"}}>
                  <input placeholder="자재 검색 필터..." value={pickQ} onChange={e=>setPickQ(e.target.value)}
                    style={{width:"100%",border:"1px solid #ddd",borderRadius:5,padding:"5px 8px",fontSize:12}}/>
                </div>
                <div style={{maxHeight:180,overflowY:"auto"}}>
                  {(()=>{const _q=pickQ.toLowerCase();const h=have();const list=allMats.filter(m=>!h.has(m.code)&&(m.code.toLowerCase().includes(_q)||m.name.toLowerCase().includes(_q)));
                    return list.length?list.map(m=>(
                      <label key={m.code} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",borderBottom:"1px solid #f5f5f5",cursor:"pointer",fontSize:12}}>
                        <input type="checkbox" checked={picked.has(m.code)} onChange={()=>togglePick(m.code)} style={{width:14,height:14}}/>
                        <span style={{fontFamily:"monospace",color:"#2f6df0",fontWeight:600}}>{m.code}</span>
                        <span style={{flex:1}}>{m.name}</span>
                        <span className={`badge ${m.type==="원자재"?"badge-green":m.type==="반제품"?"badge-blue":"badge-yellow"}`} style={{fontSize:10}}>{m.type}</span>
                      </label>
                    )):<div style={{padding:"10px",fontSize:12,color:"#999"}}>추가할 자재가 없습니다</div>;
                  })()}
                </div>
                <div style={{padding:8,borderTop:"1px solid #eee",textAlign:"right"}}>
                  <button className="btn btn-primary btn-sm" disabled={picked.size===0} onClick={addPicked}>선택 {picked.size}개 추가</button>
                </div>
              </div>
            )}
          </div>
        )}
        <div style={{marginBottom:8,fontWeight:600,fontSize:13}}>자재 목록 <span style={{fontWeight:400,color:"#999",fontSize:12}}>({materials.length}건)</span></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 90px 60px 36px",gap:6,marginBottom:4,paddingBottom:4,borderBottom:"1px solid #eee"}}>
          <span style={{fontSize:11,color:"#888",fontWeight:600}}>자재</span>
          <span style={{fontSize:11,color:"#888",fontWeight:600,textAlign:"right"}}>소요량</span>
          <span style={{fontSize:11,color:"#888",fontWeight:600}}>단위</span>
          <span></span>
        </div>
        {materials.map((m,i)=>(
          <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 90px 60px 36px",gap:6,marginBottom:8,alignItems:"center"}}>
            {m.code
              ? <div style={{fontSize:12,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={`${m.code} ${m.name}`}><span style={{fontFamily:"monospace",color:"#2f6df0",fontWeight:600}}>{m.code}</span> <span>{m.name}</span></div>
              : <input placeholder="자재명 직접입력" value={m.name||""} disabled={readOnly} onChange={e=>setField(i,"name",e.target.value)} style={{border:"1px solid #ddd",borderRadius:5,padding:"5px 8px",fontSize:12,width:"100%"}}/>}
            <input type="text" inputMode="decimal" placeholder="0.000" value={matQtyInputs[i]||""} disabled={readOnly}
              onChange={e=>{const v=e.target.value.replace(/[^0-9.]/g,"");const parts=v.split(".");if(parts.length<=2&&(parts[1]||"").length<=3){setMatQtyInputs(q=>{const n=[...q];n[i]=v;return n;});}}}
              onBlur={()=>{const v=parseFloat(matQtyInputs[i]);const rounded=isNaN(v)?0:Math.round(v*1000)/1000;setMatQtyInputs(q=>{const n=[...q];n[i]=rounded===0?"":String(rounded);return n;});setField(i,"qty",rounded);}}
              style={{border:"1px solid #ddd",borderRadius:5,padding:"5px 8px",fontSize:12,textAlign:"right",width:"100%"}}/>
            <input placeholder="단위" value={m.unit||""} disabled={readOnly} onChange={e=>setField(i,"unit",e.target.value)}
              style={{border:"1px solid #ddd",borderRadius:5,padding:"5px 8px",fontSize:12,width:"100%"}}/>
            {!readOnly&&<button className="btn btn-danger btn-sm" onClick={()=>delMat(i)}>✕</button>}
          </div>
        ))}
        {materials.length===0&&<div className="empty" style={{padding:"12px 0",textAlign:"left",color:"#aaa",fontSize:12}}>위에서 자재를 검색·선택하거나 다른 품목 BOM을 복사해 추가하세요.</div>}
      </div>
      <div className="modal-foot" style={{justifyContent:"space-between"}}>
        <div>{existing&&perm.canDelete&&<button className="btn btn-danger" onClick={removeBom}>🗑 BOM 삭제</button>}</div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn btn-outline" onClick={onClose}>취소</button>
          {!readOnly&&<button className="btn btn-primary" onClick={save}>저장</button>}
        </div>
      </div>
    </div></div>
  );
}

function WarehousePage({warehouses,setWarehouses,lots=[],perm,showToast,tryDelete,checkWarehouseLinks}) {
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({code:"",name:"",type:"완제품창고",location:"",note:""});
  const [sel,setSel]=useState(new Set());
  const [q,setQ]=useState("");
  const [typeF,setTypeF]=useState("");
  const [view,setView]=useState("table");
  const toggleSel=(code)=>setSel(prev=>{const s=new Set(prev);s.has(code)?s.delete(code):s.add(code);return s;});
  const openAdd=()=>{setForm({code:"",name:"",type:"완제품창고",location:"",note:""});setModal("add");};
  const save=()=>{
    if(!form.code||!form.name){showToast("코드와 창고명 필수");return;}
    if(modal==="add"){if(warehouses.find(w=>w.code===form.code)){showToast("이미 존재하는 코드");return;}setWarehouses([...warehouses,form]);}
    else{setWarehouses(warehouses.map(w=>w.code===form.code?form:w));}
    showToast("저장되었습니다."); setModal(null);
  };
  const del=(code,name)=>{const reasons=checkWarehouseLinks(name);tryDelete(reasons,()=>{setWarehouses(warehouses.filter(w=>w.code!==code));showToast("삭제되었습니다.");},"창고 삭제 불가");};
  const bulkDel=()=>{
    const blocked=[...sel].find(c=>{const w=warehouses.find(x=>x.code===c);return w&&checkWarehouseLinks(w.name).length>0;});
    if(blocked){showToast("연계 데이터가 있는 창고가 포함되어 있습니다.");return;}
    if(!window.confirm(`선택한 ${sel.size}개를 삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.`)) return;
    setWarehouses(warehouses.filter(w=>!sel.has(w.code)));setSel(new Set());showToast(`${sel.size}개 삭제되었습니다.`);
  };
  // 창고별 품목 수 (실데이터: 잔량>0 LOT의 고유 품목 수)
  const itemCount=(name)=>{const s=new Set();lots.forEach(l=>{if(l.warehouse===name&&(l.qty||0)>0)s.add(l.item||l.itemName||l.code);});return s.size;};
  const badgeCls=(t)=>t==="완제품창고"?"badge-blue":t==="불량품창고"?"badge-red":t==="검사창고"?"badge-orange":t==="보관샘플창고"?"badge-yellow":"badge-green";
  const filtered=warehouses.filter(w=>{
    const _q=q.trim().toLowerCase();
    if(_q&&!(`${w.code} ${w.name} ${w.location||""}`.toLowerCase().includes(_q)))return false;
    if(typeF&&w.type!==typeF)return false;
    return true;
  });
  return (
    <div>
      <div className="page-header">
        <div><div className="crumb">MedERP <span>›</span> <b>창고 관리</b></div><div className="page-title">창고 관리</div><div className="page-sub">창고를 등록하고 창고별 보관 품목 현황을 관리합니다</div></div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <div className="seg-toggle">
            <button className={"seg-btn"+(view==="table"?" is-on":"")} onClick={()=>setView("table")}>테이블</button>
            <button className={"seg-btn"+(view==="card"?" is-on":"")} onClick={()=>setView("card")}>카드</button>
          </div>
          {perm.canDelete&&sel.size>0&&<button className="btn btn-danger" onClick={bulkDel}>🗑 선택 삭제 ({sel.size})</button>}
          {perm.canCreate&&<button className="btn btn-primary" onClick={openAdd}>+ 창고 등록</button>}
        </div>
      </div>
      <div className="kbar" style={{background:"#fff",border:"1px solid var(--line)",marginBottom:view==="card"?12:0,borderRadius:view==="card"?12:"12px 12px 0 0"}}>
        <div className="kbar-search">🔍<input placeholder="창고코드 · 창고명 · 위치 검색" value={q} onChange={e=>setQ(e.target.value)}/></div>
        <select className="kbar-sel" value={typeF} onChange={e=>setTypeF(e.target.value)}>
          <option value="">유형: 전체</option><option>완제품창고</option><option>자재창고</option><option>불량품창고</option><option>검사창고</option><option>보관샘플창고</option>
        </select>
        <span style={{marginLeft:"auto",fontSize:12,color:"var(--muted)"}}>창고 {filtered.length}곳</span>
      </div>
      {view==="table"?(
      <div className="panel" style={{borderRadius:"0 0 12px 12px",borderTop:"none"}}>
        <table>
          <thead><tr><th style={{width:36,textAlign:"center"}}>선택</th><th>창고코드</th><th>창고명</th><th>유형</th><th>위치</th><th style={{textAlign:"right"}}>품목 수</th><th>비고</th><th>관리</th></tr></thead>
          <tbody>{filtered.map(w=>(
            <tr key={w.code}>
              <td style={{textAlign:"center"}}><input type="checkbox" checked={sel.has(w.code)} onChange={()=>toggleSel(w.code)} style={{cursor:"pointer"}}/></td>
              <td>{w.code}</td><td><b>{w.name}</b></td>
              <td><span className={`badge ${badgeCls(w.type)}`}>{w.type}</span></td>
              <td>{w.location}</td>
              <td style={{textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{itemCount(w.name)}</td>
              <td>{w.note||"-"}</td>
              <td style={{display:"flex",gap:4}}>{perm.canEdit&&<button className="btn btn-outline btn-sm" onClick={()=>{setForm({...w});setModal("edit");}}>수정</button>}{perm.canDelete&&<button className="btn btn-danger btn-sm" onClick={()=>del(w.code,w.name)}>삭제</button>}</td>
            </tr>
          ))}
          {!filtered.length&&<tr><td colSpan={8} style={{textAlign:"center",color:"var(--faint)",padding:"28px"}}>표시할 창고가 없습니다.</td></tr>}</tbody>
        </table>
      </div>
      ):(
      <div className="ent-grid">{filtered.map(w=>{
        const cnt=itemCount(w.name);
        return (
        <div key={w.code} className="ent-card">
          <div className="ent-card-h">
            <span className="ent-ic">🏬</span>
            <span className={`badge ${badgeCls(w.type)}`}>{w.type}</span>
          </div>
          <div><div className="ent-name">{w.name}</div><div className="ent-code">{w.code}{w.location?` · ${w.location}`:""}</div></div>
          {w.note&&<div style={{fontSize:12,color:"var(--muted)"}}>{w.note}</div>}
          <div className="ent-foot">
            <span><span className="ent-num">{cnt}</span><span> 품목</span></span>

        <div className="modal-body">

          <div className="field"><label>비고</label><input value={form.note} onChange={e=>setForm({...form,note:e.target.value})}/></div>

}

function ProcessPage({processes,setProcesses,perm,showToast,tryDelete,checkProcessLinks}) {

  const [form,setForm]=useState({code:"",name:"",desc:"",note:""});

  const openAdd=()=>{setForm({code:"",name:"",desc:"",note:""});setModal("add");};
  const save=()=>{
    if(!form.code||!form.name){showToast("코드와 공정명 필수");return;}
    if(modal==="add"){if(processes.find(p=>p.code===form.code)){showToast("이미 존재하는 코드");return;}setProcesses([...processes,form]);}
    else{setProcesses(processes.map(p=>p.code===form.code?form:p));}
    showToast("저장되었습니다."); setModal(null);
  };
  const del=(code)=>{const reasons=checkProcessLinks(code);tryDelete(reasons,()=>{setProcesses(processes.filter(p=>p.code!==code));showToast("삭제되었습니다.");},"공정 삭제 불가");};
  const bulkDel=()=>{

      {processes.length>0&&(

          <span style={{marginLeft:"auto",fontSize:12,color:"var(--muted)"}}>공정 {filtered.length}개</span>

              <td style={{textAlign:"center"}}><input type="checkbox" checked={sel.has(p.code)} onChange={()=>toggleSel(p.code)} style={{cursor:"pointer"}}/></td>
              <td style={{textAlign:"right",fontWeight:700,color:"var(--muted)"}}>{processes.indexOf(p)+1}</td>
              <td>{p.code}</td><td><b>{p.name}</b></td><td>{p.desc}</td><td>{p.note?<span className="badge badge-orange">{p.note}</span>:"-"}</td>
              <td style={{display:"flex",gap:4}}>{perm.canEdit&&<button className="btn btn-outline btn-sm" onClick={()=>{setForm({...p});setModal("edit");}}>수정</button>}{perm.canDelete&&<button className="btn btn-danger btn-sm" onClick={()=>del(p.code)}>삭제</button>}</td>

          </div>

      ))}
      {!filtered.length&&<div className="empty" style={{gridColumn:"1/-1"}}>표시할 공정이 없습니다.</div>}</div>
      )}
      {modal&&(<div className="overlay"><div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><span className="modal-title">{modal==="add"?"공정 등록":"공정 수정"}</span><button className="modal-close" onClick={()=>setModal(null)}>✕</button></div>
        <div className="modal-body">
          <div className="field-row"><div className="field"><label>공정코드 *</label><input value={form.code} onChange={e=>setForm({...form,code:e.target.value})} disabled={modal==="edit"}/></div><div className="field"><label>공정명 *</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></div></div>
          <div className="field"><label>공정 설명</label><input value={form.desc} onChange={e=>setForm({...form,desc:e.target.value})}/></div>
          <div className="field"><label>비고</label><input value={form.note} onChange={e=>setForm({...form,note:e.target.value})}/></div>
        </div>
        <div className="modal-foot"><button className="btn btn-outline" onClick={()=>setModal(null)}>취소</button><button className="btn btn-primary" onClick={save}>저장</button></div>
      </div></div>)}
    </div>
  );
}

function BomPage({bom,setBom,items,perm,showToast,tryDelete,currentUser}) {
  const today=new Date().toISOString().slice(0,10);
  const [exp,setExp]=useState(null);
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({code:"",product:"",materials:[],version:"1.0",effectiveDate:"",revHistory:[],revNote:""});
  const [matQty,setMatQty]=useState({});
  const [sel,setSel]=useState(new Set());
  const [prodQ,setProdQ]=useState("");
  const [matQs,setMatQs]=useState([]);
  const [matQtyInputs,setMatQtyInputs]=useState([]); // raw string for qty input
  const [multiView,setMultiView]=useState(false);    // 다단계 전개 보기 토글
  const [view,setView]=useState("list");              // list=목록형(아코디언), detail=마스터-상세형
  const [selBom,setSelBom]=useState(null);            // 마스터-상세형 선택 BOM 코드
  const [mdQ,setMdQ]=useState("");                    // 마스터-상세형 좌측 검색
  // ── BOM 버전 헬퍼 (레거시 데이터는 v1.0/적용일 없음으로 하위호환) ──
  const bomVer=(b)=>b.version||"1.0";
  const bomEff=(b)=>b.effectiveDate||"";
  const toggleSel=(code)=>setSel(prev=>{const s=new Set(prev);s.has(code)?s.delete(code):s.add(code);return s;});
  const products=items.filter(i=>i.type==="완제품"||i.type==="반제품");
  const allMats=items.filter(i=>i.type==="원자재"||i.type==="부자재"||i.type==="반제품");
  const openAdd=()=>{setForm({code:"BOM"+Date.now(),product:"",materials:[],version:"1.0",effectiveDate:today,revHistory:[],revNote:""});setProdQ("");setMatQs([]);setMatQtyInputs([]);setModal("add");};
  const openEdit=(b)=>{setForm({...b,productName:b.productName||(products.find(p=>p.code===b.product)?.name||""),version:bomVer(b),effectiveDate:bomEff(b)||today,revHistory:Array.isArray(b.revHistory)?b.revHistory:[],revNote:""});setProdQ(b.product||"");setMatQs(b.materials.map(m=>m.code||""));setMatQtyInputs(b.materials.map(m=>String(m.qty||"")));setModal("edit");};
  const addMat=()=>{setForm({...form,materials:[...form.materials,{code:"",name:"",qty:0,unit:"EA"}]});setMatQs(q=>[...q,""]);setMatQtyInputs(q=>[...q,""]);};
  const setMat=(idx,field,val)=>{const mats=[...form.materials];mats[idx]={...mats[idx],[field]:val};if(field==="code"){const it=items.find(i=>i.code===val);if(it){mats[idx].name=it.name;mats[idx].unit=it.unit;}}setForm({...form,materials:mats});};
  const delMat=(idx)=>{setForm({...form,materials:form.materials.filter((_,i)=>i!==idx)});setMatQs(q=>q.filter((_,i)=>i!==idx));setMatQtyInputs(q=>q.filter((_,i)=>i!==idx));};
  const save=()=>{
    if(!form.product){showToast("완제품을 선택해주세요");return;}
    const prd=products.find(p=>p.code===form.product);
    const ver=(form.version||"1.0").trim()||"1.0";
    const eff=form.effectiveDate||today;
    let revHistory=Array.isArray(form.revHistory)?[...form.revHistory]:[];
    if(modal==="edit"){
      const orig=bom.find(b=>b.code===form.code);
      const verChanged=orig&&(bomVer(orig)!==ver);
      // 버전이 바뀌었거나 개정사유를 입력하면 개정 이력에 1건 추가
      if(verChanged||(form.revNote||"").trim()){
        revHistory.push({version:ver,date:eff,note:(form.revNote||"").trim()||"개정",by:currentUser?.name||""});
      }
    }
    const {revNote,...rest}=form;
    const entry={...rest,productName:prd?prd.name:"",version:ver,effectiveDate:eff,revHistory};
    if(modal==="add"){setBom([...bom,entry]);}else{setBom(bom.map(b=>b.code===form.code?entry:b));}
    showToast("저장되었습니다."); setModal(null);
  };
  const del=(code)=>{tryDelete([],()=>{setBom(bom.filter(b=>b.code!==code));showToast("삭제되었습니다.");},"BOM 삭제 불가");};
  const bulkDel=()=>{const n=sel.size;if(!window.confirm(`선택한 ${n}개를 삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.`))return;setBom(bom.filter(b=>!sel.has(b.code)));setSel(new Set());showToast(`${n}개 삭제되었습니다.`);};
  const calc=(b)=>{const q=matQty[b.code]||1;return b.materials.map(m=>({...m,totalQty:m.qty*q}));};
  // 다단계 BOM 전개: 반제품 자재를 그 하위 BOM으로 재귀 펼쳐 최종 원자재 소요량 합산
  const explode=(productCode,mult,acc,visited)=>{
    const node=bom.find(x=>x.product===productCode);
    if(!node)return;
    node.materials.forEach(m=>{
      const sub=bom.find(x=>x.product===m.code);
      const it=items.find(i=>i.code===m.code);
      if(it&&it.type==="반제품"&&sub&&!visited.has(m.code)){
        explode(m.code,mult*m.qty,acc,new Set([...visited,m.code]));
      }else{
        const key=m.code||m.name;
        if(!acc[key])acc[key]={code:m.code,name:m.name||(it?it.name:""),unit:m.unit||(it?it.unit:"")};
        acc[key].qty=(acc[key].qty||0)+m.qty*mult;
      }
    });
  };
  const explodeList=(b,q)=>{const acc={};explode(b.product,q,acc,new Set([b.product]));return Object.values(acc).map(x=>({...x,qty:Math.round((x.qty||0)*1000)/1000}));};
  const hasSemi=(b)=>b.materials.some(m=>{const it=items.find(i=>i.code===m.code);return it&&it.type==="반제품"&&bom.some(x=>x.product===m.code);});
  return (
    <div>
      <div className="page-header">
        <div><div className="crumb">MedERP <span>›</span> <b>BOM (자재명세서)</b></div><div className="page-title">BOM (자재명세서)</div><div className="page-sub">완제품 1개 생산에 필요한 자재 목록</div></div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <div className="seg-toggle" style={{marginRight:4}}>
            <button className={`seg-btn${view==="list"?" is-on":""}`} onClick={()=>setView("list")}>목록형</button>
            <button className={`seg-btn${view==="detail"?" is-on":""}`} onClick={()=>{if(!selBom&&bom.length)setSelBom(bom[0].code);setView("detail");}}>마스터-상세형</button>
          </div>
          {perm.canDelete&&sel.size>0&&<button className="btn btn-danger" onClick={bulkDel}>🗑 선택 삭제 ({sel.size})</button>}
          {perm.canCreate&&<>
            <button className="btn btn-outline" onClick={()=>downloadTemplate(
              ["품목코드","자재코드","소요량","단위"],
              ["P0011","RM-001","2.5","EA"],
              "BOM_업로드양식.csv"
            )}>📋 양식 다운로드</button>
            <UploadBtn label="📂 BOM 업로드" onUpload={(text)=>{
              const {headers,rows}=parseCsvRows(text);
              const hi=(name)=>headers.findIndex(h=>h===name||h.replace(/\s/g,"")===name);
              const iProd=hi("품목코드")>=0?hi("품목코드"):hi("코드");
              const iMat=hi("자재코드"); const iQty=hi("소요량")>=0?hi("소요량"):hi("수량"); const iUnit=hi("단위");
              if(iProd<0||iMat<0){showToast("❌ 품목코드, 자재코드 컬럼이 필요합니다");return;}
              const grouped={}; const skips=[];
              rows.forEach((r,idx)=>{
                const ln=idx+2;
                const pc=(r[iProd]||"").trim(); const mc=(r[iMat]||"").trim();
                if(!pc||!mc){skips.push(`${ln}행: 품목코드/자재코드 누락`);return;}
                const prod=items.find(i=>i.code===pc);
                if(!prod){skips.push(`${ln}행: 없는 품목코드(${pc})`);return;}
                if(!(prod.type==="완제품"||prod.type==="제품"||prod.type==="반제품")){skips.push(`${ln}행: ${pc}는 완제품/반제품이 아님`);return;}
                const mat=items.find(i=>i.code===mc);
                const qty=Math.round((parseFloat(r[iQty])||0)*1000)/1000;
                (grouped[pc]=grouped[pc]||[]).push({code:mc,name:mat?mat.name:"",qty,unit:iUnit>=0&&r[iUnit]?r[iUnit].trim():(mat?mat.unit:"EA")});
              });
              const prodCodes=Object.keys(grouped);
              if(!prodCodes.length){showToast("❌ 등록할 BOM이 없습니다");if(skips.length)alert(skips.slice(0,15).join("\n"));return;}
              const next=[...bom];
              prodCodes.forEach(pc=>{
                const prod=items.find(i=>i.code===pc);
                const exist=bom.find(b=>b.product===pc);
                // 기존 BOM 갱신 시 버전/적용일/개정이력은 보존 (자재만 교체)
                const entry={code:exist?.code||"BOM"+Date.now()+pc,product:pc,productName:prod?prod.name:"",materials:grouped[pc],
                  version:exist?.version||"1.0",effectiveDate:exist?.effectiveDate||today,revHistory:Array.isArray(exist?.revHistory)?exist.revHistory:[]};
                const ix=next.findIndex(b=>b.product===pc);
                if(ix>=0)next[ix]=entry;else next.push(entry);
              });
              setBom(next);
              showToast(`✅ ${prodCodes.length}개 품목 BOM 등록/갱신${skips.length?` (건너뜀 ${skips.length}건)`:""}`);
              if(skips.length)alert(`⚠️ ${skips.length}건 건너뜀\n\n${skips.slice(0,15).join("\n")}${skips.length>15?`\n…외 ${skips.length-15}건`:""}`);
            }}/>
          </>}
          {perm.canCreate&&<button className="btn btn-primary" onClick={openAdd}>+ BOM 등록</button>}
        </div>
      </div>
      {view==="list"&&bom.map(b=>(
        <div key={b.code} className="bom-group">
          <div className="bom-head" onClick={()=>setExp(exp===b.code?null:b.code)}>
            <span style={{display:"flex",alignItems:"center",gap:8}} onClick={e=>e.stopPropagation()}>
              <input type="checkbox" checked={sel.has(b.code)} onChange={()=>toggleSel(b.code)} style={{cursor:"pointer",width:15,height:15}}/>
              <span onClick={()=>setExp(exp===b.code?null:b.code)}>{exp===b.code?"▼":"▶"} 📦 {b.productName} <span className="badge badge-blue" style={{marginLeft:6,fontSize:10}}>v{bomVer(b)}</span> <span style={{fontSize:11,color:"#aaa",fontWeight:400,marginLeft:4}}>{b.code}</span>{bomEff(b)&&<span style={{fontSize:11,color:"#aaa",fontWeight:400,marginLeft:6}}>적용 {bomEff(b)}</span>}</span>
            </span>
            <div style={{display:"flex",gap:6}} onClick={e=>e.stopPropagation()}>
              {perm.canEdit&&<button className="btn btn-outline btn-sm" onClick={()=>openEdit(b)}>수정</button>}
              {perm.canDelete&&<button className="btn btn-danger btn-sm" onClick={()=>del(b.code)}>삭제</button>}
            </div>
          </div>
          {exp===b.code&&(
            <div className="bom-body">
              <div style={{display:"flex",alignItems:"center",gap:8,margin:"10px 0 8px",flexWrap:"wrap"}}>
                <label style={{fontSize:12,color:"#666"}}>생산 수량:</label>
                <input type="number" min={1} style={{width:70,border:"1px solid #ddd",borderRadius:5,padding:"4px 8px",fontSize:13}} value={matQty[b.code]||1} onChange={e=>setMatQty({...matQty,[b.code]:+e.target.value})}/>
                <span style={{fontSize:12,color:"#aaa"}}>EA 기준 자재 소요량</span>
                {hasSemi(b)&&<label style={{fontSize:12,color:"#2f6df0",display:"flex",alignItems:"center",gap:4,cursor:"pointer",marginLeft:8}}>
                  <input type="checkbox" checked={multiView} onChange={e=>setMultiView(e.target.checked)}/> 🔍 다단계 전개(반제품까지 펼치기)
                </label>}
              </div>
              {!multiView?(
                <table><thead><tr><th>자재코드</th><th>자재명</th><th>단위 소요량</th><th>단위</th><th>총 소요량</th></tr></thead>
                <tbody>{calc(b).map((m,i)=>{const it=items.find(x=>x.code===m.code);const semi=it&&it.type==="반제품"&&bom.some(x=>x.product===m.code);return <tr key={i}><td>{m.code}</td><td>{m.name}{semi&&<span className="badge badge-blue" style={{marginLeft:6,fontSize:10}}>반제품</span>}</td><td>{fmt3(m.qty)}</td><td>{m.unit}</td><td style={{fontWeight:700,color:"#2f6df0"}}>{fmt3(m.totalQty)}</td></tr>;})}</tbody></table>
              ):(
                <div>
                  <div style={{fontSize:12,color:"#666",margin:"2px 0 6px"}}>📐 최종 원자재 소요량 (반제품을 하위 BOM으로 전개)</div>
                  <table><thead><tr><th>자재코드</th><th>자재명</th><th>단위</th><th>총 소요량</th><th>현재고</th></tr></thead>
                  <tbody>{explodeList(b,matQty[b.code]||1).map((m,i)=>{const mat=items.find(x=>x.code===m.code);const ok=mat&&mat.stock>=m.qty;return <tr key={i}><td>{m.code}</td><td>{m.name}</td><td>{m.unit}</td><td style={{fontWeight:700,color:"#2f6df0"}}>{fmt3(m.qty)}</td><td style={{textAlign:"right",color:mat?(ok?"#27ae60":"#e74c3c"):"#aaa",fontWeight:600}}>{mat?fmt3(mat.stock):"?"}</td></tr>;})}</tbody></table>
                </div>
              )}
            </div>
          )}
        </div>
      ))}
      {view==="list"&&!bom.length&&<div className="empty">등록된 BOM이 없습니다.</div>}

      {/* 마스터-상세형 (와이어프레임 재구성) */}
      {view==="detail"&&(()=>{
        const _q=mdQ.trim().toLowerCase();
        const listed=bom.filter(b=>!_q||(b.productName||"").toLowerCase().includes(_q)||(b.product||"").toLowerCase().includes(_q)||(b.code||"").toLowerCase().includes(_q));
        const cur=bom.find(b=>b.code===selBom)||listed[0]||bom[0]||null;
        const semi=cur&&hasSemi(cur);
        return(
          <div className="md-wrap">
            {/* 좌측: BOM(제품) 목록 */}
            <div className="md-list">
              <div className="md-search">
                <input placeholder="🔍 제품명·코드 검색" value={mdQ} onChange={e=>setMdQ(e.target.value)}
                  style={{width:"100%",border:"1px solid var(--line)",borderRadius:8,padding:"8px 11px",fontSize:13,outline:"none"}}/>
              </div>
              <div className="md-rows">
                {listed.map(b=>{
                  const prod=items.find(i=>i.code===b.product);
                  const low=prod&&typeof prod.stock==="number"&&typeof prod.safety==="number"&&prod.stock<prod.safety;
                  return(
                    <button key={b.code} className={`md-row${cur&&cur.code===b.code?" on":""}`} onClick={()=>setSelBom(b.code)}>
                      <span className="md-row-ic">📦</span>
                      <span className="md-row-tx"><b>{b.productName||(prod?prod.name:b.product)}</b><span>{b.product} · v{bomVer(b)} · 자재 {b.materials.length}종</span></span>
                      {low&&<span style={{width:8,height:8,borderRadius:"50%",background:"#e74c3c",flex:"none"}} title="안전재고 미만"/>}
                    </button>
                  );
                })}
                {!listed.length&&<div style={{padding:"24px 14px",color:"#bbb",fontSize:13,textAlign:"center"}}>{bom.length?"검색 결과 없음":"등록된 BOM 없음"}</div>}
              </div>
            </div>
            {/* 우측: 선택 BOM 상세 */}
            {cur?(
              <div className="md-detail">
                <div className="md-detail-hd">
                  <div>
                    <div className="crumb" style={{marginBottom:4}}>BOM <span>›</span> <b>{cur.productName}</b></div>
                    <h2>{cur.productName} <span className="badge badge-blue" style={{fontSize:12,verticalAlign:"middle"}}>v{bomVer(cur)}</span></h2>
                    <div style={{fontSize:12,color:"#888",marginTop:4}}>{cur.product} · 자재 {cur.materials.length}종{bomEff(cur)&&` · 적용일 ${bomEff(cur)}`}</div>
                  </div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {perm.canEdit&&<button className="btn btn-outline btn-sm" onClick={()=>openEdit(cur)}>수정</button>}
                    {perm.canDelete&&<button className="btn btn-danger btn-sm" onClick={()=>del(cur.code)}>삭제</button>}
                  </div>
                </div>
                {/* 자재 소요량 */}
                <div style={{display:"flex",alignItems:"center",gap:8,margin:"4px 0 8px",flexWrap:"wrap"}}>
                  <label style={{fontSize:12,color:"#666"}}>생산 수량:</label>
                  <input type="number" min={1} style={{width:70,border:"1px solid #ddd",borderRadius:5,padding:"4px 8px",fontSize:13}} value={matQty[cur.code]||1} onChange={e=>setMatQty({...matQty,[cur.code]:+e.target.value})}/>
                  <span style={{fontSize:12,color:"#aaa"}}>EA 기준 자재 소요량</span>
                  {semi&&<label style={{fontSize:12,color:"#2f6df0",display:"flex",alignItems:"center",gap:4,cursor:"pointer",marginLeft:8}}>
                    <input type="checkbox" checked={multiView} onChange={e=>setMultiView(e.target.checked)}/> 🔍 다단계 전개
                  </label>}
                </div>
                {!multiView?(
                  <table><thead><tr><th>자재코드</th><th>자재명</th><th>단위 소요량</th><th>단위</th><th>총 소요량</th></tr></thead>
                  <tbody>{calc(cur).map((m,i)=>{const it=items.find(x=>x.code===m.code);const sm=it&&it.type==="반제품"&&bom.some(x=>x.product===m.code);return <tr key={i}><td>{m.code}</td><td>{m.name}{sm&&<span className="badge badge-blue" style={{marginLeft:6,fontSize:10}}>반제품</span>}</td><td>{fmt3(m.qty)}</td><td>{m.unit}</td><td style={{fontWeight:700,color:"#2f6df0"}}>{fmt3(m.totalQty)}</td></tr>;})}
                  {!cur.materials.length&&<tr><td colSpan={5} className="empty">등록된 자재가 없습니다</td></tr>}</tbody></table>
                ):(
                  <div>
                    <div style={{fontSize:12,color:"#666",margin:"2px 0 6px"}}>📐 최종 원자재 소요량 (반제품을 하위 BOM으로 전개)</div>
                    <table><thead><tr><th>자재코드</th><th>자재명</th><th>단위</th><th>총 소요량</th><th>현재고</th></tr></thead>
                    <tbody>{explodeList(cur,matQty[cur.code]||1).map((m,i)=>{const mat=items.find(x=>x.code===m.code);const ok=mat&&mat.stock>=m.qty;return <tr key={i}><td>{m.code}</td><td>{m.name}</td><td>{m.unit}</td><td style={{fontWeight:700,color:"#2f6df0"}}>{fmt3(m.qty)}</td><td style={{textAlign:"right",color:mat?(ok?"#27ae60":"#e74c3c"):"#aaa",fontWeight:600}}>{mat?fmt3(mat.stock):"?"}</td></tr>;})}</tbody></table>
                  </div>
                )}
                {/* 개정 이력 */}
                <div style={{marginTop:18}}>
                  <div style={{fontSize:13,fontWeight:700,color:"#1b2333",marginBottom:8}}>📋 개정 이력</div>
                  {Array.isArray(cur.revHistory)&&cur.revHistory.length>0?(
                    <table><thead><tr><th style={{width:70}}>버전</th><th style={{width:110}}>적용일</th><th>개정 사유</th><th style={{width:90}}>담당자</th></tr></thead>
                    <tbody>{[...cur.revHistory].reverse().map((h,i)=>(
                      <tr key={i}><td><span className="badge badge-blue" style={{fontSize:10}}>v{h.version}</span></td><td style={{fontSize:12,color:"#888"}}>{h.date||"-"}</td><td style={{fontSize:12}}>{h.note||"-"}</td><td style={{fontSize:12,color:"#888"}}>{h.by||"-"}</td></tr>
                    ))}</tbody></table>
                  ):(
                    <div style={{fontSize:12,color:"#aaa",padding:"10px 0"}}>개정 이력이 없습니다. (현재 v{bomVer(cur)}{bomEff(cur)?` · 적용일 ${bomEff(cur)}`:""})</div>
                  )}
                </div>
              </div>
            ):(
              <div className="md-detail" style={{display:"grid",placeItems:"center",minHeight:200,color:"#bbb",fontSize:14}}>BOM을 선택하세요</div>
            )}
          </div>
        );
      })()}

      {modal&&(<div className="overlay"><div className="modal" style={{width:600}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><span className="modal-title">BOM {modal==="add"?"등록":"수정"}</span><button className="modal-close" onClick={()=>setModal(null)}>✕</button></div>
        <div className="modal-body">
          <div className="field" style={{position:"relative"}}>
            <label>완제품·반제품 선택 *</label>
            <input placeholder="코드 또는 제품명 검색..." value={prodQ}
              onChange={e=>{setProdQ(e.target.value);setForm(f=>({...f,product:"",productName:""}));}}
              style={{width:"100%",border:"1px solid #e0e0e0",borderRadius:6,padding:"7px 11px",fontSize:13,outline:"none"}}
              autoComplete="off"/>
            {form.product&&<div style={{fontSize:12,color:"#16a34a",fontWeight:600,marginTop:4}}>✅ {form.productName}</div>}
            {prodQ&&!form.product&&(()=>{
              const _q=prodQ.toLowerCase();
              const hits=products.filter(p=>p.code.toLowerCase().includes(_q)||p.name.toLowerCase().includes(_q));
              return hits.length>0?(
                <div style={{position:"absolute",top:"100%",left:0,right:0,background:"#fff",border:"1px solid #2f6df0",borderRadius:6,boxShadow:"0 4px 12px rgba(0,0,0,0.12)",zIndex:300,maxHeight:200,overflowY:"auto"}}>
                  {hits.map(p=>(
                    <div key={p.code} onClick={()=>{setForm(f=>({...f,product:p.code,productName:p.name}));setProdQ(p.code);}}
                      style={{padding:"8px 12px",cursor:"pointer",borderBottom:"1px solid #f0f0f0",fontSize:13}}
                      onMouseEnter={e=>e.currentTarget.style.background="#eff6ff"}
                      onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
                      <span style={{fontFamily:"monospace",color:"#2f6df0",fontWeight:600}}>{p.code}</span>
                      <span style={{marginLeft:8}}>{p.name}</span>
                      <span className={`badge ${p.type==="완제품"?"badge-blue":"badge-orange"}`} style={{marginLeft:6,fontSize:10}}>{p.type}</span>
                    </div>
                  ))}
                </div>
              ):null;
            })()}
          </div>
          {/* 버전 관리 */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            <div className="field"><label>버전</label><input value={form.version||"1.0"} onChange={e=>setForm(f=>({...f,version:e.target.value}))} placeholder="예) 1.0, 1.1, 2.0"/></div>
            <div className="field"><label>적용일</label><input type="date" value={form.effectiveDate||""} onChange={e=>setForm(f=>({...f,effectiveDate:e.target.value}))}/></div>
          </div>
          {modal==="edit"&&<div className="field" style={{marginBottom:10}}>
            <label>개정 사유 <span style={{fontWeight:400,color:"#aaa",fontSize:11}}>(버전 변경 또는 사유 입력 시 개정 이력에 기록)</span></label>
            <input value={form.revNote||""} onChange={e=>setForm(f=>({...f,revNote:e.target.value}))} placeholder="예) 부자재 규격 변경, 소요량 정정"/>
          </div>}
          <div style={{marginBottom:8,fontWeight:600,fontSize:13}}>자재 목록</div>
          <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 80px 60px 36px",gap:6,marginBottom:4,paddingBottom:4,borderBottom:"1px solid #eee"}}>
            <span style={{fontSize:11,color:"#888",fontWeight:600}}>자재코드 / 자재명</span>
            <span style={{fontSize:11,color:"#888",fontWeight:600}}>자재명 (직접입력)</span>
            <span style={{fontSize:11,color:"#888",fontWeight:600,textAlign:"right"}}>소요량</span>
            <span style={{fontSize:11,color:"#888",fontWeight:600}}>단위</span>
            <span></span>
          </div>
          {form.materials.map((m,i)=>(
            <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 1fr 80px 60px 36px",gap:6,marginBottom:8,alignItems:"start"}}>
              <div style={{position:"relative"}}>
                <input placeholder="코드 또는 자재명 검색..." value={matQs[i]||""}
                  onChange={e=>{const v=e.target.value;setMatQs(q=>{const n=[...q];n[i]=v;return n;});setMat(i,"code","");}}
                  style={{width:"100%",border:"1px solid #ddd",borderRadius:5,padding:"5px 8px",fontSize:12}}
                  autoComplete="off"/>
                {m.code&&<div style={{fontSize:10,color:"#16a34a",fontWeight:600,marginTop:2}}>✅ {m.code}</div>}
                {(matQs[i]||"")&&!m.code&&(()=>{
                  const _q=(matQs[i]||"").toLowerCase();
                  const hits=allMats.filter(mat=>mat.code.toLowerCase().includes(_q)||mat.name.toLowerCase().includes(_q));
                  return hits.length>0?(
                    <div style={{position:"absolute",top:"100%",left:0,right:0,background:"#fff",border:"1px solid #2f6df0",borderRadius:6,boxShadow:"0 4px 12px rgba(0,0,0,0.12)",zIndex:300,maxHeight:180,overflowY:"auto"}}>
                      {hits.map(mat=>(
                        <div key={mat.code} onClick={()=>{setForm(f=>{const mats=[...f.materials];mats[i]={...mats[i],code:mat.code,name:mat.name,unit:mat.unit||"EA"};return{...f,materials:mats};});setMatQs(q=>{const n=[...q];n[i]=mat.code;return n;});}}
                          style={{padding:"7px 12px",cursor:"pointer",borderBottom:"1px solid #f0f0f0",fontSize:12}}
                          onMouseEnter={e=>e.currentTarget.style.background="#eff6ff"}
                          onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
                          <span style={{fontFamily:"monospace",color:"#2f6df0",fontWeight:600}}>{mat.code}</span>
                          <span style={{marginLeft:8}}>{mat.name}</span>
                          <span className={`badge ${mat.type==="원자재"?"badge-green":"badge-yellow"}`} style={{marginLeft:6,fontSize:10}}>{mat.type}</span>
                        </div>
                      ))}
                    </div>
                  ):null;
                })()}
              </div>
              <input placeholder="자재명 직접입력" value={m.name||""} onChange={e=>setMat(i,"name",e.target.value)}
                style={{border:"1px solid #ddd",borderRadius:5,padding:"5px 8px",fontSize:12,width:"100%"}}/>
              <input type="text" inputMode="decimal" placeholder="0.000" value={matQtyInputs[i]||""}
                onChange={e=>{const v=e.target.value.replace(/[^0-9.]/g,"");const parts=v.split(".");if(parts.length<=2&&(parts[1]||"").length<=3){setMatQtyInputs(q=>{const n=[...q];n[i]=v;return n;});}}}
                onBlur={()=>{const v=parseFloat(matQtyInputs[i]);const rounded=isNaN(v)?0:Math.round(v*1000)/1000;setMatQtyInputs(q=>{const n=[...q];n[i]=rounded===0?"":String(rounded);return n;});setMat(i,"qty",rounded);}}
                style={{border:"1px solid #ddd",borderRadius:5,padding:"5px 8px",fontSize:12,textAlign:"right",width:"100%"}}/>
              <input placeholder="단위" value={m.unit||""} onChange={e=>setMat(i,"unit",e.target.value)}
                style={{border:"1px solid #ddd",borderRadius:5,padding:"5px 8px",fontSize:12,width:"100%"}}/>
              <button className="btn btn-danger btn-sm" onClick={()=>delMat(i)}>✕</button>
            </div>
          ))}
          <button className="btn btn-outline btn-sm" style={{marginTop:4}} onClick={addMat}>+ 자재 추가</button>
        </div>
        <div className="modal-foot"><button className="btn btn-outline" onClick={()=>setModal(null)}>취소</button><button className="btn btn-primary" onClick={save}>저장</button></div>
      </div></div>)}
    </div>
  );
}

function StockPage({items,lots,io,warehouses,inspectWarehouse,retainWarehouse,downloadCSV,onItemClick,setLots,setIo,perm,showToast,tryDelete}) {
  const todayStr=new Date().toISOString().slice(0,10);
  const [traceModal,setTraceModal]=useState(null);

  const getTraceability=(lotCode)=>{
    const inRec=io.find(r=>r.lot===lotCode&&r.type==="입고"&&r.note&&r.note.includes("작업지시서"));
    if(!inRec) return null;
    const match=inRec.note.match(/작업지시서\s+(\S+)/);
    const woCode=match?match[1].replace("완료","").trim():null;
    if(!woCode) return null;
    const matRecs=io.filter(r=>r.type==="출고"&&r.destination==="P"&&r.note&&r.note.includes(woCode));
    return {woCode, inRec, matRecs};
  };

  const openTrace=(l)=>{
    const result=getTraceability(l.code);
    setTraceModal({lot:l, result});
  };

  const del=(code)=>{
    const lotObj=lots.find(l=>l.code===code);
    if(!lotObj) return;
    // 규칙1: 생산 투입 여부 체크
    const usedInProd=io.some(r=>r.lot===code&&r.type==="출고"&&r.destination==="P");
    if(usedInProd){showToast("❌ 생산에 투입된 LOT는 삭제할 수 없습니다.");return;}
    // 규칙2: 같은 품목의 더 최신 LOT가 있으면 차례대로 삭제 필요
    const newerLot=lots.find(l=>l.item===lotObj.item&&l.code!==code&&(l.mfg||"")>(lotObj.mfg||""));
    if(newerLot){showToast(`❌ 차례대로 삭제해 주세요. 먼저 LOT [${newerLot.code}]를 삭제하세요.`);return;}
    tryDelete([],()=>{
      setLots(prev=>prev.filter(l=>l.code!==code));
      setIo(prev=>prev.filter(r=>r.lot!==code));
      showToast("LOT 및 관련 입출고 이력이 삭제되었습니다.");
    },"LOT 삭제 불가");
  };

  const [wh,setWh]=useState("전체");
  const [typeTab,setTypeTab]=useState("전체");
  const [baseDate,setBaseDate]=useState(todayStr);   // 기준일
  const [mfgFrom,setMfgFrom]=useState("");            // 제조일 기간 시작 (입력값)
  const [mfgTo,setMfgTo]=useState("");                // 제조일 기간 종료 (입력값)
  const [qMfgFrom,setQMfgFrom]=useState("");          // 실제 적용된 시작일 (검색 버튼 클릭 시)
  const [qMfgTo,setQMfgTo]=useState("");              // 실제 적용된 종료일
  const [hideZero,setHideZero]=useState(true);        // 수량 0 숨기기
  const [q,setQ]=useState("");                        // 품목코드·품목명 검색
  const [statusF,setStatusF]=useState("전체");        // 상태 필터
  const [qcF,setQcF]=useState("전체");                 // 품질상태 필터 (테이블뷰)
  const [lowOnly,setLowOnly]=useState(false);         // 부족만 보기
  const [view,setView]=useState("table");             // 보기: table | card
  const [cWh,setCWh]=useState(()=>new Set());          // 카드뷰 창고 다중필터
  const [cType,setCType]=useState(()=>new Set());      // 카드뷰 분류 다중필터
  const [cStatus,setCStatus]=useState(()=>new Set());  // 카드뷰 안전상태 다중필터
  const [cQc,setCQc]=useState(()=>new Set());          // 카드뷰 품질상태 다중필터
  const [cardLayout,setCardLayout]=useState("grid");   // 카드뷰 레이아웃: grid | list
  const dateStyle={border:"1px solid #ddd",borderRadius:5,padding:"5px 8px",fontSize:12,cursor:"pointer"};
  const selStyle={height:36,border:"1px solid var(--line)",borderRadius:8,padding:"0 10px",fontSize:13,color:"var(--ink)",background:"#fff",cursor:"pointer",fontFamily:"inherit"};

  const typeBadge=(t)=>t==="완제품"?"badge-blue":t==="원자재"?"badge-green":t==="반제품"?"badge-orange":t==="부자재"?"badge-yellow":t==="자재"?"badge-green":"badge-gray";
  const getType=(code)=>items.find(x=>x.code===code)?.type||"";

  // ── 기준일 기준 LOT별 수량 역산 ──
  // 현재 qty = 기준일 이후 IO 변동분 제거해서 복원
  const calcLotQtyAt=(lot, date)=>{
    if(!date||date===todayStr) return lot.qty;
    // 기준일 이후(date 초과) 출고 기록: 그만큼 더해줌 (과거엔 아직 출고 전)
    const afterOut=(io||[]).filter(r=>r.lot===lot.code&&r.type==="출고"&&r.date>date).reduce((s,r)=>s+(r.qty||0),0);
    // 기준일 이후 입고 기록: 그만큼 빼줌 (과거엔 아직 입고 전)
    const afterIn=(io||[]).filter(r=>r.lot===lot.code&&r.type==="입고"&&r.date>date).reduce((s,r)=>s+(r.qty||0),0);
    return lot.qty + afterOut - afterIn;
  };

  // 완제품/반제품 LOT: 품질검사·보관샘플 수량 제외한 양품만 표시
  // (검사/보관이 별도 창고로 물리 분리된 신규 데이터는 해당 창고 행은 그대로 표시, 양품 행은 중복차감 방지)
  const _inspWhName=inspectWarehouse?.name, _retWhName=retainWarehouse?.name;
  const calcAdjQtyAt=(l,date)=>{
    const raw=calcLotQtyAt(l,date);
    const it=items.find(x=>x.code===l.item);
    if(it?.type!=="완제품"&&it?.type!=="반제품") return raw;
    // 검사창고/보관샘플창고 행은 그 수량(검사/보관 잔량) 그대로 표시
    if((_inspWhName&&l.warehouse===_inspWhName)||(_retWhName&&l.warehouse===_retWhName)) return raw;
    const cutoff=date||todayStr;
    const qcNet=Math.max(0,(io||[]).filter(r=>r.lot===l.code&&(r.note||"").includes("품질검사")&&r.date<=cutoff).reduce((s,r)=>s+(r.type==="입고"?(r.qty||0):-(r.qty||0)),0));
    const rtNet=Math.max(0,(io||[]).filter(r=>r.lot===l.code&&(r.note||"").includes("보관샘플")&&r.date<=cutoff).reduce((s,r)=>s+(r.type==="입고"?(r.qty||0):-(r.qty||0)),0));
    // 같은 코드가 검사/보관 창고에 물리 분리돼 있으면 그만큼은 이미 빠져 있어 중복 차감 방지 (레거시는 phys=0 → 전액 차감)
    const physInspect=_inspWhName?lots.filter(x=>x.code===l.code&&x.item===l.item&&x.warehouse===_inspWhName&&x.status!=="불량").reduce((s,x)=>s+(x.qty||0),0):0;
    const physRetain =_retWhName?lots.filter(x=>x.code===l.code&&x.item===l.item&&x.warehouse===_retWhName&&x.status!=="불량").reduce((s,x)=>s+(x.qty||0),0):0;
    return Math.max(0,raw-Math.max(0,qcNet-physInspect)-Math.max(0,rtNet-physRetain));
  };
  // LOT 목록에 기준일 수량 추가
  const lotsWithQty=lots.map(l=>({...l,_qty:calcAdjQtyAt(l,baseDate),_qc:effQc(l),_avail:qcAvailable(l)}));

  // 창고 필터
  const whFiltered=wh==="전체"?lotsWithQty:lotsWithQty.filter(l=>l.warehouse===wh);

  // 유형 필터
  const applyType=(list,t)=>{
    if(t==="전체") return list;
    if(t==="원자재") return list.filter(l=>{const tp=getType(l.item);return tp==="원자재"||tp==="자재";});
    if(t==="부자재") return list.filter(l=>{const tp=getType(l.item);return tp==="부자재"||tp==="부품";});
    return list.filter(l=>getType(l.item)===t);
  };

  // 제조일 기간 필터 (시작일~종료일). 둘 다 비어있으면 전체 통과.
  const inMfgRange=(l)=>{
    if(!qMfgFrom&&!qMfgTo) return true;
    if(!l.mfg) return false;                          // 제조일 없는 LOT은 기간 검색 시 제외
    if(qMfgFrom&&l.mfg<qMfgFrom) return false;
    if(qMfgTo&&l.mfg>qMfgTo) return false;
    return true;
  };

  // 0 숨기기 + 기준일 이후 생성된 LOT 제외 (mfg > baseDate 는 그때 없었던 LOT) + 제조일 기간
  const matchSearch=(l)=>{if(!q)return true;const s=q.toLowerCase();return (l.item||"").toLowerCase().includes(s)||(l.itemName||"").toLowerCase().includes(s);};
  const isLow=(l)=>{const it=items.find(x=>x.code===l.item);return it&&it.minStock>0&&l._qty<it.minStock;};
  const filteredLots=applyType(whFiltered,typeTab)
    .filter(l=>!baseDate||!l.mfg||l.mfg<=baseDate)  // 기준일 이전에 생성된 LOT만
    .filter(inMfgRange)                               // 제조일 기간 필터
    .filter(l=>!hideZero||l._qty>0)                   // 수량 0 숨기기
    .filter(matchSearch)                              // 품목코드·품목명 검색
    .filter(l=>statusF==="전체"||l.status===statusF)  // 상태
    .filter(l=>qcF==="전체"||l._qc===qcF)             // 품질상태
    .filter(l=>!lowOnly||isLow(l));                   // 부족만 보기

  const typeTabs=[
    {key:"전체",label:"📋 전체"},
    {key:"완제품",label:"📦 완제품"},
    {key:"반제품",label:"🔧 반제품"},
    {key:"원자재",label:"🧪 원자재"},
    {key:"부자재",label:"🪣 부자재"},
  ];

  const isHistorical=baseDate&&baseDate!==todayStr;

  // 창고별 요약 (스크린샷 상단 카드) — 현재 화면 기준일/필터 반영
  const whSummary=warehouses.map(w=>{
    const rows=applyType(lotsWithQty.filter(l=>l.warehouse===w.name),typeTab)
      .filter(l=>(!baseDate||!l.mfg||l.mfg<=baseDate)&&inMfgRange(l)&&l._qty>0);
    // 가용(적합)만 합산, 검사대기/검사중/보류 등 비가용 수량은 별도 표시
    return {name:w.name, items:new Set(rows.map(r=>r.item)).size,
      qty:rows.filter(r=>r._avail).reduce((s,r)=>s+r._qty,0),
      locked:rows.filter(r=>!r._avail).reduce((s,r)=>s+r._qty,0)};
  });
  // 전체 검사대기 수량(현재 필터 기준) — 상단 안내용
  const totalWaitQty=lotsWithQty.filter(l=>(!baseDate||!l.mfg||l.mfg<=baseDate)&&inMfgRange(l)&&l._qty>0&&l._qc==="검사대기").reduce((s,l)=>s+l._qty,0);

  // ── 카드뷰: 안전재고 기반 상태(정상/경고/부족) + 좌측 다중필터 ──
  const safetyStatus=(l)=>{const it=items.find(x=>x.code===l.item);const safe=it?.minStock||0;if(safe<=0)return "정상";if(l._qty<safe)return "부족";if(l._qty<safe*1.1)return "경고";return "정상";};
  const matchType=(l,t)=>{const tp=getType(l.item);return t==="원자재"?(tp==="원자재"||tp==="자재"):t==="부자재"?(tp==="부자재"||tp==="부품"):tp===t;};
  const toggleSet=(setter)=>(val)=>setter(prev=>{const n=new Set(prev);n.has(val)?n.delete(val):n.add(val);return n;});
  const whCounts=warehouses.map(w=>({name:w.name,n:new Set(lotsWithQty.filter(l=>l.warehouse===w.name&&l._qty>0).map(l=>l.item)).size}));
  const cardLots=lotsWithQty
    .filter(l=>!baseDate||!l.mfg||l.mfg<=baseDate)
    .filter(inMfgRange)
    .filter(l=>!hideZero||l._qty>0)
    .filter(matchSearch)
    .filter(l=>cWh.size===0||cWh.has(l.warehouse))
    .filter(l=>cType.size===0||[...cType].some(t=>matchType(l,t)))
    .filter(l=>cStatus.size===0||cStatus.has(safetyStatus(l)))
    .filter(l=>cQc.size===0||cQc.has(l._qc));

  // 재고수준 바 (현재고 vs 안전재고, 안전재고 마커 포함)
  const StockLevel=({cur,safe})=>{
    const s=safe||0; const max=Math.max(s*2.2,cur*1.15,1);
    const p=cur<=0?0:Math.min(100,Math.max(3,cur/max*100));
    const sp=s>0?Math.min(100,s/max*100):-1;
    const tone=s>0&&cur<s?"#d6483b":s>0&&cur<s*1.2?"#c47d12":"#2f6df0";
    return(
      <div style={{position:"relative",minWidth:92}}>
        <div style={{height:10,background:"#eef1f5",border:"1px solid #e2e7ee",borderRadius:6,overflow:"hidden"}}>
          <div style={{height:"100%",width:p+"%",background:tone,borderRadius:6}}/>
        </div>
        {sp>=0&&<div style={{position:"absolute",top:-1,bottom:-1,left:sp+"%",width:2,background:"#1b2333"}}/>}
      </div>
    );
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="crumb">MedERP <span>›</span> <b>재고 현황</b></div>
          <div className="page-title">재고 현황</div>
          <div className="page-sub">창고별 실시간 재고와 안전재고를 모니터링합니다{isHistorical?` — ${baseDate} 기준`:""}</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div className="seg-toggle">
            <button className={`seg-btn${view==="table"?" is-on":""}`} onClick={()=>setView("table")}>창고 요약 + 테이블</button>
            <button className={`seg-btn${view==="card"?" is-on":""}`} onClick={()=>setView("card")}>필터 + 카드</button>
          </div>
          <button className="btn btn-outline" onClick={()=>downloadCSV(
            ["LOT번호","품목코드","품목명","유형","수량","제조일","유효기간","창고","상태","품질상태"],
            filteredLots.map(l=>{const it=items.find(x=>x.code===l.item);return[l.code,l.item,l.itemName,it?.type||"",l._qty,l.mfg,l.exp,l.warehouse,l.status,l._qc];})
            ,"LOT현황.csv")}>📥 엑셀 다운로드</button>
        </div>
      </div>

      {/* 검사대기 안내 배너 — 입고 후 품질검사 전 재고가 있으면 표시 */}
      {totalWaitQty>0&&<div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 16px",marginBottom:12,background:"#fff7ec",border:"1px solid #f0d9a8",borderRadius:10,fontSize:13}}>
        <span style={{fontSize:16}}>🔬</span>
        <span style={{color:"#92600c",fontWeight:600}}>품질검사 대기 재고 {fmt3(totalWaitQty)} EA</span>
        <span style={{color:"#a07a32"}}>— 검사 통과(적합) 전까지 가용재고에서 제외됩니다.</span>
        <button className="btn btn-sm" style={{marginLeft:"auto",background:"#fff",border:"1px solid #e0b96a",color:"#92600c"}}
          onClick={()=>{ if(view==="table"){setQcF("검사대기");} else {setCQc(new Set(["검사대기"]));} }}>검사대기만 보기</button>
      </div>}

      {/* 창고 요약 카드 (스크린샷 상단 배치) — 테이블 보기에서만 */}
      {view==="table"&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(210px,1fr))",gap:13,marginBottom:14}}>
        {whSummary.map((w,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:11,padding:"13px 16px",background:"#fff",border:"1px solid var(--line)",borderRadius:12,boxShadow:"var(--shadow)"}}>
            <span style={{width:38,height:38,flex:"none",display:"grid",placeItems:"center",borderRadius:10,background:"var(--accent-soft)",color:"var(--accent)",fontSize:18}}>🏬</span>
            <div style={{minWidth:0}}>
              <div style={{fontWeight:700,fontSize:13,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{w.name}</div>
              <div style={{fontSize:12,color:"var(--muted)"}}>{w.items}개 품목</div>
            </div>
            <div style={{marginLeft:"auto",textAlign:"right",whiteSpace:"nowrap"}}>
              <div style={{fontSize:19,fontWeight:800,lineHeight:1.1}}>{fmt3(w.qty)}<span style={{fontSize:11,color:"var(--muted)",fontWeight:500,marginLeft:2}}>EA</span></div>
              <div style={{fontSize:10,color:"var(--faint)",fontWeight:600,marginTop:1}}>가용 재고{w.locked>0&&<span style={{color:"#c47d12"}}> · 🔬 검사대기 {fmt3(w.locked)}</span>}</div>
            </div>
          </div>
        ))}
      </div>}

      {/* 기준일 선택 바 */}
      <div style={{background:"#fff",borderRadius:10,padding:"10px 16px",boxShadow:"0 1px 3px rgba(0,0,0,0.07)",marginBottom:12,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <span style={{fontSize:13,fontWeight:600,color:"#555"}}>📅 기준일</span>
        <input type="date" value={baseDate} onChange={e=>setBaseDate(e.target.value)} style={dateStyle}/>
        <button className="btn btn-outline btn-sm" onClick={()=>setBaseDate(todayStr)}>오늘 (현재)</button>
        {[1,3,6].map(m=>{
          const d=new Date();d.setMonth(d.getMonth()-m);const s=d.toISOString().slice(0,10);
          return <button key={m} className="btn btn-outline btn-sm" onClick={()=>setBaseDate(s)}>{m}개월 전</button>;
        })}
        {isHistorical&&<span style={{fontSize:12,background:"#fef9c3",color:"#b45309",padding:"3px 10px",borderRadius:20,fontWeight:600}}>📌 {baseDate} 기준 재고</span>}
        <span style={{width:1,height:20,background:"#e5e5e5",margin:"0 2px"}}/>
        <span style={{fontSize:13,fontWeight:600,color:"#555"}}>📆 제조일 기간</span>
        <input type="date" value={mfgFrom} max={mfgTo||undefined} onChange={e=>setMfgFrom(e.target.value)} style={dateStyle}/>
        <span style={{color:"#999"}}>~</span>
        <input type="date" value={mfgTo} min={mfgFrom||undefined} onChange={e=>setMfgTo(e.target.value)} style={dateStyle}/>
        <button className="btn btn-primary btn-sm" onClick={()=>{setQMfgFrom(mfgFrom);setQMfgTo(mfgTo);}}>🔍 검색</button>
        {(mfgFrom||mfgTo||qMfgFrom||qMfgTo)&&<button className="btn btn-outline btn-sm" onClick={()=>{setMfgFrom("");setMfgTo("");setQMfgFrom("");setQMfgTo("");}}>기간 해제</button>}
        {(qMfgFrom||qMfgTo)&&<span style={{fontSize:12,background:"#dbeafe",color:"#2560d8",padding:"3px 10px",borderRadius:20,fontWeight:600}}>📆 제조일 {qMfgFrom||"…"} ~ {qMfgTo||"…"}</span>}
        <label style={{display:"flex",alignItems:"center",gap:5,fontSize:12,color:"#555",cursor:"pointer",marginLeft:"auto"}}>
          <input type="checkbox" checked={hideZero} onChange={e=>setHideZero(e.target.checked)} style={{cursor:"pointer"}}/>
          수량 0인 LOT 숨기기
        </label>
      </div>

      {/* 검색·필터 바 (스크린샷 배치) — 테이블 보기 전용 (카드 보기는 좌측 필터 패널 사용) */}
      {view==="table"&&<div className="panel" style={{padding:"11px 14px",marginBottom:14,display:"flex",alignItems:"center",gap:9,flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:7,flex:"1 1 230px",maxWidth:300,height:36,padding:"0 11px",border:"1px solid var(--line)",borderRadius:8,background:"var(--bg)"}}>
          <span style={{color:"var(--faint)",fontSize:13}}>🔍</span>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="품목코드 · 품목명 검색"
            style={{border:"none",outline:"none",background:"none",flex:1,fontSize:13,color:"var(--ink)",minWidth:0}}/>
        </div>
        <select value={typeTab} onChange={e=>setTypeTab(e.target.value)} style={selStyle}>
          <option value="전체">분류: 전체</option><option value="완제품">완제품</option><option value="반제품">반제품</option><option value="원자재">원자재</option><option value="부자재">부자재</option>
        </select>
        <select value={wh} onChange={e=>setWh(e.target.value)} style={selStyle}>
          <option value="전체">창고: 전체</option>{warehouses.map(w=><option key={w.name} value={w.name}>{w.name}</option>)}
        </select>
        <select value={statusF} onChange={e=>setStatusF(e.target.value)} style={selStyle}>
          <option value="전체">상태: 전체</option><option value="정상">정상</option><option value="만료임박">만료임박</option><option value="만료">만료</option><option value="불량">불량</option>
        </select>
        <select value={qcF} onChange={e=>setQcF(e.target.value)} style={selStyle}>
          <option value="전체">품질: 전체</option>{QC_STATES.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <button onClick={()=>setLowOnly(v=>!v)} className="btn btn-sm"
          style={lowOnly?{background:"var(--accent-soft)",color:"var(--accent)",border:"1px solid var(--accent)"}:{background:"#fff",color:"var(--muted)",border:"1px solid var(--line)"}}>⚠ 부족만 보기</button>
        <span style={{marginLeft:"auto",fontSize:12,color:"var(--faint)"}}>{filteredLots.length}건</span>
      </div>}

      {view==="table"?(
      <div className="panel">
        <div className="panel-top">
          <b>🔖 LOT 현황</b>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            {isHistorical&&<span style={{fontSize:11,color:"#b45309",fontWeight:600}}>📌 {baseDate} 기준</span>}
            <span style={{fontSize:12,color:"#aaa"}}>{filteredLots.length}건</span>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>품목코드</th><th>품목명</th><th>유형</th><th>LOT번호</th>
              <th style={{textAlign:"right"}}>{isHistorical?`${baseDate} 기준고`:"현재고"}</th>
              <th style={{textAlign:"right"}}>안전재고</th><th style={{width:120}}>재고수준</th>
              <th>제조일</th><th>유효기간</th><th>창고</th><th>상태 / 품질</th><th>추적</th>
              {perm?.canDelete&&<th></th>}
            </tr>
          </thead>
          <tbody>
            {filteredLots.map((l,i)=>{
              const it=items.find(x=>x.code===l.item);
              const qtyChanged=isHistorical&&l._qty!==l.qty;
              return(
                <tr key={i}>
                  <td><b style={{fontFamily:"monospace",color:"#1b2333",fontSize:12}}>{l.item}</b></td>
                  <td style={{cursor:onItemClick?"pointer":"default"}} onClick={()=>onItemClick&&it&&onItemClick(it)}>
                    <span style={{color:"#2f6df0",textDecoration:onItemClick?"underline dotted":"none",fontWeight:600}}>{l.itemName}</span>
                  </td>
                  <td><span className={`badge ${typeBadge(it?.type||"")}`}>{it?.type||"-"}</span></td>
                  <td><b style={{fontFamily:"monospace",color:"#2f6df0",fontSize:12}}>{l.code}</b></td>
                  <td style={{textAlign:"right",fontWeight:700,color:l._qty<=0?"#e74c3c":l._qty<(it?.minStock||0)?"#e67e22":"inherit"}}>
                    {fmt3(l._qty)}<span style={{fontSize:11,color:"var(--muted)",fontWeight:500,marginLeft:3}}>{it?.unit||"EA"}</span>
                    {!l._avail&&l._qty>0&&<span style={{fontSize:10,color:"#c47d12",marginLeft:5,fontWeight:600}}>🔒 가용제외</span>}
                    {qtyChanged&&<span style={{fontSize:10,color:"#888",marginLeft:5}}>(현재 {fmt3(l.qty)})</span>}
                  </td>
                  <td style={{textAlign:"right",fontSize:12,color:"var(--muted)"}}>{it?.minStock?<>{fmt3(it.minStock)}<span style={{marginLeft:3}}>{it?.unit||"EA"}</span></>:"-"}</td>
                  <td><StockLevel cur={l._qty} safe={it?.minStock||0}/></td>
                  <td style={{fontSize:12,color:"#888"}}>{l.mfg||"-"}</td>
                  <td style={{color:l.status==="만료임박"?"#e67e22":l.status==="만료"?"#e74c3c":"#888",fontSize:12}}>{l.exp||"-"}</td>
                  <td style={{fontSize:12}}>{l.warehouse||"-"}</td>
                  <td><div style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap"}}><span className={`badge ${l.status==="정상"?"badge-green":l.status==="만료임박"?"badge-orange":l.status==="불량"?"badge-red":"badge-gray"}`}>{l.status}</span>{!l._avail&&<span className={`badge ${qcBadge(l._qc)}`}>{l._qc}</span>}</div></td>
                  <td>{(it?.type==="완제품"||it?.type==="반제품")&&<button className="btn btn-outline btn-sm" style={{color:"#7c3aed",borderColor:"#7c3aed",fontSize:11}} onClick={()=>openTrace(l)}>🔍 추적</button>}</td>
                  {perm?.canDelete&&<td><button className="btn btn-danger btn-sm" onClick={()=>del(l.code)}>삭제</button></td>}
                </tr>
              );
            })}
            {!filteredLots.length&&<tr><td colSpan={perm?.canDelete?13:12} className="empty">{hideZero?"수량 있는 LOT 없음 (0인 LOT는 숨김 처리됨)":"해당 조건의 LOT 없음"}</td></tr>}
          </tbody>
        </table>
