      </div>
      ):(
      /* 필터 + 카드 보기 (스크린샷 변형 B) — 좌측 다중필터 패널 */
      <div className="stk-card-wrap">
        <aside className="stk-filter">
          <div className="stk-fsearch"><span style={{color:"var(--faint)",fontSize:13}}>🔍</span><input value={q} onChange={e=>setQ(e.target.value)} placeholder="품목 검색"/></div>
          <div className="stk-fgroup">
            <div className="stk-flabel">창고</div>
            {whCounts.map(w=>(
              <label key={w.name} className="stk-fitem"><input type="checkbox" checked={cWh.has(w.name)} onChange={()=>toggleSet(setCWh)(w.name)}/><span className="stk-fname">{w.name}</span><span className="stk-fcount">{w.n}</span></label>
            ))}
            {!whCounts.length&&<div style={{fontSize:12,color:"var(--faint)"}}>창고 없음</div>}
          </div>
          <div className="stk-fgroup">
            <div className="stk-flabel">분류</div>
            {["완제품","반제품","원자재","부자재"].map(t=>(
              <label key={t} className="stk-fitem"><input type="checkbox" checked={cType.has(t)} onChange={()=>toggleSet(setCType)(t)}/><span className="stk-fname">{t}</span></label>
            ))}
          </div>
          <div className="stk-fgroup">
            <div className="stk-flabel">안전상태</div>
            {["정상","경고","부족"].map(st=>(
              <label key={st} className="stk-fitem"><input type="checkbox" checked={cStatus.has(st)} onChange={()=>toggleSet(setCStatus)(st)}/><span className="stk-fname">{st}</span></label>
            ))}
          </div>
          <div className="stk-fgroup">
            <div className="stk-flabel">품질상태</div>
            {QC_STATES.map(st=>(
              <label key={st} className="stk-fitem"><input type="checkbox" checked={cQc.has(st)} onChange={()=>toggleSet(setCQc)(st)}/><span className="stk-fname">{st}</span></label>
            ))}
          </div>
          <div style={{padding:"4px 12px 12px"}}><button className="btn btn-outline btn-sm" style={{width:"100%"}} onClick={()=>{setCWh(new Set());setCType(new Set());setCStatus(new Set());setCQc(new Set());setQ("");}}>필터 초기화</button></div>
        </aside>
        <div>
          <div className="stk-cardbar">
            <span className="stk-count">재고 항목 {cardLots.length}개</span>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div className="seg-toggle">
                <button className={`seg-btn${cardLayout==="grid"?" is-on":""}`} onClick={()=>setCardLayout("grid")} title="카드">▦</button>
                <button className={`seg-btn${cardLayout==="list"?" is-on":""}`} onClick={()=>setCardLayout("list")} title="목록">≣</button>
              </div>
              <button className="btn btn-outline btn-sm" onClick={()=>downloadCSV(
                ["LOT번호","품목코드","품목명","유형","수량","제조일","유효기간","창고","안전상태","품질상태"],
                cardLots.map(l=>{const it=items.find(x=>x.code===l.item);return[l.code,l.item,l.itemName,it?.type||"",l._qty,l.mfg,l.exp,l.warehouse,safetyStatus(l),l._qc];})
                ,"LOT현황.csv")}>📥 내보내기</button>
            </div>
          </div>
          {cardLayout==="grid"?(
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:14}}>
            {cardLots.map((l,i)=>{
              const it=items.find(x=>x.code===l.item);
              const ss=safetyStatus(l);
              const stTone=ss==="정상"?"badge-green":ss==="경고"?"badge-orange":"badge-red";
              return(
                <div key={i} style={{background:"#fff",border:"1px solid var(--line)",borderRadius:12,boxShadow:"var(--shadow)",padding:14,display:"flex",flexDirection:"column",gap:4}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:2,gap:4}}>
                    <span style={{width:30,height:30,display:"grid",placeItems:"center",borderRadius:8,background:"var(--line-soft)",border:"1px solid var(--line)",fontSize:15}}>📦</span>
                    <div style={{display:"flex",gap:4,flexWrap:"wrap",justifyContent:"flex-end"}}>
                      {!l._avail&&<span className={`badge ${qcBadge(l._qc)}`}>{l._qc}</span>}
                      <span className={`badge ${stTone}`}>{ss}</span>
                    </div>
                  </div>
                  <div style={{fontWeight:700,fontSize:14,cursor:onItemClick?"pointer":"default",color:onItemClick?"#2f6df0":"inherit"}} onClick={()=>onItemClick&&it&&onItemClick(it)}>{l.itemName}</div>
                  <div style={{fontFamily:"monospace",fontSize:12,color:"var(--muted)"}}>{l.item} · {l.code}</div>
                  <div style={{display:"flex",alignItems:"baseline",gap:6,margin:"6px 0 2px"}}>
                    <b style={{fontSize:22,fontWeight:800,color:!l._avail?"#c47d12":l._qty<=0?"#e74c3c":l._qty<(it?.minStock||0)?"#e67e22":"inherit"}}>{fmt3(l._qty)}</b>
                    <span style={{fontSize:12,color:"var(--muted)"}}>{it?.unit||"EA"}</span>
                    {!l._avail&&l._qty>0&&<span style={{fontSize:10,color:"#c47d12",fontWeight:700,marginLeft:"auto"}}>🔒 가용제외</span>}
                  </div>
                  <StockLevel cur={l._qty} safe={it?.minStock||0}/>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"var(--muted)",marginTop:6}}>
                    <span>안전 {it?.minStock?fmt3(it.minStock):"-"}</span><span>{l.warehouse||"-"}</span>
                  </div>
                </div>
              );
            })}
            {!cardLots.length&&<div className="empty" style={{gridColumn:"1/-1"}}>{hideZero?"수량 있는 LOT 없음 (0인 LOT는 숨김 처리됨)":"해당 조건의 LOT 없음"}</div>}
          </div>
          ):(
          <div className="panel">
            <table>
              <thead><tr><th>품목코드</th><th>품목명</th><th>LOT번호</th><th style={{textAlign:"right"}}>현재고</th><th style={{textAlign:"right"}}>안전재고</th><th style={{width:120}}>재고수준</th><th>창고</th><th>안전상태</th><th>품질상태</th></tr></thead>
              <tbody>
                {cardLots.map((l,i)=>{
                  const it=items.find(x=>x.code===l.item);
                  const ss=safetyStatus(l);
                  const stTone=ss==="정상"?"badge-green":ss==="경고"?"badge-orange":"badge-red";
                  return(
                    <tr key={i}>
                      <td><b style={{fontFamily:"monospace",color:"#1b2333",fontSize:12}}>{l.item}</b></td>
                      <td style={{cursor:onItemClick?"pointer":"default",color:onItemClick?"#2f6df0":"inherit",fontWeight:600}} onClick={()=>onItemClick&&it&&onItemClick(it)}>{l.itemName}</td>
                      <td><b style={{fontFamily:"monospace",color:"#2f6df0",fontSize:12}}>{l.code}</b></td>
                      <td style={{textAlign:"right",fontWeight:700}}>{fmt3(l._qty)}<span style={{fontSize:11,color:"var(--muted)",fontWeight:500,marginLeft:3}}>{it?.unit||"EA"}</span></td>
                      <td style={{textAlign:"right",fontSize:12,color:"var(--muted)"}}>{it?.minStock?<>{fmt3(it.minStock)}<span style={{marginLeft:3}}>{it?.unit||"EA"}</span></>:"-"}</td>
                      <td><StockLevel cur={l._qty} safe={it?.minStock||0}/></td>
                      <td style={{fontSize:12}}>{l.warehouse||"-"}</td>
                      <td><span className={`badge ${stTone}`}>{ss}</span></td>
                      <td><span className={`badge ${qcBadge(l._qc)}`}>{l._qc}</span></td>
                    </tr>
                  );
                })}
                {!cardLots.length&&<tr><td colSpan={9} className="empty">{hideZero?"수량 있는 LOT 없음 (0인 LOT는 숨김 처리됨)":"해당 조건의 LOT 없음"}</td></tr>}
              </tbody>
            </table>
          </div>
          )}
        </div>
      </div>
      )}
      {traceModal&&(
        <div className="overlay" onClick={()=>setTraceModal(null)}>
          <div className="modal" style={{width:560}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <span className="modal-title" style={{color:"#7c3aed"}}>🔍 LOT 추적 — {traceModal.lot.code}</span>
              <button className="modal-close" onClick={()=>setTraceModal(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div style={{background:"#f5f3ff",borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:13}}>
                <b>{traceModal.lot.itemName}</b> · 수량 {fmt3(traceModal.lot.qty)}EA · 제조일 {traceModal.lot.mfg||"-"} · 창고 {traceModal.lot.warehouse||"-"}
              </div>
              {!traceModal.result&&(
                <div style={{textAlign:"center",padding:"30px 0",color:"#888",fontSize:13}}>
                  ℹ️ 작업지시서로 생산된 LOT가 아니거나 추적 정보가 없습니다.
                </div>
              )}
              {traceModal.result&&(
                <>
                  <div style={{fontSize:13,fontWeight:600,color:"#555",marginBottom:8}}>📋 작업지시서: <span style={{color:"#2f6df0"}}>{traceModal.result.woCode}</span></div>
                  <div style={{fontSize:13,fontWeight:600,color:"#555",marginBottom:6}}>📦 투입된 원자재 LOT</div>
                  {traceModal.result.matRecs.length===0&&<div style={{fontSize:12,color:"#aaa",padding:"8px 0"}}>투입 기록 없음 (수동 완료 처리된 경우)</div>}
                  {traceModal.result.matRecs.length>0&&(
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                      <thead><tr style={{background:"#1a2236",color:"#fff"}}>
                        <th style={{padding:"6px 10px",textAlign:"left"}}>품목명</th>
                        <th style={{padding:"6px 10px",textAlign:"left"}}>LOT번호</th>
                        <th style={{padding:"6px 10px",textAlign:"right"}}>출고수량</th>
                        <th style={{padding:"6px 10px",textAlign:"left"}}>출고일</th>
                      </tr></thead>
                      <tbody>{traceModal.result.matRecs.map((r,i)=>(
                        <tr key={i} style={{borderBottom:"1px solid #f0f0f0"}}>
                          <td style={{padding:"6px 10px"}}>{r.itemName}</td>
                          <td style={{padding:"6px 10px",fontFamily:"monospace",color:"#7c3aed"}}>{r.lot||"-"}</td>
                          <td style={{padding:"6px 10px",textAlign:"right"}}>{fmt3(r.qty)}</td>
                          <td style={{padding:"6px 10px",color:"#888"}}>{r.date}</td>
                        </tr>
                      ))}</tbody>
                    </table>
                  )}
                </>
              )}
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={()=>setTraceModal(null)}>닫기</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function LotPage({lots,setLots,items,warehouses,perm,showToast,tryDelete,downloadCSV,navSearch,onNavConsumed}) {
  const [q,setQ]=useState(""); const [modal,setModal]=useState(null);
  useEffect(()=>{ if(navSearch&&navSearch.pg==="lot"){ setQ(navSearch.v); onNavConsumed&&onNavConsumed(); } },[navSearch]);
  const [form,setForm]=useState({code:"",item:"",itemName:"",qty:0,mfg:"",exp:"",status:"정상",qcStatus:"적합",warehouse:""});
  const [qcF,setQcF]=useState("");
  const [sel,setSel]=useState(new Set());
  const [startDate,setStartDate]=useState("");
  const [endDate,setEndDate]=useState("");
  const today=new Date().toISOString().slice(0,10);
  const [expF,setExpF]=useState("");
  const dateStyle={border:"1px solid #ddd",borderRadius:5,padding:"5px 8px",fontSize:12,cursor:"pointer"};
  // 유효기간 자동판정 (실데이터: exp - today). 임박 = 60일 이내
  const expInfo=(l)=>{
    if(!l.exp) return {key:"none",label:"기한없음",tone:""};
    const days=Math.floor((new Date(l.exp).getTime()-new Date(today).getTime())/86400000);
    if(days<0) return {key:"expired",label:"만료",tone:"badge-red"};
    if(days<=60) return {key:"soon",label:`임박 D-${days}`,tone:"badge-orange"};
    return {key:"valid",label:"유효",tone:"badge-green"};
  };
  const filtered=lots.filter(l=>{
    if(q&&!l.code.includes(q)&&!l.itemName.includes(q)) return false;
    if(startDate&&l.mfg&&l.mfg<startDate) return false;
    if(endDate&&l.mfg&&l.mfg>endDate) return false;
    if(expF&&expInfo(l).key!==expF) return false;
    if(qcF&&effQc(l)!==qcF) return false;
    return true;
  });
  const liveLots=lots.filter(l=>(l.qty||0)>0);
  const kQcWait=liveLots.filter(l=>effQc(l)==="검사대기").length;
  const kSoon=liveLots.filter(l=>expInfo(l).key==="soon").length;
  const kExpired=liveLots.filter(l=>expInfo(l).key==="expired").length;
  const kValid=liveLots.length-kSoon-kExpired;
  const toggleSel=(code)=>setSel(prev=>{const s=new Set(prev);s.has(code)?s.delete(code):s.add(code);return s;});
  const openAdd=()=>{setForm({code:"LOT"+Date.now(),item:"",itemName:"",qty:0,mfg:"",exp:"",status:"정상",qcStatus:"적합",warehouse:""});setModal("add");};
  const setQc=(code,val)=>setLots(lots.map(l=>l.code===code?{...l,qcStatus:val}:l));
  const save=()=>{if(!form.item){showToast("품목을 선택해주세요");return;}if(modal==="add"){setLots([...lots,form]);}else{setLots(lots.map(l=>l.code===form.code?form:l));}showToast("저장되었습니다."); setModal(null);};
  const del=(code)=>{tryDelete([],()=>{setLots(lots.filter(l=>l.code!==code));showToast("삭제되었습니다.");},"LOT 삭제 불가");};
  const bulkDel=()=>{const n=sel.size;if(!window.confirm(`선택한 ${n}개를 삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.`))return;setLots(lots.filter(l=>!sel.has(l.code)));setSel(new Set());showToast(`${n}개 삭제되었습니다.`);};
  return (
    <div>
      <div className="page-header">
        <div><div className="crumb">MedERP <span>›</span> <b>LOT 관리</b></div><div className="page-title">LOT 관리</div><div className="page-sub">LOT별 잔량·제조일·유효기간을 관리하고 임박/만료 LOT을 추적합니다</div></div>
        <div style={{display:"flex",gap:8}}>
          {perm.canDelete&&sel.size>0&&<button className="btn btn-danger" onClick={bulkDel}>🗑 선택 삭제 ({sel.size})</button>}
          <button className="btn btn-outline" onClick={()=>downloadCSV(["LOT번호","품목","수량","제조일","유효기간","상태","창고"],lots.map(l=>[l.code,l.itemName,l.qty,l.mfg,l.exp,l.status,l.warehouse]),"LOT목록.csv")}>📥 목록 다운로드</button>
          {perm.canAdmin&&<>
            <button className="btn btn-outline" onClick={()=>downloadTemplate(
              ["LOT번호","품목코드","품목명","수량","제조일","유효기간","창고"],
              ["LOT20260101","IMPC-001","원자재A","100","2026-01-01","2028-01-01","창고1"],
              "LOT_업로드양식.csv"
            )}>📋 양식 다운로드</button>
            <UploadBtn label="📂 CSV 업로드" onUpload={(text)=>{
              const {headers,rows}=parseCsvRows(text);
              const hi=(name)=>headers.findIndex(h=>h===name||h.replace(/\s/g,"")===name);
              const iCode=hi("LOT번호"); const iItem=hi("품목코드"); const iName=hi("품목명");
              const iQty=hi("수량"); const iMfg=hi("제조일"); const iExp=hi("유효기간"); const iWh=hi("창고");
              if(iItem<0){showToast("❌ 품목코드 컬럼이 필요합니다");return;}
              let added=0, skipped=0;
              const newLots=[...lots];
              rows.forEach(r=>{
                const itemCode=(r[iItem]||"").trim();
                if(!itemCode){skipped++;return;}
                const it=items.find(i=>i.code===itemCode);
                const lotCode=iCode>=0&&r[iCode]?.trim()?r[iCode].trim():"LOT"+Date.now()+Math.random().toString(36).slice(2,6);
                if(newLots.find(l=>l.code===lotCode)){skipped++;return;}
                newLots.push({
                  code:lotCode,
                  item:itemCode,
                  itemName:iName>=0?(r[iName]||it?.name||itemCode):it?.name||itemCode,
                  qty:iQty>=0?parseFloat(r[iQty])||0:0,
                  mfg:iMfg>=0?(r[iMfg]||""):"",
                  exp:iExp>=0?(r[iExp]||""):"",
                  status:"정상",
                  qcStatus:"적합",
                  warehouse:iWh>=0?(r[iWh]||""):""
                });
                added++;
              });
              setLots(newLots);
              showToast(`✅ ${added}개 추가 완료 (중복/오류 ${skipped}건 건너뜀)`);
            }}/>
          </>}
          {perm.canCreate&&<button className="btn btn-primary" onClick={openAdd}>+ LOT 등록</button>}
        </div>
      </div>
      <div className="kpis" style={{gridTemplateColumns:"repeat(4,1fr)"}}>
        <div className="kpi" onClick={()=>setExpF("")}>
          <div className="kpi-chip blue">📦</div><div className="kpi-label">잔량 보유 LOT</div>
          <div className="kpi-val">{liveLots.length}<span className="kpi-unit">건</span></div>
          <div className="kpi-trend"><span className="t-note">수량 {">"}0 LOT</span></div>
        </div>
        <div className="kpi" onClick={()=>setExpF("valid")}>
          <div className="kpi-chip green">✅</div><div className="kpi-label">유효</div>
          <div className="kpi-val">{kValid}<span className="kpi-unit">건</span></div>
          <div className="kpi-trend"><span className="t-note">유효기간 여유</span></div>
        </div>
        <div className="kpi" onClick={()=>setExpF("soon")}>
          <div className="kpi-chip amber">⏰</div><div className="kpi-label">유효기간 임박</div>
          <div className="kpi-val">{kSoon}<span className="kpi-unit">건</span></div>
          <div className="kpi-trend"><span className="t-note">60일 이내 만료</span></div>
        </div>
        <div className="kpi" onClick={()=>setExpF("expired")}>
          <div className="kpi-chip red">⚠️</div><div className="kpi-label">만료</div>
          <div className="kpi-val">{kExpired}<span className="kpi-unit">건</span></div>
          <div className="kpi-trend"><span className="t-note">유효기간 경과</span></div>
        </div>
      </div>
      <div className="panel">
        <div className="panel-top">
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <input placeholder="LOT번호/품목명 검색" value={q} onChange={e=>setQ(e.target.value)}/>
            <select value={qcF} onChange={e=>setQcF(e.target.value)} style={{height:34,border:"1px solid var(--line)",borderRadius:8,padding:"0 10px",fontSize:13,background:"#fff",cursor:"pointer"}}>
              <option value="">품질상태: 전체</option>{QC_STATES.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
            {kQcWait>0&&<button className="btn btn-sm" onClick={()=>setQcF(qcF==="검사대기"?"":"검사대기")} style={qcF==="검사대기"?{background:"var(--accent-soft)",color:"var(--accent)",border:"1px solid var(--accent)"}:{background:"var(--accent-soft)",color:"var(--accent)",border:"1px solid #bcd4fb"}}>🔬 검사대기 {kQcWait}</button>}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            {expF&&<button className="btn btn-outline btn-sm" onClick={()=>setExpF("")} style={{color:"var(--accent)",borderColor:"var(--accent)"}}>유효성: {expF==="valid"?"유효":expF==="soon"?"임박":expF==="expired"?"만료":expF} ✕</button>}
            <span style={{fontSize:12,color:"#666"}}>제조일</span>
            <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} style={dateStyle}/>
            <span style={{fontSize:12,color:"#aaa"}}>~</span>
            <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} style={dateStyle}/>
            <button className="btn btn-outline btn-sm" onClick={()=>{setStartDate(today);setEndDate(today);}}>오늘</button>
            <button className="btn btn-outline btn-sm" onClick={()=>{setStartDate("");setEndDate("");}}>전체</button>
            <span style={{fontSize:12,color:"#aaa"}}>{filtered.length}건</span>
          </div>
        </div>
        <table><thead><tr><th style={{width:36,textAlign:"center"}}>선택</th><th>LOT번호</th><th>품목코드</th><th>품목명</th><th style={{textAlign:"right"}}>잔량</th><th>제조일</th><th>유효기간</th><th>유효성</th><th>창고</th><th>상태</th><th>품질상태</th><th>관리</th></tr></thead>
        <tbody>{filtered.map(l=>{
          const ex=expInfo(l);
          return(
          <tr key={l.code} style={ex.key==="expired"?{background:"#fdf0ee"}:undefined}>
            <td style={{textAlign:"center"}}><input type="checkbox" checked={sel.has(l.code)} onChange={()=>toggleSel(l.code)} style={{cursor:"pointer"}}/></td>
            <td><b>{l.code}</b></td><td style={{fontFamily:"monospace",fontSize:12,color:"var(--muted)"}}>{l.item||"-"}</td><td>{l.itemName}</td><td style={{textAlign:"right",fontWeight:700}}>{fmt3(l.qty)}</td><td>{l.mfg}</td><td>{l.exp||"-"}</td>
            <td>{ex.tone?<span className={`badge ${ex.tone}`}>{ex.label}</span>:<span style={{color:"var(--faint)",fontSize:12}}>-</span>}</td>
            <td>{l.warehouse}</td>
            <td><span className={`badge ${l.status==="정상"?"badge-green":l.status==="만료임박"?"badge-orange":"badge-red"}`}>{l.status}</span></td>
            <td>{perm.canEdit
              ? <span className="qc-sel-wrap" title="클릭하여 품질상태 변경">
                  <select value={effQc(l)} onChange={e=>setQc(l.code,e.target.value)} className={`badge qc-sel ${qcBadge(effQc(l))}`}>{QC_STATES.map(s=><option key={s} value={s} style={{background:"#fff",color:"#333"}}>{s}</option>)}</select>
                  <span className="qc-sel-arrow">▼</span>
                </span>
              : <span className={`badge ${qcBadge(effQc(l))}`}>{effQc(l)}</span>}</td>
            <td style={{display:"flex",gap:4}}>{perm.canEdit&&<button className="btn btn-outline btn-sm" onClick={()=>{setForm({...l});setModal("edit");}}>수정</button>}{perm.canDelete&&<button className="btn btn-danger btn-sm" onClick={()=>del(l.code)}>삭제</button>}</td>
          </tr>
          );
        })}{!filtered.length&&<tr><td colSpan={12} className="empty">검색 결과 없음</td></tr>}</tbody></table>
      </div>
      {modal&&(<div className="overlay"><div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><span className="modal-title">LOT {modal==="add"?"등록":"수정"}</span><button className="modal-close" onClick={()=>setModal(null)}>✕</button></div>
        <div className="modal-body">
          <div className="field"><label>LOT번호</label><input value={form.code} disabled/></div>
          <div className="field"><label>품목 *</label><select value={form.item} onChange={e=>{const it=items.find(i=>i.code===e.target.value);setForm({...form,item:e.target.value,itemName:it?it.name:""});}}><option value="">선택</option>{items.map(i=><option key={i.code} value={i.code}>{i.name}</option>)}</select></div>
          <div className="field-row"><div className="field"><label>수량</label><input type="number" value={form.qty} onChange={e=>setForm({...form,qty:+e.target.value})}/></div><div className="field"><label>창고</label><select value={form.warehouse} onChange={e=>setForm({...form,warehouse:e.target.value})}><option value="">선택</option>{warehouses.map(w=><option key={w.code}>{w.name}</option>)}</select></div></div>
          <div className="field-row"><div className="field"><label>제조일</label><input type="date" value={form.mfg} onChange={e=>setForm({...form,mfg:e.target.value})}/></div><div className="field"><label>유효기간</label><input type="date" value={form.exp} onChange={e=>setForm({...form,exp:e.target.value})}/></div></div>
          <div className="field-row"><div className="field"><label>상태</label><select value={form.status} onChange={e=>setForm({...form,status:e.target.value})}><option>정상</option><option>만료임박</option><option>만료</option><option>불량</option></select></div><div className="field"><label>품질상태 (검사)</label><select value={form.qcStatus||"적합"} onChange={e=>setForm({...form,qcStatus:e.target.value})}>{QC_STATES.map(s=><option key={s} value={s}>{s}</option>)}</select></div></div>
          <div style={{fontSize:11,color:"var(--muted)",marginTop:-2}}>※ 품질상태가 <b>적합</b>일 때만 가용재고로 집계됩니다. 입고 직후 기본값은 검사대기입니다.</div>
        </div>
        <div className="modal-foot"><button className="btn btn-outline" onClick={()=>setModal(null)}>취소</button><button className="btn btn-primary" onClick={save}>저장</button></div>
      </div></div>)}
    </div>
  );
}

function IncomingPage({incoming,setIncoming,items,setItems,lots,setLots,io,setIo,warehouses,perm,showToast,tryDelete,currentUser,navSearch,onNavConsumed}) {
  const [modal,setModal]=useState(null);
  const [reqModal,setReqModal]=useState(null); // 시험검사 의뢰서
  const [reqForm,setReqForm]=useState({});
  const today=new Date().toISOString().slice(0,10);
  const emptyForm={code:"",item:"",itemName:"",qty:0,unit:"EA",supplier:"",incomingDate:today,warehouse:"",status:"대기",unitPrice:0,lot:""};
  const [form,setForm]=useState(emptyForm);
  const [codeInput,setCodeInput]=useState("");
  const [sel,setSel]=useState(new Set());
  const [startDate,setStartDate]=useState(today);
  const [endDate,setEndDate]=useState("");
  const [statusF,setStatusF]=useState("");
  const [q,setQ]=useState("");
  const dateStyle={border:"1px solid #ddd",borderRadius:5,padding:"5px 8px",fontSize:12,cursor:"pointer"};
  // 전체검색에서 입고예정 클릭 시 품목명으로 필터 (1회 소비) — 날짜필터도 해제해 결과가 가려지지 않게
  useEffect(()=>{ if(navSearch&&navSearch.pg==="incoming"){ setQ(navSearch.v); setStartDate(""); setEndDate(""); onNavConsumed&&onNavConsumed(); } },[navSearch]);
  const toggleSel=(code)=>setSel(prev=>{const s=new Set(prev);s.has(code)?s.delete(code):s.add(code);return s;});
  const materialItems=items; // 모든 품목 유형 허용 (완제품·반제품·원자재·부자재)

  const pickItem=(code)=>{
    const it=materialItems.find(i=>i.code===code);
    if(it){setForm(f=>({...f,item:it.code,itemName:it.name,unit:it.unit,unitPrice:it.price||0}));setCodeInput(it.code);}
  };
  const openAdd=()=>{
    const newCode="INC"+Date.now();
    setForm({...emptyForm,code:newCode,incomingDate:new Date().toISOString().slice(0,10),lot:"LOT"+Date.now()});
    setCodeInput("");setModal("add");
  };
  const openEdit=(i)=>{setForm({...emptyForm,...i,unitPrice:i.unitPrice||0,lot:i.lot||""});setCodeInput(i.item||"");setModal("edit");};

  const save=()=>{
    if(!form.item){showToast("품목을 선택해주세요");return;}
    const entry={...form};
    if(modal==="add"){setIncoming([...incoming,entry]);}
    else{setIncoming(incoming.map(i=>i.code===entry.code?entry:i));}
    if(entry.unitPrice>0){setItems(items.map(i=>i.code===entry.item?{...i,price:entry.unitPrice}:i));}
    // LOT 생성은 입고 처리(handleIncoming) 시점에 수행 — 등록 시에는 생성 안 함
    showToast("저장되었습니다.");setModal(null);
  };
  const del=(code)=>{tryDelete([],()=>{setIncoming(incoming.filter(i=>i.code!==code));showToast("삭제되었습니다.");},"입고 예정 삭제 불가");};
  const openReqMulti=()=>{const selected=sel.size>0?incoming.filter(i=>sel.has(i.code)):[];const nextDay=new Date(today);nextDay.setDate(nextDay.getDate()+1);const _sqText="\n"+selected.map((i,idx)=>`1.${idx+1} ${i.itemName||""} (${i.lot||""})`).join("\n");const _psText="\n"+selected.map((i,idx)=>`2.${idx+1} ${i.itemName||""} (${i.lot||""})`).join("\n");setReqForm({requester:"",dept:"",reqDate:today,itemName:selected.map(i=>i.itemName||"").filter(Boolean).map(n=>`- ${n}`).join("\n"),lot:selected.map(i=>i.lot||"").filter(Boolean).map(l=>`- ${l}`).join("\n"),qty:selected.reduce((s,i)=>s+(i.qty||0),0),unit:selected.length===1?(selected[0].unit||"EA"):"EA",supplier:[...new Set(selected.map(i=>i.supplier||"").filter(Boolean))].join(", "),dueDate:nextDay.toISOString().slice(0,10),inspector:"",inspType:"입고 검사",sampleQty:_sqText,processState:_psText,etc:""});setReqModal(true);};
  const bulkDel=()=>{const n=sel.size;if(!window.confirm(`선택한 ${n}개를 삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.`))return;setIncoming(incoming.filter(i=>!sel.has(i.code)));setSel(new Set());showToast(`${n}개 삭제되었습니다.`);};

  const handleIncoming=(entry)=>{
    if(entry.status==="완료"){showToast("이미 입고 처리된 항목입니다.");return;}
    // 입출고 이력 추가
    const ioEntry={
      date:entry.incomingDate||new Date().toISOString().slice(0,10),
      type:"입고",
      item:entry.item,
      itemName:entry.itemName,
      qty:entry.qty,
      unit:entry.unit||"EA",
      unitPrice:entry.unitPrice||0,
      lot:entry.lot||"",
      destination:"",
      manager:"",
      approver:"",
      note:entry.supplier||""
    };
    setIo(prev=>[...prev,ioEntry]);
    // 품목 재고 증가 (items.stock)
    setItems(prev=>prev.map(i=>i.code===entry.item?{...i,stock:(i.stock||0)+entry.qty,...(entry.unitPrice>0?{price:entry.unitPrice}:{})}:i));
    // LOT 생성 또는 수량 추가 → 재고현황(StockPage)에 반영
    if(entry.lot&&entry.qty>0){
      setLots(prev=>{
        const exists=prev.find(l=>l.code===entry.lot);
        if(!exists){
          return [...prev,{code:entry.lot,item:entry.item,itemName:entry.itemName,qty:entry.qty,mfg:entry.incomingDate,exp:"",status:"정상",qcStatus:"검사대기",warehouse:entry.warehouse||""}];
        } else {
          return prev.map(l=>l.code===entry.lot?{...l,qty:(l.qty||0)+entry.qty}:l);
        }
      });
    }
    // 입고 예정 상태 → 완료
    setIncoming(prev=>prev.map(i=>i.code===entry.code?{...i,status:"완료"}:i));
    showToast(`${entry.itemName} 입고 처리 완료 — 재고현황에 즉시 반영되었습니다.`);
  };

  // 날짜 범위 필터 (KPI·목록 공통 기준)
  const inDateRange=(i)=>{const d=i.incomingDate||i.eta||"";if(startDate&&d<startDate)return false;if(endDate&&d>endDate)return false;return true;};
  // 날짜+상태+검색 필터 (목록 표시용)
  const visible=incoming.filter(i=>{
    if(!inDateRange(i))return false;
    if(statusF==="대기"&&i.status==="완료")return false;
    if(statusF==="완료"&&i.status!=="완료")return false;
    if(q&&!(`${i.itemName||""} ${i.item||""} ${i.lot||""} ${i.supplier||""}`.toLowerCase().includes(q.toLowerCase())))return false;
    return true;
  });
  // KPI 요약 — 현재 날짜 범위 기준(상태/검색과 무관). 목록과 카운트가 일치하도록
  const dateScoped=incoming.filter(inDateRange);
  const kPending=dateScoped.filter(i=>i.status!=="완료").length;
  const kToday=dateScoped.filter(i=>(i.incomingDate||i.eta||"")===today&&i.status!=="완료").length;
  const kDone=dateScoped.filter(i=>i.status==="완료").length;
  const kPendQty=dateScoped.filter(i=>i.status!=="완료").reduce((s,i)=>s+(i.qty||0),0);

  return (
    <div>
      <div className="page-header">
        <div><div className="crumb">MedERP <span>›</span> <b>입고 예정</b></div><div className="page-title">입고 예정</div><div className="page-sub">완제품·원자재·부자재 입고 등록 — 입고 처리 시 입출고 이력 자동 등록 — LOT 지정 시 LOT 자동 생성</div></div>
        <div style={{display:"flex",gap:8}}>
          {perm.canDelete&&sel.size>0&&<button className="btn btn-danger" onClick={bulkDel}>🗑 선택 삭제 ({sel.size})</button>}
          {perm.canAdmin&&<>
            <button className="btn btn-outline" onClick={()=>downloadTemplate(
              ["품목코드","품목명","수량","입고예정일","공급업체","창고","단가","LOT번호"],
              ["IMPC-001","원자재A","100","2026-06-01","공급업체명","창고1","1000","LOT20260601"],
              "입고예정_업로드양식.csv"
            )}>📋 양식 다운로드</button>
            <UploadBtn label="📂 CSV 업로드" onUpload={(text)=>{
              const {headers,rows}=parseCsvRows(text);
              const hi=(name)=>headers.findIndex(h=>h===name||h.replace(/\s/g,"")===name);
              const iItem=hi("품목코드"); const iName=hi("품목명"); const iQty=hi("수량");
              const iDate=hi("입고예정일"); const iSup=hi("공급업체"); const iWh=hi("창고");
              const iPrice=hi("단가"); const iLot=hi("LOT번호");
              if(iItem<0){showToast("❌ 품목코드 컬럼이 필요합니다");return;}
              let added=0, skipped=0;
              const newInc=[...incoming];
              const today2=new Date().toISOString().slice(0,10);
              rows.forEach(r=>{
                const itemCode=(r[iItem]||"").trim();
                if(!itemCode){skipped++;return;}
                const qty=iQty>=0?parseFloat(r[iQty])||0:0;
                const incomingDate=iDate>=0?(r[iDate]||today2):today2;
                const supplier=iSup>=0?(r[iSup]||""):"";
                // 중복 체크: 품목코드 + 입고예정일 + 수량 + 공급업체가 모두 같으면 건너뜀
                const isDup=newInc.some(x=>x.item===itemCode&&x.incomingDate===incomingDate&&x.qty===qty&&x.supplier===supplier);
                if(isDup){skipped++;return;}
                const it=items.find(i=>i.code===itemCode);
                newInc.push({
                  code:"INC"+Date.now()+Math.random().toString(36).slice(2,5),
                  item:itemCode,
                  itemName:iName>=0?(r[iName]||it?.name||itemCode):it?.name||itemCode,
                  qty, unit:it?.unit||"EA", incomingDate, supplier,
                  warehouse:iWh>=0?(r[iWh]||""):it?.warehouse||"",
                  unitPrice:iPrice>=0?parseFloat(r[iPrice])||0:0,
                  lot:iLot>=0?(r[iLot]||""):"",
                  status:"대기"
                });
                added++;
              });
              setIncoming(newInc);
              showToast(`✅ ${added}개 추가 완료 (중복/오류 ${skipped}건 건너뜀)`);
            }}/>
          </>}
          {perm.canCreate&&<button className="btn btn-primary" onClick={openAdd}>+ 입고 등록</button>}
          <button className="btn btn-outline" style={{color:"#7c3aed",borderColor:"#7c3aed"}} onClick={openReqMulti}>📋 검사의뢰서{sel.size>0?` (${sel.size})`:""}</button>
        </div>
      </div>
      <div className="kpis" style={{gridTemplateColumns:"repeat(4,1fr)"}}>
        <div className="kpi"><div className="kpi-chip blue">🚚</div><div className="kpi-label">입고 예정</div><div className="kpi-val">{kPending}<span className="kpi-unit">건</span></div><div className="kpi-trend"><span className="t-note">선택 기간 · 미처리</span></div></div>
        <div className="kpi"><div className="kpi-chip amber">📅</div><div className="kpi-label">오늘 도착</div><div className="kpi-val">{kToday}<span className="kpi-unit">건</span></div><div className="kpi-trend"><span className="t-note">{today} 예정</span></div></div>
        <div className="kpi"><div className="kpi-chip green">✅</div><div className="kpi-label">입고 완료</div><div className="kpi-val">{kDone}<span className="kpi-unit">건</span></div><div className="kpi-trend"><span className="t-note">선택 기간 · 완료</span></div></div>
        <div className="kpi"><div className="kpi-chip violet">📦</div><div className="kpi-label">예정 수량</div><div className="kpi-val">{fmt3(kPendQty)}</div><div className="kpi-trend"><span className="t-note">선택 기간 · 미처리</span></div></div>
      </div>
      <div className="panel">
        <div className="panel-top">
          <input placeholder="품목명·코드·LOT·공급업체 검색" value={q} onChange={e=>setQ(e.target.value)}/>
          <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
            <span style={{fontSize:12,color:"#666"}}>입고일</span>
            <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} style={dateStyle}/>
            <span style={{fontSize:12,color:"#aaa"}}>~</span>
            <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} style={dateStyle}/>
            <button className="btn btn-outline btn-sm" onClick={()=>{setStartDate(today);setEndDate("");}}>오늘~</button>
            <button className="btn btn-outline btn-sm" onClick={()=>{setStartDate("");setEndDate("");}}>전체</button>
            <select className="kbar-sel" style={{height:30,marginLeft:4}} value={statusF} onChange={e=>setStatusF(e.target.value)}><option value="">상태: 전체</option><option value="대기">대기/진행</option><option value="완료">완료</option></select>
          </div>
          <span style={{fontSize:12,color:"#aaa"}}>{visible.length}건</span>
        </div>
        <table><thead><tr>
          <th style={{width:36,textAlign:"center"}}>선택</th><th>코드</th><th>품목코드</th><th>품목명</th>
          <th style={{textAlign:"right"}}>수량</th>{perm.canViewPrice&&<th style={{textAlign:"right"}}>단가</th>}
          <th>공급업체</th><th>입고일</th><th>창고</th><th>LOT</th><th>상태</th><th>관리</th>
        </tr></thead>
        <tbody>{visible.map(i=>(
          <tr key={i.code}>
            <td style={{textAlign:"center"}}><input type="checkbox" checked={sel.has(i.code)} onChange={()=>toggleSel(i.code)} style={{cursor:"pointer"}}/></td>
            <td style={{fontSize:11,color:"#aaa"}}>{i.code}</td>
            <td><span style={{fontFamily:"monospace",fontSize:12,color:"#2f6df0"}}>{i.item}</span></td>
            <td><b>{i.itemName}</b></td>
            <td style={{textAlign:"right"}}>{fmt3(i.qty)} {i.unit}</td>
            {perm.canViewPrice&&<td style={{textAlign:"right",color:i.unitPrice>0?"#2f6df0":"#aaa"}}>{i.unitPrice>0?i.unitPrice.toLocaleString()+"원":"-"}</td>}
            <td>{i.supplier||"-"}</td>
            <td>{i.incomingDate||i.eta||"-"}</td>
            <td>{i.warehouse||"-"}</td>
            <td style={{fontSize:11,color:"#888"}}>{i.lot||"-"}</td>
            <td><span className={`badge ${i.status==="완료"?"badge-green":i.status==="대기"?"badge-blue":"badge-orange"}`}>{i.status}</span></td>
            <td style={{display:"flex",gap:4}}>
              <button className={`btn btn-sm ${i.status==="완료"?"btn-outline":"btn-green"}`} onClick={()=>handleIncoming(i)} disabled={i.status==="완료"} title={i.status==="완료"?"이미 입고 처리됨":"입고 처리"}>
                {i.status==="완료"?"✅ 완료":"📥 입고 처리"}
              </button>
              <button className="btn btn-outline btn-sm" style={{color:"#7c3aed",borderColor:"#7c3aed"}} onClick={()=>{
                const nextDay=new Date(i.incomingDate||today);nextDay.setDate(nextDay.getDate()+1);
                setReqForm({
                  requester: "",
                  dept: "",
                  reqDate: today,
                  itemName: `- ${i.itemName||""}`,
                  lot: `- ${i.lot||""}`,
                  qty: i.qty||0,
                  unit: i.unit||"EA",
                  supplier: i.supplier||"",
                  dueDate: nextDay.toISOString().slice(0,10),
                  inspector: "",
                  inspType: "입고 검사",
                  sampleQty: `\n1.1 ${i.itemName||""} (${i.lot||""})`,
                  processState: `\n2.1 ${i.itemName||""} (${i.lot||""})`,
                  etc: "",
                });
                setReqModal(true);
              }}>📋 의뢰서</button>
              {perm.canEdit&&<button className="btn btn-outline btn-sm" onClick={()=>openEdit(i)}>수정</button>}
              {perm.canDelete&&<button className="btn btn-danger btn-sm" onClick={()=>del(i.code)}>삭제</button>}
            </td>

      </div>

      {modal&&(<div className="overlay"><div className="modal" style={{width:600}} onClick={e=>e.stopPropagation()}>

              <label>품목코드 입력</label>

                  const v=e.target.value; setCodeInput(v);

              {codeInput&&!form.item&&(()=>{

                const hits=materialItems.filter(i=>i.code.toLowerCase().includes(_q)||i.name.toLowerCase().includes(_q));
                return hits.length>0?(
                  <div style={{position:"absolute",top:"100%",left:0,right:0,background:"#fff",border:"1px solid #2f6df0",borderRadius:6,boxShadow:"0 4px 12px rgba(0,0,0,0.12)",zIndex:200,maxHeight:180,overflowY:"auto"}}>
                    {hits.map(i=>(
                      <div key={i.code} onClick={()=>{pickItem(i.code);setCodeInput(i.code);}}
                        style={{padding:"8px 12px",cursor:"pointer",borderBottom:"1px solid #f0f0f0",fontSize:13}}
                        onMouseEnter={e=>e.currentTarget.style.background="#eff6ff"}
                        onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
                        <span style={{fontFamily:"monospace",color:"#2f6df0",fontWeight:600}}>{i.code}</span>
                        <span style={{marginLeft:8}}>{i.name}</span>
                        <span className={`badge ${i.type==="원자재"?"badge-green":"badge-orange"}`} style={{marginLeft:6,fontSize:10}}>{i.type}</span>
                      </div>
                    ))}
                  </div>
                ):null;
              })()}
            </div>
            {form.item&&<div style={{fontSize:12,color:"#16a34a",fontWeight:600,marginTop:6}}>✅ {form.itemName} ({form.unit}) — 현재 단가: {(form.unitPrice||0).toLocaleString()}원</div>}
          </div>

          <div className="field-row">
            <div className="field"><label>수량</label><input type="number" value={form.qty||""} placeholder="0" onFocus={e=>e.target.select()} onChange={e=>setForm({...form,qty:e.target.value===''?0:+e.target.value})}/></div>
            <div className="field"><label>단위</label><select value={form.unit||"EA"} onChange={e=>setForm({...form,unit:e.target.value})}>{UNITS.map(u=><option key={u} value={u}>{u}</option>)}</select></div>
            <div className="field"><label>단가 (원) <span style={{color:"#2f6df0",fontSize:11}}>★ 품목 단가 자동 반영</span></label><input type="number" value={form.unitPrice||""} placeholder="0" onFocus={e=>e.target.select()} onChange={e=>setForm({...form,unitPrice:e.target.value===''?0:+e.target.value})}/></div>
          </div>
          <div className="field-row">
            <div className="field"><label>공급업체</label><input value={form.supplier} onChange={e=>setForm({...form,supplier:e.target.value})}/></div>
            <div className="field"><label>입고일</label><input type="date" value={form.incomingDate} onChange={e=>setForm({...form,incomingDate:e.target.value})}/></div>
          </div>
          <div className="field-row">
            <div className="field">
              <label>입고 창고</label>
              <select value={form.warehouse} onChange={e=>setForm({...form,warehouse:e.target.value})}>
                <option value="">-- 창고 선택 --</option>
                {warehouses.map(w=><option key={w.code} value={w.name}>{w.name} ({w.type})</option>)}
              </select>
            </div>
            <div className="field"><label>LOT번호 <span style={{color:"#888",fontSize:11}}>(입력 시 LOT 자동 생성)</span></label><input value={form.lot} onChange={e=>setForm({...form,lot:e.target.value})} placeholder="예) LOT-2026-001"/></div>
          </div>
          <div className="field"><label>상태</label><select value={form.status} onChange={e=>setForm({...form,status:e.target.value})}><option>대기</option><option>진행중</option><option>완료</option></select></div>
          {form.unitPrice>0&&form.qty>0&&<div style={{background:"#eff6ff",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#2f6df0",marginTop:6}}>입고 금액 합계: <b>{(form.unitPrice*form.qty).toLocaleString()}원</b></div>}
        </div>
        <div className="modal-foot"><button className="btn btn-outline" onClick={()=>setModal(null)}>취소</button><button className="btn btn-primary" onClick={save}>저장</button></div>
      </div></div>)}

function IOPage({io,setIo,items,setItems,lots,setLots,perm,showToast,downloadCSV,onItemClick,currentUser}) {
  const [modal,setModal]=useState(false);
  const [editIdx,setEditIdx]=useState(null);
  const emptyForm={date:"",type:"입고",item:"",itemName:"",qty:0,unit:"EA",unitPrice:0,lot:"",destination:"",manager:currentUser?.name||"",approver:"",note:""};
  const [form,setForm]=useState(emptyForm);
  const [codeInput,setCodeInput]=useState("");
  const [sel,setSel]=useState(new Set());
  const [q,setQ]=useState("");
  const [startDate,setStartDate]=useState("");
  const [endDate,setEndDate]=useState("");
  const [ioTab,setIoTab]=useState("완제품");
  const _now=new Date();
  const [ioYear,setIoYear]=useState(_now.getFullYear());
  const [ioMonth,setIoMonth]=useState(_now.getMonth()+1);
  const today=new Date().toISOString().slice(0,10);
  const dateStyle={border:"1px solid #ddd",borderRadius:5,padding:"5px 8px",fontSize:12,cursor:"pointer"};
  const getItemType=(code)=>items.find(i=>i.code===code)?.type||"";

  const filteredIo=io.map((r,i)=>({...r,_idx:i})).filter(r=>{
    if(startDate&&r.date<startDate) return false;
    if(endDate&&r.date>endDate) return false;
    const t=getItemType(r.item);
    const note=r.note||"";
    const isQC=note.includes("품질검사");
    const isRT=note.includes("보관샘플");
    if(ioTab==="완제품") return (t==="완제품"||t==="반제품")&&!isQC&&!isRT;
    if(ioTab==="원자재") return t==="원자재";
    if(ioTab==="부자재") return t==="부자재";
    if(ioTab==="품질검사") return (t==="완제품"||t==="반제품")&&isQC;
    if(ioTab==="보관샘플") return (t==="완제품"||t==="반제품")&&isRT;
    return true;
  });

  // 누적 재고량 계산 (LOT별 개별 재고)
  const calcRunStock=(rows)=>{
    const lotKey=(item,lot)=>item+"__"+(lot||"");
    const baseline={};
    // 탭별 IO 필터 (날짜 제외) — baseline/preNetMap을 탭 범위로 한정
    const tabIo=io.filter(r=>{
      const t=getItemType(r.item);
      const note=r.note||"";
      const isQC=note.includes("품질검사");
      const isRT=note.includes("보관샘플");
      if(ioTab==="완제품") return (t==="완제품"||t==="반제품")&&!isQC&&!isRT;
      if(ioTab==="원자재") return t==="원자재";
      if(ioTab==="부자재") return t==="부자재";
      if(ioTab==="품질검사") return (t==="완제품"||t==="반제품")&&isQC;
      if(ioTab==="보관샘플") return (t==="완제품"||t==="반제품")&&isRT;
      return true;
    });
    // ── 성능: tabIo/io를 단일 패스로 사전집계 (O(n²) → O(n)) ──
    const aInMap={},aOutMap={},pInMap={},pOutMap={};
    tabIo.forEach(r=>{
      const k=lotKey(r.item,r.lot);
      const q=r.qty||0;
      if(r.type==="입고") aInMap[k]=(aInMap[k]||0)+q;
      else if(r.type==="출고") aOutMap[k]=(aOutMap[k]||0)+q;
      if(startDate&&r.date<startDate){
        if(r.type==="입고") pInMap[k]=(pInMap[k]||0)+q;
        else if(r.type==="출고") pOutMap[k]=(pOutMap[k]||0)+q;
      }
    });
    // QC/보관샘플 순수량은 탭과 무관하게 전체 io 기준 (기존 동작 유지)
    const qcNetMap={},rtNetMap={};
    io.forEach(r=>{
      const note=r.note||"";
      const isQC=note.includes("품질검사"),isRT=note.includes("보관샘플");
      if(!isQC&&!isRT) return;
      const k=lotKey(r.item,r.lot);
      const signed=r.type==="입고"?(r.qty||0):-(r.qty||0);
      if(isQC) qcNetMap[k]=(qcNetMap[k]||0)+signed;
      if(isRT) rtNetMap[k]=(rtNetMap[k]||0)+signed;
    });
    // 품목별 LOT 수량 합계 사전집계 (불량 LOT 제외 — IO 없고 정상재고 아님)
    const lotTotalMap={};
    lots.forEach(l=>{if(l.status==="불량")return;lotTotalMap[l.item]=(lotTotalMap[l.item]||0)+(l.qty||0);});
    // (품목,코드) 기준 LOT 수량 합계 — 같은 LOT이 여러 창고에 있을 때 합산 (창고이동 부분이동 대응). 불량 LOT 제외
    const lotKeyQty={},lotKeyCode={};
    lots.forEach(l=>{if(l.status==="불량")return;const k=lotKey(l.item,l.code);lotKeyQty[k]=(lotKeyQty[k]||0)+(l.qty||0);lotKeyCode[k]=l.code;});
    // LOT 있는 항목: 탭별 IO 기준으로 역산 (완제품 탭에서 QC/RT 수량 제외)
    Object.keys(lotKeyQty).forEach(k=>{
      const code=lotKeyCode[k];
      const aIn=aInMap[k]||0;
      const aOut=aOutMap[k]||0;
      // 완제품 탭: 동일 LOT 내 QC/RT 잔량을 lot.qty에서 차감 (기존 데이터 호환)
      let effQty=lotKeyQty[k];
      if(ioTab==="완제품"){
        const qcRem=qcNetMap[k]||0;
        const rtRem=rtNetMap[k]||0;
        effQty=Math.max(0,effQty-Math.max(0,qcRem)-Math.max(0,rtRem));
      } else if(ioTab==="품질검사"&&!code.endsWith("_QC")){
        effQty=Math.max(0,qcNetMap[k]||0);
      } else if(ioTab==="보관샘플"&&!code.endsWith("_RT")){
        effQty=Math.max(0,rtNetMap[k]||0);
      }
      baseline[k]=Math.max(0,effQty-aIn+aOut);
    });
    // LOT 없는 항목: items.stock에서 lot 합산분 제외
    items.forEach(it=>{
      const k=lotKey(it.code,"");
      const lotTotal=lotTotalMap[it.code]||0;
      const aIn=aInMap[k]||0;
      const aOut=aOutMap[k]||0;
      baseline[k]=Math.max(0,Math.max(0,(it.stock||0)-lotTotal)-aIn+aOut);
    });
    // rows에만 있는 key 보충
    rows.forEach(r=>{const k=lotKey(r.item,r.lot);if(baseline[k]===undefined)baseline[k]=0;});
    // 기간 시작일 이전 IO 누적 → 기간 개시잔고 (탭 필터 적용)
    const preNetMap={};
    Object.keys(baseline).forEach(k=>{
      preNetMap[k]=(pInMap[k]||0)-(pOutMap[k]||0);
    });
    const stock={};
    return rows.map(r=>{
      const k=lotKey(r.item,r.lot);
      if(stock[k]===undefined) stock[k]=(baseline[k]||0)+(preNetMap[k]||0);
      stock[k]+=(r.type==="입고"?(r.qty||0):-(r.qty||0));
      return {...r,runStock:stock[k]};
    });
  };
  const displayRows=calcRunStock([...filteredIo].sort((a,b)=>a.date.localeCompare(b.date)||a._idx-b._idx));
  // 검색은 running stock 계산 후 표시 단계에서만 적용 (재고량 연속성 보존)
  const shownRows=displayRows.filter(r=>{
    if(!q) return true;
    const s=q.toLowerCase();
    return (r.itemName||"").toLowerCase().includes(s)||(r.item||"").toLowerCase().includes(s)||
           (r.lot||"").toLowerCase().includes(s)||(r.note||"").toLowerCase().includes(s)||
           (r.manager||"").toLowerCase().includes(s);
  });

  const toggleSel=(idx)=>setSel(prev=>{const s=new Set(prev);s.has(idx)?s.delete(idx):s.add(idx);return s;});

  const lotRemaining=(lotCode)=>{
    if(!lotCode) return null;
    const lot=lots.find(l=>l.code===lotCode);
    if(!lot) return null;
    return lot.qty||0;
  };

  const doSave=()=>{
    if(!form.item){showToast("품목을 선택해주세요");return;}

    if(editIdx!==null){
      // 수정 모드: 원본 역산 후 새값 적용 (이중 차감 방지)
      const orig=io[editIdx];
      // Step1: 원본 효과 역산
      const origAdj=orig.type==="입고"?-(orig.qty||0):+(orig.qty||0);
      let newItems=items.map(it=>it.code===orig.item?{...it,stock:(it.stock||0)+origAdj}:it);
      let newLots=lots;
      if(orig.lot) newLots=newLots.map(l=>l.code===orig.lot?{...l,qty:Math.max(0,(l.qty||0)+origAdj)}:l);
      // Step2: 새 form 효과 적용
      const newAdj=form.type==="입고"?+(form.qty||0):-(form.qty||0);
      newItems=newItems.map(it=>it.code===form.item?{...it,stock:(it.stock||0)+newAdj,...(form.type==="입고"&&form.unitPrice>0?{price:form.unitPrice}:{})}:it);
      if(form.lot){
        const exists=newLots.find(l=>l.code===form.lot);
        if(exists) newLots=newLots.map(l=>l.code===form.lot?{...l,qty:Math.max(0,(l.qty||0)+newAdj)}:l);
        else if(form.type==="입고") newLots=[...newLots,{code:form.lot,item:form.item,itemName:form.itemName||"",qty:form.qty,mfg:form.date||"",exp:"",status:"정상",qcStatus:"검사대기",warehouse:""}];
      }
      setItems(newItems);
      setLots(newLots);
      setIo(io.map((r,i)=>i===editIdx?{...form}:r));
    } else if(form.type==="입고"){
      // 신규 입고
      setIo([...io,{...form}]);
      setItems(items.map(i=>i.code===form.item?{...i,stock:(i.stock||0)+form.qty,...(form.unitPrice>0?{price:form.unitPrice}:{})}:i));
      if(form.lot){
        setLots(prev=>{
          const exists=prev.find(l=>l.code===form.lot);
          if(exists) return prev.map(l=>l.code===form.lot?{...l,qty:(l.qty||0)+form.qty}:l);
          return [...prev,{code:form.lot,item:form.item,itemName:form.itemName||"",qty:form.qty,mfg:form.date||"",exp:"",status:"정상",qcStatus:"검사대기",warehouse:""}];
        });
      }
    } else if(form.type==="출고"){
      // 신규 출고
      setItems(items.map(i=>i.code===form.item?{...i,stock:(i.stock||0)-form.qty}:i));
      if(form.lot){
        setIo([...io,{...form}]);
        setLots(lots.map(l=>l.code===form.lot?{...l,qty:Math.max(0,(l.qty||0)-form.qty)}:l));
      } else {
        // LOT 미지정: FIFO → lot별 IO 기록 생성
        let remain=form.qty;
        const fifo=[...lots].filter(l=>l.item===form.item&&(l.qty||0)>0).sort((a,b)=>(a.mfg||"").localeCompare(b.mfg||""));
        const ioRecs=[];
        const deduct={};
        for(const l of fifo){
          if(remain<=0) break;
          const sub=Math.min(l.qty||0,remain);
          ioRecs.push({...form,qty:sub,lot:l.code});
          deduct[l.code]=sub;
          remain-=sub;
        }
        if(remain>0) ioRecs.push({...form,qty:remain,lot:""});
        setIo(prev=>[...prev,...ioRecs]);
        setLots(lots.map(l=>deduct[l.code]!=null?{...l,qty:Math.max(0,(l.qty||0)-deduct[l.code])}:l));
      }
    }
    showToast("저장되었습니다.");
    setModal(false);setEditIdx(null);
  };
  const openEdit=(r,idx)=>{setForm({...r});setCodeInput(r.item||"");setEditIdx(idx);setModal(true);};

  const save=()=>{
    if(!form.item){showToast("품목을 선택해주세요");return;}
    if(form.type==="출고"){
      // 편집 모드에서는 원본 출고분을 복원한 뒤 체크 (too-strict 방지)
      const orig=editIdx!==null?io[editIdx]:null;
      const origItemAdj=(orig&&orig.type==="출고"&&orig.item===form.item)?(orig.qty||0):0;
      const origLotAdj=(orig&&orig.type==="출고"&&orig.lot===form.lot)?(orig.qty||0):0;
      const it=items.find(i=>i.code===form.item);
      const effectiveStock=(it?it.stock:0)+origItemAdj;
      if(effectiveStock-form.qty<0){
        alert(`❌ 재고 부족으로 출고할 수 없습니다.\n\n품목: ${form.itemName}\n가용 재고: ${fmt3(effectiveStock)} ${form.unit||""}\n출고 요청: ${fmt3(form.qty)} ${form.unit||""}\n부족량: ${fmt3(form.qty-effectiveStock)} ${form.unit||""}`);
        return;
      }
      if(form.lot){
        const lotObj=lots.find(l=>l.code===form.lot);
        const effectiveLotQty=(lotObj?lotObj.qty:0)+origLotAdj;
        if(effectiveLotQty-form.qty<0){
          alert(`❌ LOT 재고 부족으로 출고할 수 없습니다.\n\nLOT: ${form.lot}\n가용 LOT 재고: ${fmt3(effectiveLotQty)} ${form.unit||""}\n출고 요청: ${fmt3(form.qty)} ${form.unit||""}\n부족량: ${fmt3(form.qty-effectiveLotQty)} ${form.unit||""}`);
          return;
        }
      } else {
        // 편집 모드: 원본 lot 복원분 포함한 FIFO 합계
        const origLotForFifo=(orig&&orig.type==="출고"&&orig.lot&&orig.item===form.item)?(orig.qty||0):0;
        const fifoTotal=lots.filter(l=>l.item===form.item&&(l.qty||0)>0).reduce((s,l)=>s+(l.qty||0),0)+origLotForFifo;
        if(fifoTotal-form.qty<0){
          alert(`❌ LOT 재고 부족으로 출고할 수 없습니다.\n\n품목: ${form.itemName}\n가용 LOT 합계: ${fmt3(fifoTotal)} ${form.unit||""}\n출고 요청: ${fmt3(form.qty)} ${form.unit||""}\n부족량: ${fmt3(form.qty-fifoTotal)} ${form.unit||""}`);
          return;
        }
      }
      // QC 게이트(경고): 검사 미통과(비적합) LOT이 출고에 포함되면 확인. 승인하면 진행
      {
        const _hit=[];
        if(form.lot){ const l=lots.find(x=>x.code===form.lot); if(l&&!qcAvailable(l)) _hit.push(l); }
        else { let _rem=form.qty; const _fifo=[...lots].filter(l=>l.item===form.item&&(l.qty||0)>0).sort((a,b)=>(a.mfg||"").localeCompare(b.mfg||"")); for(const l of _fifo){ if(_rem<=0)break; const t=Math.min(l.qty||0,_rem); if(!qcAvailable(l)) _hit.push(l); _rem-=t; } }
        if(_hit.length>0){ const _msg=_hit.map(l=>`• ${l.code} — ${effQc(l)}`).join("\n"); if(!window.confirm(`⚠️ 품질검사를 통과하지 않은 LOT이 출고에 포함됩니다:\n\n${_msg}\n\n그래도 출고하시겠습니까?`)) return; }
      }
    }
    doSave();
  };

  const bulkDel=()=>{
    const n=sel.size;
    if(!window.confirm(`선택한 ${n}개를 삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.`))return;
    const toDelete=io.filter((_,i)=>sel.has(i));
    let updItems=[...items];
    let updLots=[...lots];
    for(const r of toDelete){
      const adj=r.type==="입고"?-(r.qty||0):+(r.qty||0);
      updItems=updItems.map(it=>it.code===r.item?{...it,stock:Math.max(0,(it.stock||0)+adj)}:it);
      if(r.lot) updLots=updLots.map(l=>l.code===r.lot?{...l,qty:Math.max(0,(l.qty||0)+adj)}:l);
    }
    setItems(updItems);
    setLots(updLots);
    setIo(io.filter((_,i)=>!sel.has(i)));
    setSel(new Set());
    showToast(`${n}개 삭제되었습니다.`);
  };

      return io.some(r=>r.lot===l.code&&(r.note||"").includes("품질검사"))&&!lots.some(l2=>l2.code===l.code+"_QC"&&l2.item===l.item);
    }

  // ── 원부자재 엑셀 다운로드 (SOP-705-F01 월간 그리드 양식) ──
  const downloadExcelMaterial=async()=>{

    ws.pageSetup={paperSize:9,orientation:"landscape",scale:40,margins:{left:0.5,right:0.5,top:0.75,bottom:0.75,header:0.3,footer:0.3}};
    ws.headerFooter={oddFooter:`&L&"나눔고딕,보통"&10SOP-705-F01&C&"나눔고딕,보통"&10Ver2.0(2025.09.09)&R&"나눔고딕,보통"&10(주)아이메디텍`};

    // ── 스타일 ──
    const bdr={top:{style:"thin",color:{argb:"FF000000"}},left:{style:"thin",color:{argb:"FF000000"}},bottom:{style:"thin",color:{argb:"FF000000"}},right:{style:"thin",color:{argb:"FF000000"}}};
    const gFill={type:"pattern",pattern:"solid",fgColor:{argb:"FFD9D9D9"}};
    const titleFont={name:"나눔고딕",bold:true,size:11};
    const hdrFont={name:"나눔고딕",bold:true,size:7};
    const bodyFont={name:"나눔고딕",size:7};
    const cM={horizontal:"center",vertical:"middle",wrapText:true};
    const lM={horizontal:"left",vertical:"middle",wrapText:true};
    const rM={horizontal:"right",vertical:"middle",wrapText:true};

    const applyBdr=(cell)=>{cell.border=bdr;return cell;};
    const hdrCell=(r,c,v,fill)=>{const cell=ws.getCell(r,c);cell.value=v;cell.font=hdrFont;cell.alignment=cM;cell.border=bdr;if(fill)cell.fill=gFill;return cell;};

    // ── Row 1: 여백 ──
    ws.getRow(1).height=2;

    // ── Row 2~5: 제목 A2:AE5 병합 ──
    ws.mergeCells("A2:AE5");
    ws.getRow(2).height=19.35; ws.getRow(3).height=16.35; ws.getRow(4).height=37.25; ws.getRow(5).height=19.35;
    const tc=ws.getCell("A2");
    tc.value=`(  ${year}  ) 년도  ( ${month} ) 월   (  ${typeLabel}  ) 입·출고 관리대장`;
    tc.font=titleFont; tc.alignment={horizontal:"center",vertical:"middle"}; tc.border=bdr;

    // ── 서명란 AF2:AM5 ──
    const sigLabels=[["AF2:AG2","작  성"],["AH2:AI2","검  토"],["AJ2:AK2","검  토"],["AL2:AM2","승  인"]];
    sigLabels.forEach(([rng,label])=>{ws.mergeCells(rng);const c=ws.getCell(rng.split(":")[0]);c.value=label;c.font=hdrFont;c.alignment=cM;c.border=bdr;});
    [["AF3:AG5"],["AH3:AI5"],["AJ3:AK5"],["AL3:AM5"]].forEach(([rng])=>{ws.mergeCells(rng);applyBdr(ws.getCell(rng.split(":")[0]));});

    // ── Row 6: 구분선 ──
    ws.getRow(6).height=5.85;

    lgc.font={name:"나눔고딕",size:8}; lgc.alignment=rM;

    // ── Row 8: 헤더 ──
    ws.getRow(8).height=23.85;
    ["보관위치","원료명","Lot No.","이월재고","단위","구분"].forEach((h,i)=>hdrCell(8,i+1,h,true));
    for(let d=1;d<=31;d++) hdrCell(8,6+d,d,true);
    hdrCell(8,38,"합계",true); hdrCell(8,39,"현재고",true);

    // ── 데이터: LOT 단위 그룹화 ──
    const tabIts=items.filter(i=>i.type===typeLabel);
    const tabItemCodes=new Set(tabIts.map(i=>i.code));
    const grpMap={};

    // 1) lots 배열에서 LOT별 그룹 생성
    lots.filter(l=>tabItemCodes.has(l.item)).sort((a,b)=>(a.mfg||"").localeCompare(b.mfg||"")).forEach(l=>{
      const key=l.item+"__"+l.code;
      const it=items.find(i=>i.code===l.item);
      if(!grpMap[key]) grpMap[key]={item:l.item,itemName:l.itemName||(it?it.name:""),lot:l.code};
    });
    // 2) IO 기록에만 있는 품목+LOT 조합 추가
    io.filter(r=>r.date&&r.date>=monthStartStr&&r.date<=monthEndStr&&tabItemCodes.has(r.item)).forEach(r=>{
      const key=r.item+"__"+(r.lot||"");
      if(!grpMap[key]){
        const it=items.find(i=>i.code===r.item);
        grpMap[key]={item:r.item,itemName:r.itemName||(it?it.name:""),lot:r.lot||""};
      }
    });
    // 3) LOT가 전혀 없는 품목은 빈 LOT로 추가
    tabIts.forEach(it=>{
      const hasAny=Object.values(grpMap).some(g=>g.item===it.code);
      if(!hasAny) grpMap[it.code+"__"]={item:it.code,itemName:it.name,lot:""};
    });

    // ── 이월재고 계산: LOT별 (현재 LOT 잔량에서 이번달 이후 변동분 역산) ──
    const calcPrevStock=(itemCode,lotCode)=>{
      if(lotCode){
        const lotObj=lots.find(l=>l.code===lotCode&&l.item===itemCode);
        const curQty=lotObj?lotObj.qty||0:0;
        const inFrom=io.filter(r=>r.item===itemCode&&r.lot===lotCode&&r.date&&r.date>=monthStartStr&&r.type==="입고").reduce((s,r)=>s+(r.qty||0),0);
        const outFrom=io.filter(r=>r.item===itemCode&&r.lot===lotCode&&r.date&&r.date>=monthStartStr&&r.type==="출고").reduce((s,r)=>s+(r.qty||0),0);
        return curQty-inFrom+outFrom;
      } else {
        // LOT 미지정: 품목 전체 현재고 - 모든 LOT 잔량 (LOT 미추적 재고)
        const itemStock=(items.find(i=>i.code===itemCode)||{}).stock||0;
        const lotTotal=lots.filter(l=>l.item===itemCode).reduce((s,l)=>s+(l.qty||0),0);
        const noLotCur=Math.max(0,itemStock-lotTotal);
        const inFrom=io.filter(r=>r.item===itemCode&&!r.lot&&r.date&&r.date>=monthStartStr&&r.type==="입고").reduce((s,r)=>s+(r.qty||0),0);
        const outFrom=io.filter(r=>r.item===itemCode&&!r.lot&&r.date&&r.date>=monthStartStr&&r.type==="출고").reduce((s,r)=>s+(r.qty||0),0);
        return noLotCur-inFrom+outFrom;
      }
    };

    let dr=9;

    Object.values(grpMap).forEach(grp=>{
      const it=items.find(i=>i.code===grp.item);
      const lotObj=lots.find(l=>l.code===grp.lot);
      const warehouse=lotObj?lotObj.warehouse:(it&&it.warehouse?it.warehouse:"");
      const unit=it?it.unit||"":"";
      const prevStock=calcPrevStock(grp.item,grp.lot);

      // 일별 입고/출고/출고처 (해당 월, 해당 LOT만)
      const inD={},outD={},destD={};
      io.filter(r=>r.item===grp.item&&(r.lot||"")===(grp.lot||"")&&r.date&&r.date>=monthStartStr&&r.date<=monthEndStr).forEach(r=>{

      });
      const totalIn=Object.values(inD).reduce((a,b)=>a+b,0);
      const totalOut=Object.values(outD).reduce((a,b)=>a+b,0);
      const curStock=prevStock+totalIn-totalOut;

      // 이월재고 0 + 이번달 입출고 없으면 행 생략
      if(prevStock<=0&&totalIn===0&&totalOut===0) return;

      // ── 3행 공통 셀 (A,B,C,D,E 병합) ──

      const curC=ws.getCell(dr,39); curC.value=curStock; curC.font={name:"나눔고딕",bold:true,size:9}; curC.alignment=cM; curC.border=bdr; curC.fill=gFill;

      // ── 출고 행 (dr+1) ──
      ws.getRow(dr+1).height=23.85;
      hdrCell(dr+1,6,"출고",true);
      for(let d=1;d<=31;d++){const c=ws.getCell(dr+1,6+d);c.value=outD[d]||"";c.font=bodyFont;c.alignment=cM;c.border=bdr;}
      const sumOutC=ws.getCell(dr+1,38); sumOutC.value=totalOut||""; sumOutC.font=hdrFont; sumOutC.alignment=cM; sumOutC.border=bdr; sumOutC.fill=gFill;
      applyBdr(ws.getCell(dr+1,39)).fill=gFill;

      // ── 출고처 행 (dr+2) ──
      ws.getRow(dr+2).height=23.85;
      hdrCell(dr+2,6,"출고처",true);
      for(let d=1;d<=31;d++){const c=ws.getCell(dr+2,6+d);c.value=destD[d]||"";c.font=bodyFont;c.alignment=cM;c.border=bdr;}
      applyBdr(ws.getCell(dr+2,38)).fill=gFill;
      applyBdr(ws.getCell(dr+2,39)).fill=gFill;

      dr+=3;
    });

    ws.views=[{state:"frozen",ySplit:8,activeCell:"G9"}];

    const fname=`원부자재입출고관리대장_${year}년${String(month).padStart(2,"0")}월_${typeLabel}.xlsx`;
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=fname; a.click();
    URL.revokeObjectURL(url);
    showToast("엑셀 다운로드 완료");
  };

  // ── 인쇄 (원부자재 월간 그리드) ──
  const printIO=()=>{
    const isMatTab=(ioTab==="원자재"||ioTab==="부자재");
    const f3=(n)=>{if(n===undefined||n===null||n===0||n==="")return"";const v=Math.round((+n)*1000)/1000;return isNaN(v)?"":v.toLocaleString("ko-KR",{maximumFractionDigits:3});};
    if(!isMatTab){
      // 완제품/반제품: downloadExcel과 동일한 세로 리스트 양식 (SOP-705-F08)
      const toDate=s=>s?s.replace(/-/g,"."):"-";
      const lastStock=displayRows.length>0?displayRows[displayRows.length-1].runStock??0:0;
      const rowsPerPage=28;
      const dataCount=displayRows.length<=rowsPerPage?rowsPerPage:displayRows.length;
      const printRows=Array.from({length:dataCount},(_,i)=>{
        const r=displayRows[i]||null;
        if(r){
          const printNote=(r.note||"").includes("작업지시서")?"":r.note||"";
          return `<tr><td>${i+1}</td><td>${toDate(r.date)}</td><td style="text-align:left">${r.lot||""}</td><td>${r.type}</td><td>${r.type==="입고"?f3(r.qty):""}</td><td>${r.type==="출고"?f3(r.qty):""}</td><td>${f3(r.runStock??0)}</td><td style="text-align:left">${r.destination||""}</td><td>${r.manager||""}</td><td>${r.approver||""}</td><td style="text-align:left">${printNote}</td></tr>`;
        }
        return `<tr><td style="color:#ccc">${i+1}</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
      }).join("");
      const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>완제품·반제품 입출고 관리대장</title><style>@page{size:A4 portrait;margin:19mm 18mm 12mm 18mm;}body{font-family:'나눔고딕','맑은 고딕',sans-serif;font-size:8pt;margin:0;}.title{text-align:center;font-size:13pt;font-weight:bold;border:1px solid #000;padding:7px 4px;margin-bottom:5px;}table{width:100%;border-collapse:collapse;table-layout:fixed;}th,td{border:1px solid #000;padding:2px 3px;text-align:center;font-size:7pt;line-height:1.4;overflow:hidden;word-break:break-all;}th{background:#d9d9d9;font-weight:bold;}tr{height:22pt;}.sum-row td{background:#d9d9d9;font-weight:bold;}.footer{display:flex;justify-content:space-between;font-size:7pt;color:#555;margin-top:4px;}thead{display:table-header-group;}tr{page-break-inside:avoid;}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}</style></head><body><div class="title">완제품·반제품 입출고 관리대장</div><table><colgroup><col style="width:4%"><col style="width:10%"><col style="width:12%"><col style="width:7%"><col style="width:6%"><col style="width:6%"><col style="width:6%"><col style="width:20%"><col style="width:6%"><col style="width:6%"><col style="width:17%"></colgroup><thead><tr><th>No.</th><th>일자</th><th>Lot No.</th><th>구분&#10;(입/출고)</th><th>입고량</th><th>출고량</th><th>재고량</th><th>출고처</th><th>담당자</th><th>확인자</th><th>비고</th></tr></thead><tbody>${printRows}</tbody><tfoot><tr class="sum-row"><td colspan="6" style="text-align:center">재고 수량</td><td>${f3(lastStock)}</td><td colspan="4"></td></tr></tfoot></table><div class="footer"><span>SOP-705-F08</span><span>Ver3.0(2026.04.01)</span><span>(주)아이메디텍</span></div></body></html>`;
      const blob=new Blob([html],{type:"text/html;charset=utf-8"});
      const url=URL.createObjectURL(blob);
      const win=window.open(url,"_blank","width=1000,height=800");
      win.onload=()=>{win.focus();win.print();URL.revokeObjectURL(url);};
      return;
    }
    const year=isMatTab?ioYear:(startDate?new Date(startDate).getFullYear():new Date().getFullYear());
    const month=isMatTab?ioMonth:(startDate?new Date(startDate).getMonth()+1:new Date().getMonth()+1);
    const daysInMonth=new Date(year,month,0).getDate();
    const typeLabel=ioTab==="원자재"?"원자재":ioTab==="부자재"?"부자재":ioTab==="완제품"?"완제품":"전체";
    const monthStartStr=String(year)+"-"+String(month).padStart(2,"0")+"-01";
    const monthEndStr=String(year)+"-"+String(month).padStart(2,"0")+"-"+String(daysInMonth).padStart(2,"0");

    // 이월재고 계산 함수 (LOT별 현재고 역산)
    const calcPrevStock=(itemCode,lotCode)=>{
      if(lotCode){
        const lotObj=lots.find(l=>l.code===lotCode&&l.item===itemCode);
        const curQty=lotObj?lotObj.qty||0:0;
        const inFrom=io.filter(r=>r.item===itemCode&&r.lot===lotCode&&r.date&&r.date>=monthStartStr&&r.type==="입고").reduce((s,r)=>s+(r.qty||0),0);
        const outFrom=io.filter(r=>r.item===itemCode&&r.lot===lotCode&&r.date&&r.date>=monthStartStr&&r.type==="출고").reduce((s,r)=>s+(r.qty||0),0);
        return curQty-inFrom+outFrom;
      } else {
        const itemStock=(items.find(i=>i.code===itemCode)||{}).stock||0;
        const lotTotal=lots.filter(l=>l.item===itemCode).reduce((s,l)=>s+(l.qty||0),0);
        const noLotCur=Math.max(0,itemStock-lotTotal);
        const inFrom=io.filter(r=>r.item===itemCode&&!r.lot&&r.date&&r.date>=monthStartStr&&r.type==="입고").reduce((s,r)=>s+(r.qty||0),0);
        const outFrom=io.filter(r=>r.item===itemCode&&!r.lot&&r.date&&r.date>=monthStartStr&&r.type==="출고").reduce((s,r)=>s+(r.qty||0),0);
        return noLotCur-inFrom+outFrom;
      }
    };

    // 그룹화 — 원자재/부자재는 LOT 단위, 완제품/전체는 품목 단위
    const grpMap={};
    if(isMatTab){
      const tabItemCodes=new Set(items.filter(i=>i.type===typeLabel).map(i=>i.code));
      // lots 배열에서 LOT별 그룹
      lots.filter(l=>tabItemCodes.has(l.item)).sort((a,b)=>(a.mfg||"").localeCompare(b.mfg||"")).forEach(l=>{
        const key=l.item+"__"+l.code;
        const it=items.find(i=>i.code===l.item);
        if(!grpMap[key]) grpMap[key]={item:l.item,itemName:l.itemName||(it?it.name:""),lot:l.code};
      });
      // IO에만 있는 품목+LOT 조합
      io.filter(r=>r.date&&r.date>=monthStartStr&&r.date<=monthEndStr&&tabItemCodes.has(r.item)).forEach(r=>{
        const key=r.item+"__"+(r.lot||"");
        if(!grpMap[key]){const it=items.find(i=>i.code===r.item);grpMap[key]={item:r.item,itemName:r.itemName||(it?it.name:""),lot:r.lot||""};}
      });
      // LOT 없는 품목
      items.filter(i=>i.type===typeLabel).forEach(it=>{
        if(!Object.values(grpMap).some(g=>g.item===it.code)) grpMap[it.code+"__"]={item:it.code,itemName:it.name,lot:""};
      });
    } else {
      filteredIo.forEach(r=>{
        if(!grpMap[r.item]){
          const lot=lots.filter(l=>l.item===r.item).sort((a,b)=>(b.mfg||"").localeCompare(a.mfg||""))[0];
          grpMap[r.item]={item:r.item,itemName:r.itemName,lot:lot?lot.code:""};
        }
      });
    }

    const dayNums=Array.from({length:daysInMonth},(_,i)=>i+1);

    const rows=Object.values(grpMap).map(grp=>{
      const it=items.find(i=>i.code===grp.item);
      const lotObj=lots.find(l=>l.code===grp.lot);
      const inD={},outD={},destD={};
      if(isMatTab){
        // LOT별 IO 필터
        io.filter(r=>r.item===grp.item&&(r.lot||"")===(grp.lot||"")&&r.date&&r.date>=monthStartStr&&r.date<=monthEndStr).forEach(r=>{
          const d=new Date(r.date).getDate();
          if(r.type==="입고"){inD[d]=(inD[d]||0)+r.qty;}
          else{outD[d]=(outD[d]||0)+r.qty;if(r.destination)destD[d]=r.destination;}
        });
      } else {
        (filteredIo.filter(r=>r.item===grp.item)).forEach(r=>{
          if(!r.date) return;
          const rd=new Date(r.date);
          if(rd.getFullYear()!==year||rd.getMonth()+1!==month) return;
          const d=rd.getDate();
          if(r.type==="입고"){inD[d]=(inD[d]||0)+r.qty;}
          else{outD[d]=(outD[d]||0)+r.qty;if(r.destination)destD[d]=r.destination;}
        });
      }
      const prevStock=isMatTab?calcPrevStock(grp.item,grp.lot):(it?it.stock||0:0);
      const totalIn=Object.values(inD).reduce((a,b)=>a+b,0);
      const totalOut=Object.values(outD).reduce((a,b)=>a+b,0);
      const wh=lotObj?lotObj.warehouse:(it&&it.warehouse?it.warehouse:"");
      if(prevStock<=0&&totalIn===0&&totalOut===0) return null;
      return {warehouse:wh,itemName:grp.itemName,lot:grp.lot,prevStock,unit:it?it.unit||"":"",inD,outD,destD,totalIn,totalOut,curStock:prevStock+totalIn-totalOut};
    }).filter(Boolean);

    const dayCols=dayNums.map(d=>`<th class="day">${d}</th>`).join("");
    const dataRows=rows.map(r=>`
      <tr>
        <td rowspan="3" class="fix-wh">${r.warehouse}</td>
        <td rowspan="3" class="fix-nm" style="text-align:left">${r.itemName}</td>
        <td rowspan="3" class="fix-lt">${r.lot}</td>
        <td rowspan="3" class="fix-num">${f3(r.prevStock)}</td>
        <td rowspan="3" class="fix-un">${r.unit}</td>
        <td class="gry fix-gb">입고</td>
        ${dayNums.map(d=>`<td class="day">${f3(r.inD[d])}</td>`).join("")}
        <td class="gry fix-sum">${f3(r.totalIn)}</td>
        <td class="gry fix-num" rowspan="3" style="font-weight:bold">${f3(r.curStock)}</td>
      </tr>
      <tr>
        <td class="gry fix-gb">출고</td>
        ${dayNums.map(d=>`<td class="day">${f3(r.outD[d])}</td>`).join("")}
        <td class="gry fix-sum">${f3(r.totalOut)}</td>
      </tr>
      <tr>
        <td class="gry fix-gb">출고처</td>
        ${dayNums.map(d=>`<td class="day" style="font-size:6px">${r.destD[d]||""}</td>`).join("")}
        <td class="gry fix-sum"></td>
      </tr>`).join("");

    const html=`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>${year}년 ${month}월 ${typeLabel} 입·출고 관리대장</title>
    <style>
      @page{size:A4 landscape;margin:8mm 6mm;}
      body{font-family:'나눔고딕','맑은 고딕',sans-serif;font-size:8px;margin:0;}
      .title-area{display:flex;margin-bottom:3px;align-items:stretch;}
      .title{flex:1;text-align:center;font-size:13px;font-weight:bold;border:1px solid #000;padding:6px;}
      .sig-area{display:flex;min-width:180px;}
      .sig-box{border:1px solid #000;flex:1;display:flex;flex-direction:column;}
      .sig-label{background:#d9d9d9;font-weight:bold;text-align:center;font-size:8px;padding:3px 2px;border-bottom:1px solid #000;}
      .sig-content{flex:1;min-height:30px;}
      .sig-date{border-top:1px solid #000;text-align:center;font-size:7px;padding:1px;height:11px;}
      .legend{text-align:right;font-size:7px;color:#555;margin-bottom:2px;}
      table{width:100%;border-collapse:collapse;font-size:7.5px;table-layout:fixed;}
      th,td{border:1px solid #000;padding:1px 1px;text-align:center;overflow:hidden;word-break:break-all;line-height:1.2;}
      th{background:#d9d9d9;font-weight:bold;}
      .gry{background:#d9d9d9;font-weight:bold;}
      .footer{text-align:center;font-size:7px;margin-top:3px;color:#555;}
      /* 고정 컬럼 너비 */
      .fix-wh{width:14mm;}
      .fix-nm{width:38mm;}
      .fix-lt{width:22mm;}
      .fix-num{width:13mm;}
      .fix-un{width:7mm;}
      .fix-gb{width:9mm;background:#d9d9d9;}
      .fix-sum{width:13mm;}
      /* 날짜 컬럼: 나머지 공간 균등 분배 */
      .day{width:4.5mm;font-size:7px;}
      thead{display:table-header-group;}
      tr{page-break-inside:avoid;}
      @media print{
        body{-webkit-print-color-adjust:exact;print-color-adjust:exact;padding-bottom:18px;}
        .footer{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:2px 0;}
      }
    </style></head><body>
    <div class="title-area">
      <div class="title">(  ${year}  ) 년도  ( ${month} ) 월  (  ${typeLabel}  ) 입·출고 관리대장</div>
      <div class="sig-area">
        <div class="sig-box"><div class="sig-label">작&nbsp;성</div><div class="sig-content"></div><div class="sig-date"></div></div>
        <div class="sig-box"><div class="sig-label">검&nbsp;토</div><div class="sig-content"></div><div class="sig-date"></div></div>
        <div class="sig-box"><div class="sig-label">검&nbsp;토</div><div class="sig-content"></div><div class="sig-date"></div></div>
        <div class="sig-box"><div class="sig-label">승&nbsp;인</div><div class="sig-content"></div><div class="sig-date"></div></div>
      </div>
    </div>
    <div class="legend">출고처 범례: P = 생산, Q = 품질, R = 연구, E = 기타(생산·품질·연구 외 출고 시, 출고처 상세 내용은 SOP-706-F07. 제조지시 및 기록서 참고)</div>
    <table>
      <thead><tr>
        <th class="fix-wh">보관위치</th><th class="fix-nm">원료명</th><th class="fix-lt">Lot No.</th>
        <th class="fix-num">이월재고</th><th class="fix-un">단위</th><th class="fix-gb">구분</th>
        ${dayCols}<th class="fix-sum">합계</th><th class="fix-num">현재고</th>
      </tr></thead>
      <tbody>${dataRows||"<tr><td colspan='40'>데이터 없음</td></tr>"}</tbody>
    </table>
    <div class="footer" style="display:flex;justify-content:space-between;"><span>SOP-705-F01</span><span>Ver2.0(2025.09.09)</span><span>(주)아이메디텍</span></div>
    </body></html>`;

    const blob=new Blob([html],{type:"text/html;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const win=window.open(url,"_blank","width=1200,height=800");
    win.onload=()=>{ win.focus(); win.print(); URL.revokeObjectURL(url); };
  };

  return (
    <div>
      <div className="page-header">
        <div><div className="crumb">MedERP <span>›</span> <b>입출고관리</b></div><div className="page-title">입출고관리</div><div className="page-sub">( 모델명 ) 입·출고 관리대장 — SOP-705-F08 — LOT별 재고 추적</div></div>
        <div style={{display:"flex",gap:8}}>
          {perm.canDelete&&sel.size>0&&<button className="btn btn-danger" onClick={bulkDel}>🗑 선택 삭제 ({sel.size})</button>}
          <button className="btn btn-outline" onClick={printIO}>🖨️ 인쇄</button>
          <button className="btn btn-outline" onClick={(ioTab==="원자재"||ioTab==="부자재")?downloadExcelMaterial:downloadExcel}>📥 엑셀 다운로드</button>
          {perm.canCreate&&<button className="btn btn-primary" onClick={()=>{setForm({...emptyForm,date:today,manager:currentUser?.name||"",note:""});setCodeInput("");setEditIdx(null);setModal(true);}}>+ 입출고 등록</button>}
        </div>
      </div>

      {/* 탭: 전체 / 완제품·반제품 / 원자재 / 부자재 / 품질검사 / 보관샘플 */}
      <div className="tabs">
        {[["전체","📋 전체"],["완제품","📦 완제품·반제품"],["원자재","🧪 원자재"],["부자재","🔩 부자재"],["품질검사","🔬 품질검사"],["보관샘플","🧪 보관샘플"]].map(([k,label])=>(
          <div key={k} className={`tab${ioTab===k?" active":""}`} onClick={()=>setIoTab(k)}>{label}</div>

      </div>

      <div className="panel" style={{overflowX:"auto"}}>
        <div className="panel-top">
          <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
            <input placeholder="🔍 품목명·코드·LOT·참조 검색" value={q} onChange={e=>setQ(e.target.value)} style={{width:240}}/>
            {(ioTab==="원자재"||ioTab==="부자재")?(
              <div style={{display:"flex",alignItems:"center",gap:8}}>

                </select>
                <select value={ioMonth} onChange={e=>setIoMonth(+e.target.value)} style={dateStyle}>

                <button className="btn btn-outline btn-sm" onClick={()=>{const pm=_now.getMonth()===0?12:_now.getMonth();const py=_now.getMonth()===0?_now.getFullYear()-1:_now.getFullYear();setIoYear(py);setIoMonth(pm);}}>지난달</button>
              </div>
            ):(
              <div style={{display:"flex",alignItems:"center",gap:6}}>

                <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} style={dateStyle}/>
                <button className="btn btn-outline btn-sm" onClick={()=>{setStartDate(today);setEndDate(today);}}>오늘</button>
                <button className="btn btn-outline btn-sm" onClick={()=>{setStartDate("");setEndDate("");}}>전체</button>
              </div>
            )}
          </div>
          <span style={{fontSize:12,color:"#aaa"}}>{shownRows.length}건{q&&` / 전체 ${displayRows.length}`}</span>
        </div>
        <table style={{minWidth:960}}>
          <thead>
            <tr>
              <th style={{width:36,textAlign:"center"}}>선택</th>
              <th style={{width:40,textAlign:"center"}}>No.</th>
              <th>일자</th>
              <th>Lot No.</th>
              <th>품목코드</th>
              <th>품목명</th>
              <th style={{textAlign:"center"}}>구분</th>
              <th style={{textAlign:"center"}}>입고량</th>
              <th style={{textAlign:"center"}}>출고량</th>
              <th style={{textAlign:"center"}}>재고량</th>
              <th>출처/구분</th>
              <th>담당자</th>
              <th>확인자</th>
              <th>비고</th>
              <th style={{width:60}}>관리</th>
            </tr>
          </thead>
          <tbody>
            {shownRows.map((r,ri)=>{
              const stdItem=items.find(i=>i.code===r.item);
              return(
                <tr key={r._idx}>
                  <td style={{textAlign:"center"}}><input type="checkbox" checked={sel.has(r._idx)} onChange={()=>toggleSel(r._idx)} style={{cursor:"pointer"}}/></td>
                  <td style={{textAlign:"center",color:"#888",fontSize:12}}>{ri+1}</td>
                  <td style={{fontSize:12,whiteSpace:"nowrap"}}>{r.date}</td>
                  <td style={{fontSize:11,color:"#555",fontFamily:"monospace"}}>{r.lot||"-"}</td>
                  <td style={{fontSize:11,color:"#888",fontFamily:"monospace"}}>{r.item||"-"}</td>
                  <td style={{cursor:onItemClick?"pointer":"default"}} onClick={()=>onItemClick&&stdItem&&onItemClick(stdItem)}>
                    <span style={{color:"#2f6df0",textDecoration:onItemClick?"underline dotted":"none",fontWeight:600}}>{r.itemName}</span>
                  </td>
                  <td style={{textAlign:"center"}}><span className={`badge ${r.type==="입고"?"badge-blue":"badge-orange"}`}>{r.type}</span></td>
                  <td style={{textAlign:"center",color:r.type==="입고"?"#2f6df0":"#ccc",fontWeight:r.type==="입고"?600:400}}>{r.type==="입고"?fmt3(r.qty):"-"}</td>

function MatPicker({code,items,onPick,onType,style}){

  const cand=items.filter(i=>i.type==="원자재"||i.type==="부자재"||i.type==="반제품");
  const searching=q!==null;
  const _q=(q||"").trim().toLowerCase();
  const hits=searching&&_q?cand.filter(i=>(i.code||"").toLowerCase().includes(_q)||(i.name||"").toLowerCase().includes(_q)).slice(0,20):[];
  return (
    <div style={{position:"relative",...(style&&style.wrap?style.wrap:{})}}>
      <input value={searching?q:(code||"")} placeholder="코드/이름 검색" autoComplete="off"
        style={style&&style.input?style.input:{width:90,border:"1px solid #ddd",borderRadius:5,padding:"5px 6px",fontSize:11,fontFamily:"monospace",background:"#fff"}}
        onFocus={()=>setQ(code||"")}
        onChange={e=>{setQ(e.target.value);if(onType)onType(e.target.value);}}
        onBlur={()=>setTimeout(()=>setQ(null),150)}/>
      {searching&&hits.length>0&&(
        <div style={{position:"absolute",top:"100%",left:0,minWidth:240,background:"#fff",border:"1px solid #2f6df0",borderRadius:6,boxShadow:"0 4px 12px rgba(0,0,0,0.15)",zIndex:400,maxHeight:200,overflowY:"auto"}}>
          {hits.map(it=>(
            <div key={it.code} onMouseDown={()=>{onPick(it);setQ(null);}}
              style={{padding:"6px 10px",cursor:"pointer",borderBottom:"1px solid #f0f0f0",fontSize:12,whiteSpace:"nowrap"}}
              onMouseEnter={e=>e.currentTarget.style.background="#eff6ff"}

              <span style={{fontFamily:"monospace",color:"#2f6df0",fontWeight:600}}>{it.code}</span>

      )}
