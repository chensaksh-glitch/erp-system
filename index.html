<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP 시스템</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ===== Design Tokens (MedERP 클린 테마 — 색은 여기만 바꾸면 전체 적용) ===== */
:root {
  --accent: #2f6df0;          /* MedERP 코발트 포인트색 */
  --accent-strong: #2560d8;
  --accent-soft: #eaf1fe;     /* 연한 포인트 배경 */
  --ok: #2f9e63; --warn: #d6483b; --orange: #c47d12;
  --ink: #1b2333; --muted: #667085; --faint: #98a2b3;
  --line: #e2e7ee;            /* 쿨 그레이 라인 */
  --line-soft: #eef1f5;
  --bg: #eef1f5;              /* 쿨한 페이퍼 배경 → 흰 카드가 도드라짐 */
  --sidebar: #23272f;        /* MedERP 다크 슬레이트 사이드바 */
  --radius: 12px; --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.04);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; -webkit-font-smoothing: antialiased; }
.wrap { display: flex; min-height: 100vh; }

/* NAV — 솔리드 다크 사이드바 (대비로 화면을 잡아줌) */
.nav { width: 236px; background: var(--sidebar); padding: 0; display: flex; flex-direction: column; position: fixed; height: 100vh; overflow-y: auto; z-index: 100; }
.nav-logo { display: flex; align-items: center; gap: 10px; padding: 16px 16px 15px; border-bottom: 1px solid rgba(255,255,255,0.07); }
.nav-mark { width: 32px; height: 32px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 9px; background: var(--accent); color: #fff; }
.nav-brand { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.3px; }
.nav-logo span { color: #fff; }
.nav-section { font-size: 10px; color: #6b7689; padding: 18px 18px 6px; letter-spacing: 0.07em; font-weight: 700; text-transform: uppercase; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; margin: 1px 10px; border-radius: 8px; font-size: 13px; color: #aeb8c7; transition: background 0.13s, color 0.13s; }
.nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
.nav-item.active { background: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 2px 8px -2px var(--accent); }
.nav-item .icon { font-size: 15px; width: 18px; text-align: center; }
/* 그룹(접기/펼치기) 메뉴 */
.nav-solo { margin-top: 6px; font-weight: 600; color: #d4d9e4; }
.nav-group-wrap { margin-top: 5px; }
.nav-group { display: flex; align-items: center; gap: 10px; padding: 9px 14px; margin: 1px 10px; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 700; color: #8b93a7; user-select: none; transition: background 0.13s, color 0.13s; }
.nav-group:hover { background: rgba(255,255,255,0.05); color: #e7eaf2; }
.nav-group.has-active { color: #fff; }
.nav-group .icon { font-size: 15px; width: 18px; text-align: center; }
.nav-group-label { flex: 1; }
.nav-caret { font-size: 16px; color: #6b7689; transition: transform 0.18s ease; }
.nav-caret.open { transform: rotate(90deg); }
.nav-sub { padding-left: 40px; font-size: 12.5px; color: #9aa3b5; }
.nav-sub .icon { font-size: 13px; }

/* MAIN */
.main { flex: 1; margin-left: 236px; padding: 0; min-width: 0; }
.main-inner { padding: 22px 28px 48px; }
/* TOPBAR (MedERP 상단바) */
.topbar { position: sticky; top: 0; z-index: 50; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 24px; background: #fff; border-bottom: 1px solid var(--line); }
.topbar-search { display: flex; align-items: center; gap: 9px; flex: 1; max-width: 420px; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--muted); font-size: 13px; cursor: text; }
.topbar-search-ph { flex: 1; }
.topbar-kbd { font-size: 11px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--faint); }
.topbar-right { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.topbar-icon { position: relative; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: none; border: 1px solid transparent; border-radius: 9px; color: var(--muted); cursor: pointer; transition: background .13s, border-color .13s, color .13s; }
.topbar-icon:hover { background: var(--bg); border-color: var(--line); color: var(--ink); }
.topbar-badge { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.topbar-user { display: flex; align-items: center; gap: 8px; margin-left: 6px; }
.topbar-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); border: 1px solid var(--line); }
.topbar-uname { font-size: 13px; color: var(--muted); white-space: nowrap; }
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.page-title { font-size: 20px; font-weight: 700; color: #18212f; letter-spacing: -0.01em; }
.page-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }

/* CARDS — 납작한 흰 카드 + 얇은 라인 (그림자 최소) */
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 26px; }
.card { background: #fff; border-radius: 12px; padding: 18px 20px; border: 1px solid var(--line); box-shadow: var(--shadow); }
.card-label { font-size: 12px; color: var(--muted); margin-bottom: 7px; font-weight: 500; }
.card-val { font-size: 26px; font-weight: 800; color: #18212f; letter-spacing: -0.02em; }
.card-sub { font-size: 12px; color: var(--faint); margin-top: 4px; }
.card.warn { border-color: #f1bdb6; }
.card.ok { border-color: #b6e0c6; }
.card.warn .card-val { color: var(--warn); }
.card.ok .card-val { color: var(--ok); }

/* KPI CARDS — 대시보드 (아이콘 칩 + 전월대비 추세) */
.kpis { display: grid; gap: 14px; margin-bottom: 20px; }
.kpi { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); cursor: pointer; transition: transform 0.14s ease, box-shadow 0.14s ease; }
.kpi:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16,24,40,0.09); }
.kpi-chip { position: absolute; top: 15px; right: 15px; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; }
.kpi-chip.blue   { background: #eaf1fe; color: var(--accent); }
.kpi-chip.green  { background: #e7f4ec; color: var(--ok); }
.kpi-chip.violet { background: #eceafe; color: #6552e0; }
.kpi-chip.red    { background: #fbe7e4; color: var(--warn); }
.kpi-chip.amber  { background: #fbf0db; color: var(--orange); }
.kpi-chip.cyan   { background: #e2f5f7; color: #1597a6; }
.kpi-label { font-size: 12.5px; color: var(--muted); font-weight: 500; margin-bottom: 9px; padding-right: 44px; }
.kpi-val { font-size: 27px; font-weight: 800; color: #18212f; letter-spacing: -0.02em; line-height: 1.1; }
.kpi-unit { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.kpi-trend { font-size: 12px; font-weight: 600; margin-top: 11px; display: flex; align-items: center; gap: 5px; }
.kpi-trend .t-up { color: var(--ok); }
.kpi-trend .t-down { color: var(--warn); }
.kpi-trend .t-note { color: var(--faint); font-weight: 500; }

/* DASHBOARD 2-COL (MedERP 운영 대시보드) */
.dash-2col { display: grid; grid-template-columns: 1.45fr 1fr; gap: 18px; margin-bottom: 20px; }
@media (max-width: 1100px){ .dash-2col { grid-template-columns: 1fr; } }
.dash-col { display: flex; flex-direction: column; gap: 18px; }
.dash-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.dash-card-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dash-card-hd b { font-size: 14px; color: var(--ink); }
.dash-card-bd { padding: 4px 18px 8px; }
.dash-link { color: var(--accent); cursor: pointer; font-size: 12px; font-weight: 600; }
.prog-row { padding: 12px 0; border-bottom: 1px dashed var(--line); }
.prog-row:last-child { border-bottom: none; }
.prog-row-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
.prog-code { font-size: 12px; color: var(--faint); font-weight: 600; font-variant-numeric: tabular-nums; }
.prog-name { font-weight: 700; font-size: 13px; margin-bottom: 8px; }
.prog-bar { height: 8px; background: var(--line-soft); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.prog-bar > span { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .3s; }
.prog-meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.mini-row { display: flex; align-items: center; gap: 9px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.mini-row:last-child { border-bottom: none; }
.mini-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.mini-name { flex: 1; font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-val { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tl-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.tl-row:last-child { border-bottom: none; }
.tl-time { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; min-width: 64px; white-space: nowrap; }
.tl-name { flex: 1; font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* SEGMENT TOGGLE (요약/위젯) */
.seg-toggle { display: flex; padding: 3px; gap: 3px; background: #f2f5f8; border: 1px solid var(--line); border-radius: 11px; }
.seg-btn { padding: 6px 14px; border: none; background: none; cursor: pointer; font: inherit; font-size: 13px; color: var(--muted); border-radius: 8px; font-weight: 500; }
.seg-btn.is-on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(16,24,40,0.10); font-weight: 700; }

/* WIDGET GRID (위젯 그리드 / bento) */
.wf-bento { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 20px; }
.wf-bento .b-chart { grid-column: span 2; }
.wf-bento .b-kpis { grid-column: span 2; display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.wf-bento .b-donut { grid-column: span 1; }
.wf-bento .b-low { grid-column: span 2; }
.wf-bento .b-cal { grid-column: span 1; }
@media (max-width: 1100px){ .wf-bento { grid-template-columns: 1fr 1fr; } .wf-bento .b-chart, .wf-bento .b-kpis, .wf-bento .b-low { grid-column: span 2; } }
.minichart { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding: 8px 4px 0; }
.minichart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.minichart-bar { width: 100%; max-width: 40px; background: var(--accent); border-radius: 6px 6px 0 0; min-height: 3px; transition: height .3s; }
.minichart-val { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.minichart-lbl { font-size: 11px; color: var(--faint); }
.donut-wrap { display: flex; align-items: center; gap: 18px; padding: 12px 4px; }
.donut { width: 116px; height: 116px; border-radius: 50%; flex: none; display: grid; place-items: center; }
.donut-hole { width: 80px; height: 80px; border-radius: 50%; background: #fff; display: grid; place-items: center; text-align: center; }
.donut-hole b { font-size: 21px; font-weight: 800; color: var(--ink); }
.donut-hole span { font-size: 11px; color: var(--muted); display: block; }
.cal-strip { display: flex; gap: 6px; margin: 4px 0 10px; }
.cal-day { flex: 1; text-align: center; padding: 7px 2px; border: 1px solid var(--line); border-radius: 9px; font-size: 11px; color: var(--muted); }
.cal-day b { display: block; font-size: 15px; color: var(--ink); margin-top: 2px; }
.cal-day.has { border-color: var(--accent); background: var(--accent-soft); }
.cal-dot { display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin: 3px auto 0; }

/* MASTER-DETAIL (마스터-상세형) */
.md-wrap { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
@media (max-width: 1000px){ .md-wrap { grid-template-columns: 1fr; } }
.md-list { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.md-search { margin: 14px 14px 8px; }
.md-rows { flex: 1; overflow-y: auto; max-height: 560px; }
.md-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; background: none; border: none; border-top: 1px solid var(--line-soft); cursor: pointer; font: inherit; text-align: left; }
.md-row:first-child { border-top: none; }
.md-row:hover { background: var(--line-soft); }
.md-row.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.md-row-ic { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 8px; background: var(--line-soft); color: var(--muted); border: 1px solid var(--line); }
.md-row-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.md-row-tx b { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.md-row-tx span { font-size: 11px; color: var(--faint); }
.md-detail { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; }
.md-detail-hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
.md-detail-hd h2 { margin: 2px 0 0; font-size: 20px; font-weight: 700; color: var(--ink); }
.md-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.md-grid .span2 { grid-column: span 2; }
@media (max-width: 700px){ .md-grid { grid-template-columns: 1fr; } .md-grid .span2 { grid-column: auto; } }
.kv-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.kv-row:last-child { border-bottom: none; }
.kv-k { color: var(--muted); font-size: 13px; white-space: nowrap; }
.kv-v { font-weight: 700; font-size: 13px; text-align: right; }
.stockbig { display: flex; align-items: baseline; gap: 7px; margin: 4px 0 10px; }
.stockbig b { font-size: 26px; font-weight: 800; }
.stockbig span { color: var(--muted); font-size: 13px; }
.wf-route { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.route-step { padding: 5px 12px; border: 1px solid var(--line); border-radius: 20px; background: var(--bg); font-weight: 700; font-size: 12px; color: var(--ink); }

/* CHART CARD */
.chart-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px 14px; box-shadow: var(--shadow); margin-bottom: 20px; }
.chart-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.chart-card-title { font-size: 14px; font-weight: 700; color: #18212f; }

/* MENU LAUNCHER — 대시보드 전체 메뉴 바로가기 */
.menu-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.menu-tile { display: flex; flex-direction: column; align-items: center; gap: 9px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px 10px; cursor: pointer; text-align: center; transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s; }
.menu-tile:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16,24,40,0.10); border-color: #dfe3ee; }
.menu-tile-chip { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; background: var(--accent-soft); }
.menu-tile-chip.blue   { background: #eaf1fe; }
.menu-tile-chip.green  { background: #e7f4ec; }
.menu-tile-chip.violet { background: #eceafe; }
.menu-tile-chip.amber  { background: #fbf0db; }
.menu-tile-chip.red    { background: #fbe7e4; }
.menu-tile-label { font-size: 12.5px; font-weight: 600; color: #374151; }

/* BREADCRUMB */
.crumb { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--faint); margin-bottom: 11px; }
.crumb b { color: var(--muted); font-weight: 600; }
/* 재고현황 카드뷰 좌측 필터 패널 */
.stk-card-wrap { display: grid; grid-template-columns: 210px 1fr; gap: 16px; align-items: start; }
.stk-filter { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 0 4px; position: sticky; top: 12px; }
.stk-fsearch { display: flex; align-items: center; gap: 7px; margin: 0 12px 10px; padding: 0 10px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.stk-fsearch input { border: none; outline: none; background: none; flex: 1; font-size: 13px; min-width: 0; font-family: inherit; color: var(--ink); }
.stk-fgroup { padding: 10px 12px; border-top: 1px solid var(--line-soft); }
.stk-flabel { font-size: 11px; font-weight: 700; color: var(--faint); letter-spacing: .04em; margin-bottom: 6px; }
.stk-fitem { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; font-size: 13px; color: var(--ink); }
.stk-fitem input { cursor: pointer; }
.stk-fname { flex: 1; }
.stk-fcount { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.stk-cardbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.stk-count { font-size: 13px; font-weight: 600; color: var(--muted); }
@media (max-width: 900px){ .stk-card-wrap { grid-template-columns: 1fr; } .stk-filter { position: static; } }

/* 기준정보 툴바 + 카드 그리드 (창고·공정 등) */
.kbar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.kbar-search { display: flex; align-items: center; gap: 7px; padding: 0 11px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 210px; color: var(--faint); }
.kbar-search input { border: none; outline: none; background: none; flex: 1; font-size: 13px; font-family: inherit; min-width: 0; color: var(--ink); }
.kbar-sel { border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; height: 34px; font-size: 13px; font-family: inherit; background: #fff; color: var(--ink); cursor: pointer; }
.ent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 14px; }
.ent-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.ent-card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ent-ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); font-size: 19px; flex: none; }
.ent-name { font-size: 15px; font-weight: 700; color: var(--ink); line-height: 1.3; }
.ent-code { font-size: 12px; color: var(--faint); font-family: monospace; }
.ent-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 9px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); }
.ent-num { font-size: 20px; font-weight: 800; color: var(--ink); }
.ent-num span { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 3px; }
.flow-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 16px; }
.flow-card-title { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 12px; }

tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafbfc; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.panel { background: #fff; border-radius: var(--radius); border: 1px solid var(--line); box-shadow: var(--shadow); overflow-x: auto; }
.badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; border: 1.2px solid transparent; white-space: nowrap; }
.badge-blue { background: var(--accent-soft); color: var(--accent); border-color: #bcd4fb; }
.badge-green { background: #e7f4ec; color: var(--ok); border-color: #b6e0c6; }
.badge-red { background: #fbe7e4; color: var(--warn); border-color: #f1bdb6; }
.badge-gray { background: #f2f5f8; color: var(--muted); border-color: var(--line); }
.badge-orange { background: #fbf0db; color: var(--orange); border-color: #ecd5a3; }
.badge-yellow { background: #fff8e1; color: #b8860b; border-color: #ecd9a0; }
/* 인라인 품질상태 드롭다운 (배지형 select) — hover 시 편집 가능 단서 */
.qc-sel-wrap { position: relative; display: inline-flex; align-items: center; }
.qc-sel { appearance: none; -webkit-appearance: none; cursor: pointer; font-weight: 700; padding: 2px 18px 2px 9px; border-radius: 20px; text-align: left; transition: box-shadow .12s, filter .12s; }
.qc-sel-wrap:hover .qc-sel { box-shadow: 0 0 0 2px var(--accent-soft); filter: brightness(0.98); }
.qc-sel-arrow { position: absolute; right: 6px; font-size: 8px; pointer-events: none; opacity: 0.6; }

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-strong); }
.btn-outline { background: #fff; color: #4b5563; border: 1px solid #e3e5e9; }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger { background: #fff; color: var(--warn); border: 1px solid #f3c6c6; }
.btn-danger:hover { background: #fdeaea; }
.btn-sm { padding: 5px 11px; font-size: 12px; border-radius: 7px; }
.btn-green { background: var(--ok); color: #fff; }
.btn-green:hover { background: #15803d; }

.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 19px 24px 15px; border-bottom: 1px solid var(--line); }

.field { margin-bottom: 15px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: #4b5563; margin-bottom: 6px; }

.input { width: 100%; border: 1px solid #e3e5e9; border-radius: 8px; padding: 9px 12px; font-size: 13px; outline: none; font-family: inherit; box-sizing: border-box; transition: border-color 0.13s, box-shadow 0.13s; }

.bom-body { padding: 0 16px 12px; }

function App() {
  const [page, setPage] = useState("dashboard");
  const [gsOpen, setGsOpen] = useState(false);   // 전체 검색 팔레트
  const [gsQ, setGsQ] = useState("");
  const [navQ, setNavQ] = useState(null);        // 전체검색 결과 클릭 → 대상 페이지 딥링크 필터 {pg,v}
  useEffect(()=>{
    const h=(e)=>{
      if((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="K")){ e.preventDefault(); setGsOpen(o=>!o); }
      else if(e.key==="Escape") setGsOpen(false);
    };
    window.addEventListener("keydown",h);
    return ()=>window.removeEventListener("keydown",h);
  },[]);
  const [navCollapsed, setNavCollapsed] = useState({});   // 사이드바 그룹 접힘 상태 (기본: 모두 펼침)
  const [items, setItems] = useState(initItems);
  const [warehouses, setWarehouses] = useState(initWarehouses);
  const [processes, setProcesses] = useState(initProcesses);
  const [bom, setBom] = useState(initBom);
  const [lots, setLots] = useState(initLots);
  const [incoming, setIncoming] = useState(initIncoming);
  const [orders, setOrders] = useState(initOrders);
  const [io, setIo] = useState(initIO);
  const [costBom, setCostBom] = useState(initCostBom);
  const [factories, setFactories] = useState(initFactories);
  const [costMaster, setCostMaster] = useState(initCostMaster);
  const [ordersLedger, setOrdersLedger] = useState(initOrdersLedger);
  const [users, setUsers] = useState(initUsers);
  const [transfers, setTransfers] = useState([]);
  const [stdCosts, setStdCosts] = useState([]);
  const [shipments, setShipments] = useState([]);
  const [mfgDocs, setMfgDocs] = useState({});
  const [dbLoaded, setDbLoaded] = useState(false);

  // ── Supabase: 앱 시작 시 전체 데이터 로드 ──
  useEffect(()=>{
    (async()=>{
      try{
        const {data,error}=await sb.from('erp_data').select('*');
        if(error){console.error('DB 로드 오류:',error);setDbLoaded(true);return;}
        const store={};
        (data||[]).forEach(row=>{store[row.key]=row.value;});
        if(store.items)    setItems(store.items.map(it=>it.type==="제품"?{...it,type:"완제품"}:it)); // 레거시 유형 "제품"→"완제품" 정규화
        if(store.warehouses) setWarehouses(store.warehouses);
        if(store.processes)  setProcesses(store.processes);
        if(store.bom)      setBom(store.bom);
        if(store.lots)     setLots(store.lots);
        if(store.incoming) setIncoming(store.incoming);
        if(store.orders)   setOrders(store.orders);
        if(store.io)       setIo(store.io);
        if(store.costBom)  setCostBom(store.costBom);
        if(store.factories) setFactories(store.factories);
        if(store.costMaster) setCostMaster(store.costMaster);
        if(store.ordersLedger) setOrdersLedger(store.ordersLedger);
        if(store.users)    setUsers(store.users);
        if(store.transfers) setTransfers(store.transfers);
        if(store.stdCosts)  setStdCosts(store.stdCosts);
        if(store.shipments) setShipments(store.shipments);
        // 제조지시서: 레거시 통합 blob(mfg_docs) + 품목별 개별 행(mfg_docs:<code>) 병합
        {
          const _md=(store.mfg_docs&&typeof store.mfg_docs==="object")?{...store.mfg_docs}:{};
          Object.keys(store).forEach(k=>{ if(k.indexOf("mfg_docs:")===0&&store[k]) _md[k.slice(9)]=store[k]; });
          if(Object.keys(_md).length) setMfgDocs(_md);
          // 레거시 blob → 품목별 행 1회 마이그레이션 후 blob 제거(삭제 정합성 확보, 백그라운드)
          if(store.mfg_docs&&typeof store.mfg_docs==="object"&&Object.keys(store.mfg_docs).length){
            (async()=>{
              try{
                for(const [c,d] of Object.entries(store.mfg_docs)){
                  if(!store["mfg_docs:"+c]) await sb.from('erp_data').upsert({key:'mfg_docs:'+c,value:d,updated_at:new Date().toISOString()});
                }
                await sb.from('erp_data').delete().eq('key','mfg_docs');
              }catch(e){ console.error('제조지시서 마이그레이션 오류:',e); }
            })();
          }
        }
      }catch(e){console.error('DB 연결 오류:',e);}
      finally{setDbLoaded(true);}
    })();
  },[]);

  // ── Supabase: 각 state 변경 시 자동 저장 ──
  const syncDB = async(key,value)=>{
    try{ await sb.from('erp_data').upsert({key,value,updated_at:new Date().toISOString()}); }
    catch(e){ console.error('DB 저장 오류:',key,e); }
  };
  // 제조지시서 단건 저장/삭제 — 품목별 개별 행(mfg_docs:<code>)으로 저장.
  // 첨부 시 전체 제조지시서를 통째로 재업로드하던 방식을 대체(첨부 직후 멈칫 방지).
  const saveMfgDoc = (code,doc)=>{
    setMfgDocs(prev=>{ const n={...prev}; if(doc) n[code]=doc; else delete n[code]; return n; });
    // 네트워크 저장은 다음 틱으로 미뤄 UI(첨부 상태·토스트)가 먼저 반영되게 함
    setTimeout(async()=>{
      try{
        if(doc) await sb.from('erp_data').upsert({key:'mfg_docs:'+code,value:doc,updated_at:new Date().toISOString()});
        else await sb.from('erp_data').delete().eq('key','mfg_docs:'+code);
      }catch(e){ console.error('제조지시서 저장 오류:',code,e); }
    },0);
  };
  useEffect(()=>{if(dbLoaded) syncDB('items',items);},[items,dbLoaded]);
  useEffect(()=>{if(dbLoaded) syncDB('warehouses',warehouses);},[warehouses,dbLoaded]);
  useEffect(()=>{if(dbLoaded) syncDB('processes',processes);},[processes,dbLoaded]);
  useEffect(()=>{if(dbLoaded) syncDB('bom',bom);},[bom,dbLoaded]);
  useEffect(()=>{if(dbLoaded) syncDB('lots',lots);},[lots,dbLoaded]);
  useEffect(()=>{if(dbLoaded) syncDB('incoming',incoming);},[incoming,dbLoaded]);
  useEffect(()=>{if(dbLoaded) syncDB('orders',orders);},[orders,dbLoaded]);
  useEffect(()=>{if(dbLoaded) syncDB('io',io);},[io,dbLoaded]);
  useEffect(()=>{if(dbLoaded) syncDB('costBom',costBom);},[costBom,dbLoaded]);
  useEffect(()=>{if(dbLoaded) syncDB('factories',factories);},[factories,dbLoaded]);
  useEffect(()=>{if(dbLoaded) syncDB('costMaster',costMaster);},[costMaster,dbLoaded]);
  useEffect(()=>{if(dbLoaded) syncDB('ordersLedger',ordersLedger);},[ordersLedger,dbLoaded]);
  useEffect(()=>{if(dbLoaded) syncDB('users',users);},[users,dbLoaded]);
  useEffect(()=>{if(dbLoaded) syncDB('transfers',transfers);},[transfers,dbLoaded]);
  useEffect(()=>{if(dbLoaded) syncDB('stdCosts',stdCosts);},[stdCosts,dbLoaded]);
  useEffect(()=>{if(dbLoaded) syncDB('shipments',shipments);},[shipments,dbLoaded]);
  // 제조지시서는 saveMfgDoc()로 품목별 개별 행에 저장하므로 전체 blob 동기화 effect 제거
  const [currentUser, setCurrentUser] = useState(null);
  const [loginForm, setLoginForm] = useState({id:"",pw:""});
  const [loginError, setLoginError] = useState("");
  const [toast, setToast] = useState("");
  const [alert, setAlert] = useState(null);
  const [detailItem, setDetailItem] = useState(null);

  const perm = currentUser ? PERMISSIONS[currentUser.role] : PERMISSIONS.viewer;

  const handleLogin = () => {
    const u = users.find(u=>u.id===loginForm.id && u.pw===loginForm.pw);
    if(u) {
      setCurrentUser(u);
      setLoginError(""); setLoginForm({id:"",pw:""});
    }
    else { setLoginError("아이디 또는 비밀번호가 틀렸습니다."); }
  };
  const handleLogout = () => {
    setCurrentUser(null);
    setPage("dashboard");
  };

  // ── 백업 시스템 ──
  const [backupModal, setBackupModal] = useState(null); // null | "confirm-restore"
  const restoreFileRef = React.useRef(null);

  const getAllData = () => ({
    version: 1,
    exportedAt: new Date().toISOString(),
    items, warehouses, processes, bom, lots, incoming, orders, io,
    costBom, factories, costMaster, ordersLedger, users, transfers, stdCosts, shipments
  });

  const doBackup = () => {
    const data = getAllData();
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const dateStr = new Date().toISOString().slice(0,10).replace(/-/g,"");
    a.download = `MedERP_backup_${dateStr}.json`;
    a.click();
    URL.revokeObjectURL(url);
    localStorage.setItem('lastBackupDate', new Date().toISOString());
    showToast("✅ 백업 파일 다운로드 완료");
  };

  // 자동 월간 백업: dbLoaded 후 30일 경과 시 자동 실행
  useEffect(()=>{
    if(!dbLoaded) return;
    const last = localStorage.getItem('lastBackupDate');
    if(!last) return; // 첫 사용이면 패스 (수동으로 한 번은 직접 백업)
    const daysPassed = (Date.now() - new Date(last).getTime()) / (1000*60*60*24);
    if(daysPassed >= 30) {
      setTimeout(()=>{ // 앱 완전 로드 후 2초 뒤
        if(window.confirm("⚠️ 마지막 백업으로부터 30일이 지났습니다.\n지금 자동 백업을 진행할까요?")) {
          doBackup();
        }
      }, 2000);
    }
  },[dbLoaded]);

  const doRestore = async (file) => {
    try {
      const text = (await file.text()).replace(/^﻿/,""); // 선두 BOM 제거 후 파싱
      const data = JSON.parse(text);
      if(!data.version || !data.items) { alert("올바른 백업 파일이 아닙니다."); return; }
      // Supabase에 모두 저장
      const keys = ['items','warehouses','processes','bom','lots','incoming','orders','io','costBom','factories','costMaster','ordersLedger','users'];
      for(const key of keys) {
        if(data[key] !== undefined) await syncDB(key, data[key]);
      }
      // React state도 업데이트
      if(data.items)        setItems(data.items.map(it=>it.type==="제품"?{...it,type:"완제품"}:it)); // 유형 "제품"→"완제품" 정규화
      if(data.warehouses)   setWarehouses(data.warehouses);
      if(data.processes)    setProcesses(data.processes);
      if(data.bom)          setBom(data.bom);
      if(data.lots)         setLots(data.lots);
      if(data.incoming)     setIncoming(data.incoming);
      if(data.orders)       setOrders(data.orders);
      if(data.io)           setIo(data.io);
      if(data.costBom)      setCostBom(data.costBom);
      if(data.factories)    setFactories(data.factories);
      if(data.costMaster)   setCostMaster(data.costMaster);
      if(data.ordersLedger) setOrdersLedger(data.ordersLedger);
      if(data.users)        setUsers(data.users);
      if(data.transfers)    setTransfers(data.transfers);
      if(data.stdCosts)     setStdCosts(data.stdCosts);
      if(data.shipments)    setShipments(data.shipments);
      setBackupModal(null);
      showToast("✅ 데이터 복원 완료");
    } catch(e) {
      alert("복원 실패: 파일이 손상되었거나 잘못된 형식입니다.\n" + e.message);
    }
  };

  const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(""),2500); };
  const showAlert = (title, msg, reason="", showOrder=false) => setAlert({title,msg,reason,showOrder});

  const checkItemLinks = (code) => {
    const inBom = bom.some(b => b.product===code || b.materials.some(m=>m.code===code));
    const inLot = lots.some(l=>l.item===code);
    const inIo = io.some(r=>r.item===code);
    const inInc = incoming.some(r=>r.item===code);
    const inOrd = orders.some(o=>o.product===code);
    const reasons = [];
    if(inOrd) reasons.push("① 작업지시서 먼저 삭제 필요");
    if(inBom) reasons.push("② BOM(자재명세서) 먼저 삭제 필요");
    if(inLot) reasons.push("③ LOT 먼저 삭제 필요");
    if(inIo) reasons.push("④ 입출고 이력 존재 (이력 삭제 후 가능)");
    if(inInc) reasons.push("⑤ 입고 예정 먼저 삭제 필요");
    return reasons;
  };
  const checkWarehouseLinks = (code) => {
    const inItem = items.some(i=>i.warehouse===code);
    const inLot = lots.some(l=>l.warehouse===code);
    const reasons = [];
    if(inItem) reasons.push("① 해당 창고를 사용하는 품목의 창고 변경 필요");
    if(inLot) reasons.push("② LOT 먼저 삭제 필요");
    return reasons;

          <p style={{fontSize:11,color:"#aaa"}}>생산관리 시스템</p>
        </div>
        {loginError && <div className="login-error">{loginError}</div>}
        <div className="field">
          <label>아이디</label>
          <input value={loginForm.id} onChange={e=>setLoginForm({...loginForm,id:e.target.value})}
            onKeyDown={e=>e.key==="Enter"&&handleLogin()} placeholder="아이디 입력" autoFocus/>
        </div>
        <div className="field">
          <label>비밀번호</label>
          <input type="password" value={loginForm.pw} onChange={e=>setLoginForm({...loginForm,pw:e.target.value})}
            onKeyDown={e=>e.key==="Enter"&&handleLogin()} placeholder="비밀번호 입력"/>
        </div>
        <button className="btn btn-primary" style={{width:"100%",marginTop:8,padding:"10px"}} onClick={handleLogin}>로그인</button>
        <VersionBadge />
      </div>
    </div>

  return (
    <div className="wrap">
      <nav className="nav">
        <div className="nav-logo"><span className="nav-mark"><Icon name="layers" size={19}/></span><span className="nav-brand"><span>Med</span>ERP</span></div>
        {navGroups.map((g,gi)=>{
          if(g.solo){
            const n=g.solo;
            return <div key={n.key} className={`nav-item nav-solo${page===n.key?" active":""}`} onClick={()=>setPage(n.key)}>
              <span className="icon"><Icon name={n.icon} size={18}/></span>{n.label}
            </div>;
          }
          const open=!navCollapsed[g.group];
          const hasActive=g.items.some(it=>it.key===page);
          return <div key={g.group} className="nav-group-wrap">
            <div className={`nav-group${hasActive?" has-active":""}`} onClick={()=>setNavCollapsed(c=>({...c,[g.group]:!c[g.group]}))}>
              <span className="icon"><Icon name={g.icon} size={18}/></span>
              <span className="nav-group-label">{g.group}</span>
              <span className={`nav-caret${open?" open":""}`}>›</span>
            </div>
            {open && g.items.map(it=>(
              <div key={it.key} className={`nav-item nav-sub${page===it.key?" active":""}`} onClick={()=>setPage(it.key)}>
                <span className="icon"><Icon name={it.icon} size={17}/></span>{it.label}
              </div>
            ))}
          </div>;
        })}
        <div className="nav-user">
          <div className="nav-user-info">
            <span className="nav-user-name">{currentUser.name}</span>
            <span className={`nav-user-role role-${currentUser.role}`}>
              {currentUser.role==="admin"?"관리자":currentUser.role==="manager"?"담당자":"조회자"}
            </span>
          </div>
          {perm.canAdmin && (
            <div style={{marginBottom:6,display:"flex",gap:5}}>
              <button className="btn btn-outline btn-sm" style={{flex:1,fontSize:11}} onClick={doBackup}>💾 백업</button>
              <button className="btn btn-outline btn-sm" style={{flex:1,fontSize:11}} onClick={()=>restoreFileRef.current&&restoreFileRef.current.click()}>📂 복원</button>
            </div>
          )}
          <input ref={restoreFileRef} type="file" accept=".json" style={{display:"none"}} onChange={e=>{
            const f=e.target.files[0]; if(!f) return;
            e.target.value="";
            setBackupModal({file:f});
          }}/>
          <button className="btn btn-outline btn-sm" style={{width:"100%"}} onClick={handleLogout}>로그아웃</button>
        </div>
      </nav>
      <main className="main">
        <header className="topbar">
          <div className="topbar-search" style={{cursor:"pointer"}} onClick={()=>setGsOpen(true)}><Icon name="search" size={16}/><span className="topbar-search-ph">품목·LOT·작업지시·주문 검색…</span><span className="topbar-kbd">Ctrl K</span></div>
          <div className="topbar-right">
            <button className="topbar-icon" title="새로고침" onClick={()=>window.location.reload()}><Icon name="refresh" size={17}/></button>
            <button className="topbar-icon" title="알림"><Icon name="bell" size={17}/><span className="topbar-badge"/></button>
            <div className="topbar-user"><span className="topbar-avatar"/><span className="topbar-uname">{currentUser.name}</span></div>
          </div>
        </header>
        <div className="main-inner">{pages[page]||null}</div>
      </main>

      {alert && (
        <div className="overlay">
          <div className="alert-modal" onClick={e=>e.stopPropagation()}>
            <div className="alert-icon">🔒</div>
            <div className="alert-title">{alert.title}</div>
            <div className="alert-msg">{alert.msg}<br/><b style={{color:"#e74c3c"}}>{alert.reason}</b></div>
            {alert.showOrder && (
              <div className="alert-order">
                <div style={{fontWeight:700,marginBottom:6,color:"#333"}}>✅ 삭제 가능한 순서</div>
                {DELETE_ORDER.map((d,i)=><li key={i}>{d}</li>)}
              </div>
            )}
            <button className="btn btn-primary" style={{width:"100%"}} onClick={()=>setAlert(null)}>확인</button>
          </div>
        </div>
      )}

      {gsOpen && (
        <div className="overlay" style={{zIndex:500,alignItems:"flex-start",paddingTop:"10vh"}} onClick={()=>{setGsOpen(false);setGsQ("");}}>
          <div onClick={e=>e.stopPropagation()} style={{width:560,maxWidth:"92vw",background:"#fff",borderRadius:14,boxShadow:"0 20px 60px rgba(16,24,40,0.28)",overflow:"hidden"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,padding:"14px 16px",borderBottom:"1px solid var(--line)"}}>
              <Icon name="search" size={18} style={{color:"#667085"}}/>
              <input autoFocus value={gsQ} onChange={e=>setGsQ(e.target.value)} placeholder="품목명·코드, LOT, 작업지시, 주문, 거래처 검색…" style={{flex:1,border:"none",outline:"none",fontSize:15,background:"none",fontFamily:"inherit"}}/>
              <span className="topbar-kbd">ESC</span>
            </div>
            <div style={{maxHeight:"56vh",overflowY:"auto"}}>
              {(()=>{
                const q=gsQ.trim().toLowerCase();
                if(!q) return <div style={{padding:"28px 16px",textAlign:"center",color:"#aaa",fontSize:13}}>검색어를 입력하세요 · 품목 / LOT / 작업지시 / 주문 / 입고예정</div>;
                const inc=(s)=>(s||"").toString().toLowerCase().includes(q);
                const res=[];
                items.filter(i=>inc(i.name)||inc(i.code)).slice(0,8).forEach(i=>res.push({t:"품목",ic:"package",lb:i.name,sub:`${i.code} · ${i.type}`,pg:"items",q:i.code}));
                lots.filter(l=>inc(l.code)||inc(l.itemName)||inc(l.item)).slice(0,8).forEach(l=>res.push({t:"LOT",ic:"tag",lb:l.code,sub:`${l.itemName||l.item} · ${l.warehouse||"-"} · ${(l.qty||0).toLocaleString()}`,pg:"lot",q:l.code}));
                orders.filter(o=>inc(o.code)||inc(o.productName)||inc(o.product)).slice(0,8).forEach(o=>res.push({t:"작업지시",ic:"wrench",lb:o.code,sub:`${o.productName||o.product||""} · ${o.status||""}`,pg:"orders",q:o.code}));
                ordersLedger.filter(r=>inc(r.product)||inc(r.client)||inc(r.orderNo)).slice(0,8).forEach(r=>res.push({t:"주문",ic:"ledger",lb:r.product||r.orderNo,sub:`${r.client||""} · ${r.orderNo||""}`,pg:"ordersLedger",q:r.orderNo||r.product||""}));
                incoming.filter(r=>inc(r.itemName)||inc(r.item)||inc(r.lot)).slice(0,6).forEach(r=>res.push({t:"입고예정",ic:"truck",lb:r.itemName||r.item,sub:`${r.incomingDate||""} · ${(r.qty||0).toLocaleString()}${r.unit||""}`,pg:"incoming",q:r.itemName||r.item||""}));
                if(!res.length) return <div style={{padding:"28px 16px",textAlign:"center",color:"#aaa",fontSize:13}}>"{gsQ}" 검색 결과가 없습니다</div>;
                return res.map((r,i)=>(
                  <div key={i} onClick={()=>{setPage(r.pg);setNavQ(r.q?{pg:r.pg,v:r.q}:null);setGsOpen(false);setGsQ("");}} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 16px",cursor:"pointer",borderBottom:"1px solid #f3f5f8"}} onMouseEnter={e=>e.currentTarget.style.background="#f6f8fb"} onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
                    <span style={{width:30,height:30,borderRadius:8,background:"var(--accent-soft)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--accent)",flexShrink:0}}><Icon name={r.ic} size={16}/></span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{r.lb}</div>
                      <div style={{fontSize:11,color:"#888",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{r.sub}</div>
                    </div>
                    <span className="badge badge-gray" style={{flexShrink:0}}>{r.t}</span>
                  </div>
                ));
              })()}
            </div>
          </div>
        </div>
      )}

      {toast && <div className="toast">{toast}</div>}
      {detailItem && <ItemDetailModal item={detailItem} items={items} lots={lots} io={io} bom={bom} perm={perm} onClose={()=>setDetailItem(null)} />}

      {backupModal && (
        <div className="overlay" style={{zIndex:400}}>
          <div className="alert-modal" onClick={e=>e.stopPropagation()}>
            <div className="alert-icon">⚠️</div>
            <div className="alert-title">데이터 복원</div>
            <div className="alert-msg" style={{textAlign:"left"}}>
              <b style={{color:"#e74c3c"}}>주의: 현재 모든 데이터가 백업 파일로 덮어씌워집니다.</b><br/><br/>
              파일명: <b>{backupModal.file?.name}</b><br/>
              <br/>이 작업은 되돌릴 수 없습니다. 계속하시겠습니까?
            </div>
            <div style={{display:"flex",gap:8,marginTop:4}}>
              <button className="btn btn-outline" style={{flex:1}} onClick={()=>setBackupModal(null)}>취소</button>
              <button className="btn btn-danger" style={{flex:1}} onClick={()=>doRestore(backupModal.file)}>복원 시작</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════
//  창고 간 이동 (TransferPage)
// ══════════════════════════════════════════════
function TransferPage({transfers,setTransfers,items,lots,setLots,io,setIo,warehouses,currentUser,perm,showToast,tryDelete,downloadCSV}) {
  const today = new Date().toISOString().slice(0,10);
  const emptyForm = {item:"",itemName:"",lot:"",qty:"",fromWarehouse:"",toWarehouse:"",date:today,note:""};
  const [form,setForm]   = React.useState(emptyForm);
  const [modal,setModal] = React.useState(false);
  const [sel,setSel]     = React.useState(new Set());
  const [search,setSearch] = React.useState("");

  // 선택 품목에 해당하는 LOT 목록
  const lotOptions = lots.filter(l=>l.item===form.item && l.qty>0);
  // 선택 LOT의 현재 창고를 fromWarehouse 기본값으로
  const selLot = lots.find(l=>l.code===form.lot);

  const openAdd = () => {
    setForm({...emptyForm, date:today});
    setModal(true);
  };

  const save = () => {
    if(!form.item)          { showToast("품목을 선택해주세요"); return; }
    if(!form.lot)           { showToast("LOT를 선택해주세요"); return; }
    if(!form.fromWarehouse) { showToast("출발 창고를 선택해주세요"); return; }
    if(!form.toWarehouse)   { showToast("도착 창고를 선택해주세요"); return; }
    if(form.fromWarehouse===form.toWarehouse) { showToast("출발 창고와 도착 창고가 같습니다"); return; }
    const qty = Number(form.qty);
    if(!qty||qty<=0)        { showToast("수량을 입력해주세요"); return; }
    const lotObj = lots.find(l=>l.code===form.lot);
    if(lotObj && qty > lotObj.qty) { showToast(`LOT 재고 부족 (현재고: ${lotObj.qty})`); return; }

    const id = "TR" + Date.now();
    const rec = {
      id, date:form.date, item:form.item, itemName:form.itemName,
      lot:form.lot, qty, fromWarehouse:form.fromWarehouse,
      toWarehouse:form.toWarehouse, note:form.note,
      manager: currentUser?.name||""
    };

    // 도착 LOT 코드 = 원본 LOT 번호 그대로 (접미사 없음, 창고로만 구분)
    const srcLot = lots.find(l=>l.code===form.lot && l.warehouse===form.fromWarehouse) || lots.find(l=>l.code===form.lot);
    const existDest = lots.find(l=>l.item===form.item && l.code===form.lot && l.warehouse===form.toWarehouse);
    const destLotCode = form.lot;

    // LOT 창고 업데이트: 출발창고 LOT 차감 → 도착창고 동일 LOT 합산 or 신규 생성 ((코드+창고)로 식별)
    setLots(prev => {
      const updated = prev.map(l=>
        l.code===form.lot && l.warehouse===form.fromWarehouse ? {...l, qty:(l.qty||0)-qty} :
        l.code===form.lot && l.warehouse===form.toWarehouse ? {...l, qty:(l.qty||0)+qty} : l
      );
      if(existDest) return updated;
      return [...updated, {...srcLot, code:destLotCode, qty, warehouse:form.toWarehouse}];
    });

    // IO 기록: 출발창고 출고(원본 LOT) + 도착창고 입고(도착 LOT) — _transferId로 삭제 시 역추적
    const ioOut = {date:form.date,type:"출고",item:form.item,itemName:form.itemName,qty,unitPrice:0,lot:form.lot,destination:form.toWarehouse,manager:currentUser?.name||"",approver:"",note:`창고이동→${form.toWarehouse} ${form.note||""}`,_transferId:id};
    const ioIn  = {date:form.date,type:"입고",item:form.item,itemName:form.itemName,qty,unitPrice:0,lot:destLotCode,destination:"",manager:currentUser?.name||"",approver:"",note:`창고이동←${form.fromWarehouse} ${form.note||""}`,_transferId:id};
    setIo(prev=>[...prev,ioOut,ioIn]);

    setTransfers(prev=>[{...rec,_destLotCode:destLotCode},...prev]);
    showToast("✅ 창고 간 이동이 완료되었습니다.");
    setModal(false);
  };

  const _revertTransfer=(t)=>{
    // 도착 코드: 신규=원본 LOT 번호(t.lot), 구버전(_MV_ 데이터)=접미사 코드
    const destCode=t._destLotCode||(t.lot+"_MV_"+t.toWarehouse);
    const destIsSuffixed=destCode!==t.lot; // 구버전 여부
    // IO 역추적 삭제 (_transferId 우선, 없으면 note 패턴으로 매칭)
    setIo(prev=>prev.filter(r=>
      r._transferId ? r._transferId!==t.id :
      !(r.item===t.item && r.qty===t.qty && (r.note||"").includes("창고이동") &&
        ((r.lot===t.lot&&r.type==="출고")||(r.lot===destCode&&r.type==="입고")))
    ));
    // LOT 수량 복구
    setLots(prev=>{
      // 출발창고 LOT 복구
      const updated=prev.map(l=>l.code===t.lot&&(l.warehouse===t.fromWarehouse||!l.warehouse)?{...l,qty:(l.qty||0)+t.qty}:l);
      // 도착 LOT 차감: 구버전은 코드로, 신규는 (코드+도착창고)로 식별
      const match=l=>destIsSuffixed?l.code===destCode:(l.code===t.lot&&l.warehouse===t.toWarehouse);
      const destLot=updated.find(match);
      if(!destLot) return updated;
      if((destLot.qty||0)<=t.qty) return updated.filter(l=>!match(l));
      return updated.map(l=>match(l)?{...l,qty:(l.qty||0)-t.qty}:l);
    });
  };

  const del = (id) => {
    tryDelete([], ()=>{
      const t=transfers.find(t=>t.id===id);
      if(t) _revertTransfer(t);
      setTransfers(prev=>prev.filter(t=>t.id!==id));
      showToast("삭제되었습니다.");
    }, "이동 이력 삭제 불가");
  };
  const bulkDel = () => {
    if(!window.confirm(`선택한 ${sel.size}개를 삭제하시겠습니까?`)) return;
    transfers.filter(t=>sel.has(t.id)).forEach(t=>_revertTransfer(t));
    setTransfers(prev=>prev.filter(t=>!sel.has(t.id)));
    setSel(new Set());
    showToast(`${sel.size}개 삭제되었습니다.`);
  };

  // ── 기존 _MV_ 접미사 LOT 일괄 정리 (코드만 원본 번호로 복원, 창고는 유지) ──
  const cleanupMvCodes = () => {
    const baseCode = c => (c||"").split("_MV_")[0];
    const mvLots = lots.filter(l=>(l.code||"").includes("_MV_"));
    const mvIo   = io.filter(r=>(r.lot||"").includes("_MV_"));
    const mvTr   = transfers.filter(t=>(t._destLotCode||"").includes("_MV_"));
    if(mvLots.length===0 && mvIo.length===0 && mvTr.length===0){
      showToast("정리할 _MV_ LOT이 없습니다.");
      return;
    }
    if(!window.confirm(`기존 _MV_ 접미사 LOT을 원본 번호로 정리합니다.\n\n· LOT ${mvLots.length}건\n· 입출고 이력 ${mvIo.length}건\n· 이동 이력 ${mvTr.length}건\n\n코드만 깔끔하게 바뀌고 수량/창고는 그대로 유지됩니다.\n계속하시겠습니까?`)) return;
    // 1) lots: 코드 정리 + (품목+코드+창고) 동일 시 합산 병합
    const merged={}, order=[];
    lots.forEach(l=>{
      const code=baseCode(l.code), wh=l.warehouse||"";
      const key=l.item+"|"+code+"|"+wh;
      if(merged[key]) merged[key]={...merged[key], qty:(merged[key].qty||0)+(l.qty||0)};
      else { merged[key]={...l, code}; order.push(key); }
    });
    const newLots=order.map(k=>merged[k]);
    // 2) io: lot 코드 정리
    const newIo=io.map(r=>(r.lot||"").includes("_MV_")?{...r, lot:baseCode(r.lot)}:r);
    // 3) transfers: _destLotCode 정리
    const newTr=transfers.map(t=>(t._destLotCode||"").includes("_MV_")?{...t, _destLotCode:baseCode(t._destLotCode)}:t);
    setLots(newLots);
    setIo(newIo);
    setTransfers(newTr);
    showToast(`✅ 정리 완료 — LOT ${mvLots.length}건, 입출고 ${mvIo.length}건 코드 정리됨`);
  };

  const filtered = transfers.filter(t=>
    !search ||
    t.itemName?.includes(search) ||
    t.item?.includes(search) ||
    t.lot?.includes(search) ||
    t.fromWarehouse?.includes(search) ||
    t.toWarehouse?.includes(search)
  );

  const toggleSel = (id) => { const s=new Set(sel); s.has(id)?s.delete(id):s.add(id); setSel(s); };
  const allCheck = filtered.length>0 && filtered.every(t=>sel.has(t.id));

  return (
    <div className="page-content">
      <div className="page-header">
        <div><div className="crumb">MedERP <span>›</span> <b>창고 간 이동</b></div><div className="page-title">창고 간 이동</div><div className="page-sub">LOT 단위로 창고 간 재고를 이동합니다. 이동 시 입출고 이력이 자동 생성됩니다.</div></div>
      </div>

      {/* 툴바 */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
        {perm.canDelete&&sel.size>0&&<button className="btn btn-danger" onClick={bulkDel}>🗑 선택 삭제 ({sel.size})</button>}
        <button className="btn btn-outline" onClick={()=>downloadCSV(
          ["이동일","품목코드","품목명","LOT번호","수량","출발창고","도착창고","담당자","비고"],
          filtered.map(t=>[t.date,t.item,t.itemName,t.lot,t.qty,t.fromWarehouse,t.toWarehouse,t.manager||"",t.note||""])
          ,"창고이동이력.csv")}>📥 목록 다운로드</button>
        {perm.canCreate&&<button className="btn btn-outline" onClick={cleanupMvCodes} title="기존 _MV_ 접미사 LOT을 원본 번호로 일괄 정리">🧹 _MV_ LOT 정리</button>}
        {perm.canCreate&&<button className="btn btn-primary" onClick={openAdd}>+ 창고 간 이동</button>}
      </div>

      {/* 검색 */}
      <div style={{marginBottom:12}}>
        <input className="input" placeholder="품목명, LOT, 창고 검색…" value={search} onChange={e=>setSearch(e.target.value)} style={{maxWidth:320}} />
      </div>

      {/* 테이블 */}
      <div className="table-wrap">
        <table className="table">
          <thead>
            <tr>
              {perm.canDelete&&<th style={{width:36}}><input type="checkbox" checked={allCheck} onChange={e=>{const s=new Set();if(e.target.checked)filtered.forEach(t=>s.add(t.id));setSel(s);}}/></th>}
              <th>이동일</th><th>품목코드</th><th>품목명</th><th>LOT번호</th>
              <th>수량</th><th>출발 창고</th><th style={{color:"#3b7ddd"}}>→ 도착 창고</th>
              <th style={{textAlign:"center"}}>상태</th>
              <th>담당자</th><th>비고</th><th>관리</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length===0
              ? <tr><td colSpan={12} className="empty">이동 이력이 없습니다</td></tr>
              : filtered.map(t=>(
                <tr key={t.id}>
                  {perm.canDelete&&<td><input type="checkbox" checked={sel.has(t.id)} onChange={()=>toggleSel(t.id)}/></td>}
                  <td>{t.date}</td>
                  <td><code style={{fontSize:11}}>{t.item}</code></td>
                  <td style={{fontWeight:600}}>{t.itemName}</td>
                  <td><code style={{fontSize:11}}>{t.lot}</code></td>
                  <td style={{textAlign:"right",fontWeight:600}}>{(t.qty||0).toLocaleString()}</td>
                  <td>{t.fromWarehouse}</td>
                  <td style={{color:"#3b7ddd",fontWeight:600}}><Icon name="chevronR" size={12} style={{display:"inline",verticalAlign:-2,marginRight:2}}/>{t.toWarehouse}</td>
                  <td style={{textAlign:"center"}}><span className="badge badge-green">완료</span></td>
                  <td>{t.manager||"-"}</td>
                  <td style={{color:"#888",fontSize:12}}>{t.note||""}</td>
                  <td>{perm.canDelete&&<button className="btn btn-danger btn-sm" onClick={()=>del(t.id)}>삭제</button>}</td>
                </tr>
              ))
            }
          </tbody>
        </table>
      </div>

      {/* 이동 등록 모달 */}
      {modal&&(
        <div className="modal-overlay" onClick={e=>{if(e.target.className==="modal-overlay")setModal(false);}}>
          <div className="modal" style={{maxWidth:520}}>
            <div className="modal-header"><h3>🔄 창고 간 이동 등록</h3><button className="modal-close" onClick={()=>setModal(false)}>✕</button></div>
            <div className="modal-body" style={{display:"flex",flexDirection:"column",gap:14}}>
              {/* 이동일 */}
              <div>
                <label className="label">이동일 *</label>
                <input className="input" type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} />
              </div>
              {/* 품목 선택 */}
              <div>
                <label className="label">품목 *</label>
                <select className="input" value={form.item} onChange={e=>{
                  const it=items.find(i=>i.code===e.target.value);
                  setForm({...form,item:e.target.value,itemName:it?.name||"",lot:"",fromWarehouse:"",qty:""});
                }}>
                  <option value="">-- 품목 선택 --</option>
                  {items.map(i=><option key={i.code} value={i.code}>{i.name} ({i.code})</option>)}
                </select>
              </div>
              {/* LOT 선택 */}
              <div>
                <label className="label">LOT 번호 *</label>
                <select className="input" value={form.lot} onChange={e=>{
                  const l=lots.find(x=>x.code===e.target.value);
                  setForm({...form,lot:e.target.value,fromWarehouse:l?.warehouse||""});
                }} disabled={!form.item}>
                  <option value="">-- LOT 선택 --</option>
                  {lotOptions.map(l=><option key={l.code} value={l.code}>{l.code} (재고: {l.qty} / {l.warehouse})</option>)}
                </select>
                {form.item&&lotOptions.length===0&&<div style={{color:"#e55",fontSize:12,marginTop:4}}>⚠ 해당 품목의 사용 가능한 LOT가 없습니다</div>}
              </div>
              {/* 출발 창고 */}
              <div>
                <label className="label">출발 창고 *</label>
                <select className="input" value={form.fromWarehouse} onChange={e=>setForm({...form,fromWarehouse:e.target.value})}>
                  <option value="">-- 창고 선택 --</option>
                  {warehouses.map(w=><option key={w.code} value={w.name}>{w.name}</option>)}
                </select>
              </div>
              {/* 도착 창고 */}
              <div>
                <label className="label">도착 창고 *</label>
                <select className="input" value={form.toWarehouse} onChange={e=>setForm({...form,toWarehouse:e.target.value})}>
                  <option value="">-- 창고 선택 --</option>
                  {warehouses.filter(w=>w.name!==form.fromWarehouse).map(w=><option key={w.code} value={w.name}>{w.name}</option>)}
                </select>
              </div>
              {/* 수량 */}
              <div>
                <label className="label">이동 수량 *
                  {selLot&&<span style={{fontWeight:400,color:"#888",marginLeft:8}}>(LOT 현재고: {selLot.qty})</span>}
                </label>
                <input className="input" type="number" min="1" max={selLot?.qty||undefined}
                  value={form.qty} onChange={e=>setForm({...form,qty:e.target.value})}
                  placeholder={selLot?`최대 ${selLot.qty}`:"수량 입력"} />
              </div>
              {/* 비고 */}
              <div>
                <label className="label">비고</label>
                <input className="input" value={form.note} onChange={e=>setForm({...form,note:e.target.value})} placeholder="이동 사유 등 (선택)" />
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-outline" onClick={()=>setModal(false)}>취소</button>
              <button className="btn btn-primary" onClick={save}>✅ 이동 완료</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function AnalysisPage({orders, items, factories=[], processes=[]}) {
  const nowYm = new Date().toISOString().slice(0,7);
  const prevYm = (ym, n) => {
    const [y,m] = ym.split("-").map(Number);
    const d = new Date(y, m-1-n, 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  };
  const [fromYm, setFromYm] = React.useState(prevYm(nowYm, 5));
  const [toYm,   setToYm]   = React.useState(nowYm);
  const [preset, setPreset]  = React.useState(6); // 현재 선택된 프리셋 (null=수동)
  const [view,setView] = React.useState(0); // 0=리포트 대시보드 · 1=피벗 비교

  const barRef   = React.useRef(null);
  const lineRef  = React.useRef(null);
  const barChart = React.useRef(null);
  const lineChart= React.useRef(null);

  // fromYm ~ toYm 사이의 모든 월 배열
  const buildMonths = (from, to) => {
    const result = [];
    let [fy,fm] = from.split("-").map(Number);
    const [ty,tm] = to.split("-").map(Number);
    while(fy < ty || (fy===ty && fm<=tm)) {
      result.push(`${fy}-${String(fm).padStart(2,'0')}`);
      fm++; if(fm>12){fm=1;fy++;}
      if(result.length>60) break; // 최대 5년
    }
    return result;
  };

  const months = buildMonths(fromYm, toYm);
  const completedOrders = orders.filter(o=>o.status==="완료"&&o.doneDate);
  const rangeOrders = completedOrders.filter(o=>o.doneDate.slice(0,7)>=fromYm&&o.doneDate.slice(0,7)<=toYm);

  const monthlyData = months.map(m=>{
    const mo = completedOrders.filter(o=>o.doneDate.slice(0,7)===m);
    const qty    = mo.reduce((s,o)=>s+(o.orderQty||0),0);
    const defect = mo.reduce((s,o)=>s+(o.defectQty||0),0);
    const rate   = qty>0?parseFloat((defect/qty*100).toFixed(1)):0;
    const label  = months.length>12 ? m.slice(0,7) : m.slice(5)+"월";
    return {month:m, label, count:mo.length, qty, defect, rate};
  });

  // 제품별 실적 (선택 기간)
  const productMap = {};
  rangeOrders.forEach(o=>{
    const k = o.product||o.productName;
    if(!productMap[k]) productMap[k]={name:o.productName||k, count:0, qty:0, defect:0};
    productMap[k].count++;
    productMap[k].qty    += o.orderQty||0;
    productMap[k].defect += o.defectQty||0;
  });
  const productList = Object.values(productMap).sort((a,b)=>b.qty-a.qty);

  // KPI (선택 기간)
  const totalCompleted  = rangeOrders.length;
  const totalQty        = rangeOrders.reduce((s,o)=>s+(o.orderQty||0),0);
  const totalDefect     = rangeOrders.reduce((s,o)=>s+(o.defectQty||0),0);
  const avgDefectRate   = totalQty>0?(totalDefect/totalQty*100).toFixed(1):0;
  const completionRate  = orders.length>0?(completedOrders.length/orders.length*100).toFixed(0):0;

  const applyPreset = (n) => {
    setPreset(n);
    setFromYm(prevYm(nowYm, n-1));
    setToYm(nowYm);
  };

  // 차트 - 막대
  React.useEffect(()=>{
    if(!barRef.current||typeof Chart==="undefined") return;
    if(barChart.current) barChart.current.destroy();
    barChart.current = new Chart(barRef.current, {
      type:'bar',
      data:{
        labels: monthlyData.map(d=>d.label),
        datasets:[
          {label:'생산수량(EA)', data:monthlyData.map(d=>d.qty), backgroundColor:'rgba(37,99,235,0.75)', borderRadius:4},
          {label:'불량수량(EA)', data:monthlyData.map(d=>d.defect), backgroundColor:'rgba(231,76,60,0.7)',  borderRadius:4},
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'top'},tooltip:{mode:'index'}},
        scales:{y:{beginAtZero:true,title:{display:true,text:'수량(EA)'}}}}
    });
    return ()=>{ if(barChart.current) barChart.current.destroy(); };
  },[fromYm, toYm, orders, view]);

  // 차트 - 라인
  React.useEffect(()=>{
    if(!lineRef.current||typeof Chart==="undefined") return;
    if(lineChart.current) lineChart.current.destroy();
    lineChart.current = new Chart(lineRef.current, {
      type:'line',
      data:{
        labels: monthlyData.map(d=>d.label),
        datasets:[
          {label:'불량률(%)',  data:monthlyData.map(d=>d.rate),  borderColor:'#e74c3c', backgroundColor:'rgba(231,76,60,0.08)', tension:0.4, pointRadius:5, fill:true},
          {label:'완료건수',  data:monthlyData.map(d=>d.count), borderColor:'#27ae60', backgroundColor:'rgba(39,174,96,0.08)',  tension:0.4, pointRadius:5, fill:false, yAxisID:'y2'},
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'top'},tooltip:{mode:'index'}},
        scales:{
          y: {beginAtZero:true,title:{display:true,text:'불량률(%)'},position:'left'},
          y2:{beginAtZero:true,title:{display:true,text:'완료건수'},position:'right',grid:{drawOnChartArea:false}},
        }}
    });
    return ()=>{ if(lineChart.current) lineChart.current.destroy(); };
  },[fromYm, toYm, orders, view]);

  // ══════════ 피벗 비교 뷰 (와이어프레임) ══════════
  const pivotLineRef = React.useRef(null);
  const pivotChart   = React.useRef(null);
  const [pFrom,setPFrom]   = React.useState(prevYm(nowYm,5));
  const [pTo,setPTo]       = React.useState(nowYm);
  const [pGroup,setPGroup] = React.useState("line");
  const [pMetric,setPMetric]= React.useState("qty");
  const [aFrom,setAFrom]   = React.useState(prevYm(nowYm,5));
  const [aTo,setATo]       = React.useState(nowYm);
  const [aGroup,setAGroup] = React.useState("line");
  const [aMetric,setAMetric]= React.useState("qty");
  const applyPivot = () => { setAFrom(pFrom); setATo(pTo); setAGroup(pGroup); setAMetric(pMetric); };
  const pivotDirty = pFrom!==aFrom||pTo!==aTo||pGroup!==aGroup||pMetric!==aMetric;

  const aMonths    = buildMonths(aFrom, aTo);
  const aCompleted = orders.filter(o=>o.status==="완료"&&o.doneDate);
  const aRange     = aCompleted.filter(o=>o.doneDate.slice(0,7)>=aFrom&&o.doneDate.slice(0,7)<=aTo);
  const groupOf = (o) => {
    if(aGroup==="line")    return factories.find(f=>f.code===o.factoryCode)?.name || o.factoryCode || "미지정";
    if(aGroup==="product") return o.productName || o.product || "미지정";
    if(aGroup==="process") return (o.processes&&o.processes[0]&&o.processes[0].name) || "미지정";
    return o.client || o.customer || "미지정"; // 작업지시엔 거래처 필드 없음 → 미지정
  };
  const metricLabel = {qty:"생산량",good:"양품수",defect:"불량수",rate:"불량률(%)"}[aMetric];
  const groupLabel  = {line:"생산 라인",product:"품목",process:"공정",client:"거래처"}[aGroup];
  const isBadMetric = aMetric==="defect"||aMetric==="rate";
  const cellOf = (agg)=> aMetric==="qty"?agg.qty : aMetric==="good"?Math.max(0,agg.qty-agg.defect) : aMetric==="defect"?agg.defect : (agg.qty>0?+(agg.defect/agg.qty*100).toFixed(1):0);
  const monthIdx = {}; aMonths.forEach((m,i)=>monthIdx[m]=i);
  const gNames = [...new Set(aRange.map(groupOf))];
  const mat = {}; gNames.forEach(g=>mat[g]=aMonths.map(()=>({qty:0,defect:0})));
  aRange.forEach(o=>{ const g=groupOf(o); const mi=monthIdx[o.doneDate.slice(0,7)]; if(mi==null) return; mat[g][mi].qty+=o.orderQty||0; mat[g][mi].defect+=o.defectQty||0; });
  const pivotRows = gNames.map(g=>{
    const tot = mat[g].reduce((s,c)=>({qty:s.qty+c.qty,defect:s.defect+c.defect}),{qty:0,defect:0});
    return { g, cells:mat[g].map(cellOf), qtyCells:mat[g].map(c=>c.qty), total:cellOf(tot), totQty:tot.qty };
  }).sort((a,b)=>b.totQty-a.totQty);
  const maxCell = Math.max(1, ...pivotRows.flatMap(r=>r.cells), 0);
  const heatBg = (v)=>{ if(v<=0) return "#f8fafc"; const t=Math.min(1,v/maxCell); return isBadMetric?`rgba(214,72,59,${(0.10+t*0.62).toFixed(2)})`:`rgba(47,109,240,${(0.10+t*0.62).toFixed(2)})`; };
  const heatFg = (v)=> (v>0 && v/maxCell>0.55) ? "#fff" : "#1b2333";

  const sumA = (arr,f)=>arr.reduce((s,o)=>s+f(o),0);
  const aQty = sumA(aRange,o=>o.orderQty||0);
  const aDef = sumA(aRange,o=>o.defectQty||0);
  const aGoodRate = aQty>0?+((aQty-aDef)/aQty*100).toFixed(1):0;
  const leads = aRange.filter(o=>o.startAt&&o.doneDate).map(o=>(new Date(o.doneDate)-new Date(o.startAt))/86400000).filter(d=>d>=0);
  const aLead = leads.length?+(leads.reduce((s,d)=>s+d,0)/leads.length).toFixed(1):0;
  const pmN = aMonths.length;
  const pvRange = aCompleted.filter(o=>o.doneDate.slice(0,7)>=prevYm(aFrom,pmN)&&o.doneDate.slice(0,7)<=prevYm(aFrom,1));
  const pvQty = sumA(pvRange,o=>o.orderQty||0);
  const pvDef = sumA(pvRange,o=>o.defectQty||0);
  const pvGoodRate = pvQty>0?+((pvQty-pvDef)/pvQty*100).toFixed(1):0;
  const pvLeads = pvRange.filter(o=>o.startAt&&o.doneDate).map(o=>(new Date(o.doneDate)-new Date(o.startAt))/86400000).filter(d=>d>=0);
  const pvLead = pvLeads.length?+(pvLeads.reduce((s,d)=>s+d,0)/pvLeads.length).toFixed(1):0;
  const qtyTrend  = pvQty? Math.round((aQty-pvQty)/pvQty*100) : null;
  const goodTrend = pvRange.length? +(aGoodRate-pvGoodRate).toFixed(1) : null;
  const defTrend  = pvRange.length? aDef-pvDef : null;
  const leadTrend = pvLead? +(aLead-pvLead).toFixed(1) : null;

  const defByProd = {};
  aRange.forEach(o=>{ const k=o.productName||o.product||"미지정"; if(!defByProd[k]) defByProd[k]={name:k,defect:0}; defByProd[k].defect+=o.defectQty||0; });
  const topDef = Object.values(defByProd).filter(d=>d.defect>0).sort((a,b)=>b.defect-a.defect).slice(0,5);
  const maxDef = Math.max(1, ...topDef.map(d=>d.defect));

  React.useEffect(()=>{
    if(view!==1||!pivotLineRef.current||typeof Chart==="undefined") return;
    if(pivotChart.current) pivotChart.current.destroy();
    const pal=['#2f6df0','#2f9e63','#c47d12','#d6483b','#7c5cff','#0ea5a5'];
    const top=pivotRows.slice(0,6);
    pivotChart.current=new Chart(pivotLineRef.current,{
      type:'line',
      data:{labels:aMonths.map(m=>m.slice(5)+"월"),datasets:top.map((r,i)=>({label:r.g,data:r.cells,borderColor:pal[i%pal.length],backgroundColor:pal[i%pal.length]+"22",tension:0.35,pointRadius:3,fill:false}))},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{boxWidth:12,font:{size:11}}}},scales:{y:{beginAtZero:true}}}
    });
    return ()=>{ if(pivotChart.current) pivotChart.current.destroy(); };
  },[aFrom,aTo,aGroup,aMetric,orders,view]);

  const inputStyle={border:"1px solid #ddd",borderRadius:6,padding:"5px 10px",fontSize:13,outline:"none"};

  return (
    <div>
      <div className="page-header">
        <div><div className="crumb">MedERP <span>›</span> <b>생산 실적 분석</b></div><div className="page-title">생산 실적 분석</div><div className="page-sub">기간별 생산·품질 실적을 분석합니다</div></div>
        <div className="seg-toggle">
          <button className={`seg-btn ${view===0?"is-on":""}`} onClick={()=>setView(0)}>리포트 대시보드</button>
          <button className={`seg-btn ${view===1?"is-on":""}`} onClick={()=>setView(1)}>피벗 비교</button>
        </div>
      </div>

      {view===0 && <React.Fragment>
      {/* 기간 필터 바 */}
      <div style={{background:"#fff",borderRadius:10,padding:"12px 18px",boxShadow:"0 1px 3px rgba(0,0,0,0.07)",marginBottom:20,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <span style={{fontSize:13,fontWeight:600,color:"#555"}}>기간</span>
        <input type="month" value={fromYm} max={toYm} style={inputStyle}
          onChange={e=>{setFromYm(e.target.value);setPreset(null);}}/>
        <span style={{color:"#aaa"}}>~</span>
        <input type="month" value={toYm} min={fromYm} max={nowYm} style={inputStyle}
          onChange={e=>{setToYm(e.target.value);setPreset(null);}}/>
        <div style={{display:"flex",gap:5,marginLeft:8}}>
          {[3,6,12].map(n=>(
            <button key={n} className={`btn btn-sm ${preset===n?"btn-primary":"btn-outline"}`}
              onClick={()=>applyPreset(n)}>{n}개월</button>
          ))}
          <button className={`btn btn-sm ${preset===0?"btn-primary":"btn-outline"}`}
            onClick={()=>{setPreset(0);setFromYm(nowYm.slice(0,4)+"-01");setToYm(nowYm);}}>올해</button>
        </div>
        <span style={{marginLeft:"auto",fontSize:12,color:"#888"}}>
          {months.length}개월 | 완료 {totalCompleted}건
        </span>
      </div>

      {/* KPI 카드 */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:24}}>
        <div className="card"><div className="card-label">완료 작업지시</div><div className="card-val">{totalCompleted}<span style={{fontSize:16,fontWeight:400}}> 건</span></div><div className="card-sub">선택 기간 기준</div></div>
        <div className="card ok"><div className="card-label">전체 완료율</div><div className="card-val">{completionRate}<span style={{fontSize:16,fontWeight:400}}> %</span></div><div className="card-sub">전체 {orders.length}건 중</div></div>
        <div className="card"><div className="card-label">총 생산량</div><div className="card-val" style={{fontSize:20}}>{totalQty.toLocaleString()}<span style={{fontSize:14,fontWeight:400}}> EA</span></div><div className="card-sub">선택 기간 기준</div></div>
        <div className={`card${parseFloat(avgDefectRate)>3?" warn":""}`}><div className="card-label">평균 불량률</div><div className="card-val">{avgDefectRate}<span style={{fontSize:16,fontWeight:400}}> %</span></div><div className="card-sub">불량 {totalDefect.toLocaleString()} EA</div></div>
      </div>

      {/* 차트 2개 */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20,marginBottom:24}}>
        <div className="panel" style={{padding:20}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:14,color:"#1a2236"}}>📊 월별 생산량 / 불량수량</div>
          <div style={{height:260}}><canvas ref={barRef}/></div>
        </div>
        <div className="panel" style={{padding:20}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:14,color:"#1a2236"}}>📉 불량률 추이 / 완료건수</div>
          <div style={{height:260}}><canvas ref={lineRef}/></div>
        </div>
      </div>

      {/* 제품별 생산 실적 */}
      <div className="panel">
        <div className="panel-top">
          <b>🏷️ 제품별 생산 실적</b>
          <span style={{fontSize:12,color:"#888"}}>{fromYm} ~ {toYm} | {productList.length}개 제품</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>제품명</th>
              <th style={{textAlign:"right"}}>완료건수</th>
              <th style={{textAlign:"right"}}>총 생산량</th>
              <th style={{textAlign:"right"}}>총 불량</th>
              <th style={{textAlign:"right"}}>불량률</th>
              <th>생산 비율</th>
            </tr>
          </thead>
          <tbody>
            {productList.map((p,i)=>{
              const rate   = p.qty>0?(p.defect/p.qty*100).toFixed(1):0;
              const barPct = totalQty>0?Math.round(p.qty/totalQty*100):0;
              return (
                <tr key={i}>
                  <td><b>{p.name}</b></td>
                  <td style={{textAlign:"right"}}>{p.count}건</td>
                  <td style={{textAlign:"right",fontWeight:700}}>{p.qty.toLocaleString()} EA</td>
                  <td style={{textAlign:"right",color:p.defect>0?"#e74c3c":"#27ae60",fontWeight:600}}>{p.defect}</td>
                  <td style={{textAlign:"right",color:parseFloat(rate)>3?"#e74c3c":"#333"}}>{rate}%</td>
                  <td style={{width:160}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <div style={{flex:1,background:"#f0f2f5",borderRadius:10,height:8,overflow:"hidden"}}>
                        <div style={{width:`${barPct}%`,background:"#2f6df0",height:"100%",borderRadius:10}}/>
                      </div>
                      <span style={{fontSize:12,color:"#888",minWidth:30}}>{barPct}%</span>
                    </div>
                  </td>
                </tr>
              );
            })}
            {!productList.length&&<tr><td colSpan={6} className="empty">선택 기간에 완료된 작업지시가 없습니다</td></tr>}
          </tbody>
        </table>
      </div>
      </React.Fragment>}

      {view===1 && (
        <div style={{display:"grid",gridTemplateColumns:"230px 1fr",gap:16,alignItems:"start"}}>
          {/* 좌측 컨트롤 패널 */}
          <div className="panel" style={{padding:16}}>
            <div style={{fontSize:12,fontWeight:700,color:"#667085",marginBottom:8}}>기간</div>
            <input type="month" value={pFrom} max={pTo} onChange={e=>setPFrom(e.target.value)} style={{...inputStyle,width:"100%",marginBottom:6,boxSizing:"border-box"}}/>
            <input type="month" value={pTo} min={pFrom} max={nowYm} onChange={e=>setPTo(e.target.value)} style={{...inputStyle,width:"100%",boxSizing:"border-box"}}/>

            <div style={{fontSize:12,fontWeight:700,color:"#667085",margin:"16px 0 6px"}}>그룹 기준</div>
            {[["line","생산 라인"],["product","품목"],["process","공정"],["client","거래처"]].map(([v,l])=>(
              <label key={v} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 2px",fontSize:13,cursor:"pointer"}}>
                <input type="radio" name="pgroup" checked={pGroup===v} onChange={()=>setPGroup(v)}/>{l}
              </label>
            ))}

            <div style={{fontSize:12,fontWeight:700,color:"#667085",margin:"16px 0 6px"}}>지표</div>
            {[["qty","생산량"],["good","양품수"],["defect","불량수"],["rate","불량률"]].map(([v,l])=>(
              <label key={v} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 2px",fontSize:13,cursor:"pointer"}}>
                <input type="radio" name="pmetric" checked={pMetric===v} onChange={()=>setPMetric(v)}/>{l}
              </label>
            ))}

            <button className="btn btn-primary" style={{width:"100%",marginTop:16,justifyContent:"center"}} onClick={applyPivot}>
              <Icon name="refresh" size={14}/> 적용{pivotDirty?" •":""}
            </button>
          </div>

          {/* 우측 콘텐츠 */}
          <div>
            {/* KPI 카드 */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:16}}>
              {[
                {ic:"chart", lb:"총 생산량",    v:aQty.toLocaleString(), u:"EA", t:qtyTrend,  tu:"%",  good:true},
                {ic:"check", lb:"양품률",       v:aGoodRate,             u:"%",  t:goodTrend, tu:"%p", good:true},
                {ic:"flag",  lb:"불량 수",      v:aDef.toLocaleString(), u:"EA", t:defTrend,  tu:"",   good:false},
                {ic:"clock", lb:"평균 리드타임", v:aLead,                 u:"일", t:leadTrend, tu:"일", good:false},
              ].map((k,i)=>(
                <div key={i} className="card">
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div className="kpi-chip" style={{color:"#2f6df0"}}><Icon name={k.ic} size={16}/></div>
                    {k.t!=null && <span style={{fontSize:12,fontWeight:700,color:((k.t>0)===k.good)?"#2f9e63":(k.t===0?"#888":"#d6483b")}}>{k.t>0?"↑ +":k.t<0?"↓ ":""}{k.t}{k.tu}</span>}
                  </div>
                  <div className="card-label" style={{marginTop:8}}>{k.lb}</div>
                  <div className="card-val">{k.v}<span style={{fontSize:14,fontWeight:400}}> {k.u}</span></div>
                </div>
              ))}
            </div>

            {/* 히트맵 */}
            <div className="panel" style={{marginBottom:16}}>
              <div className="panel-top"><b>{groupLabel} × 월별 {metricLabel} (히트맵)</b><span style={{fontSize:12,color:"#888"}}>{aFrom} ~ {aTo} · {pivotRows.length}개 그룹</span></div>
              <div style={{overflowX:"auto"}}>
                <table style={{minWidth:520}}>
                  <thead><tr>
                    <th style={{textAlign:"left"}}>{groupLabel}</th>
                    {aMonths.map(m=><th key={m} style={{textAlign:"center"}}>{m.slice(5)}월</th>)}
                    <th style={{textAlign:"right"}}>합계</th>
                  </tr></thead>
                  <tbody>
                    {pivotRows.map(r=>(
                      <tr key={r.g}>
                        <td style={{fontWeight:600,whiteSpace:"nowrap"}}>{r.g}</td>
                        {r.cells.map((c,ci)=>{
                          const has=r.qtyCells[ci]>0; // 해당 달에 생산이 있었는지
                          return <td key={ci} style={{textAlign:"center",background:heatBg(c),color:heatFg(c),fontWeight:c>0?600:400,fontSize:12}}>{has?(aMetric==="rate"?c+"%":c.toLocaleString()):"-"}</td>;
                        })}
                        <td style={{textAlign:"right",fontWeight:700}}>{aMetric==="rate"?r.total+"%":r.total.toLocaleString()}</td>
                      </tr>
                    ))}
                    {!pivotRows.length && <tr><td colSpan={aMonths.length+2} className="empty">선택 기간에 완료된 작업지시가 없습니다</td></tr>}
                  </tbody>
                </table>
              </div>
            </div>

            {/* 추이 + 불량 상위 품목 */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
              <div className="panel" style={{padding:18}}>
                <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>추이 — 그룹별 {metricLabel}</div>
                <div style={{height:240}}><canvas ref={pivotLineRef}/></div>
              </div>
              <div className="panel" style={{padding:18}}>
                <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>불량 상위 품목 Top 5</div>
                <div style={{fontSize:11,color:"#aaa",marginBottom:14}}>※ 작업지시에 불량 '유형' 필드가 없어 품목 기준으로 표시합니다</div>
                {topDef.map((d,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                    <span style={{fontSize:13,width:120,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{d.name}</span>
                    <div style={{flex:1,background:"#f0f2f5",borderRadius:8,height:14,overflow:"hidden"}}>
                      <div style={{width:`${Math.round(d.defect/maxDef*100)}%`,background:"#d6483b",height:"100%",borderRadius:8}}/>
                    </div>
                    <span style={{fontSize:12,fontWeight:700,minWidth:46,textAlign:"right"}}>{d.defect} EA</span>
                  </div>
                ))}
                {!topDef.length && <div className="empty" style={{padding:30}}>불량 데이터가 없습니다</div>}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function ItemDetailModal({item,items,lots,io,bom,perm,onClose}) {
  if(!item) return null;
  const itemLots = lots.filter(l=>l.item===item.code);
  const recentIo = io.filter(r=>r.item===item.code).slice(0,6);
  const itemBom = bom.find(b=>b.product===item.code);
