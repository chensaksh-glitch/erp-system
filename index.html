                    onPick={p=>{setMatField(i,"code",p.code);setMatField(i,"name",p.name);setMatField(i,"unit",p.unit||"EA");}}
                    style={{input:{width:90,border:"1px solid #ddd",borderRadius:5,padding:"5px 6px",fontSize:12,fontFamily:"monospace",background:"#fff"}}}/></td>
                  <td><input style={{width:"100%",border:"1px solid #eee",borderRadius:5,padding:"5px 6px",fontSize:12,fontWeight:600}} value={m.name} placeholder="자재명" onChange={e=>setMatField(i,"name",e.target.value)}/></td>
                  <td style={{textAlign:"right"}}><input type="number" style={{width:60,border:"1px solid #ddd",borderRadius:5,padding:"5px 6px",fontSize:12,textAlign:"right"}} value={m.qty} onChange={e=>setMatField(i,"qty",e.target.value)}/> <span style={{fontSize:11,color:"#888"}}>{m.unit}</span></td>
                  <td style={{textAlign:"right",fontWeight:600}}>{fmt3(tot)}</td>
                  <td style={{textAlign:"right",color:"#888"}}>{it?fmt3(it.stock):"?"}</td>
                  <td><span className={`badge ${ok?"badge-green":"badge-red"}`}>{ok?"충분":"부족"}</span></td>
                  <td style={{textAlign:"right"}}><button className="btn btn-danger btn-sm" onClick={()=>delMat(i)}>✕</button></td>
                </tr>
              );
            })}
            {!(form.materials||[]).length&&<tr><td colSpan={7} className="empty">자재 없음 — 품목 선택 시 BOM에서 자동 전개됩니다</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );

  // ── 4단계: 검토 · 발행 ──
  const fReview=()=>(
    <div>
      <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 14px",background:"var(--accent-soft)",borderRadius:8,marginBottom:14,fontSize:13,color:"var(--accent)",fontWeight:600}}>📋 아래 내용으로 작업지시서를 발행합니다.</div>
      {[["지시번호",form.code],["대상 품목",form.productName||"-"],["지시 수량",fmt3(form.orderQty||0)+" "+(form.unit||"EA")],["생산 라인",factories.find(f=>f.code===form.factoryCode)?.name||"-"],["납기일",form.dueDate||"-"],["우선순위",form.priority||"보통"],["투입 공정",form.processes.length+"개"],["투입 자재",(form.materials||[]).length+"종"]].map(([k,v])=>(
        <div key={k} className="kv-row"><span className="kv-k">{k}</span><span className="kv-v">{v}</span></div>
      ))}
      <div className="kv-row"><span className="kv-k">자재 충분 여부</span><span className="kv-v" style={{color:shortMats.length?"#e74c3c":"#16a34a"}}>{shortMats.length?`${shortMats.length}종 부족 — 발주 필요`:"전체 충분"}</span></div>
    </div>
  );

  const summaryAside=()=>(
    <aside style={{background:"#fff",border:"1px solid var(--line)",borderRadius:12,boxShadow:"var(--shadow)",padding:16,position:"sticky",top:16}}>
      <div style={{fontWeight:700,fontSize:15,marginBottom:10}}>지시 요약</div>
      {[["지시번호",form.code],["품목",form.productName||"-"],["수량",fmt3(form.orderQty||0)+" "+(form.unit||"EA")],["라인",factories.find(f=>f.code===form.factoryCode)?.name||"-"],["납기",form.dueDate||"-"]].map(([k,v])=>(
        <div key={k} className="kv-row"><span className="kv-k">{k}</span><span className="kv-v">{v}</span></div>
      ))}
      {shortMats.length>0&&<div style={{display:"flex",alignItems:"center",gap:7,marginTop:12,padding:"9px 11px",background:"#fbe7e4",border:"1px solid #f1bdb6",borderRadius:9,color:"#d6483b",fontSize:12,fontWeight:700}}>⚠️ 자재 {shortMats.length}종 부족 — 발주 필요</div>}
    </aside>
  );

  const renderWizard=()=>(
    <div>
      <div className="crumb"><b>MedERP</b> › 작업지시서 › 등록</div>
      <div className="page-header">
        <div><div className="crumb">MedERP <span>›</span> <b>작업지시서</b></div><div className="page-title">작업지시서</div><div className="page-sub">생산 작업지시를 등록하고 발행합니다</div></div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <div className="seg-toggle">
            <button className={`seg-btn${wizMode==="single"?" is-on":""}`} onClick={()=>setWizMode("single")}>단일 폼</button>
            <button className={`seg-btn${wizMode==="wizard"?" is-on":""}`} onClick={()=>setWizMode("wizard")}>단계별 마법사</button>
          </div>
          <button className="btn btn-outline" onClick={()=>setModal(null)}>← 목록</button>
        </div>
      </div>
      {wizMode==="wizard"?(
        <div style={{display:"grid",gridTemplateColumns:"210px 1fr 250px",gap:16,alignItems:"start"}}>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {wizSteps.map((s,i)=>(
              <button key={i} onClick={()=>setWizStep(i)} style={{display:"flex",alignItems:"center",gap:10,padding:"11px 13px",background:"#fff",border:`1px solid ${i===wizStep?"var(--accent)":"var(--line)"}`,borderRadius:10,cursor:"pointer",font:"inherit",textAlign:"left",color:i<=wizStep?"var(--ink)":"var(--muted)",boxShadow:i===wizStep?"0 1px 2px rgba(16,24,40,.06)":"none"}}>
                <span style={{width:24,height:24,flex:"none",display:"grid",placeItems:"center",borderRadius:"50%",fontSize:12,fontWeight:700,background:i<wizStep?"var(--ok)":i===wizStep?"var(--accent)":"#fff",color:i<=wizStep?"#fff":"var(--muted)",border:i>wizStep?"1px solid var(--line)":"none"}}>{i<wizStep?"✓":i+1}</span>
                <span style={{fontSize:13,fontWeight:i===wizStep?700:500}}>{s}</span>
              </button>
            ))}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div className="panel" style={{padding:18}}>
              <div style={{fontWeight:700,fontSize:15,marginBottom:14}}>{wizSteps[wizStep]}</div>
              {wizStep===0&&fProductBasic()}
              {wizStep===1&&fProcess()}
              {wizStep===2&&fMaterials()}
              {wizStep===3&&fReview()}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <button className="btn btn-outline" disabled={wizStep===0} onClick={()=>setWizStep(s=>Math.max(0,s-1))}>이전</button>
              <div style={{flex:1}}/>
              {wizStep<3
                ?<button className="btn btn-primary" onClick={()=>setWizStep(s=>Math.min(3,s+1))}>다음 ›</button>
                :<button className="btn btn-primary" onClick={save}>✅ 작업지시 발행</button>}
            </div>
          </div>
          {summaryAside()}
        </div>
      ):(
        <div style={{display:"grid",gridTemplateColumns:"1fr 250px",gap:16,alignItems:"start"}}>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div className="panel" style={{padding:18}}>
              <div style={{fontWeight:700,fontSize:15,marginBottom:14}}>기본 정보</div>
              <div className="field-row" style={{marginBottom:14}}>
                <div className="field"><label>지시번호</label><input value={form.code} disabled/></div>
                <div className="field"><label>등록일</label><input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
              </div>
              {fProductBasic()}
            </div>
            <div className="panel" style={{padding:18}}><div style={{fontWeight:700,fontSize:15,marginBottom:14}}>공정 · 라인 배정</div>{fProcess()}</div>
            <div className="panel" style={{padding:18}}><div style={{fontWeight:700,fontSize:15,marginBottom:14}}>자재 소요 (BOM 자동 전개)</div>{fMaterials()}</div>
            <div className="panel" style={{padding:18}}><div style={{fontWeight:700,fontSize:15,marginBottom:14}}>비고</div><textarea className="input" rows={3} value={form.note||""} onChange={e=>setForm(f=>({...f,note:e.target.value}))} placeholder="메모 입력"/></div>
            <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
              <button className="btn btn-outline" onClick={()=>setModal(null)}>취소</button>
              <button className="btn btn-primary" onClick={save}>✅ 작업지시 발행</button>
            </div>
          </div>
          {summaryAside()}
        </div>
      )}
    </div>
  );

  return (
    <div>
      {modal==="add"&&renderWizard()}
      {modal!=="add"&&<>
      <div className="page-header">
        <div><div className="crumb">MedERP <span>›</span> <b>작업지시서</b></div><div className="page-title">작업지시서</div><div className="page-sub">작업 지시 등록 → 작업 입력(공정시간·자재출고) → 완료 처리</div></div>
        <div style={{display:"flex",gap:8}}>
          {activeTab==="list"&&perm.canDelete&&sel.size>0&&<button className="btn btn-danger" onClick={bulkDel}>🗑 선택 삭제 ({sel.size})</button>}
          {activeTab==="list"&&perm.canCreate&&<button className="btn btn-outline" onClick={cleanupDefLots} title="기존 DEF_ 불량 LOT을 생산 LOT 번호로 일괄 정리">🧹 불량 LOT 정리</button>}
          {activeTab==="list"&&perm.canCreate&&<button className="btn btn-primary" onClick={openAdd}>+ 작업지시 등록</button>}
        </div>
      </div>

      <div className="tabs">
        <div className={`tab${activeTab==="list"?" active":""}`} onClick={()=>setActiveTab("list")}>📋 작업지시서 목록</div>
        <div className={`tab${activeTab==="work"?" active":""}`} onClick={()=>setActiveTab("work")}>⚙️ 작업 입력</div>
      </div>

      {/* ── 탭1: 목록 ── */}
      {activeTab==="list"&&<div className="panel">
        <div className="panel-top">
          <input placeholder="지시번호·완제품·LOT 검색" value={q} onChange={e=>setQ(e.target.value)}/>
          <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
            <span style={{fontSize:12,color:"#666"}}>지시일</span>
            <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} style={dateStyle}/>
            <span style={{fontSize:12,color:"#aaa"}}>~</span>
            <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} style={dateStyle}/>
            <button className="btn btn-outline btn-sm" onClick={()=>{setStartDate(todayStr);setEndDate(todayStr);}}>오늘</button>
            <button className="btn btn-outline btn-sm" onClick={()=>{setStartDate("");setEndDate("");}}>전체</button>
          </div>
          <span style={{fontSize:12,color:"#aaa"}}>{filteredOrders.length}건</span>
        </div>
        <table>
          <thead><tr>
            <th style={{width:36,textAlign:"center"}}>선택</th>
            <th>지시번호</th><th>완제품</th><th style={{textAlign:"right"}}>지시수량</th><th style={{textAlign:"right"}}>완료수량</th><th style={{textAlign:"right"}}>불량수량</th><th style={{textAlign:"right"}}>검사수량</th><th style={{textAlign:"right"}}>보관샘플</th>
            <th>공장</th><th>작업자</th><th>지시일</th><th>완료일</th><th>상태</th><th>LOT</th><th>관리</th>
          </tr></thead>
          <tbody>{filteredOrders.map(o=>(
            <tr key={o.code} style={{cursor:"pointer"}} onClick={()=>setViewWo(o)}>
              <td style={{textAlign:"center"}} onClick={e=>e.stopPropagation()}>
                <input type="checkbox" checked={sel.has(o.code)} onChange={()=>toggleSel(o.code)} style={{cursor:"pointer"}}/>
              </td>
              <td><b style={{color:"#2f6df0"}}>{o.code}</b></td>
              <td>{o.productName}</td>
              <td style={{textAlign:"right"}}>{o.orderQty} EA</td>
              <td style={{textAlign:"right",color:o.status==="완료"?"#16a34a":"#aaa",fontWeight:o.status==="완료"?600:400}}>{o.status==="완료"?`${Math.max(0,(o.orderQty||0)-(o.defectQty||0)-(o.inspectQty||0))} EA`:"-"}</td>
              <td style={{textAlign:"right",color:(o.defectQty||0)>0?"#e74c3c":"#aaa",fontWeight:(o.defectQty||0)>0?600:400}}>{o.status==="완료"?`${o.defectQty||0} EA`:"-"}</td>
              <td style={{textAlign:"right",color:(o.inspectQty||0)>0?"#7c3aed":"#aaa",fontWeight:(o.inspectQty||0)>0?600:400}}>{o.status==="완료"?`${o.inspectQty||0} EA`:"-"}</td>
              <td style={{textAlign:"right",color:(o.retainQty||0)>0?"#0369a1":"#aaa",fontWeight:(o.retainQty||0)>0?600:400}}>{o.status==="완료"?`${o.retainQty||0} EA`:"-"}</td>
              <td>{factories.find(f=>f.code===o.factoryCode)?.name||"-"}</td>
              <td style={{fontSize:12,color:o.worker?"#16a34a":"#aaa",fontWeight:o.worker?600:400}}>{o.worker||"-"}</td>
              <td>{o.date}</td>
              <td style={{color:o.doneDate?"#16a34a":"#aaa"}}>{o.doneDate||"-"}</td>
              <td><SBadge s={o.status}/></td>
              <td style={{fontSize:11,color:"#888"}}>{o.lot||"-"}</td>
              <td style={{display:"flex",gap:4,flexWrap:"wrap"}} onClick={e=>e.stopPropagation()}>
                {mfgDocs&&mfgDocs[o.product]&&<button className="btn btn-outline btn-sm" style={{color:"#7c3aed",borderColor:"#7c3aed",fontSize:11}} onClick={()=>openMfgDoc(o.product)}>📄 지시서</button>}
                {perm.canEdit&&o.status!=="완료"&&o.status!=="취소"&&(
                  <button className="btn btn-sm" style={{background:"#16a34a",color:"#fff",border:"none",padding:"4px 8px",borderRadius:4,cursor:"pointer",fontSize:12}}
                    onClick={()=>{selectWorkWo(o.code);setActiveTab("work");}}>⚙️ 작업입력</button>
                )}
                {perm.canEdit&&o.status!=="취소"&&(
                  <button className="btn btn-sm" style={{background:o.status==="완료"?"#6366f1":"#16a34a",color:"#fff",border:"none"}} onClick={()=>openComplete(o)}>{o.status==="완료"?"🔄 재완료":"✅ 완료"}</button>
                )}
                {perm.canEdit&&o.status==="완료"&&(
                  <button className="btn btn-sm" style={{background:"#f59e0b",color:"#fff",border:"none"}} onClick={()=>cancelComplete(o)}>↩️ 완료취소</button>
                )}
                {perm.canEdit&&<button className="btn btn-outline btn-sm" onClick={()=>{const bomEntry=bom.find(b=>b.product===o.product);setForm({...o,processes:o.processes||[],materials:o.materials||(bomEntry?.materials?[...bomEntry.materials]:[])});setProdCodeInput(o.product||"");setModal("edit");}}>수정</button>}
                {perm.canDelete&&<button className="btn btn-danger btn-sm" onClick={()=>del(o.code)}>삭제</button>}
              </td>
            </tr>
          ))}{!filteredOrders.length&&<tr><td colSpan={13} className="empty">{orders.length?"해당 기간에 작업지시 없음":"작업지시 없음"}</td></tr>}</tbody>
        </table>
      </div>}

      {/* ── 탭2: 작업 입력 ── */}
      {activeTab==="work"&&(
        <div>
          {/* WO 선택 */}
          <div className="panel" style={{marginBottom:16}}>
            <div className="panel-top">
              <b>⚙️ 작업 입력 — 작업지시서 선택</b>
              <select value={workWoCode} onChange={e=>selectWorkWo(e.target.value)}
                style={{border:"1px solid #2f6df0",borderRadius:6,padding:"6px 12px",fontSize:13,fontWeight:600,color:"#2f6df0"}}>
                <option value="">-- 작업지시서 선택 --</option>
                {activeWOs.map(o=><option key={o.code} value={o.code}>{o.code} | {o.productName} | {o.orderQty}EA {o.lot?`| LOT: ${o.lot}`:""} | {o.status}</option>)}
              </select>
            </div>
            {!workOrder&&<div className="empty" style={{padding:40}}>대기 또는 진행중 상태의 작업지시서를 선택하세요</div>}
          </div>

          {workOrder&&(
            <>
              {/* WO 정보 */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:12,marginBottom:16}}>
                {[["완제품",workOrder.productName],["지시수량",workOrder.orderQty+"EA"],["LOT",workOrder.lot||"-"],["상태",workOrder.status],["작업자",currentUser?.name||"-"]].map(([k,v])=>(
                  <div key={k} className={`card${k==="작업자"?" ok":""}`}><div className="card-label">{k}</div><div className="card-val" style={{fontSize:15}}>{v}</div></div>
                ))}
              </div>

              {/* 공정 시간 입력 */}
              <div className="panel" style={{marginBottom:12}}>
                <div className="panel-top"><b>⚙️ 공정별 소요시간 입력</b>
                  <span style={{fontSize:11,color:"#888"}}>총 {workProcTimes.reduce((s,p)=>s+(p.hours||0),0)}h</span>
                </div>
                {workProcTimes.length===0&&<div className="empty" style={{padding:24}}>등록된 공정 없음 — 품목관리에서 완제품에 공정 설정</div>}
                <table>
                  <thead><tr><th>공정명</th><th style={{textAlign:"right",width:160}}>소요시간 (h)</th></tr></thead>
                  <tbody>{workProcTimes.map((p,i)=>(
                    <tr key={i}>
                      <td>{p.name||p.code}</td>
                      <td style={{textAlign:"right"}}>
                        <input type="number" value={p.hours}
                          onChange={e=>{const t=[...workProcTimes];t[i]={...t[i],hours:+e.target.value};setWorkProcTimes(t);}}
                          style={{width:90,border:"1px solid #ddd",borderRadius:5,padding:"4px 8px",fontSize:13,textAlign:"right"}}/>
                        <span style={{fontSize:12,color:"#888",marginLeft:4}}>h</span>
                      </td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>

              {/* 자재 출고 — 전체 너비 */}
              <div className="panel" style={{marginBottom:16}}>
                <div className="panel-top">
                  <b>📦 자재 출고 처리</b>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <span style={{fontSize:11,color:"#888"}}>지시수량 기준 필요량 대비 출고 현황</span>
                    <button className="btn btn-outline btn-sm" onClick={()=>setWorkExtraMats(prev=>[...prev,{code:"",name:"",qty:0,unit:"EA",lotCode:""}])}>+ 추가 자재 출고</button>
                  </div>
                </div>
                {(!workBom||workBom.materials.length===0)&&workExtraMats.length===0&&<div className="empty" style={{padding:24}}>BOM이 등록되지 않은 완제품입니다 — 추가 자재 출고 버튼으로 직접 출고 가능</div>}
                {(workBom?.materials?.length>0||workExtraMats.length>0)&&(
                  <div style={{overflowX:"auto"}}>
                    <table style={{minWidth:700}}>
                      <thead><tr>
                        <th>자재명 / 코드</th>
                        <th style={{textAlign:"right",width:100}}>필요량</th>
                        <th style={{textAlign:"right",width:90}}>출고됨</th>
                        <th style={{textAlign:"right",width:90}}>잔여</th>
                        <th style={{textAlign:"right",width:90}}>현재재고</th>
                        <th style={{width:180}}>LOT 선택</th>
                        <th style={{width:140}}>지금 출고량</th>
                      </tr></thead>
                      <tbody>
                        {(workBom?.materials||[]).map((mat,i)=>{
                          const need=mat.qty*workOrder.orderQty;
                          const done=alreadyDeducted(mat.code);
                          const remain=need-done;
                          const it=items.find(x=>x.code===mat.code);
                          const matLots=lots.filter(l=>l.item===mat.code&&l.qty>0);
                          const selLot=workMatLot[mat.code]||"";
                          const selLotObj=matLots.find(l=>l.code===selLot);
                          const finished=remain<=0;
                          return(
                            <tr key={i} style={{background:finished?"#f0fdf4":""}}>
                              <td>
                                <div style={{fontWeight:600,fontSize:13}}>{mat.name}</div>
                                <div style={{fontSize:11,color:"#888",fontFamily:"monospace"}}>{mat.code}</div>
                              </td>
                              <td style={{textAlign:"right"}}>{fmt3(need)}<span style={{fontSize:11,color:"#888"}}>{mat.unit}</span></td>
                              <td style={{textAlign:"right",color:done>0?"#16a34a":"#aaa"}}>{fmt3(done)}<span style={{fontSize:11}}>{mat.unit}</span></td>
                              <td style={{textAlign:"right",color:finished?"#16a34a":"#e74c3c",fontWeight:700}}>
                                {finished?"✅":fmt3(remain)}<span style={{fontSize:11}}>{!finished&&mat.unit}</span>
                              </td>
                              <td style={{textAlign:"right",color:(it?.stock||0)<(finished?0:remain)?"#e74c3c":"#555"}}>
                                {it?fmt3(it.stock):"-"}<span style={{fontSize:11,color:"#888"}}>{mat.unit}</span>
                              </td>
                              <td>
                                {matLots.length>0?(
                                  <div>
                                    <select value={selLot} onChange={e=>setWorkMatLot(q=>({...q,[mat.code]:e.target.value}))}
                                      style={{width:"100%",border:"1px solid #ddd",borderRadius:5,padding:"3px 6px",fontSize:11}}>
                                      {matLots.map(l=><option key={l.code} value={l.code}>{l.code} ({fmt3(l.qty)}{mat.unit})</option>)}
                                    </select>
                                    {selLotObj&&<div style={{fontSize:10,color:"#2f6df0",marginTop:2}}>LOT 잔여: {fmt3(selLotObj.qty)}{mat.unit}</div>}
                                  </div>
                                ):<span style={{fontSize:11,color:"#aaa"}}>LOT 없음 (재고 {fmt3(it?.stock||0)})</span>}
                              </td>
                              <td>
                                {!finished?(
                                  <div style={{display:"flex",gap:4,alignItems:"center"}}>
                                    <input type="number" value={workMatQty[mat.code]||0}
                                      onChange={e=>setWorkMatQty(q=>({...q,[mat.code]:+e.target.value}))}
                                      style={{width:65,border:"1px solid #ddd",borderRadius:5,padding:"3px 6px",fontSize:12,textAlign:"right"}}/>
                                    <button className="btn btn-sm" style={{background:"#2f6df0",color:"#fff",border:"none",padding:"4px 10px",borderRadius:4,cursor:"pointer",fontSize:11,whiteSpace:"nowrap"}}
                                      onClick={()=>deductMaterial(mat)}>출고</button>
                                  </div>
                                ):<span style={{fontSize:12,color:"#16a34a",fontWeight:600}}>완료</span>}
                              </td>
                            </tr>
                          );
                        })}
                        {/* 추가 자재 행 */}
                        {workExtraMats.map((mat,i)=>{
                          const it=items.find(x=>x.code===mat.code);
                          const matLots=lots.filter(l=>l.item===mat.code&&l.qty>0);
                          return(
                            <tr key={`x${i}`} style={{background:"#fffbeb",borderTop:"2px dashed #fcd34d"}}>
                              <td colSpan={2}>
                                <div style={{fontSize:11,color:"#b45309",fontWeight:600,marginBottom:4}}>➕ 추가 자재</div>
                                <div style={{display:"flex",gap:4}}>
                                  <MatPicker code={mat.code} items={items}
                                    onType={v=>{const found=items.find(x=>(x.code||"").trim().toLowerCase()===v.trim().toLowerCase());setWorkExtraMats(prev=>{const n=[...prev];n[i]={...n[i],code:v,name:found?found.name:n[i].name,unit:found?found.unit||"EA":n[i].unit};return n;});}}
                                    onPick={it=>setWorkExtraMats(prev=>{const n=[...prev];n[i]={...n[i],code:it.code,name:it.name,unit:it.unit||"EA"};return n;})}
                                    style={{input:{width:80,border:"1px solid #fcd34d",borderRadius:5,padding:"3px 6px",fontSize:11,fontFamily:"monospace"}}}/>
                                  <input style={{flex:1,border:"1px solid #fcd34d",borderRadius:5,padding:"3px 6px",fontSize:11}}
                                    placeholder="자재명" value={mat.name}
                                    onChange={e=>setWorkExtraMats(prev=>{const n=[...prev];n[i]={...n[i],name:e.target.value};return n;})}/>
                                </div>
                              </td>
                              <td colSpan={2}>
                                <div style={{display:"flex",gap:4,alignItems:"center"}}>
                                  <input type="number" style={{width:65,border:"1px solid #fcd34d",borderRadius:5,padding:"3px 6px",fontSize:12,textAlign:"right"}}
                                    placeholder="수량" value={mat.qty||0}
                                    onChange={e=>setWorkExtraMats(prev=>{const n=[...prev];n[i]={...n[i],qty:+e.target.value};return n;})}/>
                                  <input style={{width:40,border:"1px solid #fcd34d",borderRadius:5,padding:"3px 4px",fontSize:11}}
                                    placeholder="단위" value={mat.unit||""}
                                    onChange={e=>setWorkExtraMats(prev=>{const n=[...prev];n[i]={...n[i],unit:e.target.value};return n;})}/>
                                </div>
                              </td>
                              <td style={{textAlign:"right",color:"#555"}}>{it?fmt3(it.stock):"-"}</td>
                              <td>
                                {matLots.length>0?(
                                  <select value={mat.lotCode||""} onChange={e=>setWorkExtraMats(prev=>{const n=[...prev];n[i]={...n[i],lotCode:e.target.value};return n;})}
                                    style={{width:"100%",border:"1px solid #fcd34d",borderRadius:5,padding:"3px 6px",fontSize:11}}>
                                    <option value="">-- LOT 선택 --</option>
                                    {matLots.map(l=><option key={l.code} value={l.code}>{l.code} ({fmt3(l.qty)})</option>)}
                                  </select>
                                ):<span style={{fontSize:11,color:"#aaa"}}>LOT 없음</span>}
                              </td>
                              <td>
                                <div style={{display:"flex",gap:4}}>
                                  <button className="btn btn-sm" style={{background:"#f59e0b",color:"#fff",border:"none",padding:"4px 8px",borderRadius:4,cursor:"pointer",fontSize:11}}
                                    onClick={()=>deductExtraMat(i)}>출고</button>
                                  <button className="btn btn-danger btn-sm" onClick={()=>setWorkExtraMats(prev=>prev.filter((_,j)=>j!==i))}>✕</button>
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>

              <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
                <button className="btn btn-outline" onClick={saveWorkProgress}>💾 임시저장 (공정시간)</button>
                <button className="btn btn-sm" style={{background:"#16a34a",color:"#fff",border:"none",padding:"8px 20px",borderRadius:6,cursor:"pointer",fontWeight:600,fontSize:13}}
                  onClick={startWorkComplete}>✅ 완료 처리</button>
              </div>
            </>
          )}
        </div>
      )}
      </>}

      {/* 상세보기 팝업 */}
      {viewWo&&(
        <div className="overlay">
          <div className="modal" style={{width:700}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <span className="modal-title">📋 작업지시서 상세 — {viewWo.code}</span>
              <button className="modal-close" onClick={()=>setViewWo(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>
                <div style={{background:"#f8f9fb",borderRadius:8,padding:"10px 14px"}}><div style={{fontSize:11,color:"#888",marginBottom:3}}>완제품</div><div style={{fontWeight:700}}>{viewWo.productName}</div></div>
                <div style={{background:"#f8f9fb",borderRadius:8,padding:"10px 14px"}}><div style={{fontSize:11,color:"#888",marginBottom:3}}>지시수량 / 불량</div><div style={{fontWeight:700}}>{viewWo.orderQty}EA {(viewWo.defectQty||0)>0&&<span style={{color:"#e74c3c"}}>/ {viewWo.defectQty}EA 불량</span>}</div></div>
                <div style={{background:"#f8f9fb",borderRadius:8,padding:"10px 14px"}}><div style={{fontSize:11,color:"#888",marginBottom:3}}>상태</div><div style={{fontWeight:700}}><SBadge s={viewWo.status}/>{viewWo.doneDate&&<span style={{fontSize:11,color:"#16a34a",marginLeft:6}}>완료일: {viewWo.doneDate}</span>}</div></div>
              </div>
              {(viewWo.processes||[]).length>0&&(
                <div style={{marginBottom:12}}>
                  <div style={{fontWeight:600,fontSize:13,marginBottom:6}}>⚙️ 공정 목록</div>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                    <thead><tr style={{background:"#1a2236",color:"#fff"}}>
                      <th style={{padding:"6px 12px",textAlign:"left"}}>공정명</th>
                      {viewWo.processTimes&&<th style={{padding:"6px 12px",textAlign:"right"}}>실제 소요시간</th>}
                    </tr></thead>
                    <tbody>{viewWo.processes.map((p,i)=>{
                      const pt=viewWo.processTimes?.find(t=>t.code===p.code);
                      return<tr key={i} style={{borderBottom:"1px solid #f0f0f0"}}>
                        <td style={{padding:"6px 12px"}}>{p.name||p.code}</td>
                        {viewWo.processTimes&&<td style={{padding:"6px 12px",textAlign:"right",color:"#2f6df0",fontWeight:600}}>{pt?`${pt.hours}h`:"미기록"}</td>}
                      </tr>;
                    })}</tbody>
                    {viewWo.processTimes&&<tfoot><tr style={{background:"#f0f9ff"}}><td style={{padding:"6px 12px",fontWeight:600}}>총 실제 소요시간</td><td style={{padding:"6px 12px",textAlign:"right",fontWeight:700,color:"#2f6df0"}}>{(viewWo.processTimes||[]).reduce((s,p)=>s+(p.hours||0),0)}h</td></tr></tfoot>}
                  </table>
                </div>
              )}
              {(()=>{const be=bom.find(b=>b.product===viewWo.product);return be?(
                <div>
                  <div style={{fontWeight:600,fontSize:13,marginBottom:6}}>🧪 BOM 자재 소요량 (지시수량 {viewWo.orderQty}EA 기준)</div>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                    <thead><tr style={{background:"#1a2236",color:"#fff"}}><th style={{padding:"6px 12px",textAlign:"left"}}>자재명</th><th style={{padding:"6px 12px",textAlign:"right"}}>단위소요</th><th style={{padding:"6px 12px",textAlign:"right"}}>총소요량</th><th style={{padding:"6px 12px",textAlign:"right"}}>현재재고</th><th style={{padding:"6px 12px",textAlign:"center"}}>충분</th></tr></thead>
                    <tbody>{be.materials.map((m,i)=>{const it=items.find(x=>x.code===m.code);const need=m.qty*viewWo.orderQty;const ok=it&&it.stock>=need;return(<tr key={i} style={{borderBottom:"1px solid #f0f0f0"}}><td style={{padding:"6px 12px"}}>{m.name}</td><td style={{padding:"6px 12px",textAlign:"right"}}>{fmt3(m.qty)}{m.unit}</td><td style={{padding:"6px 12px",textAlign:"right",fontWeight:600}}>{fmt3(need)}{m.unit}</td><td style={{padding:"6px 12px",textAlign:"right",color:ok?"inherit":"#e74c3c"}}>{it?fmt3(it.stock):"-"}</td><td style={{padding:"6px 12px",textAlign:"center"}}>{ok?"✅":"⚠️ 부족"}</td></tr>);})}</tbody>
                  </table>
                  {viewWo.status==="완료"&&<div style={{background:"#dcfce7",borderRadius:8,padding:"8px 12px",marginTop:8,fontSize:12,color:"#16a34a",fontWeight:600}}>✅ 완료 처리됨 — 자재 차감 및 LOT 생성 완료</div>}
                </div>
              ):null;})()}
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={()=>setViewWo(null)}>닫기</button>
              {perm.canEdit&&viewWo.status!=="완료"&&viewWo.status!=="취소"&&(
                <button className="btn btn-sm" style={{background:"#16a34a",color:"#fff",border:"none",padding:"7px 16px",borderRadius:6,cursor:"pointer"}} onClick={()=>{openComplete(viewWo);setViewWo(null);}}>✅ 완료 처리</button>
              )}
              {perm.canEdit&&viewWo.status!=="완료"&&<button className="btn btn-primary" onClick={()=>{setForm({...viewWo,processes:viewWo.processes||[]});setProdCodeInput(viewWo.product||"");setModal("edit");setViewWo(null);}}>수정</button>}
            </div>
          </div>
        </div>
      )}

      {/* 완료 처리 팝업 */}
      {completeModal&&(
        <div className="overlay">
          <div className="modal" style={{width:560}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <span className="modal-title" style={{color:"#16a34a"}}>✅ 완료 처리 — {completeModal.code}</span>
              <button className="modal-close" onClick={()=>setCompleteModal(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div style={{background:"#f0fdf4",borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:13}}>
                <b>{completeModal.productName}</b> · 지시수량 {completeModal.orderQty}EA · LOT: {completeModal.lot||"미지정"}
              </div>
              <div className="field-row">
                <div className="field"><label>완료일 *</label><input type="date" value={compForm.doneDate} onChange={e=>setCompForm(f=>({...f,doneDate:e.target.value}))}/></div>
                <div className="field"><label>불량수량 (EA)</label><input type="number" min="0" value={compForm.defectQty} onChange={e=>setCompForm(f=>({...f,defectQty:+e.target.value}))}/></div>
              </div>
              <div className="field-row">
                <div className="field">
                  <label>품질검사 수량 (EA) <span style={{color:"#888",fontWeight:400,fontSize:11}}>— 검사 샘플</span></label>
                  <input type="number" min="0" value={compForm.inspectQty} onChange={e=>setCompForm(f=>({...f,inspectQty:+e.target.value}))}/>
                </div>
                <div className="field">
                  <label>보관샘플 수량 (EA) <span style={{color:"#888",fontWeight:400,fontSize:11}}>— 보관용 샘플</span></label>
                  <input type="number" min="0" value={compForm.retainQty} onChange={e=>setCompForm(f=>({...f,retainQty:+e.target.value}))}/>
                </div>
              </div>
              {(compForm.defectQty>0||compForm.inspectQty>0||compForm.retainQty>0)&&(()=>{
                const goodQty=Math.max(0,(completeModal.orderQty||0)-compForm.defectQty-compForm.inspectQty-compForm.retainQty);
                return <div style={{background:"#f8f9fb",borderRadius:6,padding:"8px 12px",fontSize:12,marginBottom:8,lineHeight:1.7}}>
                  {compForm.defectQty>0&&<div style={{color:"#e74c3c"}}>⚠️ 불량 {compForm.defectQty}EA → {defectWarehouse.name} LOT 이동</div>}
                  {compForm.inspectQty>0&&<div style={{color:"#7c3aed"}}>🔬 품질검사 {compForm.inspectQty}EA → 작업지시 LOT로 입고</div>}
                  {compForm.retainQty>0&&<div style={{color:"#0369a1"}}>📦 보관샘플 {compForm.retainQty}EA → 작업지시 LOT로 입고</div>}
                  <div style={{color:"#16a34a",fontWeight:600}}>✅ 양품 입고: {goodQty}EA</div>
                </div>;
              })()}
              {compForm.processTimes.length>0&&(
                <div>
                  <label style={{fontSize:12,fontWeight:600,color:"#555",display:"block",marginBottom:6}}>⚙️ 공정별 실제 소요시간</label>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                    <thead><tr style={{background:"#1a2236",color:"#fff"}}><th style={{padding:"6px 12px",textAlign:"left"}}>공정명</th><th style={{padding:"6px 12px",textAlign:"right",width:120}}>실제 소요시간 (h)</th></tr></thead>
                    <tbody>{compForm.processTimes.map((p,i)=>(
                      <tr key={i} style={{borderBottom:"1px solid #f0f0f0"}}>
                        <td style={{padding:"6px 12px"}}>{p.name||p.code}</td>
                        <td style={{padding:"4px 8px",textAlign:"right"}}>
                          <input type="number" value={p.hours}
                            onChange={e=>{const ts=[...compForm.processTimes];ts[i]={...ts[i],hours:+e.target.value};setCompForm(f=>({...f,processTimes:ts}));}}
                            style={{width:80,border:"1px solid #ddd",borderRadius:5,padding:"4px 8px",fontSize:12,textAlign:"right"}}/>
                        </td>
                      </tr>
                    ))}</tbody>
                    <tfoot><tr style={{background:"#f0f9ff"}}><td style={{padding:"6px 12px",fontWeight:600}}>합계</td><td style={{padding:"6px 12px",textAlign:"right",fontWeight:700,color:"#2f6df0"}}>{compForm.processTimes.reduce((s,p)=>s+(p.hours||0),0)}h</td></tr></tfoot>
                  </table>
                </div>
              )}
              {compForm.processTimes.length===0&&<div style={{fontSize:12,color:"#aaa",padding:"8px 0"}}>등록된 공정이 없습니다 (품목 관리에서 완제품에 공정을 설정하면 자동 표시됩니다)</div>}
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={()=>setCompleteModal(null)}>취소</button>
              <button className="btn btn-sm" style={{background:"#16a34a",color:"#fff",border:"none",padding:"7px 20px",borderRadius:6,cursor:"pointer",fontWeight:600}} onClick={saveComplete}>✅ 완료 확정</button>
            </div>
          </div>
        </div>
      )}

      {/* 수정 모달 (등록은 전체화면 마법사로 대체) */}
      {modal==="edit"&&(
        <div className="overlay">
          <div className="modal" style={{width:620}} onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <span className="modal-title">작업지시서 수정</span>
              <button className="modal-close" onClick={()=>setModal(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div className="field-row">
                <div className="field"><label>지시번호</label><input value={form.code} disabled/></div>
                <div className="field"><label>지시일</label><input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
              </div>
              <div className="field-row">
                <div className="field" style={{position:"relative"}}>
                  <label>완제품·반제품 * {form.product&&<span style={{fontSize:11,color:"#16a34a"}}>✅ 공정 {form.processes.length}개 자동 로드</span>}</label>
                  <input value={prodCodeInput}
                    onChange={e=>{
                      const v=e.target.value; setProdCodeInput(v);
                      const exact=products.find(p=>p.code===v);
                      if(exact){const prd=items.find(i=>i.code===exact.code);const autoProcs=(prd?.processes||[]).map(pc=>{const proc=processes.find(pr=>pr.code===pc);return{code:pc,name:proc?.name||pc};});const autoBom=bom.find(b=>b.product===exact.code);setForm(f=>({...f,product:exact.code,productName:exact.name,processes:autoProcs,materials:[...(autoBom?.materials||[])]}));}
                      else{setForm(f=>({...f,product:"",productName:""}));}
                    }}
                    placeholder="코드 또는 제품명 입력"
                    autoComplete="off"/>
                  {prodCodeInput&&!form.product&&(()=>{
                    const hits=products.filter(p=>{const _q=prodCodeInput.toLowerCase();return p.code.toLowerCase().includes(_q)||p.name.toLowerCase().includes(_q);});
                    return hits.length>0?(
                      <div style={{position:"absolute",top:"100%",left:0,right:0,background:"#fff",border:"1px solid #2f6df0",borderRadius:6,boxShadow:"0 4px 12px rgba(0,0,0,0.12)",zIndex:300,maxHeight:200,overflowY:"auto"}}>
                        {hits.map(p=>(
                          <div key={p.code}
                            onClick={()=>{const prd=items.find(i=>i.code===p.code);const autoProcs=(prd?.processes||[]).map(pc=>{const proc=processes.find(pr=>pr.code===pc);return{code:pc,name:proc?.name||pc};});const autoBom=bom.find(b=>b.product===p.code);setForm(f=>({...f,product:p.code,productName:p.name,processes:autoProcs,materials:[...(autoBom?.materials||[])]}));setProdCodeInput(p.code);}}
                            style={{padding:"8px 12px",cursor:"pointer",borderBottom:"1px solid #f0f0f0",fontSize:13}}
                            onMouseEnter={e=>e.currentTarget.style.background="#eff6ff"}
                            onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
                            <span style={{fontFamily:"monospace",color:"#2f6df0",fontWeight:600}}>{p.code}</span>
                            <span style={{marginLeft:8,fontWeight:600}}>{p.name}</span>
                            <span className={`badge ${p.type==="완제품"?"badge-blue":"badge-orange"}`} style={{marginLeft:6,fontSize:10}}>{p.type}</span>
                          </div>
                        ))}
                      </div>
                    ):null;
                  })()}
                  {form.product&&<div style={{fontSize:12,color:"#16a34a",fontWeight:600,marginTop:5}}>✅ {form.productName}</div>}
                </div>
                <div className="field"><label>공장</label><select value={form.factoryCode} onChange={e=>setForm(f=>({...f,factoryCode:e.target.value}))}><option value="">선택</option>{factories.map(f=><option key={f.code} value={f.code}>{f.name}</option>)}</select></div>
              </div>
              <div className="field-row">
                <div className="field"><label>지시수량 (EA)</label><input type="text" inputMode="numeric" value={form.orderQty===0?"":form.orderQty} onChange={e=>{const v=e.target.value.replace(/[^0-9]/g,"");setForm(f=>({...f,orderQty:v===""?0:parseInt(v,10)}));}} placeholder="수량 입력"/></div>
                <div className="field"><label>LOT번호</label><input value={form.lot} onChange={e=>setForm(f=>({...f,lot:e.target.value}))} placeholder="완료 후 자동 생성 가능"/></div>
                <div className="field"><label>입고 창고</label><select value={form.warehouse||""} onChange={e=>setForm(f=>({...f,warehouse:e.target.value}))}><option value="">선택</option>{warehouses.map(w=><option key={w.code} value={w.name}>{w.name}</option>)}</select></div>
              </div>
              {modal==="edit"&&(
                <div className="field"><label>상태</label><select value={form.status} onChange={e=>setForm(f=>({...f,status:e.target.value}))}><option>대기</option><option>진행중</option><option>완료</option><option>취소</option></select></div>
              )}
              <div style={{marginTop:10}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
                  <label style={{fontSize:12,fontWeight:600,color:"#555"}}>⚙️ 투입 공정 <span style={{color:"#aaa",fontWeight:400,fontSize:11}}>(소요시간은 완료처리 시 입력)</span></label>
                  <button className="btn btn-outline btn-sm" onClick={addProcess}>+ 추가</button>
                </div>
                {form.processes.map((p,i)=>(
                  <div key={i} style={{display:"flex",gap:6,marginBottom:6,alignItems:"center"}}>
                    <select style={{flex:1,border:"1px solid #ddd",borderRadius:5,padding:"6px 8px",fontSize:12}} value={p.code} onChange={e=>setProc(i,e.target.value)}>
                      <option value="">공정 선택</option>
                      {processes.map(pr=><option key={pr.code} value={pr.code}>{pr.name}</option>)}
                    </select>
                    <button className="btn btn-danger btn-sm" onClick={()=>delProc(i)}>✕</button>
                  </div>
                ))}
                {!form.processes.length&&<div style={{fontSize:12,color:"#aaa",padding:"4px 0"}}>품목 관리에서 완제품에 공정을 설정하면 자동으로 불러옵니다</div>}
              </div>

              {/* 투입 자재 편집 */}
              <div style={{marginTop:12}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
                  <label style={{fontSize:12,fontWeight:600,color:"#555"}}>🧪 투입 자재 <span style={{color:"#aaa",fontWeight:400,fontSize:11}}>(BOM 자동 로드 — 추가·수정·삭제 가능)</span></label>
                  <button className="btn btn-outline btn-sm" onClick={addMat}>+ 자재 추가</button>
                </div>
                {(form.materials||[]).length===0&&<div style={{fontSize:12,color:"#aaa",padding:"4px 0"}}>자재 없음 — 제품 선택 시 BOM에서 자동 로드됩니다</div>}
                {(form.materials||[]).map((m,i)=>{
                  const it=items.find(x=>x.code===m.code);
                  const need=m.qty*(form.orderQty||1);
                  const ok=it&&it.stock>=need;
                  return(
                    <div key={i} style={{display:"flex",gap:4,marginBottom:5,alignItems:"center",background:ok?"#f0fdf4":"#fef2f2",borderRadius:6,padding:"4px 6px"}}>
                      <MatPicker code={m.code} items={items}
                        onType={v=>{const found=items.find(x=>(x.code||"").trim().toLowerCase()===v.trim().toLowerCase());setMatField(i,"code",v);if(found){setMatField(i,"name",found.name);setMatField(i,"unit",found.unit||"EA");}}}
                        onPick={it=>{setMatField(i,"code",it.code);setMatField(i,"name",it.name);setMatField(i,"unit",it.unit||"EA");}}
                        style={{input:{width:80,border:"1px solid #ddd",borderRadius:5,padding:"5px 6px",fontSize:11,fontFamily:"monospace",background:"#fff"}}}/>
                      <input style={{flex:1,border:"1px solid #ddd",borderRadius:5,padding:"5px 6px",fontSize:11,background:"#fff"}}
                        placeholder="자재명" value={m.name} onChange={e=>setMatField(i,"name",e.target.value)}/>
                      <input type="number" style={{width:65,border:"1px solid #ddd",borderRadius:5,padding:"5px 6px",fontSize:11,textAlign:"right",background:"#fff"}}
                        placeholder="소요량" value={m.qty} onChange={e=>setMatField(i,"qty",e.target.value)}/>
                      <input style={{width:42,border:"1px solid #ddd",borderRadius:5,padding:"5px 4px",fontSize:11,background:"#fff"}}
                        placeholder="단위" value={m.unit} onChange={e=>setMatField(i,"unit",e.target.value)}/>
                      <div style={{fontSize:10,whiteSpace:"nowrap",minWidth:80,textAlign:"right"}}>
                        <div style={{color:"#888"}}>재고: <b style={{color:ok?"#16a34a":"#e74c3c"}}>{it?fmt3(it.stock):"?"}</b></div>
                        {form.orderQty>0&&<div style={{color:ok?"#16a34a":"#e74c3c"}}>{ok?"✅ 충분":`⚠️ 필요 ${fmt3(need)}`}</div>}
                      </div>
                      <button className="btn btn-danger btn-sm" onClick={()=>delMat(i)}>✕</button>
                    </div>
                  );
                })}
              </div>
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={()=>setModal(null)}>취소</button>
              <button className="btn btn-primary" onClick={save}>저장</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function CostPage({costBom,setCostBom,factories,bom,items,processes,costMaster,setCostMaster,orders,io,stdCosts,setStdCosts,currentUser,perm,showToast,downloadCSV}) {
  const [activeTab,setActiveTab]=useState("calc");
  const [selId,setSelId]=useState(costBom[0]?.id||"");
  const [selWoCode,setSelWoCode]=useState("");
  const [addModal,setAddModal]=useState(false);
  const [newName,setNewName]=useState("");
  const [newItemQ,setNewItemQ]=useState("");
  const [newLinkedProduct,setNewLinkedProduct]=useState("");
  const [prodSearchQ,setProdSearchQ]=useState("");
  const [codeSearchQ,setCodeSearchQ]=useState("");

  const th={color:"#fff",background:"#1a2236"};
  const iStyle={border:"1px solid #ddd",borderRadius:4,padding:"3px 6px",fontSize:12,textAlign:"right"};

  // ── 원가마스터 헬퍼 ──
  const updProcRate=(idx,field,val)=>{const pr=[...costMaster.processRates];pr[idx]={...pr[idx],[field]:val};setCostMaster({...costMaster,processRates:pr});};
  const updFactSetting=(idx,field,val)=>{const fs=[...costMaster.factorySettings];fs[idx]={...fs[idx],[field]:val};setCostMaster({...costMaster,factorySettings:fs});};
  const updFacilityRate=(idx,field,val)=>{const fr=[...(costMaster.facilityRates||[])];fr[idx]={...fr[idx],[field]:field==="ratePerHour"?+val:val};setCostMaster({...costMaster,facilityRates:fr});};

  const delFacilityRate=(idx)=>setCostMaster({...costMaster,facilityRates:(costMaster.facilityRates||[]).filter((_,i)=>i!==idx)});
  const syncProcessRates=()=>{const ex=costMaster.processRates;const sy=processes.map(p=>{const e=ex.find(r=>r.processCode===p.code);return e||{processCode:p.code,processName:p.name,ratePerHour:26000,stdHoursPerUnit:0};});setCostMaster({...costMaster,processRates:sy});showToast("공정 목록과 동기화 완료");};
  const syncFactorySettings=()=>{const ex=costMaster.factorySettings;const sy=factories.map(f=>{const e=ex.find(s=>s.factoryCode===f.code);return e||{factoryCode:f.code,monthlyCapacity:1000,depreciation:0,utilities:0};});setCostMaster({...costMaster,factorySettings:sy});showToast("공장 목록과 동기화 완료");};

  // ── 원가계산 ──
  const entry=costBom.find(c=>c.id===selId)||null;
  const updEntry=(field,val)=>setCostBom(costBom.map(c=>c.id===selId?{...c,[field]:val}:c));
  const updMfg=(field,val)=>setCostBom(costBom.map(c=>c.id===selId?{...c,mfgSection:{...c.mfgSection,[field]:["laborRate","processHours","packingHours","testHours","depreciation"].includes(field)?+val:val}}:c));
  const updGroupItem=(gType,gIdx,iIdx,field,val)=>{setCostBom(costBom.map(c=>{if(c.id!==selId)return c;const gs=[...(c[gType]||[])];const its=[...gs[gIdx].items];its[iIdx]={...its[iIdx],[field]:["price","qty"].includes(field)?+val:val};gs[gIdx]={...gs[gIdx],items:its};return{...c,[gType]:gs};}));};
  const addGroupItem=(gType,gIdx)=>{setCostBom(costBom.map(c=>{if(c.id!==selId)return c;const gs=[...(c[gType]||[])];gs[gIdx]={...gs[gIdx],items:[...gs[gIdx].items,{name:"",spec:"",price:0,qty:0,unit:"EA"}]};return{...c,[gType]:gs};}));};
  const delGroupItem=(gType,gIdx,iIdx)=>{setCostBom(costBom.map(c=>{if(c.id!==selId)return c;const gs=[...(c[gType]||[])];gs[gIdx]={...gs[gIdx],items:gs[gIdx].items.filter((_,i)=>i!==iIdx)};return{...c,[gType]:gs};}));};
  const calcGT=(g)=>(g.items||[]).reduce((s,it)=>s+(it.price||0)*(it.qty||0),0);
  const packingTotal=(entry?.packingGroups||[]).reduce((s,g)=>s+calcGT(g),0);

  const mfg=entry?.mfgSection||{};
  const woList=(orders||[]).filter(o=>o.status==="완료"||o.status==="진행중"||o.status==="대기");
  const selWo=(orders||[]).find(o=>o.code===selWoCode)||null;

  // 노무비: 반드시 작업지시서 연동 후 processTimes 기반으로 계산 (수동 고정시간 제거)
  let laborRows=[],laborTotal=0;
  if(selWo&&(selWo.processTimes||[]).length>0){
    laborRows=selWo.processTimes.map(pt=>{const master=costMaster.processRates.find(r=>r.processCode===pt.code);const rate=master?.ratePerHour||0;const cost=Math.round(rate*(pt.hours||0));return{name:pt.name||pt.code,hours:pt.hours||0,rate,cost,fromWo:true};});
    laborTotal=laborRows.reduce((s,r)=>s+r.cost,0);
  }
  // WO 미연동 시 laborRows = [] → 노무비 0, 시설비 0

  const depreciation=mfg.depreciation||0;

  // ── 실제 자재 사용 (io 연동) ──
  // 반제품인 경우 해당 BOM의 원자재 단가 합계로 단위원가 계산
  const calcItemUnitCost=(itemCode)=>{
    const it=items.find(i=>i.code===itemCode);
    if(!it) return 0;
    if(it.type==="반제품"){
      const semiB=bom.find(b=>b.product===itemCode);
      if(semiB){
        return semiB.materials.reduce((s,m)=>{const mat=items.find(i=>i.code===m.code);return s+(mat?.price||0)*m.qty;},0);
      }
    }
    return it.price||0;
  };
  // 동일 WO에 대한 출고 기록을 품목별로 합산 (중복 방지)
  const actualMatsRaw=selWo?(io||[]).filter(r=>r.type==="출고"&&r.note&&r.note.includes(selWo.code)):[];
  const actualMatsMap={};
  actualMatsRaw.forEach(r=>{
    if(!actualMatsMap[r.item]){actualMatsMap[r.item]={...r,qty:0};}
    actualMatsMap[r.item].qty+=r.qty||0;
  });
  const actualMats=Object.values(actualMatsMap);
  const actualMatCost=actualMats.reduce((s,r)=>{const unitCostR=calcItemUnitCost(r.item)||r.unitPrice||0;return s+unitCostR*r.qty;},0);
  const selWoBom=selWo?bom.find(b=>b.product===selWo.product):null;

  // ── 시설비 (임차료·청정실 운영비) = 총 가동시간 × 시간당 단가 (공장별) ──
  const totalLaborHours=laborRows.reduce((s,r)=>s+(r.hours||0),0);
  const woFactoryCode=selWo?.factoryCode||"";
  const woFactory=factories.find(f=>f.code===woFactoryCode)||null;
  const allFacilityRates=costMaster.facilityRates||[];
  const facilityRates=woFactoryCode?allFacilityRates.filter(f=>f.factoryCode===woFactoryCode):allFacilityRates;
  const facilityRows=facilityRates.map(f=>({...f,cost:Math.round(totalLaborHours*(f.ratePerHour||0))}));
  const facilityTotal=facilityRows.reduce((s,r)=>s+r.cost,0);

  const grandTotal=actualMatCost+packingTotal+laborTotal+facilityTotal+depreciation;

  // ── 작업지시 원가 목록 (상세보기와 동일한 방식으로 계산) ──
  const woCostList=(orders||[]).map(o=>{
    // 자재비
    const actualIo=(io||[]).filter(r=>r.type==="출고"&&r.note&&r.note.includes(o.code));
    let matCost=0;let matFromActual=false;
    if(actualIo.length>0){
      const ioMap={};
      actualIo.forEach(r=>{if(!ioMap[r.item]){ioMap[r.item]={...r,qty:0};}ioMap[r.item].qty+=r.qty||0;});
      matCost=Object.values(ioMap).reduce((s,r)=>{return s+calcItemUnitCost(r.item)*r.qty;},0);
      matFromActual=true;
    } else {
      const bomEntry=bom.find(b=>b.product===o.product);
      matCost=(bomEntry?.materials||[]).reduce((s,m)=>{return s+calcItemUnitCost(m.code)*m.qty*o.orderQty;},0);
    }
    // 노무비
    const laborRows=(o.processTimes||[]).map(pt=>{const master=costMaster.processRates.find(r=>r.processCode===pt.code);const rate=master?.ratePerHour||0;return Math.round(rate*(pt.hours||0));});
    const laborCost=laborRows.reduce((s,c)=>s+c,0);
    // 시설비 (임차료·청정실 = 총 공정시간 × 시설 단가)
    const totalHours=(o.processTimes||[]).reduce((s,pt)=>s+(pt.hours||0),0);
    const facRates=(costMaster.facilityRates||[]).filter(f=>!o.factoryCode||f.factoryCode===o.factoryCode);
    const facilityCost=Math.round(totalHours*facRates.reduce((s,f)=>s+(f.ratePerHour||0),0));
    // 포장비 (costBom에서 해당 제품 연동)
    const linkedCostBom=costBom.find(c=>c.linkedProduct===o.product);
    const packCost=linkedCostBom?(linkedCostBom.packingGroups||[]).reduce((s,g)=>s+g.items.reduce((ss,it)=>ss+(it.price||0)*(it.qty||0),0),0):0;
    // 감가상각
    const depr=linkedCostBom?.mfgSection?.depreciation||0;
    const total=matCost+laborCost+facilityCost+packCost+depr;
    const unitCost=o.orderQty>0?Math.round(total/o.orderQty):0;
    return{...o,matCost,laborCost,facilityCost,packCost,depr,total,unitCost,matFromActual};
  });
  const batchSz=selWo?selWo.orderQty:(entry?.batchSize||1);
  const unitCost=batchSz>0?Math.round(grandTotal/batchSz):0;

  const doExport=()=>{
    if(!entry)return;
    const rows=[["구분","코드/그룹","품명","단가","수량","단위","소계"]];
    actualMats.forEach(r=>{const it=items.find(i=>i.code===r.item);const price=it?.price||r.unitPrice||0;rows.push(["자재비",r.item,r.itemName,price,r.qty,r.unit||"",price*r.qty]);});
    (entry.packingGroups||[]).forEach(g=>g.items.forEach(it=>rows.push(["포장비",g.name,it.name,it.price,it.qty,it.unit,(it.price||0)*(it.qty||0)])));
    laborRows.forEach(r=>rows.push(["노무비","",r.name,r.rate,r.hours,"h",r.cost]));
    rows.push(["감가상각","","","","","",depreciation]);
    rows.push(["총원가","","","","","",grandTotal],[`단위원가(÷${batchSz})`,""," ","","","",unitCost]);
    downloadCSV(rows[0],rows.slice(1),"원가계산.csv");
  };

  const PackingGroupTable=()=>{
    if(!entry)return null;
    const groups=entry.packingGroups||[];
    return(
      <div className="panel" style={{marginBottom:14}}>
        <div className="panel-top" style={{background:"#f0fdf4"}}><b>📦 포장비 (수동 입력)</b><span style={{fontSize:12,color:"#888"}}>소계: <b style={{color:"#16a34a"}}>{packingTotal.toLocaleString()}원</b></span></div>
        {groups.map((g,gIdx)=>(
          <div key={gIdx}>
            <div style={{background:"#dcfce7",padding:"6px 18px",fontWeight:600,fontSize:12,color:"#16a34a",borderBottom:"1px solid #eee",display:"flex",justifyContent:"space-between"}}>
              <span>{g.name}</span><span style={{color:"#555"}}>{calcGT(g).toLocaleString()}원</span>
            </div>
            <table>
              <thead><tr><th style={th}>품명</th><th style={th}>규격</th><th style={{...th,textAlign:"right",width:90}}>단가</th><th style={{...th,textAlign:"right",width:80}}>수량</th><th style={{...th,width:55}}>단위</th><th style={{...th,textAlign:"right",width:100}}>소계</th>{perm.canEdit&&<th style={{...th,width:36}}></th>}</tr></thead>
              <tbody>
                {g.items.map((it,iIdx)=>(
                  <tr key={iIdx}>
                    <td>{perm.canEdit?<input value={it.name} onChange={e=>updGroupItem("packingGroups",gIdx,iIdx,"name",e.target.value)} style={{...iStyle,width:"100%",textAlign:"left"}}/>:<b>{it.name}</b>}</td>
                    <td>{perm.canEdit?<input value={it.spec||""} onChange={e=>updGroupItem("packingGroups",gIdx,iIdx,"spec",e.target.value)} style={{...iStyle,width:"100%",textAlign:"left"}}/>:it.spec||"-"}</td>
                    <td style={{textAlign:"right"}}>{perm.canEdit?<input type="number" value={it.price} onChange={e=>updGroupItem("packingGroups",gIdx,iIdx,"price",e.target.value)} style={{...iStyle,width:85}}/>:(it.price||0).toLocaleString()}</td>
                    <td style={{textAlign:"right"}}>{perm.canEdit?<input type="number" value={it.qty} onChange={e=>updGroupItem("packingGroups",gIdx,iIdx,"qty",e.target.value)} style={{...iStyle,width:75}}/>:it.qty}</td>
                    <td>{perm.canEdit?<input value={it.unit} onChange={e=>updGroupItem("packingGroups",gIdx,iIdx,"unit",e.target.value)} style={{...iStyle,width:50,textAlign:"left"}}/>:it.unit}</td>
                    <td style={{textAlign:"right",fontWeight:600,color:"#16a34a"}}>{((it.price||0)*(it.qty||0)).toLocaleString()}</td>
                    {perm.canEdit&&<td style={{textAlign:"center"}}><button style={{background:"none",border:"none",color:"#e74c3c",cursor:"pointer",fontSize:14,lineHeight:1}} onClick={()=>delGroupItem("packingGroups",gIdx,iIdx)}>✕</button></td>}
                  </tr>
                ))}
                {perm.canEdit&&<tr><td colSpan={7} style={{textAlign:"center",padding:"6px"}}><button className="btn btn-outline btn-sm" onClick={()=>addGroupItem("packingGroups",gIdx)}>+ 항목 추가</button></td></tr>}
              </tbody>
            </table>
          </div>
        ))}
      </div>
    );
  };

  return(
    <div>
      <div className="page-header">
        <div><div className="crumb">MedERP <span>›</span> <b>원가 관리</b></div><div className="page-title">원가 관리</div><div className="page-sub">제품별 원가 계산 (재료비·노무비·제조경비) 및 원가 마스터 관리</div></div>
        {activeTab==="calc"&&<button className="btn btn-outline" onClick={doExport}>📥 엑셀 다운로드</button>}
      </div>
      <div className="tabs">
        <div className={`tab${activeTab==="calc"?" active":""}`} onClick={()=>setActiveTab("calc")}>💰 원가 계산</div>
        <div className={`tab${activeTab==="wolist"?" active":""}`} onClick={()=>setActiveTab("wolist")}>📊 작업지시 원가</div>
        <div className={`tab${activeTab==="stdcost"?" active":""}`} onClick={()=>setActiveTab("stdcost")}>📌 표준원가</div>
        <div className={`tab${activeTab==="master"?" active":""}`} onClick={()=>setActiveTab("master")}>📋 원가 마스터</div>
      </div>

      {activeTab==="calc"&&(
        <div>
          {/* 제품 선택 바 */}
          <div style={{background:"#fff",borderRadius:10,padding:"12px 18px",boxShadow:"0 1px 3px rgba(0,0,0,0.07)",marginBottom:16,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <span style={{fontSize:13,fontWeight:600,color:"#555"}}>제품:</span>
              <div style={{position:"relative"}}>
                <input placeholder="품목코드 직접입력..." value={codeSearchQ} onChange={e=>{
                  const v=e.target.value; setCodeSearchQ(v);
                  if(v){
                    const hit=costBom.find(c=>c.linkedProduct&&c.linkedProduct.toLowerCase()===v.toLowerCase());
                    if(hit){setSelId(hit.id);setProdSearchQ("");}
                  }
                }} style={{width:150,border:"1px solid #2f6df0",borderRadius:5,padding:"5px 8px",fontSize:12,color:"#2f6df0"}} title="품목코드 입력 시 자동 연동"/>
                {codeSearchQ&&(()=>{
                  const hits=items.filter(i=>(i.type==="완제품"||i.type==="반제품")&&(i.code.toLowerCase().includes(codeSearchQ.toLowerCase())||i.name.toLowerCase().includes(codeSearchQ.toLowerCase())));
                  if(!hits.length) return null;
                  return(
                    <div style={{position:"absolute",top:"100%",left:0,zIndex:50,background:"#fff",border:"1px solid #e0e0e0",borderRadius:6,boxShadow:"0 4px 12px rgba(0,0,0,0.1)",minWidth:200,maxHeight:150,overflowY:"auto"}}>
                      {hits.map(i=>(
                        <div key={i.code} style={{padding:"7px 12px",cursor:"pointer",fontSize:12,borderBottom:"1px solid #f5f5f5"}}
                          onClick={()=>{
                            const linked=costBom.find(c=>c.linkedProduct===i.code);
                            if(linked){setSelId(linked.id);}
                            setCodeSearchQ(i.code);
                          }}
                          onMouseEnter={e=>e.currentTarget.style.background="#eff6ff"}
                          onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
                          <span style={{fontFamily:"monospace",color:"#2f6df0",fontWeight:600}}>{i.code}</span>
                          <span style={{marginLeft:8,color:"#555"}}>{i.name}</span>
                          {costBom.find(c=>c.linkedProduct===i.code)&&<span style={{marginLeft:6,fontSize:10,background:"#dcfce7",color:"#16a34a",padding:"1px 4px",borderRadius:3}}>연동됨</span>}
                        </div>
                      ))}
                    </div>
                  );
                })()}
              </div>
              <input placeholder="코드/제품명 검색..." value={prodSearchQ} onChange={e=>setProdSearchQ(e.target.value)} style={{width:130,border:"1px solid #ddd",borderRadius:5,padding:"5px 8px",fontSize:12}}/>
              <select value={selId} onChange={e=>{setSelId(e.target.value);setProdSearchQ("");setCodeSearchQ("");}} style={{border:"1px solid #ddd",borderRadius:6,padding:"5px 10px",fontSize:13}}>
                {costBom.filter(c=>!prodSearchQ||c.id.toLowerCase().includes(prodSearchQ.toLowerCase())||c.productName.toLowerCase().includes(prodSearchQ.toLowerCase())||(c.linkedProduct&&c.linkedProduct.toLowerCase().includes(prodSearchQ.toLowerCase()))).map(c=><option key={c.id} value={c.id}>{c.id}{c.linkedProduct?` [${c.linkedProduct}]`:""} — {c.productName}</option>)}
              </select>
              {perm.canCreate&&<button className="btn btn-outline btn-sm" onClick={()=>{setNewName("");setNewItemQ("");setNewLinkedProduct("");setAddModal(true);}}>+ 제품 추가</button>}

      {activeTab==="stdcost"&&(()=>{
        // ── 표준원가 탭 ──

        // BOM 기반 자동계산
        const calcFromBom=(productCode,batchSize)=>{
          const bomEntry=bom.find(b=>b.product===productCode);
          const matCost=(bomEntry?.materials||[]).reduce((s,m)=>{
            const it=items.find(i=>i.code===m.code);
            return s+(it?.price||0)*m.qty;
          },0)*batchSize;
          const laborCost=0; // 공정시간 데이터 없으면 0
          const facilityCost=0;
          const packCost=(()=>{
            const cb=costBom.find(c=>c.linkedProduct===productCode);
            return cb?(cb.packingGroups||[]).reduce((s,g)=>s+g.items.reduce((ss,it)=>ss+(it.price||0)*(it.qty||0),0),0):0;
          })();
          const depr=(()=>{
            const cb=costBom.find(c=>c.linkedProduct===productCode);
            return cb?.mfgSection?.depreciation||0;
          })();
          const stdTotal=matCost+laborCost+facilityCost+packCost+depr;
          const stdUnitCost=batchSize>0?Math.round(stdTotal/batchSize):0;
          return {stdMatCost:Math.round(matCost),stdLaborCost:laborCost,stdFacilityCost:facilityCost,stdPackCost:Math.round(packCost),stdDepr:depr,stdTotal:Math.round(stdTotal),stdUnitCost};
        };

        const upsertStd=(productCode,patch)=>{
          setStdCosts(prev=>{
            const idx=prev.findIndex(s=>s.productCode===productCode);

            const updated={...base,...patch};
            // 합계 재계산
            const t=updated.stdMatCost+updated.stdLaborCost+updated.stdFacilityCost+updated.stdPackCost+updated.stdDepr;
            updated.stdTotal=Math.round(t);
            updated.stdUnitCost=updated.batchSize>0?Math.round(t/updated.batchSize):0;
            if(idx>=0){const arr=[...prev];arr[idx]=updated;return arr;}
            return [...prev,updated];
          });
        };

        const confirmStd=(productCode)=>{
          if(!perm.canAdmin){showToast("관리자만 표준원가를 확정할 수 있습니다");return;}

                    <th style={{textAlign:"right",color:"#f9a8d4"}}>감가상각</th>
                    <th style={{textAlign:"right"}}>표준총원가</th>
                    <th style={{textAlign:"right",color:"#fbbf24"}}>단위원가</th>
                    <th style={{textAlign:"right",color:"#34d399"}}>목표판매가</th>
                    <th>확정일</th><th>확정자</th><th>액션</th>
                  </tr>
                </thead>
                <tbody>
                  {finishedItems.map(it=>{
                    const sc=stdCosts.find(s=>s.productCode===it.code)||{productCode:it.code,productName:it.name,batchSize:1,stdMatCost:0,stdLaborCost:0,stdFacilityCost:0,stdPackCost:0,stdDepr:0,stdTotal:0,stdUnitCost:0,targetPrice:0,confirmedAt:"",confirmedBy:""};
                    const isConfirmed=!!sc.confirmedAt;
                    const inp=(field,w=80)=>(
                      <input type="number" value={sc[field]||0}
                        onChange={e=>upsertStd(it.code,{[field]:+e.target.value})}
                        style={{width:w,border:"1px solid #ddd",borderRadius:4,padding:"3px 6px",fontSize:12,textAlign:"right",background:isConfirmed?"#f9fafb":"#fff"}}
                        readOnly={isConfirmed&&!perm.canAdmin}
                      />
                    );
                    const margin=sc.targetPrice>0&&sc.stdUnitCost>0?Math.round((sc.targetPrice-sc.stdUnitCost)/sc.targetPrice*100):null;
                    return(
                      <tr key={it.code} style={{background:isConfirmed?"#f0fdf4":"#fff"}}>
                        <td><code style={{fontSize:11,color:"#2f6df0"}}>{it.code}</code></td>
                        <td style={{fontWeight:600}}>{it.name}<span style={{marginLeft:6,fontSize:10,background:"#e0e7ff",color:"#4338ca",padding:"1px 4px",borderRadius:3}}>{it.type}</span></td>

                          <input type="number" value={sc.batchSize||1} min="1"

                            style={{width:60,border:"1px solid #ddd",borderRadius:4,padding:"3px 6px",fontSize:12,textAlign:"right"}}/>
                        </td>
                        <td style={{textAlign:"right"}}>{inp("stdMatCost",90)}</td>
                        <td style={{textAlign:"right"}}>{inp("stdLaborCost",90)}</td>

                        <td style={{textAlign:"right"}}>{inp("stdPackCost",90)}</td>
                        <td style={{textAlign:"right"}}>{inp("stdDepr",80)}</td>
                        <td style={{textAlign:"right",fontWeight:700}}>{(sc.stdTotal||0).toLocaleString()}</td>
                        <td style={{textAlign:"right",fontWeight:700,color:"#7c3aed"}}>{(sc.stdUnitCost||0).toLocaleString()}</td>
                        <td style={{textAlign:"right"}}>
                          <div style={{display:"flex",alignItems:"center",gap:4,justifyContent:"flex-end"}}>
                            <input type="number" value={sc.targetPrice||0}
                              onChange={e=>upsertStd(it.code,{targetPrice:+e.target.value})}
                              style={{width:90,border:"1px solid #ddd",borderRadius:4,padding:"3px 6px",fontSize:12,textAlign:"right"}}/>
                            {margin!=null&&<span style={{fontSize:11,color:margin>=0?"#16a34a":"#e55",fontWeight:600,minWidth:36}}>{margin}%</span>}

                          <td style={{textAlign:"center"}}><button style={{background:"none",border:"none",color:"#e74c3c",cursor:"pointer",fontSize:14}} onClick={()=>delFacilityRate(gi)}>✕</button></td>
                        </tr>

                      {!fRates.length&&<tr><td colSpan={4} className="empty" style={{padding:"10px"}}>항목 없음</td></tr>}

            {costMaster.processRates.length>0&&<table>
              <thead><tr><th style={th}>공정코드</th><th style={th}>공정명</th><th style={{...th,textAlign:"right"}}>시간당 인건비 (원/h)</th><th style={{...th,textAlign:"right"}}>표준시간/EA (h)</th><th style={{...th,textAlign:"right"}}>단위당 인건비</th></tr></thead>
              <tbody>{costMaster.processRates.map((r,i)=>(

              setCostBom([...costBom,nc]);setSelId(nc.id);setCodeSearchQ(newLinkedProduct||"");setAddModal(false);showToast("제품 원가가 추가되었습니다");

              <div className="kv-row"><span className="kv-k">월 청정실 운영비</span><span className="kv-v">{f.monthlyCleanroom.toLocaleString()}원</span></div>
              <div className="kv-row"><span className="kv-k">1시간 청정실비</span><span className="kv-v" style={{color:"#2f6df0"}}>{cleanHour.toLocaleString()}원</span></div>
              <div className="kv-row"><span className="kv-k">근무</span><span className="kv-v">{f.workDays}일 · {f.hoursPerDay}h/일</span></div>
              <div style={{marginTop:8,marginBottom:4,fontSize:11,color:"#888",fontWeight:600}}>운영비 항목</div>

function ShipmentPage({shipments,setShipments,items,setItems,lots,setLots,io,setIo,currentUser,perm,showToast,downloadCSV}) {
  const todayStr=new Date().toISOString().slice(0,10);
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({code:"",date:todayStr,customer:"",item:"",itemName:"",lot:"",qty:0,unitPrice:0,note:"",manager:""});
  const [codeInput,setCodeInput]=useState("");
  const [sel,setSel]=useState(new Set());
  const [startDate,setStartDate]=useState("");
  const [endDate,setEndDate]=useState("");
  const [filterCustomer,setFilterCustomer]=useState("");
  const dateStyle={border:"1px solid #ddd",borderRadius:5,padding:"5px 8px",fontSize:12};

  const finishedItems=items.filter(i=>i.type==="완제품"||i.type==="반제품");
  const toggleSel=(code)=>setSel(prev=>{const s=new Set(prev);s.has(code)?s.delete(code):s.add(code);return s;});

  const filtered=shipments.filter(s=>{
    if(startDate&&s.date<startDate) return false;
    if(endDate&&s.date>endDate) return false;
    if(filterCustomer&&!s.customer.includes(filterCustomer)) return false;
    return true;
  });

  const customers=[...new Set(shipments.map(s=>s.customer).filter(Boolean))];
  const availableLots=lots.filter(l=>l.item===form.item&&l.qty>0&&l.status!=="불량");

  const openAdd=()=>{
    const _today=new Date();const _ymd=String(_today.getFullYear()).slice(2)+String(_today.getMonth()+1).padStart(2,"0")+String(_today.getDate()).padStart(2,"0");
    const _seq=String((shipments.filter(s=>s.code.startsWith("SH"+_ymd)).length)+1).padStart(3,"0");
    setForm({code:"SH"+_ymd+_seq,date:todayStr,customer:"",item:"",itemName:"",lot:"",qty:0,unitPrice:0,note:"",manager:currentUser?.name||""});
    setCodeInput("");setModal("add");
  };

  const pickItem=(code)=>{
    const it=finishedItems.find(i=>i.code===code);
    if(it){setForm(f=>({...f,item:it.code,itemName:it.name,unitPrice:it.price||0,lot:""}));}
  };

  const save=()=>{
    if(!form.item){showToast("품목을 선택해주세요");return;}
    if(!form.customer.trim()){showToast("거래처를 입력해주세요");return;}
    if(form.qty<=0){showToast("수량을 입력해주세요");return;}
    if(modal==="add"){
      // 재고 차감
      const lotObj=lots.find(l=>l.code===form.lot&&l.item===form.item);
      if(form.lot&&lotObj){
        if(lotObj.qty<form.qty){showToast(`❌ LOT 재고 부족 (현재 ${fmt3(lotObj.qty)})`);return;}
        setLots(prev=>prev.map(l=>l.code===form.lot?{...l,qty:l.qty-form.qty}:l));
      }
      setItems(prev=>prev.map(i=>i.code===form.item?{...i,stock:Math.max(0,i.stock-form.qty)}:i));
      setIo(prev=>[...prev,{date:form.date,type:"출고",item:form.item,itemName:form.itemName,qty:form.qty,unitPrice:form.unitPrice,lot:form.lot,destination:"S",manager:form.manager,approver:"",note:`출하 ${form.code} ${form.customer}`}]);
      setShipments(prev=>[form,...prev]);
    } else {
      setShipments(prev=>prev.map(s=>s.code===form.code?form:s));
    }
    showToast("저장되었습니다.");setModal(null);
  };

  const del=(code)=>{
    if(!window.confirm("출하 기록을 삭제하시겠습니까?\n관련 입출고 이력도 삭제됩니다.")) return;
    const s=shipments.find(x=>x.code===code);
    if(s){
      // 재고 복원
      setItems(prev=>prev.map(i=>i.code===s.item?{...i,stock:i.stock+s.qty}:i));
      if(s.lot) setLots(prev=>prev.map(l=>l.code===s.lot?{...l,qty:l.qty+s.qty}:l));
      setIo(prev=>prev.filter(r=>!r.note||!r.note.includes(s.code)));
    }
    setShipments(prev=>prev.filter(x=>x.code!==code));
    showToast("삭제되었습니다.");
  };

  const bulkDel=()=>{
    if(!window.confirm(`선택한 ${sel.size}개를 삭제하시겠습니까?`)) return;
    [...sel].forEach(code=>del(code));
    setSel(new Set());
  };

  const totalQty=filtered.reduce((s,x)=>s+(x.qty||0),0);
  const totalAmt=filtered.reduce((s,x)=>s+((x.qty||0)*(x.unitPrice||0)),0);

  return (
    <div>
      <div className="page-header">
        <div><div className="crumb">MedERP <span>›</span> <b>출하 관리</b></div><div className="page-title">출하 관리</div><div className="page-sub">완제품 출하 등록 — 출하 시 재고 자동 차감</div></div>
        <div style={{display:"flex",gap:8}}>
          {perm.canDelete&&sel.size>0&&<button className="btn btn-danger" onClick={bulkDel}>🗑 선택 삭제 ({sel.size})</button>}
          <button className="btn btn-outline" onClick={()=>downloadCSV(
            ["출하번호","출하일","거래처","품목명","LOT","수량","단가","금액","담당자","비고"],
            filtered.map(s=>[s.code,s.date,s.customer,s.itemName,s.lot,s.qty,s.unitPrice,(s.qty||0)*(s.unitPrice||0),s.manager,s.note])
          ,"출하현황.csv")}>📥 엑셀 다운로드</button>
          {perm.canCreate&&<button className="btn btn-primary" onClick={openAdd}>+ 출하 등록</button>}
        </div>
      </div>

      {/* 필터 바 */}
      <div style={{background:"#fff",borderRadius:10,padding:"10px 16px",boxShadow:"0 1px 3px rgba(0,0,0,0.07)",marginBottom:12,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <span style={{fontSize:13,fontWeight:600,color:"#555"}}>출하일</span>
        <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} style={dateStyle}/>
        <span style={{fontSize:12,color:"#aaa"}}>~</span>
        <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} style={dateStyle}/>
        <button className="btn btn-outline btn-sm" onClick={()=>{setStartDate(todayStr);setEndDate(todayStr);}}>오늘</button>
        <button className="btn btn-outline btn-sm" onClick={()=>{setStartDate("");setEndDate("");}}>전체</button>
        <input placeholder="거래처 검색" value={filterCustomer} onChange={e=>setFilterCustomer(e.target.value)} style={{...dateStyle,width:140}}/>
      </div>

      {/* 요약 카드 */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:14}}>
        {[["총 출하 건수",`${filtered.length} 건`],["총 출하 수량",`${fmt3(totalQty)} EA`],["총 출하 금액",`${totalAmt.toLocaleString()} 원`]].map(([k,v])=>(
          <div key={k} className="card"><div className="card-label">{k}</div><div className="card-val" style={{fontSize:18}}>{v}</div></div>
        ))}
      </div>

      <div className="panel">
        <div className="panel-top">
          <b>🚛 출하 목록</b>
          <span style={{fontSize:12,color:"#aaa"}}>{filtered.length}건</span>
        </div>
        <table>
          <thead><tr>
            <th style={{width:36,textAlign:"center"}}>선택</th>
            <th>출하번호</th><th>출하일</th><th>거래처</th><th>품목명</th>
            <th>LOT</th><th style={{textAlign:"right"}}>수량</th><th style={{textAlign:"right"}}>단가</th><th style={{textAlign:"right"}}>금액</th>
            <th>담당자</th><th>비고</th><th>관리</th>
          </tr></thead>
          <tbody>
            {filtered.map(s=>(
              <tr key={s.code}>
                <td style={{textAlign:"center"}}><input type="checkbox" checked={sel.has(s.code)} onChange={()=>toggleSel(s.code)} style={{cursor:"pointer"}}/></td>
                <td><b style={{color:"#2f6df0",fontSize:12}}>{s.code}</b></td>
                <td style={{fontSize:12}}>{s.date}</td>
                <td style={{fontWeight:600}}>{s.customer}</td>
                <td>{s.itemName}</td>
                <td style={{fontSize:11,color:"#7c3aed",fontFamily:"monospace"}}>{s.lot||"-"}</td>
                <td style={{textAlign:"right",fontWeight:700}}>{fmt3(s.qty)}</td>
                <td style={{textAlign:"right",fontSize:12,color:"#888"}}>{(s.unitPrice||0).toLocaleString()}</td>
                <td style={{textAlign:"right",fontWeight:600,color:"#2f6df0"}}>{((s.qty||0)*(s.unitPrice||0)).toLocaleString()}</td>
                <td style={{fontSize:12,color:"#888"}}>{s.manager||"-"}</td>
                <td style={{fontSize:12,color:"#888"}}>{s.note||"-"}</td>
                <td style={{display:"flex",gap:4}}>
                  {perm.canEdit&&<button className="btn btn-outline btn-sm" onClick={()=>{setForm({...s});setCodeInput(s.item||"");setModal("edit");}}>수정</button>}
                  {perm.canDelete&&<button className="btn btn-danger btn-sm" onClick={()=>del(s.code)}>삭제</button>}

              </tr>
