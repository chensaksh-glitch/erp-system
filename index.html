  );
}

function OrdersPage({orders,setOrders,items,setItems,bom,processes,factories,lots,setLots,io,setIo,warehouses,defectWarehouse,goodWarehouse,inspectWarehouse,retainWarehouse,currentUser,perm,showToast,tryDelete,checkOrderLinks,mfgDocs,navSearch,onNavConsumed}) {
  const [activeTab,setActiveTab]=useState("list");
  const [sel,setSel]=useState(new Set());
  const [viewWo,setViewWo]=useState(null);
  const [modal,setModal]=useState(null);
  const [completeModal,setCompleteModal]=useState(null);
  const [compForm,setCompForm]=useState({doneDate:"",defectQty:0,inspectQty:0,retainQty:0,processTimes:[]});
  const [form,setForm]=useState({code:"",product:"",productName:"",orderQty:0,lot:"",processes:[],materials:[],status:"대기",date:"",factoryCode:""});
  const [startDate,setStartDate]=useState("");
  const [endDate,setEndDate]=useState("");

  // 전체검색에서 작업지시 클릭 시 지시번호로 필터 (1회 소비, 목록 탭으로 전환 + 날짜필터 해제)
  useEffect(()=>{ if(navSearch&&navSearch.pg==="orders"){ setQ(navSearch.v); setActiveTab("list"); setStartDate(""); setEndDate(""); onNavConsumed&&onNavConsumed(); } },[navSearch]);
  const filteredOrders=orders.filter(o=>{
    if(startDate&&o.date<startDate) return false;
    if(endDate&&o.date>endDate) return false;
    if(q&&!(`${o.code||""} ${o.productName||""} ${o.product||""} ${o.lot||""}`.toLowerCase().includes(q.toLowerCase()))) return false;
    return true;
  });
  // 작업 입력 탭 state
  const [workWoCode,setWorkWoCode]=useState("");
  const [workProcTimes,setWorkProcTimes]=useState([]); // [{code,name,hours}]
  const [workMatQty,setWorkMatQty]=useState({});       // {itemCode: qty to deduct now}
  const [workMatLot,setWorkMatLot]=useState({});       // {itemCode: lotCode}
  const [workExtraMats,setWorkExtraMats]=useState([]); // [{code,name,qty,unit,lotCode}]
  const products=items.filter(i=>i.type==="완제품"||i.type==="반제품");
  const [prodCodeInput,setProdCodeInput]=useState("");
  const [wizStep,setWizStep]=useState(0);          // 등록 마법사 단계
  const [wizMode,setWizMode]=useState("wizard");   // 단일 폼 | 단계별 마법사
  const toggleSel=(code)=>setSel(prev=>{const s=new Set(prev);s.has(code)?s.delete(code):s.add(code);return s;});
  const SBadge=({s})=><span className={`badge ${s==="완료"?"badge-green":s==="진행중"?"badge-blue":s==="대기"?"badge-gray":"badge-red"}`}>{s}</span>;

  const openMfgDoc=(productCode)=>{
    const doc=mfgDocs&&mfgDocs[productCode];
    if(!doc){alert("등록된 제조지시서가 없습니다.\n품목 관리에서 먼저 첨부해주세요.");return;}
    const win=window.open("","_blank");
    openMfgDocIn(win,doc);
  };

  const selectProduct=(productCode)=>{
    const prd=items.find(i=>i.code===productCode);
    const itemProcCodes=prd?.processes||[];
    const autoProcs=itemProcCodes.map(pc=>{const proc=processes.find(p=>p.code===pc);return{code:pc,name:proc?.name||pc};});
    setForm(f=>({...f,product:productCode,processes:autoProcs}));
  };

  const openAdd=()=>{
    const _today=new Date();const _ymd=String(_today.getFullYear()).slice(2)+String(_today.getMonth()+1).padStart(2,"0")+String(_today.getDate()).padStart(2,"0");const _sameDayNums=orders.filter(o=>o.code.startsWith("I"+_ymd)).map(o=>parseInt(o.code.slice(-3))).filter(n=>!isNaN(n));const _seq=String((_sameDayNums.length>0?Math.max(..._sameDayNums):0)+1).padStart(3,"0");const _newCode="I"+_ymd+_seq;
    setForm({code:_newCode,product:"",productName:"",orderQty:0,unit:"EA",dueDate:"",priority:"보통",startAt:"",endAt:"",note:"",lot:"",warehouse:goodWarehouse?.name||"",processes:[],materials:[],status:"대기",date:new Date().toISOString().slice(0,10),factoryCode:factories[0]?.code||""});
    setProdCodeInput("");setWizStep(0);setModal("add");
  };
  // ── 기존 DEF_ 불량 LOT을 생산 LOT 번호로 일괄 정리 ──
  const cleanupDefLots=()=>{
    const defLots=lots.filter(l=>(l.code||"").startsWith("DEF_"));
    if(defLots.length===0){showToast("정리할 DEF_ 불량 LOT이 없습니다.");return;}
    if(!window.confirm(`기존 DEF_ 불량 LOT ${defLots.length}건을 작업지시의 생산 LOT 번호로 정리합니다.\n\n작업지시를 못 찾으면 작업지시번호로 정리됩니다.\n수량/창고는 그대로 유지됩니다. 계속하시겠습니까?`)) return;
    let renamed=0, fallback=0;
    const newCodeOf=l=>{
      const oc=(l.code||"").replace(/^DEF_/,"").replace(/_\d+$/,"");   // 작업지시번호(order.code) 추출
      const ord=orders.find(o=>o.code===oc);
      if(ord&&ord.lot){renamed++;return ord.lot;}
      fallback++;return oc||l.code;
    };
    const merged={}, ord=[];
    lots.forEach(l=>{
      const code=(l.code||"").startsWith("DEF_")?newCodeOf(l):l.code;
      const key=l.item+"|"+code+"|"+(l.warehouse||"")+"|"+(l.status||"");
      if(merged[key]) merged[key]={...merged[key], qty:(merged[key].qty||0)+(l.qty||0)};
      else { merged[key]={...l, code}; ord.push(key); }
    });
    setLots(ord.map(k=>merged[k]));
    showToast(`✅ 불량 LOT 정리 — 생산LOT ${renamed}건, 작업지시번호 ${fallback}건 변환`);
  };
  const addProcess=()=>setForm(f=>({...f,processes:[...f.processes,{code:"",name:""}]}));
  const setProc=(idx,val)=>{const ps=[...form.processes];const proc=processes.find(p=>p.code===val);ps[idx]={code:val,name:proc?.name||val};setForm(f=>({...f,processes:ps}));};
  const delProc=(idx)=>setForm(f=>({...f,processes:f.processes.filter((_,i)=>i!==idx)}));
  const addMat=()=>setForm(f=>({...f,materials:[...(f.materials||[]),{code:"",name:"",qty:1,unit:"EA"}]}));
  const delMat=(idx)=>setForm(f=>({...f,materials:f.materials.filter((_,i)=>i!==idx)}));
  const setMatField=(idx,field,val)=>setForm(f=>{const ms=[...(f.materials||[])];ms[idx]={...ms[idx],[field]:["qty"].includes(field)?+val:val};return{...f,materials:ms};});

  const openComplete=(order)=>{
    if(order.status==="취소"){
      alert("취소된 작업지시서입니다.");
      return;
    }
    // 작업실적에서 저장된 공정시간(processTimes)을 그대로 사용. 없으면 0
    const existingTimes=order.processTimes||[];
    const pts=(order.processes||[]).map(p=>{
      const ex=existingTimes.find(t=>t.code===p.code);
      return{code:p.code,name:p.name,hours:ex?ex.hours:0};
    });
    setCompForm({doneDate:order.doneDate||new Date().toISOString().slice(0,10),defectQty:order.defectQty||0,inspectQty:order.inspectQty||0,retainQty:order.retainQty||0,processTimes:pts});
    setCompleteModal(order);
  };

  const handleComplete=(order,doneDate,defectQty,isReComplete=false,inspectQty=0,retainQty=0)=>{
    // 자재 출고: 이미 수동 출고된 수량을 제외하고 나머지만 자동 출고
    // 재완료(isReComplete=true)일 때는 자재 출고도 건너뜀 (이미 이전 완료 시 처리됨)
    if(!isReComplete){
      const bomMats=order.materials?.length>0 ? order.materials : (bom.find(b=>b.product===order.product)?.materials||[]);
      if(bomMats.length>0&&order.orderQty>0){
        const ioRecs=[];
        const stockUpdates={};
        const lotDeductions={}; // {itemCode: {lotCode: qty}}
        bomMats.forEach(m=>{
          const need=m.qty*order.orderQty;
          const alreadyDone=(io||[]).filter(r=>r.type==="출고"&&r.item===m.code&&r.note&&r.note.includes(order.code)).reduce((s,r)=>s+(r.qty||0),0);
          let remaining=need-alreadyDone;
          if(remaining>0){
            // FIFO: 제조일 오래된 LOT부터 차감
            const availLots=lots.filter(l=>l.item===m.code&&(l.qty||0)>0)
              .sort((a,b)=>(a.mfg||"").localeCompare(b.mfg||""));
            let leftover=remaining;
            availLots.forEach(l=>{
              if(leftover<=0) return;
              const take=Math.min(l.qty,leftover);
              ioRecs.push({date:doneDate,type:"출고",item:m.code,itemName:m.name,qty:take,unitPrice:items.find(i=>i.code===m.code)?.price||0,lot:l.code,destination:"P",manager:"",approver:"",note:"작업지시서 "+order.code+" 투입(완료자동)"});
              if(!lotDeductions[m.code]) lotDeductions[m.code]={};
              lotDeductions[m.code][l.code]=(lotDeductions[m.code][l.code]||0)+take;
              leftover-=take;
            });
            // LOT 재고 부족 시 나머지는 lot 미지정으로 처리
            if(leftover>0){
              ioRecs.push({date:doneDate,type:"출고",item:m.code,itemName:m.name,qty:leftover,unitPrice:items.find(i=>i.code===m.code)?.price||0,lot:"",destination:"P",manager:"",approver:"",note:"작업지시서 "+order.code+" 투입(완료자동)"});
            }
            stockUpdates[m.code]=(stockUpdates[m.code]||0)+remaining;
          }
        });
        if(ioRecs.length>0){
          setItems(prev=>prev.map(it=>stockUpdates[it.code]!=null?{...it,stock:Math.max(0,it.stock-stockUpdates[it.code])}:it));
          setIo(prev=>[...prev,...ioRecs]);
          setLots(prev=>prev.map(l=>{
            const deduct=lotDeductions[l.item]?.[l.code]||0;
            return deduct>0?{...l,qty:Math.max(0,(l.qty||0)-deduct)}:l;
          }));
        }
      }
      const mainLotCode=order.lot||"LOT"+Date.now();
      // 양품 = 지시 - 불량 - 검사 - 보관샘플 (음수 방지: 합계 초과는 saveComplete에서 이미 차단)
      const goodQty=Math.max(0,(order.orderQty||0)-(defectQty||0)-(inspectQty||0)-(retainQty||0));
      const totalGoodQty=goodQty+(inspectQty||0)+(retainQty||0);
      // 양품/검사/보관 LOT 행 분리 — 같은 LOT 번호, 각 창고로. 검사/보관 창고 미등록 시 완제품창고에 합산(레거시 동작)
      if(totalGoodQty>0){
        setItems(prev=>prev.map(it=>it.code===order.product?{...it,stock:it.stock+totalGoodQty}:it));
        const _goodWh=order.warehouse||goodWarehouse.name;
        const _hasInsp=!!inspectWarehouse, _hasRet=!!retainWarehouse;
        const _goodRowQty=goodQty+(_hasInsp?0:(inspectQty||0))+(_hasRet?0:(retainQty||0));
        const _newLots=[];
        if(_goodRowQty>0) _newLots.push({code:mainLotCode,item:order.product,itemName:order.productName,qty:_goodRowQty,mfg:doneDate,exp:"",status:"정상",warehouse:_goodWh});
        if(_hasInsp&&(inspectQty||0)>0) _newLots.push({code:mainLotCode,item:order.product,itemName:order.productName,qty:inspectQty,mfg:doneDate,exp:"",status:"정상",warehouse:inspectWarehouse.name});
        if(_hasRet&&(retainQty||0)>0) _newLots.push({code:mainLotCode,item:order.product,itemName:order.productName,qty:retainQty,mfg:doneDate,exp:"",status:"정상",warehouse:retainWarehouse.name});
        if(_newLots.length>0) setLots(prev=>[...prev,..._newLots]);
      }
      if(goodQty>0){
        setIo(prev=>[...prev,{date:doneDate,type:"입고",item:order.product,itemName:order.productName,qty:goodQty,unitPrice:items.find(i=>i.code===order.product)?.price||0,lot:mainLotCode,note:`작업지시서 ${order.code} 완료`}]);
      }
      if((defectQty||0)>0){
        // 불량 LOT도 생산 LOT 번호 그대로 (불량품창고 + status "불량"으로 구분, 접미사 없음)
        const defWh=defectWarehouse.name;
        setLots(prev=>{
          const exist=prev.find(l=>l.code===mainLotCode&&l.warehouse===defWh&&l.status==="불량");
          if(exist) return prev.map(l=>(l===exist)?{...l,qty:(l.qty||0)+defectQty}:l);
          return [...prev,{code:mainLotCode,item:order.product,itemName:order.productName,qty:defectQty,mfg:doneDate,exp:"",status:"불량",warehouse:defWh}];
        });
      }
      if((inspectQty||0)>0){
        setIo(prev=>[...prev,{date:doneDate,type:"입고",item:order.product,itemName:order.productName,qty:inspectQty,unitPrice:items.find(i=>i.code===order.product)?.price||0,lot:mainLotCode,note:`품질검사 — WO ${order.code}`}]);
      }
      if((retainQty||0)>0){
        setIo(prev=>[...prev,{date:doneDate,type:"입고",item:order.product,itemName:order.productName,qty:retainQty,unitPrice:items.find(i=>i.code===order.product)?.price||0,lot:mainLotCode,note:`보관샘플 — WO ${order.code}`}]);
      }
    }
  };

  // ── 재완료: 이전 완료분 입출고/LOT/재고를 되돌린 뒤 수정한 수량으로 재반영 (중복 IO 방지) ──
  // stale closure 방지: 로컬 작업본에서 되돌리기+재반영을 한 번에 계산 후 일괄 커밋
  const reComplete=()=>{
    const code=completeModal.code;
    const prodCode=completeModal.product;
    const orderQty=completeModal.orderQty||0;
    const nDefect=compForm.defectQty||0, nInspect=compForm.inspectQty||0, nRetain=compForm.retainQty||0;
    const oDefect=completeModal.defectQty||0;
    const defWh=defectWarehouse.name;

    let _io=[...io];
    let _lots=lots.map(l=>({...l}));
    let _items=items.map(i=>({...i}));
    const priceOf=(c)=>items.find(i=>i.code===c)?.price||0;

    // 생산 LOT 코드 파악 (order.lot 우선, 없으면 기존 완료 입고 IO에서 추출)
    const prodInRecs=_io.filter(r=>r.type==="입고"&&(r.note===`작업지시서 ${code} 완료`||r.note===`품질검사 — WO ${code}`||r.note===`보관샘플 — WO ${code}`));
    const mainLotCode=completeModal.lot||prodInRecs[0]?.lot||("LOT"+Date.now());

    // ── 안전 체크: 생산된 완제품/불량 LOT이 이미 출하·소비되어 되돌릴 수 없으면 차단 ──
    // 정상 LOT 수량은 첫 완료 시 생성된 입고 IO(완료+검사+보관) 합계로 도출 (지시수량 사후 수정에도 정확)
    const oNormalLotQty=prodInRecs.reduce((s,r)=>s+(r.qty||0),0);   // 양품+검사+보관 = 정상 LOT 수량
    // 생산 정상 LOT은 창고이동(#25)으로 같은 코드가 여러 창고에 분할 존재할 수 있음.
    // → 단일 창고 LOT만 보면 이동분을 "출하·소비"로 오판하므로 전 창고 합산으로 판정.
    const normalLotsAll=_lots.filter(l=>l.code===mainLotCode&&l.item===prodCode&&l.status==="정상");
    const curNormalTotal=normalLotsAll.reduce((s,l)=>s+(l.qty||0),0);
    const _designatedWh=new Set([inspectWarehouse?.name,retainWarehouse?.name].filter(Boolean));
    const normalWarehouses=[...new Set(normalLotsAll.filter(l=>!_designatedWh.has(l.warehouse)).map(l=>l.warehouse))];  // 양품(비검사/보관) 창고만 — 검사/보관 분리는 설계상 허용
    if(oNormalLotQty>0&&curNormalTotal<oNormalLotQty){
      alert(`❌ 재완료 불가\n\n생산된 완제품 LOT(${mainLotCode})이 이미 출하·소비되었습니다.\n생성수량 ${oNormalLotQty}EA 중 현재 ${curNormalTotal}EA만 남아 되돌릴 수 없습니다.\n\n출하 내역을 먼저 취소한 뒤 다시 시도해주세요.`);
      return false;
    }
    if(oNormalLotQty>0&&normalWarehouses.length>1){
      alert(`❌ 재완료 불가\n\n생산된 완제품 LOT(${mainLotCode})이 여러 창고에 분산되어 있습니다.\n(${normalWarehouses.join(", ")})\n\n창고 이동을 먼저 취소해 한 창고로 모은 뒤 다시 시도해주세요.\n(분산 상태에서 자동 되돌리기는 데이터 손상 위험이 있어 차단합니다.)`);
      return false;
    }
    const defectLot=_lots.find(l=>l.code===mainLotCode&&l.item===prodCode&&l.status==="불량"&&l.warehouse===defWh);
    const curDefectQty=defectLot?(defectLot.qty||0):0;
    if(oDefect>0&&curDefectQty<oDefect){
      alert(`❌ 재완료 불가\n\n불량 LOT(${mainLotCode})이 이미 처리·이동되었습니다.\n생성수량 ${oDefect}EA 중 현재 ${curDefectQty}EA만 남아 되돌릴 수 없습니다.`);
      return false;
    }

    // ── 1) 이전 완료분 되돌리기 ──
    // 1a) 완제품/검사/보관 입고 IO 제거 + 완제품 재고 환원 + 정상/불량 LOT 제거
    _io=_io.filter(r=>!prodInRecs.includes(r));
    _items=_items.map(it=>it.code===prodCode?{...it,stock:Math.max(0,(it.stock||0)-oNormalLotQty)}:it);
    _lots=_lots.filter(l=>!(l.code===mainLotCode&&l.item===prodCode&&(l.status==="정상"||(l.status==="불량"&&l.warehouse===defWh))));
    // 1b) 자재 투입(완료자동) 출고 되돌리기 — 수동 투입분("…투입")은 보존
    const autoMatOut=_io.filter(r=>r.type==="출고"&&r.note&&r.note.includes(code)&&r.note.includes("완료자동"));
    autoMatOut.forEach(r=>{
      _items=_items.map(it=>it.code===r.item?{...it,stock:(it.stock||0)+(r.qty||0)}:it);
      if(r.lot) _lots=_lots.map(l=>(l.code===r.lot&&l.item===r.item)?{...l,qty:(l.qty||0)+(r.qty||0)}:l);
    });
    _io=_io.filter(r=>!autoMatOut.includes(r));

    // ── 2) 수정한 수량으로 재반영 ──
    const doneDate=compForm.doneDate;
    // 2a) 자재 자동 투입 (수동 투입분 제외한 나머지만 FIFO 차감)
    const bomMats=completeModal.materials?.length>0?completeModal.materials:(bom.find(b=>b.product===prodCode)?.materials||[]);
    if(bomMats.length>0&&orderQty>0){
      bomMats.forEach(m=>{
        const need=m.qty*orderQty;
        const alreadyDone=_io.filter(r=>r.type==="출고"&&r.item===m.code&&r.note&&r.note.includes(code)).reduce((s,r)=>s+(r.qty||0),0);
        let remaining=need-alreadyDone;
        if(remaining>0){
          const availLots=_lots.filter(l=>l.item===m.code&&(l.qty||0)>0).sort((a,b)=>(a.mfg||"").localeCompare(b.mfg||""));
          let leftover=remaining;
          availLots.forEach(l=>{
            if(leftover<=0)return;
            const take=Math.min(l.qty||0,leftover);
            _io=[..._io,{date:doneDate,type:"출고",item:m.code,itemName:m.name,qty:take,unitPrice:priceOf(m.code),lot:l.code,destination:"P",manager:"",approver:"",note:"작업지시서 "+code+" 투입(완료자동)"}];
            _lots=_lots.map(x=>(x.code===l.code&&x.item===m.code)?{...x,qty:Math.max(0,(x.qty||0)-take)}:x);
            leftover-=take;
          });
          if(leftover>0){
            _io=[..._io,{date:doneDate,type:"출고",item:m.code,itemName:m.name,qty:leftover,unitPrice:priceOf(m.code),lot:"",destination:"P",manager:"",approver:"",note:"작업지시서 "+code+" 투입(완료자동)"}];
          }
          _items=_items.map(it=>it.code===m.code?{...it,stock:Math.max(0,(it.stock||0)-remaining)}:it);
        }
      });
    }
    // 2b) 완제품/불량/검사/보관 재생성
    const goodQty=Math.max(0,orderQty-nDefect-nInspect-nRetain);
    const totalGoodQty=goodQty+nInspect+nRetain;
    if(totalGoodQty>0){
      _items=_items.map(it=>it.code===prodCode?{...it,stock:(it.stock||0)+totalGoodQty}:it);
      const _goodWh=completeModal.warehouse||goodWarehouse.name;
      const _hasInsp=!!inspectWarehouse, _hasRet=!!retainWarehouse;
      const _goodRowQty=goodQty+(_hasInsp?0:nInspect)+(_hasRet?0:nRetain);
      if(_goodRowQty>0) _lots=[..._lots,{code:mainLotCode,item:prodCode,itemName:completeModal.productName,qty:_goodRowQty,mfg:doneDate,exp:"",status:"정상",warehouse:_goodWh}];
      if(_hasInsp&&nInspect>0) _lots=[..._lots,{code:mainLotCode,item:prodCode,itemName:completeModal.productName,qty:nInspect,mfg:doneDate,exp:"",status:"정상",warehouse:inspectWarehouse.name}];
      if(_hasRet&&nRetain>0) _lots=[..._lots,{code:mainLotCode,item:prodCode,itemName:completeModal.productName,qty:nRetain,mfg:doneDate,exp:"",status:"정상",warehouse:retainWarehouse.name}];
    }
    if(goodQty>0){
      _io=[..._io,{date:doneDate,type:"입고",item:prodCode,itemName:completeModal.productName,qty:goodQty,unitPrice:priceOf(prodCode),lot:mainLotCode,note:`작업지시서 ${code} 완료`}];
    }
    if(nDefect>0){
      const idx=_lots.findIndex(l=>l.code===mainLotCode&&l.warehouse===defWh&&l.status==="불량");
      if(idx>=0) _lots=_lots.map((l,i)=>i===idx?{...l,qty:(l.qty||0)+nDefect}:l);
      else _lots=[..._lots,{code:mainLotCode,item:prodCode,itemName:completeModal.productName,qty:nDefect,mfg:doneDate,exp:"",status:"불량",warehouse:defWh}];
    }
    if(nInspect>0){
      _io=[..._io,{date:doneDate,type:"입고",item:prodCode,itemName:completeModal.productName,qty:nInspect,unitPrice:priceOf(prodCode),lot:mainLotCode,note:`품질검사 — WO ${code}`}];
    }
    if(nRetain>0){
      _io=[..._io,{date:doneDate,type:"입고",item:prodCode,itemName:completeModal.productName,qty:nRetain,unitPrice:priceOf(prodCode),lot:mainLotCode,note:`보관샘플 — WO ${code}`}];
    }

    // ── 3) 일괄 커밋 ──
    setItems(_items); setLots(_lots); setIo(_io);
    const updated={...completeModal,status:"완료",defectQty:nDefect,inspectQty:nInspect,retainQty:nRetain,doneDate,processTimes:compForm.processTimes,worker:currentUser?.name||completeModal.worker||""};
    setOrders(orders.map(o=>o.code===code?updated:o));
    showToast("✅ 재완료 — 입출고·재고 재반영 완료 (중복 없음)");
    return true;
  };

  // ── 완료 취소: 완료분 입출고/LOT/재고를 되돌리고 작업지시를 '대기' 상태로 복귀 ──
  const cancelComplete=(order)=>{
    const code=order.code;
    const prodCode=order.product;
    const oDefect=order.defectQty||0;
    const defWh=defectWarehouse.name;
    if(!window.confirm(`↩️ 완료 취소 — ${code}\n\n완료 시 생성된 입출고(자재 투입·완제품 입고·검사/보관)와 LOT·재고를 되돌리고\n작업지시를 '대기' 상태로 변경합니다.\n\n계속하시겠습니까?`)) return;

    let _io=[...io];
    let _lots=lots.map(l=>({...l}));
    let _items=items.map(i=>({...i}));

    const prodInRecs=_io.filter(r=>r.type==="입고"&&(r.note===`작업지시서 ${code} 완료`||r.note===`품질검사 — WO ${code}`||r.note===`보관샘플 — WO ${code}`));
    const mainLotCode=order.lot||prodInRecs[0]?.lot;

    // 안전: 생산된 완제품/불량 LOT이 이미 출하·소비되어 되돌릴 수 없으면 차단
    const oNormalLotQty=prodInRecs.reduce((s,r)=>s+(r.qty||0),0);
    // 생산 정상 LOT은 창고이동(#25)으로 같은 코드가 여러 창고에 분할 존재 가능 → 전 창고 합산으로 판정
    const normalLotsAll=mainLotCode?_lots.filter(l=>l.code===mainLotCode&&l.item===prodCode&&l.status==="정상"):[];
    const curNormalTotal=normalLotsAll.reduce((s,l)=>s+(l.qty||0),0);
    const _designatedWh=new Set([inspectWarehouse?.name,retainWarehouse?.name].filter(Boolean));
    const normalWarehouses=[...new Set(normalLotsAll.filter(l=>!_designatedWh.has(l.warehouse)).map(l=>l.warehouse))];  // 양품(비검사/보관) 창고만 — 검사/보관 분리는 설계상 허용
    if(oNormalLotQty>0&&curNormalTotal<oNormalLotQty){
      alert(`❌ 완료 취소 불가\n\n생산된 완제품 LOT(${mainLotCode})이 이미 출하·소비되었습니다.\n생성수량 ${oNormalLotQty}EA 중 현재 ${curNormalTotal}EA만 남아 되돌릴 수 없습니다.\n\n출하 내역을 먼저 취소한 뒤 다시 시도해주세요.`);
      return;
    }
    if(oNormalLotQty>0&&normalWarehouses.length>1){
      alert(`❌ 완료 취소 불가\n\n생산된 완제품 LOT(${mainLotCode})이 여러 창고에 분산되어 있습니다.\n(${normalWarehouses.join(", ")})\n\n창고 이동을 먼저 취소해 한 창고로 모은 뒤 다시 시도해주세요.\n(분산 상태에서 자동 되돌리기는 데이터 손상 위험이 있어 차단합니다.)`);
      return;
    }
    const defectLot=mainLotCode?_lots.find(l=>l.code===mainLotCode&&l.item===prodCode&&l.status==="불량"&&l.warehouse===defWh):null;
    const curDefectQty=defectLot?(defectLot.qty||0):0;
    if(oDefect>0&&curDefectQty<oDefect){
      alert(`❌ 완료 취소 불가\n\n불량 LOT(${mainLotCode})이 이미 처리·이동되었습니다.\n생성수량 ${oDefect}EA 중 현재 ${curDefectQty}EA만 남아 되돌릴 수 없습니다.`);
      return;
    }

    // 되돌리기: 완제품/검사/보관 입고 IO 제거 + 완제품 재고 환원 + 정상/불량 LOT 제거
    _io=_io.filter(r=>!prodInRecs.includes(r));
    _items=_items.map(it=>it.code===prodCode?{...it,stock:Math.max(0,(it.stock||0)-oNormalLotQty)}:it);
    _lots=_lots.filter(l=>!(l.code===mainLotCode&&l.item===prodCode&&(l.status==="정상"||(l.status==="불량"&&l.warehouse===defWh))));
    // 자재 투입(완료자동) 출고 되돌리기 — 수동 투입분("…투입")은 보존
    const autoMatOut=_io.filter(r=>r.type==="출고"&&r.note&&r.note.includes(code)&&r.note.includes("완료자동"));
    autoMatOut.forEach(r=>{
      _items=_items.map(it=>it.code===r.item?{...it,stock:(it.stock||0)+(r.qty||0)}:it);
      if(r.lot) _lots=_lots.map(l=>(l.code===r.lot&&l.item===r.item)?{...l,qty:(l.qty||0)+(r.qty||0)}:l);
    });
    _io=_io.filter(r=>!autoMatOut.includes(r));

    setItems(_items); setLots(_lots); setIo(_io);
    const updated={...order,status:"대기",doneDate:""};
    setOrders(orders.map(o=>o.code===code?updated:o));
    setViewWo(null);
    showToast("↩️ 완료 취소 — 입출고·재고를 되돌리고 대기 상태로 변경했습니다");
  };

  const saveComplete=()=>{
    if(!compForm.doneDate){showToast("완료일을 입력해주세요");return;}
    // 불량+검사+보관샘플 합계가 지시수량을 초과하면 차단 (양품 음수 → 재고 과다 집계 방지)
    const _orderQty=completeModal.orderQty||0;
    const _used=(compForm.defectQty||0)+(compForm.inspectQty||0)+(compForm.retainQty||0);
    if(_used>_orderQty){
      alert(`❌ 수량 합계가 지시수량을 초과합니다.\n\n지시수량: ${_orderQty}EA\n불량 ${compForm.defectQty||0} + 검사 ${compForm.inspectQty||0} + 보관샘플 ${compForm.retainQty||0} = ${_used}EA\n초과: ${_used-_orderQty}EA\n\n합계가 지시수량을 넘지 않도록 조정해주세요.`);
      return;
    }
    // QC 게이트(경고): 검사 미통과(비적합) 자재가 생산 투입(FIFO)에 소비되면 확인. 승인하면 진행
    {
      const _ord=completeModal;
      const _bom=_ord.materials?.length>0?_ord.materials:(bom.find(b=>b.product===_ord.product)?.materials||[]);
      const _hit=[];
      _bom.forEach(m=>{
        const need=(m.qty||0)*(_ord.orderQty||0);
        const done=(io||[]).filter(r=>r.type==="출고"&&r.item===m.code&&r.note&&r.note.includes(_ord.code)).reduce((s,r)=>s+(r.qty||0),0);
        let rem=need-done; if(rem<=0)return;
        const _fifo=lots.filter(l=>l.item===m.code&&(l.qty||0)>0).sort((a,b)=>(a.mfg||"").localeCompare(b.mfg||""));
        for(const l of _fifo){ if(rem<=0)break; const t=Math.min(l.qty||0,rem); if(!qcAvailable(l)&&!_hit.find(h=>h.code===l.code)) _hit.push(l); rem-=t; }
      });
      if(_hit.length>0){ const _msg=_hit.map(l=>`• ${l.itemName||l.item} / ${l.code} — ${effQc(l)}`).join("\n"); if(!window.confirm(`⚠️ 품질검사를 통과하지 않은 자재가 생산에 투입됩니다:\n\n${_msg}\n\n그래도 완료 처리하시겠습니까?`)) return; }
    }
    const isReComplete=completeModal.status==="완료";
    if(isReComplete){
      // 재완료: 이전 완료분 입출고를 되돌리고 수정한 수량으로 재반영 (중복 IO 방지)
      if(!window.confirm("🔄 재완료\n\n이전 완료분 입출고(자재 투입·완제품 입고·검사/보관)를 되돌리고\n수정한 수량으로 다시 반영합니다.\n중복 입출고는 생성되지 않습니다.\n\n계속하시겠습니까?")) return;
      if(!reComplete()) return;   // 이미 출하·소비된 LOT이면 차단(false) → 모달 유지
    } else {
      const updated={...completeModal,status:"완료",defectQty:compForm.defectQty,inspectQty:compForm.inspectQty,retainQty:compForm.retainQty,doneDate:compForm.doneDate,processTimes:compForm.processTimes,worker:currentUser?.name||completeModal.worker||""};
      handleComplete(completeModal,compForm.doneDate,compForm.defectQty,false,compForm.inspectQty,compForm.retainQty);
      setOrders(orders.map(o=>o.code===completeModal.code?updated:o));
      showToast("완료 처리 — 자재 차감·LOT 생성 완료");
    }
    setCompleteModal(null);setViewWo(null);
  };

  // 작업 입력 탭 로직
  const activeWOs=orders.filter(o=>o.status==="대기"||o.status==="진행중");
  const workOrder=orders.find(o=>o.code===workWoCode)||null;
  const _baseBom=workOrder?bom.find(b=>b.product===workOrder.product):null;
  const workBom=workOrder?{...(_baseBom||{}),materials:(workOrder.materials?.length>0?workOrder.materials:_baseBom?.materials)||[]}:null;
  const alreadyDeducted=(itemCode)=>io.filter(r=>r.type==="출고"&&r.item===itemCode&&r.note&&r.note.includes(workWoCode)).reduce((s,r)=>s+(r.qty||0),0);

  const selectWorkWo=(code)=>{
    setWorkWoCode(code);
    const wo=orders.find(o=>o.code===code);
    if(wo){
      const existing=wo.processTimes||[];
      const pts=(wo.processes||[]).map(p=>{const ex=existing.find(t=>t.code===p.code);return{code:p.code,name:p.name,hours:ex?ex.hours:0};});
      setWorkProcTimes(pts);
      // BOM 수량 기반으로 필요량 자동 채우기
      const wb=bom.find(b=>b.product===wo.product);
      const preQty={};
      if(wb){
        wb.materials.forEach(mat=>{
          const need=mat.qty*(wo.orderQty||1);
          const done=io.filter(r=>r.type==="출고"&&r.item===mat.code&&r.note&&r.note.includes(code)).reduce((s,r)=>s+(r.qty||0),0);
          const remain=need-done;
          preQty[mat.code]=remain>0?remain:0;
        });
      }
      setWorkMatQty(preQty);
      // LOT 자동 초기화: 각 자재의 첫 번째 LOT 선택
      const preLot={};
      if(wb){
        wb.materials.forEach(mat=>{
          const matLots=lots.filter(l=>l.item===mat.code&&l.qty>0);
          preLot[mat.code]=matLots.length>0?matLots[0].code:"";
        });
      }
      setWorkMatLot(preLot);
      setWorkExtraMats([]);
    }
  };

  const _doDeduct=(matCode,matName,matUnit,qty,selectedLot,isExtra=false)=>{
    const today=new Date().toISOString().slice(0,10);
    const it=items.find(i=>i.code===matCode);
    const curStock=it?.stock||0;
    const newStock=curStock-qty;
    if(newStock<0){
      alert(`❌ 재고 부족으로 출고할 수 없습니다.\n\n품목: ${matName}\n현재 재고: ${fmt3(curStock)}${matUnit}\n출고 요청: ${fmt3(qty)}${matUnit}\n부족량: ${fmt3(qty-curStock)}${matUnit}`);
      return false;
    }
    setIo(prev=>[...prev,{date:today,type:"출고",item:matCode,itemName:matName,qty,unitPrice:it?.price||0,lot:selectedLot,destination:"P",manager:"",approver:"",note:"작업지시서 "+workWoCode+" 투입"}]);
    setItems(prev=>prev.map(i=>i.code===matCode?{...i,stock:i.stock-qty}:i));
    if(selectedLot){setLots(prev=>prev.map(l=>l.code===selectedLot&&l.item===matCode?{...l,qty:Math.max(0,l.qty-qty)}:l));}
    showToast(`${matName} ${fmt3(qty)}${matUnit} 출고 완료 (LOT: ${selectedLot||"없음"})`);
    return true;
  };

  const deductMaterial=(mat)=>{
    const qty=workMatQty[mat.code]||0;
    if(qty<=0){showToast("수량을 입력하세요");return;}
    const selectedLot=workMatLot[mat.code]||"";
    if(!selectedLot){
      const matLots=lots.filter(l=>l.item===mat.code&&l.qty>0);
      if(matLots.length>0&&!window.confirm("LOT를 선택하지 않았습니다. LOT 없이 출고하시겠습니까?")) return;
    }
    const ok=_doDeduct(mat.code,mat.name,mat.unit,qty,selectedLot);
    if(!ok) return;
    setWorkMatQty(q=>({...q,[mat.code]:0}));
    // 전체 자재 출고 완료 체크
    if(workBom){
      const allDone=workBom.materials.every(m=>{
        const need=m.qty*(workOrder?.orderQty||1);
        const alreadyQty=alreadyDeducted(m.code)+(m.code===mat.code?qty:0);
        return alreadyQty>=need;
      });
      if(allDone){
        setTimeout(()=>{if(window.confirm("🎉 모든 자재 출고가 완료되었습니다!\n완료 처리를 진행하시겠습니까?"))startWorkComplete();},200);
      }
    }
  };

  const deductExtraMat=(idx)=>{
    const mat=workExtraMats[idx];
    if(!mat.code){showToast("품목코드를 입력하세요");return;}
    if((mat.qty||0)<=0){showToast("수량을 입력하세요");return;}
    const selectedLot=mat.lotCode||"";
    if(!selectedLot){
      const matLots=lots.filter(l=>l.item===mat.code&&l.qty>0);
      if(matLots.length>0&&!window.confirm("LOT를 선택하지 않았습니다. LOT 없이 출고하시겠습니까?")) return;
    }
    const ok=_doDeduct(mat.code,mat.name||mat.code,mat.unit||"EA",mat.qty,selectedLot,true);
    if(ok){setWorkExtraMats(prev=>prev.filter((_,i)=>i!==idx));}
  };

  const saveWorkProgress=()=>{
    if(!workOrder){showToast("작업지시서를 선택하세요");return;}
    setOrders(orders.map(o=>o.code===workWoCode?{...o,status:"진행중",processTimes:workProcTimes,worker:currentUser?.name||o.worker||""}:o));
    showToast("공정 시간 임시저장 완료");
  };

  const startWorkComplete=()=>{
    if(!workOrder){showToast("작업지시서를 선택하세요");return;}
    if(workOrder.status==="완료"||workOrder.status==="취소"){
      alert(`이미 ${workOrder.status} 처리된 작업지시서입니다.`);
      return;
    }
    // 재고 부족 자재만 체크 (재고 충분하면 완료 시 자동 출고됨)
    if(workBom&&workBom.materials.length>0){
      const insufficient=workBom.materials.filter(m=>{
        const done=alreadyDeducted(m.code);
        const need=m.qty*(workOrder.orderQty||1);
        const remaining=need-done;
        if(remaining<=0) return false;
        const it=items.find(i=>i.code===m.code);
        return (it?.stock||0)<remaining;
      });
      if(insufficient.length>0){
        const list=insufficient.map(m=>{
          const done=alreadyDeducted(m.code);
          const need=m.qty*(workOrder.orderQty||1);
          const remaining=need-done;
          const it=items.find(i=>i.code===m.code);
          return `• ${m.name}: 필요 ${fmt3(remaining)}${m.unit}, 현재고 ${fmt3(it?.stock||0)}${m.unit}`;
        }).join("\n");
        alert(`❌ 재고 부족으로 완료 처리 불가\n\n${list}\n\n부족한 자재를 먼저 입고해주세요.`);
        return;
      }
    }
    setCompForm({doneDate:new Date().toISOString().slice(0,10),defectQty:workOrder.defectQty||0,inspectQty:workOrder.inspectQty||0,retainQty:workOrder.retainQty||0,processTimes:workProcTimes});
    setCompleteModal(workOrder);
  };

  const save=()=>{
    if(!form.product){showToast("품목을 선택해주세요");return;}
    if(modal==="add"&&!(form.lot||"").trim()){window.alert("LOT번호를 입력해주세요.\n작업지시 등록 시 LOT번호는 필수입니다.");return;}
    const prd=products.find(p=>p.code===form.product);
    const entry={...form,productName:prd?prd.name:form.productName,status:modal==="add"?"대기":form.status};
    if(modal==="add"){setOrders([...orders,entry]);}else{setOrders(orders.map(o=>o.code===form.code?entry:o));}
    showToast("저장되었습니다.");setModal(null);
  };
  const del=(code)=>{
    const o=orders.find(x=>x.code===code);
    let msg="삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.";
    if(o?.status==="완료") msg=`완료된 작업지시서(${code})입니다.\n관련 입출고 이력도 함께 삭제됩니다.\n정말 삭제하시겠습니까?`;
    else if(o?.status==="진행중") msg=`진행중인 작업지시서(${code})입니다.\n관련 입출고 이력도 함께 삭제됩니다.\n삭제하시겠습니까?`;
    if(!window.confirm(msg)) return;
    setOrders(orders.filter(x=>x.code!==code));
    setIo(prev=>prev.filter(r=>!r.note||!r.note.includes(code)));
    showToast("삭제되었습니다.");
  };
  const bulkDel=()=>{
    const hasCompleted=[...sel].some(c=>{const o=orders.find(x=>x.code===c);return o&&o.status==="완료";});
    const n=sel.size;
    const msg=hasCompleted
      ?`선택 항목 중 완료된 작업지시서가 포함되어 있습니다.\n관련 입출고 이력도 함께 삭제됩니다.\n${n}개 모두 삭제하시겠습니까?`
      :`선택한 ${n}개를 삭제하시겠습니까?\n관련 입출고 이력도 함께 삭제됩니다.`;
    if(!window.confirm(msg))return;
    setOrders(orders.filter(o=>!sel.has(o.code)));
    setIo(prev=>prev.filter(r=>!r.note||![...sel].some(code=>r.note.includes(code))));
    setSel(new Set());showToast(`${n}개 삭제되었습니다.`);
  };

  const formBom=bom.find(b=>b.product===form.product);

  // ════════ 등록 마법사 (스크린샷 레이아웃) ════════
  const wizSteps=["품목 · 수량","공정 · 일정","자재 확인","검토 · 발행"];
  const shortMats=(form.materials||[]).filter(m=>{const it=items.find(x=>x.code===m.code);return it&&it.stock<(m.qty*(form.orderQty||1));});

  const productField=()=>(

      <label>대상 품목 * {form.product&&<span style={{fontSize:11,color:"#16a34a"}}>✅ 공정 {form.processes.length}개 자동 로드</span>}</label>
      <input value={prodCodeInput}
        onChange={e=>{
          const v=e.target.value; setProdCodeInput(v);
          const exact=products.find(p=>p.code===v);
          if(exact){const prd=items.find(i=>i.code===exact.code);const autoProcs=(prd?.processes||[]).map(pc=>{const proc=processes.find(pr=>pr.code===pc);return{code:pc,name:proc?.name||pc};});const autoBom=bom.find(b=>b.product===exact.code);setForm(f=>({...f,product:exact.code,productName:exact.name,processes:autoProcs,materials:[...(autoBom?.materials||[])]}));}
          else{setForm(f=>({...f,product:"",productName:""}));}
        }}
        placeholder="멸균주사기 10ml (MD-1001)" autoComplete="off"/>
      {prodCodeInput&&!form.product&&(()=>{
        const hits=products.filter(p=>{const _q=prodCodeInput.toLowerCase();return p.code.toLowerCase().includes(_q)||p.name.toLowerCase().includes(_q);});

            {hits.map(p=>(
              <div key={p.code}
                onClick={()=>{const prd=items.find(i=>i.code===p.code);const autoProcs=(prd?.processes||[]).map(pc=>{const proc=processes.find(pr=>pr.code===pc);return{code:pc,name:proc?.name||pc};});const autoBom=bom.find(b=>b.product===p.code);setForm(f=>({...f,product:p.code,productName:p.name,processes:autoProcs,materials:[...(autoBom?.materials||[])]}));setProdCodeInput(p.code);}}
                style={{padding:"8px 12px",cursor:"pointer",borderBottom:"1px solid #f0f0f0",fontSize:13}}
                onMouseEnter={e=>e.currentTarget.style.background="#eff6ff"} onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
                <span style={{fontFamily:"monospace",color:"#2f6df0",fontWeight:600}}>{p.code}</span>

  // ── 1단계: 품목 · 수량 (스크린샷: 대상 품목/지시 수량/단위/납기일/우선순위) ──

      <div className="field"><label>단위</label><input value={form.unit||"EA"} onChange={e=>setForm(f=>({...f,unit:e.target.value}))}/></div>

      <div className="field"><label>우선순위</label><select value={form.priority||"보통"} onChange={e=>setForm(f=>({...f,priority:e.target.value}))}><option>보통</option><option>높음</option><option>낮음</option></select></div>
      <div className="field"><label>LOT번호 *</label><input value={form.lot||""} onChange={e=>setForm(f=>({...f,lot:e.target.value}))} placeholder="필수 입력"/></div>

        <div className="field"><label>착수 예정</label><input type="date" value={form.startAt||""} onChange={e=>setForm(f=>({...f,startAt:e.target.value}))}/></div>
        <div className="field"><label>완료 예정</label><input type="date" value={form.endAt||""} onChange={e=>setForm(f=>({...f,endAt:e.target.value}))}/></div>
      </div>
      <div style={{marginTop:16,display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
        <label style={{fontSize:12,fontWeight:600,color:"#555"}}>⚙️ 공정 흐름 <span style={{color:"#aaa",fontWeight:400,fontSize:11}}>(품목 선택 시 자동 로드)</span></label>

  // ── 3단계: 자재 확인 (스크린샷: BOM 자동 전개 표) ──
  const fMaterials=()=>(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <span style={{fontSize:12,color:"#888"}}>지시수량 {fmt3(form.orderQty||0)} {form.unit||"EA"} 기준 소요량</span>
        <button className="btn btn-outline btn-sm" onClick={addMat}>+ 자재 추가</button>

            {(form.materials||[]).map((m,i)=>{
